/* Insert a new empty folder immediately before `target` (used by the
   hover strip above each folder, to add folders between/before existing ones). */
/* Create a new empty folder immediately after `target` (Ctrl/Cmd+Enter). */
function createFolderAfter(target) {
  const nf = createFolder('', target);   // createFolder places it after target
  createLine(nf).mq.focus();
  renumberFolders(); renumber(); recompute();
}

function insertFolderBefore(target) {
  const idx = folders.indexOf(target);
  const prev = idx > 0 ? folders[idx - 1] : null;
  const nf = createFolder('', prev);   // places after prev, i.e. before target
  if (!prev) {
    // target was first: move the new folder to the very front (DOM + array)
    target.el.parentNode.insertBefore(nf.el, target.el);
    const ni = folders.indexOf(nf);
    if (ni !== -1) { folders.splice(ni, 1); folders.unshift(nf); }
  }
  createLine(nf).mq.focus();
  renumberFolders(); renumber(); recompute();
}

/* Duplicate a folder: create a copy directly after it, cloning the name and
   every line (latex, note text + visibility, slider bounds). */
function duplicateFolder(src) {
  const copyName = src.userNamed ? (src.name + ' copy') : '';
  const nf = createFolder(copyName, src);
  nf.userNamed = src.userNamed;
  if (src.userNamed) nf.nameEl.value = copyName;
  src.lines.forEach(srcLine => {
    if (srcLine.isSystem) {
      createSystemLine(nf, nf.lines[nf.lines.length - 1] || null, srcLine.eqFields.map(f => f.mq.latex()));
      return;
    }
    const nl = createLine(nf, nf.lines[nf.lines.length - 1] || null, srcLine.mq.latex());
    // note
    const noteText = srcLine.noteArea.value;
    if (noteText) {
      nl.noteArea.value = noteText;
      nl.lineEl.classList.add('has-note');
      if (srcLine.lineEl.classList.contains('note-collapsed')) nl.lineEl.classList.add('note-collapsed');
    }
    // slider bounds
    if (srcLine.sliderMin !== undefined) nl.sliderMin = srcLine.sliderMin;
    if (srcLine.sliderMax !== undefined) nl.sliderMax = srcLine.sliderMax;
    if (srcLine.sliderStep !== undefined) nl.sliderStep = srcLine.sliderStep;
  });
  if (nf.lines.length === 0) createLine(nf);
  // mirror collapsed state
  if (src.collapsed) { nf.collapsed = true; nf.el.classList.add('collapsed'); }
  renumberFolders(); renumber(); recompute();
}

/* Auto-name non-user-named folders: blank when there's a single folder,
   otherwise sequential "1, 2, 3...". User-renamed folders keep their name and
   are skipped (but still consume a number so the visible order reads naturally). */
function renumberFolders() {
  // No auto-numbering: folders are blank unless the user names them.
  for (const f of folders) {
    if (f.userNamed) continue;
    f.name = '';
    if (document.activeElement !== f.nameEl) f.nameEl.value = '';
    f.nameEl.placeholder = '';
  }
}

function removeFolder(folder) {
  if (folders.length === 1) {
    folder.lines.slice().forEach(l => l.lineEl.remove()); folder.lines.length = 0;
    createLine(folder).mq.focus(); renumber(); recompute(); return;
  }
  const idx = folders.indexOf(folder); folder.el.remove();
  folders.splice(idx, 1);
  renumberFolders(); renumber(); recompute();
}

/* empty a folder's lines but keep the folder itself, leaving one blank line */
function clearFolder(folder) {
  folder.lines.slice().forEach(l => l.lineEl.remove());
  folder.lines.length = 0;
  createLine(folder).mq.focus();
  renumber(); recompute();
}

/* ---- drag & drop ---- */
let drag = null;
function attachDrag(handleEl, obj, kind) {
  handleEl.addEventListener('pointerdown', (e) => {
    e.preventDefault(); handleEl.setPointerCapture(e.pointerId);
    drag = { kind, obj, lastTarget:null };
    const el = kind==='line' ? obj.lineEl : obj.el; el.classList.add('drag-ghost');
    const move = (ev) => onDragMove(ev);
    const up = () => {
      handleEl.releasePointerCapture(e.pointerId);
      handleEl.removeEventListener('pointermove', move);
      handleEl.removeEventListener('pointerup', up);
      handleEl.removeEventListener('pointercancel', up);
      onDragEnd();
    };
    handleEl.addEventListener('pointermove', move);
    handleEl.addEventListener('pointerup', up);
    handleEl.addEventListener('pointercancel', up);
  });
}
function clearDropMarks() {
  document.querySelectorAll('.drop-before,.drop-after,.drop-empty').forEach(el => el.classList.remove('drop-before','drop-after','drop-empty'));
}
function onDragMove(ev) {
  if (!drag) return; const y = ev.clientY; clearDropMarks();
  if (drag.kind === 'line') {
    let tf = null;
    for (const f of folders) { const r = f.el.getBoundingClientRect(); if (y>=r.top && y<=r.bottom) { tf = f; break; } }
    if (!tf) { drag.lastTarget = null; return; }
    if (tf.collapsed || tf.lines.length === 0) { tf.linesEl.classList.add('drop-empty'); drag.lastTarget = { folder:tf, beforeLine:null }; return; }
    let placed = false;
    for (const l of tf.lines) {
      if (l === drag.obj) continue;
      const r = l.lineEl.getBoundingClientRect(); const mid = r.top + r.height/2;
      if (y < mid) { l.lineEl.classList.add('drop-before'); drag.lastTarget = { folder:tf, beforeLine:l }; placed = true; break; }
    }
    if (!placed) { const last = tf.lines[tf.lines.length-1]; last.lineEl.classList.add('drop-after'); drag.lastTarget = { folder:tf, beforeLine:null }; }
  } else {
    let placed = false;
    for (const f of folders) {
      if (f === drag.obj) continue;
      const r = f.el.getBoundingClientRect(); const mid = r.top + r.height/2;
      if (y < mid) { f.el.classList.add('drop-before'); drag.lastTarget = { beforeFolder:f }; placed = true; break; }
    }
    if (!placed) { const last = folders[folders.length-1]; if (last !== drag.obj) { last.el.classList.add('drop-after'); drag.lastTarget = { beforeFolder:null }; } }
  }
}
function onDragEnd() {
  if (!drag) return; const t = drag.lastTarget;
  const el = drag.kind==='line' ? drag.obj.lineEl : drag.obj.el;
  el.classList.remove('drag-ghost'); clearDropMarks();
  if (t) {
    if (drag.kind === 'line') {
      const line = drag.obj; const oldF = line.folder;
      oldF.lines.splice(oldF.lines.indexOf(line), 1);
      const tf = t.folder; line.folder = tf;
      if (t.beforeLine) { const i = tf.lines.indexOf(t.beforeLine); tf.lines.splice(i, 0, line); t.beforeLine.lineEl.before(line.lineEl); }
      else { tf.lines.push(line); tf.linesEl.appendChild(line.lineEl); }
      if (oldF.lines.length === 0 && oldF !== tf) createLine(oldF);
    } else {
      const folder = drag.obj; folders.splice(folders.indexOf(folder), 1);
      if (t.beforeFolder) { const i = folders.indexOf(t.beforeFolder); folders.splice(i, 0, folder); t.beforeFolder.el.before(folder.el); }
      else { folders.push(folder); foldersEl.appendChild(folder.el); }
    }
  }
  drag = null; renumberFolders(); renumber(); recompute();
}
function activeLine() {
  for (const f of folders) for (const l of f.lines) if (l.lineEl.classList.contains('focused')) return l;
  const lf = folders[folders.length-1]; return lf.lines[lf.lines.length-1];
}
function activeMQ() {
  const l = activeLine();
  if (l && l.isSystem) {
    // return the focused equation field, or the first
    const focused = l.eqFields.find(ef => ef.row.contains(document.activeElement));
    return (focused || l.eqFields[0] || {}).mq || null;
  }
  return l ? l.mq : null;
}

/* Insert a system block from the keypad: convert the active line if it's an empty
   normal line, else add a new system block after it. */
function insertSystemBlock() {
  const line = activeLine();
  if (line && !line.isSystem && line.mq && line.mq.latex().trim() === '') {
    convertToSystem(line);
    return;
  }
  const folder = line ? line.folder : folders[folders.length - 1];
  const sys = createSystemLine(folder, line || null);
  renumber(); recompute();
  if (sys.eqFields[0]) sys.eqFields[0].mq.focus();
}

/* Insert a superscript ('^') or subscript ('_'). If there's an operand before
   the cursor the script attaches to it; if not, MathQuill creates an editable
   empty base box and we drop the caret into it so it can be typed. fillVal
   pre-fills the script slot (e.g. '2' for x²). */
function scriptKey(mq, op, fillVal) {
  const cur = mq.latex();
  const noOperand = cur === '' || /[+\-*/^_=(,]$/.test(cur) ||
                    /\\(cdot|div|times|left\()$/.test(cur);
  mq.cmd(op);                  // {base}op{slot}; base is an editable empty box when nothing precedes
  if (fillVal) mq.typedText(fillVal);
  if (noOperand) {
    // caret is in/after the script slot; step left into the empty base box to type the value
    mq.keystroke('Left');
    if (fillVal) mq.keystroke('Left');
  }
}
function powerKey(mq, expVal) { scriptKey(mq, '^', expVal); }

   field as an upright ×10^{...} so it never displays as an italic variable E.
   Runs on blur/enter (not mid-keystroke), so replacing the latex is safe. */
function normalizeSciNotation(mq) {

  // produces a proper ×10^{} superscript, so there's nothing to normalise here.
  // Kept as a no-op so existing call sites need no changes.
}

// caps/shift state for the letters page; letter buttons register here so their
// labels flip live when caps is toggled.
let capsOn = false;
const letterButtons = [];   // { btn, ch }
function applyCaps() {
  letterButtons.forEach(({ btn, ch }) => { btn.textContent = capsOn ? ch.toUpperCase() : ch; });
  document.querySelectorAll('.capskey').forEach(b => b.classList.toggle('on', capsOn));
}

function makeKey(k) {
  const b = document.createElement('button');
  if (k.frac) {
    b.innerHTML = '<span class="frac-glyph"><span class="fg-n">\u25A1</span>' +
                  '<span class="fg-bar"></span><span class="fg-d">\u25A1</span></span>';
  } else if (k.katex && window.katex) {
    const span = document.createElement('span');
    try { katex.render(k.katex, span, { throwOnError:false }); b.appendChild(span); }
    catch (e) { b.textContent = k.l; }
  } else {
    b.textContent = k.l;
  }
  if (k.c) k.c.split(' ').forEach(c => b.classList.add(c));
  if (k.letter) letterButtons.push({ btn: b, ch: k.v });
  if (k.t === 'caps') b.classList.add('capskey');
  b.addEventListener('click', () => {
    // system block: works regardless of the active line type
    if (k.t === 'system') { insertSystemBlock(); return; }
    const line = activeLine();
    if (!line) return;
    // resolve the target MathField: a normal line's field, or the focused
    // equation field inside a system block.
    const mq = activeMQ();
    if (!mq) return;
    mq.focus();
    switch (k.t) {
      case 'write': mq.write(k.v); break;
      case 'cmd': {
        // operators (times/div/plus/minus) exit a sup/sub before insertion,
        // unless an exponent exception applies (bracketed, leading -, leading /)
        const opKey = k.v === '\\div' ? '/' : (k.v === '\\times' || k.v === '\\cdot') ? '*' : k.v;
        if (/\\times|\\cdot|\\div|^[+\-]$/.test(k.v) && !shouldStayInSupSub(mq, line && line.fieldEl, opKey)) {
          breakOutOfSupSub(mq, line && line.fieldEl);
        }
        mq.cmd(k.v); break;
      }
      case 'keystroke': mq.keystroke(k.v); break;
      case 'type':
        if (/^[+\-*/=]$/.test(k.v) && !shouldStayInSupSub(mq, line && line.fieldEl, k.v)) {
          breakOutOfSupSub(mq, line && line.fieldEl);
        }
        mq.typedText(k.v);
        if (k.v === '/') stripFracParens(mq);
        break;
      case 'var': {
        const ch = capsOn && k.letter ? k.v.toUpperCase() : k.v;
        mq.typedText(ch);
        if (capsOn && k.letter) { capsOn = false; applyCaps(); }   // shift: one capital, then back to lowercase
        break;
      }
      case 'caps':
        capsOn = !capsOn; applyCaps();
        return;   // don't refocus-insert anything
      case 'subscript':
        scriptKey(mq, '_', null);   // editable subscript; placeholder base if nothing precedes
        break;
      case 'greek': mq.cmd(k.v); break;
      case 'fn':
        mq.typedText(k.v); mq.typedText('(');
        break;
      case 'logbase':
        // log with a chosen base AND an opened bracket: log_{ }( ), with the
        // caret left in the subscript (the base) so you type the base first,
        // then arrow right into the bracket for the argument.
        mq.typedText('log');
        mq.cmd('_');                 // caret now inside the subscript
        mq.keystroke('Right');       // exit the subscript
        mq.typedText('(');           // auto-closes -> log_{}(|)
        mq.keystroke('Left');        // move before '('
        mq.keystroke('Left');        // enter the subscript from the right
        break;
      case 'solve':
        mq.typedText('solve'); mq.typedText('(');
        break;
      case 'nthroot':
        mq.typedText('nthroot');
        break;
      case 'pow':       // xʸ
        powerKey(mq, null);
        break;
      case 'sq':        // x²
        powerKey(mq, '2');
        break;
      case 'exp10':     // ×10ⁿ scientific notation; caret lands in the exponent
        mq.cmd('\\times'); mq.typedText('10'); mq.cmd('^');
        break;
      case 'abs':
        mq.cmd('|');
        break;
      case 'int':
        mq.typedText('int');
        break;
      case 'act':
        if (k.v === 'newline') {
          const f = line.folder; const idx = f.lines.indexOf(line); const next = f.lines[idx+1];
          if (next) focusLineSafe(next); else createLine(f, line).mq.focus();
        } else if (k.v === 'note') {
          if (line.isSystem) break;   // system blocks have no note
          line.lineEl.classList.add('has-note'); line.lineEl.classList.remove('note-collapsed'); line.noteArea.focus();
        } else if (k.v === 'symbol') {
          openSymbolPicker(line, mq);
        } else if (k.v === 'formula') {
          openFormulaPicker(line, mq);
        }
        break;
    }
  });
  return b;
}

const symbolPicker = document.getElementById('symbolPicker');

let symbolTargetMQ = null;

function openSymbolPicker(line, mq) {
  symbolTargetLine = line;
  symbolTargetMQ = mq || (line && !line.isSystem ? line.mq : null) || activeMQ();
  symbolSearch.value = '';
  renderSymbolResults('');
  symbolPicker.hidden = false;
  const r = line.lineEl.getBoundingClientRect();
  const pw = 280, ph = 320;
  let left = Math.min(r.left + 40, window.innerWidth - pw - 12);
  let top = Math.min(r.bottom + 6, window.innerHeight - ph - 12);
  left = Math.max(12, left); top = Math.max(12, top);
  symbolPicker.style.left = left + 'px';
  symbolPicker.style.top = top + 'px';
  // defer focus so MathQuill (which just handled the @ keydown) doesn't grab it back
  setTimeout(() => { symbolSearch.focus(); symbolSearch.select(); }, 0);
}
function closeSymbolPicker() { symbolPicker.hidden = true; symbolTargetLine = null; symbolTargetMQ = null; }

function filterSymbols(q) {
  q = q.trim().toLowerCase();
  if (!q) return SYMBOL_LIST;
  const list = SYMBOL_LIST.filter(s => s.name.toLowerCase().includes(q));
  return list.sort((a,b) => {
    const as = a.name.toLowerCase().startsWith(q) ? 0 : 1;
    const bs = b.name.toLowerCase().startsWith(q) ? 0 : 1;
    return as - bs || a.name.localeCompare(b.name);
  });
}

function renderSymbolResults(q) {
  const items = filterSymbols(q);
  symbolActiveIdx = 0;
  symbolResults.innerHTML = '';
  if (items.length === 0) {
    const e = document.createElement('div'); e.className = 'sym-empty'; e.textContent = 'No symbols match';
    symbolResults.appendChild(e); return;
  }
  items.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'sym-row' + (i === 0 ? ' active' : '');
    row.innerHTML = '<span class="sym-glyph"></span><span class="sym-name"></span>';
    row.querySelector('.sym-glyph').textContent = s.glyph;
    row.querySelector('.sym-name').textContent = s.name + ' (' + s.glyph + ')';
    row.addEventListener('mousedown', (ev) => { ev.preventDefault(); chooseSymbol(s); });
    row.addEventListener('mouseenter', () => setSymbolActive(i));
    symbolResults.appendChild(row);
  });
}
function setSymbolActive(i) {
  const rows = symbolResults.querySelectorAll('.sym-row');
  rows.forEach((r,k) => r.classList.toggle('active', k===i));
  symbolActiveIdx = i;
  const el = rows[i]; if (el) el.scrollIntoView({ block:'nearest' });
}
function chooseSymbol(s) {
  const mq = symbolTargetMQ || (symbolTargetLine && symbolTargetLine.mq);
  if (mq) { mq.focus(); mq.cmd(s.latex); }
  closeSymbolPicker();
}

symbolSearch.addEventListener('input', () => renderSymbolResults(symbolSearch.value));
symbolSearch.addEventListener('keydown', (e) => {
  const rows = symbolResults.querySelectorAll('.sym-row');
  if (e.key === 'ArrowDown') { e.preventDefault(); setSymbolActive(Math.min(symbolActiveIdx+1, rows.length-1)); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setSymbolActive(Math.max(symbolActiveIdx-1, 0)); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    const items = filterSymbols(symbolSearch.value);

}

const formulaSearch = document.getElementById('formulaSearch');

let formulaTargetLine = null;
let formulaTargetMQ = null;
let formulaActiveIdx = 0;

function openFormulaPicker(line, mq) {

/* plain-text form of a formula's LaTeX name for matching (strips \commands,
   braces, spaces) e.g. 'M = 4\\pi^2 r^3/GT^2' -> 'm=4pi^2r^3/gt^2' */
function plainFormula(name) {
  return name
    .replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '$1/$2')   // \frac{a}{b} -> a/b
    .replace(/\\[a-zA-Z]+/g, m => ({'\\times':'*','\\cdot':'*','\\sqrt':'sqrt','\\pi':'pi','\\lambda':'lambda','\\Delta':'delta','\\phi':'phi','\\theta':'theta','\\gamma':'gamma','\\sigma':'sigma','\\varepsilon':'epsilon','\\Phi':'phi','\\perp':'perp','\\sin':'sin','\\cos':'cos','\\tan':'tan','\\text':'','\\left':'','\\right':''}[m] ?? m.slice(1)))
    .replace(/[{}\\\s]/g, '')
    .toLowerCase();
}
function filterFormulas(q) {
  q = q.trim().toLowerCase();
  if (!q) return FORMULA_LIST;

  // equation-prefix mode: if the query contains '=', the user is typing an
  // equation -> match only formulas whose (plain) name STARTS WITH that prefix.
  if (q.includes('=')) {
    const pfx = q.replace(/\s+/g, '');
    return FORMULA_LIST.filter(f => plainFormula(f.name).startsWith(pfx));
  }

  // otherwise: every term must appear in the name OR the keywords/category
  const terms = q.split(/\s+/);
  const scored = [];
  for (const f of FORMULA_LIST) {
    const plain = plainFormula(f.name);
    const hay = (plain + ' ' + f.cat + ' ' + f.kw).toLowerCase();
    if (terms.every(t => hay.includes(t))) {
      const kw = f.kw.toLowerCase();
      let score = 3;
      if (plain.startsWith(q)) score = 0;                              // name prefix
      else if (kw.split(/,\s*/).some(k => k.startsWith(q))) score = 1; // keyword prefix
      else if (kw.includes(q)) score = 2;                             // keyword anywhere
      scored.push({ f, score });
    }
  }
  scored.sort((a, b) => a.score - b.score);
  return scored.map(s => s.f);
}

function renderFormulaResults(q) {
  const items = filterFormulas(q);
  formulaActiveIdx = 0;
  formulaResults.innerHTML = '';
  if (items.length === 0) {
    const e = document.createElement('div'); e.className = 'sym-empty'; e.textContent = 'No formulas match';
    formulaResults.appendChild(e); return;
  }
  let lastCat = null;
  items.forEach((f, i) => {
    if (f.cat !== lastCat) {
      const h = document.createElement('div'); h.className = 'fml-cat'; h.textContent = f.cat;
      formulaResults.appendChild(h); lastCat = f.cat;
    }
    const row = document.createElement('div');
    row.className = 'fml-row' + (i === 0 ? ' active' : '');
    row.dataset.idx = i;
    const eq = document.createElement('span'); eq.className = 'fml-eq';
    try { katex.render(f.name, eq, { throwOnError:false }); } catch (e) { eq.textContent = f.name; }
    const kw = document.createElement('span'); kw.className = 'fml-kw';
    kw.textContent = f.kw.split(',')[0];
    row.appendChild(eq); row.appendChild(kw);
    row.addEventListener('mousedown', (ev) => { ev.preventDefault(); chooseFormula(f); });
    row.addEventListener('mouseenter', () => setFormulaActive(i));
    formulaResults.appendChild(row);
  });
}
function setFormulaActive(i) {
  const rows = formulaResults.querySelectorAll('.fml-row');
  rows.forEach(r => r.classList.toggle('active', +r.dataset.idx === i));
  formulaActiveIdx = i;
  const el = [...rows].find(r => +r.dataset.idx === i); if (el) el.scrollIntoView({ block:'nearest' });
}
function chooseFormula(f) {
  const mq = formulaTargetMQ || (formulaTargetLine && formulaTargetLine.mq);
  if (mq) { mq.focus(); mq.write(f.latex); }
  closeFormulaPicker();
  recompute();
}

formulaSearch.addEventListener('keydown', (e) => {
  const items = filterFormulas(formulaSearch.value);
  if (e.key === 'ArrowDown') { e.preventDefault(); setFormulaActive(Math.min(formulaActiveIdx+1, items.length-1)); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setFormulaActive(Math.max(formulaActiveIdx-1, 0)); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (items[formulaActiveIdx]) chooseFormula(items[formulaActiveIdx]);

function formulaKeyGuard(e) {
  if (formulaPicker.hidden) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); closeFormulaPicker(); }

/* --- line navigation helpers --- */
function flatLines() { const a = []; folders.forEach(f => f.lines.forEach(l => a.push(l))); return a; }
function gotoFirstLine() { const a = flatLines(); if (a[0]) focusLineSafe(a[0]); }
function gotoLastLine()  { const a = flatLines(); if (a.length) focusLineSafe(a[a.length-1]); }
function gotoFolderFirst(line) { const f = line && line.folder; if (f && f.lines[0]) focusLineSafe(f.lines[0]); }
function gotoFolderLast(line)  { const f = line && line.folder; if (f && f.lines.length) focusLineSafe(f.lines[f.lines.length-1]); }

/* global keyboard shortcuts: mode toggles, line navigation, Tab cycling */
document.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey;
  // mode toggles: Ctrl/Cmd+Shift+E (exact), +D (deg/rad), +S (sig figs)
  if (mod && e.shiftKey && !e.altKey) {
    const k = e.key.toLowerCase();
    if (k === 'e') { e.preventDefault(); toggleExact(); return; }
    if (k === 'd') { e.preventDefault(); toggleAngle(); return; }
    if (k === 's') { e.preventDefault(); toggleSigFigs(); return; }
  }
  // line navigation with the arrow keys
  if (mod && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault();
    const cur = focusedLineObj;
    if (e.shiftKey) {                               // current folder ends
      if (e.key === 'ArrowUp') gotoFolderFirst(cur); else gotoFolderLast(cur);
    } else {                                        // whole document ends
      if (e.key === 'ArrowUp') gotoFirstLine(); else gotoLastLine();
    }
    return;
  }
  // Tab / Shift+Tab cycle between lines (only when a math field is focused, so
  // it doesn't hijack tabbing through the sidebar controls)
  if (e.key === 'Tab' && focusedLineObj && document.activeElement &&
      document.activeElement.closest && document.activeElement.closest('.mq-field')) {
    e.preventDefault();
    navigateLine(focusedLineObj, e.shiftKey ? -1 : +1);
    return;
  }
}, true);

/* Collect user-defined variables across the active tab's folders, plus the
   predefined physics constants, and render them alphabetically. */
function buildVarsList() {
  varsListEl.innerHTML = '';
  const angleFns = angleScope();

  // user-defined values: evaluate each folder the same way recompute does
  const userVars = {};   // name -> value (last definition wins, like scope)
  for (const folder of folders) {
    const scope = { ...angleFns, ...physConstants() };
    const infos = folder.lines.map(line => {
      if (line.isSystem) return { isSystem: true };
      const expr = prepareExpr(line.mq.latex());
      const m = expr.match(/^\s*([A-Za-zΑ-Ωα-ωϑϕϵϖϱς](?:_[A-Za-z0-9]+)?)\s*=(?!=)\s*(.+)$/);
      return { isAssign: !!m, name: m?m[1]:null, rhs: m?m[2]:null };
    });
    // resolve assignments (a couple of passes for order independence)
    for (let pass = 0; pass < 4; pass++) {
      for (const info of infos) {
        if (!info.isAssign) continue;
        try { const v = evalExpr(info.rhs, scope); if (typeof v === 'number' && isFinite(v)) { scope[info.name] = v; userVars[info.name] = v; } }
        catch (e) {}
      }
    }
  }

  const consts = physConstants();
  const constNames = Object.keys(consts).filter(n => !(n in userVars)).sort(cmpVarNames);
  const userNames = Object.keys(userVars).sort(cmpVarNames);

  if (userNames.length === 0 && constNames.length === 0) {
    const e = document.createElement('div'); e.className = 'vars-empty'; e.textContent = 'No variables defined yet.';
    varsListEl.appendChild(e); return;
  }
  if (userNames.length) {
    varsListEl.appendChild(sectionLabel('Defined'));
    userNames.forEach(n => varsListEl.appendChild(varRow(n, userVars[n], false)));
  }
  varsListEl.appendChild(sectionLabel('Constants'));
  constNames.forEach(n => varsListEl.appendChild(varRow(n, consts[n], true)));
}
function sectionLabel(t) { const d = document.createElement('div'); d.className = 'vars-section'; d.textContent = t; return d; }
function cmpVarNames(a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()) || a.localeCompare(b); }
function varRow(name, value, isConst) {
  const row = document.createElement('div'); row.className = 'vars-row' + (isConst ? ' is-const' : '');
  const nm = document.createElement('span'); nm.className = 'vname';
  try { katex.render(varToLatex(name), nm, { throwOnError:false }); } catch (e) { nm.textContent = name; }
  const vl = document.createElement('span'); vl.className = 'vval';
  let t = decimalLatex(value);
  if (t === null) t = String(value);
  try { const s = document.createElement('span'); katex.render(t, s, { throwOnError:false }); vl.appendChild(s); }
  catch (e) { vl.textContent = String(value); }
  row.appendChild(nm); row.appendChild(vl);
  return row;
}

/* =====================================================================
   Serialisation, tabs, and persistence
   ===================================================================== */

/* Snapshot the currently rendered calculator (folders + modes) to a plain JS
   object. Everything derived (results, sliders, chips) is regenerated on load. */
function snapshotActive() {
  return {
    theme: document.documentElement.getAttribute('data-theme') || 'light',
    exact: exactMode,
    angle: angleMode,
    gravity: gValue,
    sigfigs: sigFigs,
    solveAll: solveAllMode,
    folders: folders.map(f => ({
      name: f.name,
      userNamed: f.userNamed,
      collapsed: f.collapsed,
      lines: f.lines.map(l => {
        if (l.isSystem) {
          return { system: true, equations: l.eqFields.map(ef => ef.mq.latex()) };
        }
        return {
          latex: l.mq.latex(),
          note: l.noteArea.value || '',
          noteCollapsed: l.lineEl.classList.contains('note-collapsed'),
          hasNote: l.lineEl.classList.contains('has-note'),
          sliderMin: (l.sliderMin !== undefined && isFinite(l.sliderMin)) ? l.sliderMin : null,
          sliderMax: (l.sliderMax !== undefined && isFinite(l.sliderMax)) ? l.sliderMax : null,
          sliderStep: (l.sliderStep !== undefined && isFinite(l.sliderStep)) ? l.sliderStep : null
        };
      })
    }))
  };
}

/* Clear the rendered calculator and rebuild it from a snapshot object. */
function loadSnapshot(data) {
  // tear down current DOM + state
  folders.slice().forEach(f => f.el.remove());
  folders.length = 0;

  // modes
  exactMode = !!data.exact;
  angleMode = (data.angle === 'rad') ? 'rad' : 'deg';
  if (data.gravity === 9.8 || data.gravity === 9.81) { gValue = data.gravity; PHYS_CONSTANTS.g = gValue; }
  // only Auto and 3 s.f. exist now; map any older saved value (2/4) to 3
  if (data.sigfigs === 'auto') sigFigs = 'auto';
  else if (data.sigfigs === 2 || data.sigfigs === 3 || data.sigfigs === 4) sigFigs = 3;
  solveAllMode = !!data.solveAll;
  const theme = (data.theme === 'dark') ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  syncModeButtons(theme);

  const fdata = (data.folders && data.folders.length) ? data.folders : [{ name:'', userNamed:false, collapsed:false, lines:[{latex:''}] }];
  for (const fd of fdata) {
    const folder = createFolder(fd.name || '');
    folder.userNamed = !!fd.userNamed;
    if (fd.userNamed) folder.nameEl.value = fd.name || '';
    const lines = (fd.lines && fd.lines.length) ? fd.lines : [{ latex:'' }];
    for (const ld of lines) {
      if (ld.system) {
        createSystemLine(folder, folder.lines[folder.lines.length-1] || null, (ld.equations && ld.equations.length) ? ld.equations : ['','']);
        continue;
      }
      const line = createLine(folder, folder.lines[folder.lines.length-1] || null, ld.latex || '');
      if (ld.note) { line.noteArea.value = ld.note; line.lineEl.classList.add('has-note'); if (ld.noteCollapsed) line.lineEl.classList.add('note-collapsed'); }
      else if (ld.hasNote) { line.lineEl.classList.add('has-note'); }
      if (ld.sliderMin !== null && ld.sliderMin !== undefined) { line.sliderMin = ld.sliderMin; line.sliderUserBounds = true; }
      if (ld.sliderMax !== null && ld.sliderMax !== undefined) { line.sliderMax = ld.sliderMax; line.sliderUserBounds = true; }
      if (ld.sliderStep !== null && ld.sliderStep !== undefined) line.sliderStep = ld.sliderStep;
    }
    // remove the default blank line createFolder/createLine may have left if data had lines
  }
  // collapse states after build (so heights settle)
  fdata.forEach((fd, i) => { if (fd.collapsed && folders[i]) { folders[i].collapsed = true; folders[i].el.classList.add('collapsed'); } });

  renumberFolders(); renumber(); recompute();
}

function syncModeButtons(theme) {
  themeSeg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode===theme));
  exactSeg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode===(exactMode?'exact':'decimal')));
  angleSeg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode===angleMode));
  gravSeg.querySelectorAll('button').forEach(b => b.classList.toggle('on', parseFloat(b.dataset.g)===gValue));
  sigfigSeg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.sf===String(sigFigs)));
  solveModeSeg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.solve===(solveAllMode?'all':'first')));
}

/* ---- tabs ---- */
const STORAGE_KEY = 'stemvault_calc_tabs_v1';
let saveTimer = null;
let storageOK = true;
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch (e) { storageOK = false; }

function persist() {
  // write the active tab's live snapshot into its tab record, then save all tabs
  const t = tabs.find(t => t.id === activeTabId);
  if (t) t.data = snapshotActive();
  if (!storageOK) return;
  try {
    favourites = favourites.filter(id => tabs.some(t => t.id === id));
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ tabs, activeTabId, tabSeq, idSeq, tabGroups, groupSeq, favourites }));
  } catch (e) { /* quota or disabled; ignore */ }
}

/* debounced autosave, called on every meaningful change */
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 300);
}

function renderTabList() {
  tabList.innerHTML = '';
  normalizeTabOrder();
  let i = 0;
  while (i < tabs.length) {
    const t = tabs[i];
    const grp = t.group ? tabGroups.find(g => g.id === t.group) : null;
    if (grp) {
      // gather the contiguous run of this group's members
      const members = [];
      let j = i;
      while (j < tabs.length && tabs[j].group === grp.id) { members.push(tabs[j]); j++; }
      tabList.appendChild(buildGroupSection(grp, members));
      i = j;
    } else {
      tabList.appendChild(buildTabRow(t, null));
      i++;
    }
  }
  renderFavList();
  if (typeof syncPageTitle === 'function') syncPageTitle();
}

/* favourites: shortcut rows at the top of the sidebar that point to starred
   tabs (the tabs also stay in their normal place in the list). */
function toggleFavourite(id) {
  const i = favourites.indexOf(id);
  if (i === -1) favourites.push(id); else favourites.splice(i, 1);
  renderTabList(); persist();
}
function renderFavList() {
  const favListEl = document.getElementById('favList');
  if (!favListEl) return;
  favListEl.innerHTML = '';
  const valid = favourites.filter(id => tabs.some(t => t.id === id));
  if (!valid.length) { favListEl.classList.remove('has-favs'); return; }
  favListEl.classList.add('has-favs');
  const head = document.createElement('div');
  head.className = 'fav-head'; head.textContent = 'Favourites';
  favListEl.appendChild(head);
  valid.forEach(id => {
    const t = tabs.find(t => t.id === id); if (!t) return;
    const grp = t.group ? tabGroups.find(g => g.id === t.group) : null;
    const row = document.createElement('div');
    row.className = 'tab fav-row' + (t.id === activeTabId ? ' active' : '');
    if (grp) row.style.setProperty('--group-color', grp.color);
    const star = document.createElement('span');
    star.className = 'fav-dot'; star.innerHTML = '\u2605';
    if (grp) star.style.color = grp.color;
    row.appendChild(star);
    const nameEl = document.createElement('span');
    nameEl.className = 'tname';
    nameEl.textContent = grp ? (grp.name + ' ' + t.name) : t.name;
    nameEl.title = nameEl.textContent;
    row.appendChild(nameEl);
    const unfav = document.createElement('button');
    unfav.className = 'tstar on'; unfav.innerHTML = '\u2605'; unfav.title = 'Remove from favourites';
    unfav.addEventListener('click', e => { e.stopPropagation(); toggleFavourite(id); });
    row.appendChild(unfav);
    row.addEventListener('click', () => switchTab(id));
    favListEl.appendChild(row);
  });
}

/* a single tab row (used both ungrouped and inside group sections) */
function buildTabRow(t, grp) {
  const row = document.createElement('div');
  row.className = 'tab' + (t.id === activeTabId ? ' active' : '') + (grp ? ' grouped' : '');
  row.dataset.tabId = t.id;
  if (grp) row.style.setProperty('--group-color', grp.color);

  // name is plain text (draggable); double-click to rename inline (Chrome-like)
  const nameEl = document.createElement('span');
  nameEl.className = 'tname'; nameEl.textContent = t.name; nameEl.title = t.name;
  nameEl.addEventListener('dblclick', e => { e.stopPropagation(); startTabRename(row, t, nameEl); });
  row.appendChild(nameEl);

  // favourite star (revealed on hover; filled when starred)
  const star = document.createElement('button');
  const isFav = favourites.includes(t.id);
  star.className = 'tstar' + (isFav ? ' on' : '');
  star.innerHTML = isFav ? '\u2605' : '\u2606';
  star.title = isFav ? 'Remove from favourites' : 'Add to favourites';
  star.addEventListener('click', e => { e.stopPropagation(); toggleFavourite(t.id); });
  star.addEventListener('pointerdown', e => e.stopPropagation());
  row.appendChild(star);

  // duplicate tab (revealed on hover)
  const dup = document.createElement('button');
  dup.className = 'tdup'; dup.innerHTML = '&#10697;'; dup.title = 'Duplicate tab';
  dup.addEventListener('click', e => { e.stopPropagation(); duplicateTab(t.id); });
  dup.addEventListener('pointerdown', e => e.stopPropagation());
  row.appendChild(dup);

  // share tab: copy link / save to file (revealed on hover) - Apple share glyph
  const share = document.createElement('button');
  share.className = 'tshare'; share.title = 'Share tab (copy link / save)';
  share.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></svg>';
  share.addEventListener('click', e => {
    e.stopPropagation();
    const r = share.getBoundingClientRect();
    openShareMenu(t.id, r.left, r.bottom + 4);
  });
  share.addEventListener('pointerdown', e => e.stopPropagation());
  row.appendChild(share);

  const close = document.createElement('button');
  close.className = 'tclose'; close.innerHTML = '&times;'; close.title = 'Close tab';
  close.addEventListener('click', e => { e.stopPropagation(); confirmCloseTab(t.id); });
  close.addEventListener('pointerdown', e => e.stopPropagation());
  row.appendChild(close);

  row.addEventListener('click', () => { if (!row._dragged) switchTab(t.id); });
  row.addEventListener('contextmenu', e => { e.preventDefault(); openTabMenu(t.id, e.clientX, e.clientY); });
  attachLongPress(row, (x, y) => openTabMenu(t.id, x, y));
  attachTabDrag(row, t);
  return row;
}
/* inline rename: swap the name span for a text input until commit/blur */
function startTabRename(row, t, nameEl) {
  const inp = document.createElement('input');
  inp.className = 'tname tname-edit'; inp.value = t.name; inp.spellcheck = false;
  inp.addEventListener('pointerdown', e => e.stopPropagation());
  inp.addEventListener('click', e => e.stopPropagation());
  const commit = () => {
    const v = inp.value.trim();
    if (v && v !== t.name) { t.name = v; t.userNamed = true; }
    renderTabList(); persist();
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); else if (e.key === 'Escape') { inp.value = t.name; inp.blur(); } });
  inp.addEventListener('blur', commit);
  row.replaceChild(inp, nameEl);
  inp.focus(); inp.select();
}

/* a collapsible group section: coloured header (toggle + name + count) and its
   member tab rows (hidden when collapsed) */
function buildGroupSection(grp, members) {
  const sec = document.createElement('div');
  sec.className = 'tgroup-section' + (grp.collapsed ? ' collapsed' : '');
  sec.dataset.groupId = grp.id;
  sec.style.setProperty('--group-color', grp.color);

  const head = document.createElement('div');
  head.className = 'tgroup-head';
  const tw = document.createElement('button');
  tw.className = 'tgroup-twist'; tw.innerHTML = '\u25BE'; tw.title = grp.collapsed ? 'Expand' : 'Collapse';
  tw.addEventListener('click', e => { e.stopPropagation(); grp.collapsed = !grp.collapsed; renderTabList(); persist(); });
  const dot = document.createElement('span');
  dot.className = 'tgroup-dot'; dot.title = 'Group options';
  dot.addEventListener('click', e => { e.stopPropagation(); const r = dot.getBoundingClientRect(); openGroupMenu(grp.id, r.left, r.bottom + 4); });
  const nm = document.createElement('input');
  nm.className = 'tgroup-name'; nm.value = grp.name; nm.spellcheck = false;
  nm.addEventListener('click', e => e.stopPropagation());
  nm.addEventListener('pointerdown', e => e.stopPropagation());
  nm.addEventListener('input', () => { grp.name = nm.value; scheduleSave(); });
  nm.addEventListener('keydown', e => { if (e.key==='Enter') nm.blur(); });
  head.appendChild(tw); head.appendChild(dot); head.appendChild(nm);
  head.addEventListener('contextmenu', e => { e.preventDefault(); openGroupMenu(grp.id, e.clientX, e.clientY); });
  sec.appendChild(head);

  const body = document.createElement('div');
  body.className = 'tgroup-body';
  members.forEach(t => body.appendChild(buildTabRow(t, grp)));
  sec.appendChild(body);
  return sec;
}

function switchTab(id) {
  if (id === activeTabId) { closePanel(); return; }
  // save current active tab's live state
  const cur = tabs.find(t => t.id === activeTabId);
  if (cur) cur.data = snapshotActive();
  activeTabId = id;
  const t = tabs.find(t => t.id === id);
  if (t) loadSnapshot(t.data);
  renderTabList(); persist(); closePanel();
}

/* keep the header title in sync: static "Group: " prefix + editable tab name */
const pageTitle = document.getElementById('pageTitle');
const ptGroup = document.getElementById('ptGroup');
const ptName = document.getElementById('ptName');
function syncPageTitle() {
  const t = tabs.find(t => t.id === activeTabId);

/* click the tab-name part of the header to rename the active tab inline */
function activateTabNameEdit() {
  if (!ptName) return;
  const t = tabs.find(t => t.id === activeTabId); if (!t) return;
  ptName.classList.add('editing');
  ptName.contentEditable = 'true';
  ptName.textContent = t.name;
  const r = document.createRange(); r.selectNodeContents(ptName);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  ptName.focus();
}
if (ptName) {
  ptName.addEventListener('click', () => { activateTabNameEdit(); });
  const commitTitle = () => {
    if (!ptName.classList.contains('editing')) return;
    const t = tabs.find(t => t.id === activeTabId);
    const v = ptName.textContent.trim();
    ptName.contentEditable = 'false';
    ptName.classList.remove('editing');
    if (t && v && v !== t.name) { t.name = v; t.userNamed = true; renderTabList(); persist(); }
    else syncPageTitle();

  ptName.addEventListener('blur', commitTitle);
  ptName.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); ptName.blur(); }
    else if (e.key === 'Escape') { ptName.classList.remove('editing'); ptName.contentEditable = 'false'; syncPageTitle(); ptName.blur(); }
    else if (e.key === 'ArrowDown') {
      e.preventDefault(); ptName.blur();

      focusNavTarget(seq[1]);
    }
  });
}

/* lowest positive integer N such that "Tab N" isn't already an auto-named tab */
function nextTabNumber() {
  const used = new Set();
  for (const t of tabs) {
    if (t.userNamed) continue;
    const m = /^Tab (\d+)$/.exec(t.name || '');
    if (m) used.add(+m[1]);
  }
  let n = 1; while (used.has(n)) n++;
  return n;
}

function newTab(data, name) {
  const cur = tabs.find(t => t.id === activeTabId);
  if (cur) cur.data = snapshotActive();
  const id = ++tabSeq;   // internal unique id (never reused; used for grouping/save)
  const blank = { theme:'light', exact:false, angle:'deg', folders:[{ name:'', userNamed:false, collapsed:false, lines:[{latex:''}] }] };
  const tab = { id, name: name || ('Tab ' + nextTabNumber()), userNamed: !!name, data: data || blank };
  // a new tab joins the active tab's group and is placed right after it
  if (cur) {
    if (cur.group) tab.group = cur.group;
    const idx = tabs.indexOf(cur);
    tabs.splice(idx + 1, 0, tab);
  } else {
    tabs.push(tab);
  }
  activeTabId = id;
  loadSnapshot(tab.data);
  normalizeTabOrder();
  renderTabList(); persist();
  return tab;
}

/* duplicate a tab: deep-copy its snapshot into a new tab placed right after it,
   inheriting its group, named "<name> copy". */
function duplicateTab(id) {
  const src = tabs.find(t => t.id === id); if (!src) return;
  // ensure the active tab's live state is captured before copying
  const cur = tabs.find(t => t.id === activeTabId);
  if (cur) cur.data = snapshotActive();
  const data = JSON.parse(JSON.stringify(src.id === activeTabId ? snapshotActive() : src.data));
  const nid = ++tabSeq;
  let name = src.name + ' copy';
  let n = 2; const base = name;
  while (tabs.some(t => t.name === name)) { name = base + ' ' + n; n++; }
  const tab = { id: nid, name, userNamed: true, data };
  if (src.group) tab.group = src.group;
  const idx = tabs.indexOf(src);
  tabs.splice(idx + 1, 0, tab);
  activeTabId = nid;
  loadSnapshot(tab.data);
  normalizeTabOrder();
  renderTabList(); persist();
  return tab;
}

/* true if a tab has no meaningful content (single blank line, no name/group) */
function tabIsEmpty(t) {
  if (!t) return true;
  if (t.userNamed) return false;
  const data = (t.id === activeTabId) ? snapshotActive() : t.data;
  if (!data || !data.folders) return true;
  const lines = data.folders.reduce((a, f) => a + (f.lines ? f.lines.length : 0), 0);
  const anyText = data.folders.some(f => (f.lines || []).some(l => (l.latex || '').trim() !== ''))
               || data.folders.some(f => (f.name || '').trim() !== '');
  return !anyText && lines <= 1;
}

/* confirm (unless the tab is empty) then close */
function confirmCloseTab(id) {
  const t = tabs.find(t => t.id === id);
  if (tabIsEmpty(t)) { closeTab(id); return; }
  confirmDialog('Close this tab? Its contents will be lost.', 'Close tab').then(ok => { if (ok) closeTab(id); });
}

function closeTab(id) {
  const idx = tabs.findIndex(t => t.id === id);
  if (idx === -1) return;
  if (tabs.length === 1) { // never zero tabs; reset this one to blank
    tabs[0].data = { theme:'light', exact:false, angle:'deg', folders:[{ name:'', userNamed:false, collapsed:false, lines:[{latex:''}] }] };
    if (activeTabId === id) loadSnapshot(tabs[0].data);
    renderTabList(); persist(); return;
  }
  const wasActive = (id === activeTabId);
  tabs.splice(idx, 1);
  favourites = favourites.filter(f => tabs.some(t => t.id === f));
  if (wasActive) { activeTabId = tabs[Math.max(0, idx-1)].id; loadSnapshot(tabs.find(t=>t.id===activeTabId).data); }
  pruneEmptyGroups();
  renderTabList(); persist();
}

/* close every tab positioned after the given one */
function closeTabsBelow(id) {
  const idx = tabs.findIndex(t => t.id === id);
  if (idx === -1 || idx === tabs.length - 1) return;
  // capture current active state so it isn't lost if active is among removed
  const cur = tabs.find(t => t.id === activeTabId);
  if (cur) cur.data = snapshotActive();
  tabs = tabs.slice(0, idx + 1);
  if (!tabs.some(t => t.id === activeTabId)) {
    activeTabId = id; loadSnapshot(tabs.find(t => t.id === id).data);
  }
  pruneEmptyGroups(); renderTabList(); persist();
}

/* close every tab positioned after the last member of the given group */
function closeTabsBelowGroup(gid) {
  normalizeTabOrder();
  let lastIdx = -1;
  tabs.forEach((t, i) => { if (t.group === gid) lastIdx = i; });
  if (lastIdx === -1 || lastIdx === tabs.length - 1) return;
  const cur = tabs.find(t => t.id === activeTabId);
  if (cur) cur.data = snapshotActive();
  const lastId = tabs[lastIdx].id;
  tabs = tabs.slice(0, lastIdx + 1);
  if (!tabs.some(t => t.id === activeTabId)) {
    activeTabId = lastId; loadSnapshot(tabs.find(t => t.id === lastId).data);
  }
  pruneEmptyGroups(); renderTabList(); persist();
}

/* close every tab except the given one */
function closeOtherTabs(id) {
  const keep = tabs.find(t => t.id === id);
  if (!keep) return;
  if (activeTabId === id) keep.data = snapshotActive();
  tabs = [keep];
  if (activeTabId !== id) { activeTabId = id; loadSnapshot(keep.data); }
  pruneEmptyGroups(); renderTabList(); persist();
}

/* group operations */
function createGroupFromTab(id) {
  const t = tabs.find(t => t.id === id); if (!t) return;
  const gid = ++groupSeq;
  const color = GROUP_COLORS[(tabGroups.length) % GROUP_COLORS.length];
  tabGroups.push({ id: gid, name: 'Group ' + gid, color });
  t.group = gid;
  pruneEmptyGroups(); renderTabList(); persist();
}
function moveTabToGroup(id, gid) {
  const t = tabs.find(t => t.id === id); if (!t) return;
  t.group = gid || undefined;
  pruneEmptyGroups(); renderTabList(); persist();
}
function ungroupTab(id) {
  const t = tabs.find(t => t.id === id); if (!t) return;
  t.group = undefined;
  pruneEmptyGroups(); renderTabList(); persist();
}
function renameGroup(gid) {
  const g = tabGroups.find(g => g.id === gid); if (!g) return;
  const name = prompt('Group name:', g.name);
  if (name !== null && name.trim() !== '') { g.name = name.trim(); renderTabList(); persist(); }
}
/* drop groups that no longer contain any tab */
function pruneEmptyGroups() {
  tabGroups = tabGroups.filter(g => tabs.some(t => t.group === g.id));
}
/* Keep grouped tabs contiguous: reorder `tabs` so every group's members sit in
   one run, in first-appearance order of groups, ungrouped tabs keeping their
   relative position. Returns nothing; mutates tabs. */
function normalizeTabOrder() {
  const groupOrder = [];          // group ids in order of first appearance
  for (const t of tabs) if (t.group && !groupOrder.includes(t.group)) groupOrder.push(t.group);
  // Build a new order: walk original tabs; when we hit the first member of a
  // group, emit ALL members of that group together; ungrouped emit in place.
  const emitted = new Set();
  const out = [];
  for (const t of tabs) {
    if (!t.group) { out.push(t); continue; }
    if (emitted.has(t.group)) continue;
    emitted.add(t.group);
    for (const m of tabs) if (m.group === t.group) out.push(m);
  }
  tabs = out;
}

/* ---- tab context menu ---- */
const tabMenu = document.getElementById('tabMenu');
function closeTabMenu() { tabMenu.hidden = true; tabMenu.innerHTML = ''; }
function openTabMenu(id, x, y) {
  const t = tabs.find(t => t.id === id); if (!t) return;
  const idx = tabs.findIndex(tt => tt.id === id);
  tabMenu.innerHTML = '';
  const item = (label, fn, opts = {}) => {
    const el = document.createElement('div');
    el.className = 'tmenu-item' + (opts.danger ? ' danger' : '') + (opts.disabled ? ' disabled' : '');
    el.textContent = label;
    if (opts.arrow) { const a = document.createElement('span'); a.className = 'tmenu-arrow'; a.textContent = '\u25B8'; el.appendChild(a); el.classList.add('tmenu-sub'); }
    if (!opts.disabled && fn) el.addEventListener('click', () => { fn(); closeTabMenu(); });
    tabMenu.appendChild(el);
    return el;
  };
  const sep = () => { const s = document.createElement('div'); s.className = 'tmenu-sep'; tabMenu.appendChild(s); };

  item('Close tab', () => confirmCloseTab(id), { danger: true });
  item('Close tabs below', () => {
    confirmDialog('Close all tabs below this one?', 'Close').then(ok => { if (ok) closeTabsBelow(id); });
  }, { danger: true, disabled: idx === tabs.length - 1 });
  item('Close other tabs', () => {
    confirmDialog('Close all other tabs?', 'Close').then(ok => { if (ok) closeOtherTabs(id); });
  }, { danger: true, disabled: tabs.length <= 1 });
  sep();
  if (t.group) {
    const g = tabGroups.find(g => g.id === t.group);
    item('Rename group' + (g ? ' (' + g.name + ')' : ''), () => renameGroup(t.group));
    item('Remove from group', () => ungroupTab(id));
  } else {
    item('Group tab', () => createGroupFromTab(id));
  }
  // Move to group submenu (only if other groups exist)
  const otherGroups = tabGroups.filter(g => g.id !== t.group);
  if (otherGroups.length) {
    const sub = item('Move to group', null, { arrow: true });
    const menu = document.createElement('div'); menu.className = 'tmenu-submenu';
    otherGroups.forEach(g => {
      const row = document.createElement('div'); row.className = 'tmenu-item tmenu-color-row';
      const sw = document.createElement('span'); sw.className = 'tmenu-swatch'; sw.style.background = g.color;
      const lbl = document.createElement('span'); lbl.textContent = g.name;
      row.appendChild(sw); row.appendChild(lbl);
      row.addEventListener('click', () => { moveTabToGroup(id, g.id); closeTabMenu(); });
      menu.appendChild(row);
    });
    sub.appendChild(menu);
  }

  // position, clamped to viewport
  tabMenu.hidden = false;
  const r = tabMenu.getBoundingClientRect();
  const px = Math.min(x, window.innerWidth - r.width - 8);
  const py = Math.min(y, window.innerHeight - r.height - 8);
  tabMenu.style.left = Math.max(8, px) + 'px';
  tabMenu.style.top = Math.max(8, py) + 'px';
}

/* context menu for a group header: rename, recolour, collapse, ungroup all */
function openGroupMenu(gid, x, y) {
  const g = tabGroups.find(g => g.id === gid); if (!g) return;
  tabMenu.innerHTML = '';
  const item = (label, fn) => {
    const el = document.createElement('div'); el.className = 'tmenu-item'; el.textContent = label;
    el.addEventListener('click', () => { fn(); closeTabMenu(); });

  };

  item('Rename group', () => renameGroup(gid));
  item(g.collapsed ? 'Expand group' : 'Collapse group', () => { g.collapsed = !g.collapsed; renderTabList(); persist(); });
  // colour picker row
  const crow = document.createElement('div'); crow.className = 'tmenu-item';
  crow.style.flexDirection = 'column'; crow.style.alignItems = 'stretch'; crow.style.gap = '0.4rem';
  const clbl = document.createElement('span'); clbl.textContent = 'Colour'; clbl.style.fontSize = '0.8rem'; clbl.style.color = 'var(--ink-dim)';
  const sw = document.createElement('div'); sw.style.display = 'flex'; sw.style.flexWrap = 'wrap'; sw.style.gap = '0.3rem';

  const r = tabMenu.getBoundingClientRect();
  tabMenu.style.left = Math.max(8, Math.min(x, window.innerWidth - r.width - 8)) + 'px';
  tabMenu.style.top = Math.max(8, Math.min(y, window.innerHeight - r.height - 8)) + 'px';
}
document.addEventListener('click', e => { if (!tabMenu.hidden && !tabMenu.contains(e.target)) closeTabMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTabMenu(); });

/* re-evaluate each line's inline/stacked result layout on window resize */
let _resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => {
    folders.forEach(f => f.lines.forEach(l => { if (!l.isSystem) updateLineLayout(l); }));

/* long-press to open the context menu on touch devices */
function attachLongPress(el, fn) {
  let timer = null, sx = 0, sy = 0;
  el.addEventListener('touchstart', e => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    timer = setTimeout(() => { timer = null; fn(sx, sy); }, 500);
  }, { passive: true });
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) cancel();
  }, { passive: true });
  el.addEventListener('touchcancel', cancel);
}

/* ---- Chrome-style tab drag: reorder, and drag in/out of groups ----
   Drop position is computed from the pointer's Y over the rendered rows; the
   target group is whichever group section the pointer is inside (or none). On
   release we reorder `tabs` and set the dragged tab's group, then re-render. */
let tabDrag = null;
function attachTabDrag(row, t) {
  row.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return;  // left button only
    const startX = e.clientX, startY = e.clientY;
    let active = false;
    row._dragged = false;
    const onMove = (ev) => {
      if (!active) {
        if (Math.abs(ev.clientX - startX) < 5 && Math.abs(ev.clientY - startY) < 5) return;
        active = true; row._dragged = true;
        try { row.setPointerCapture(e.pointerId); } catch (err) {}
        row.classList.add('tab-dragging');
        tabDrag = { id: t.id };
        closeTabMenu();
      }
      tabDragMove(ev);
    };
    const onUp = () => {
      row.removeEventListener('pointermove', onMove);
      row.removeEventListener('pointerup', onUp);
      row.removeEventListener('pointercancel', onUp);
      try { row.releasePointerCapture(e.pointerId); } catch (err) {}
      if (active) { tabDragEnd(); row.classList.remove('tab-dragging'); }
      // clear the dragged flag after the click event has a chance to read it
      setTimeout(() => { row._dragged = false; }, 0);
    };
    row.addEventListener('pointermove', onMove);
    row.addEventListener('pointerup', onUp);
    row.addEventListener('pointercancel', onUp);
  });
}
function clearTabDropMarks() {
  tabList.querySelectorAll('.drop-before,.drop-after').forEach(el => el.classList.remove('drop-before','drop-after'));
  tabList.querySelectorAll('.tgroup-section.drop-into').forEach(el => el.classList.remove('drop-into'));
}
function tabDragMove(ev) {
  if (!tabDrag) return;
  clearTabDropMarks();
  const y = ev.clientY, x = ev.clientX;
  const rows = [...tabList.querySelectorAll('.tab')].filter(r => +r.dataset.tabId !== tabDrag.id);

  // which group section is the pointer inside (for snap-in)?
  let intoGroup = null;
  for (const sec of tabList.querySelectorAll('.tgroup-section')) {
    const r = sec.getBoundingClientRect();
    if (y >= r.top && y <= r.bottom && x >= r.left && x <= r.right) { intoGroup = +sec.dataset.groupId; break; }
  }
  tabDrag.intoGroup = intoGroup;

  // find the row we should drop before (first whose midpoint is below the pointer)
  let beforeId = null, marked = null;
  for (const r of rows) {
    const rect = r.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    if (y < mid) { beforeId = +r.dataset.tabId; marked = r; break; }
  }
  tabDrag.beforeId = beforeId;
  if (marked) marked.classList.add('drop-before');
  else if (rows.length) rows[rows.length - 1].classList.add('drop-after');

  // highlight the group we'd snap into
  if (intoGroup != null) {
    const sec = tabList.querySelector('.tgroup-section[data-group-id="' + intoGroup + '"]');
    if (sec) sec.classList.add('drop-into');
  }
}
function tabDragEnd() {
  if (!tabDrag) { clearTabDropMarks(); return; }
  const { id, beforeId, intoGroup } = tabDrag;
  tabDrag = null; clearTabDropMarks();
  const moving = tabs.find(t => t.id === id);
  if (!moving) { renderTabList(); return; }

  // remove from current position
  tabs = tabs.filter(t => t.id !== id);
  // assign group: the section the pointer was over (or ungroup if over none)
  moving.group = (intoGroup != null) ? intoGroup : undefined;
  // insert before the target row (or at end)
  if (beforeId != null) {
    const idx = tabs.findIndex(t => t.id === beforeId);
    if (idx === -1) tabs.push(moving); else tabs.splice(idx, 0, moving);
  } else {
    tabs.push(moving);
  }
  pruneEmptyGroups();
  normalizeTabOrder();
  renderTabList(); persist();
}

/* ---- file export / import ---- */
/* snapshot for a given tab: live snapshot if it's active, else its stored data */
function tabData(id) {
  if (id === activeTabId) return snapshotActive();
  const t = tabs.find(t => t.id === id);
  return t ? t.data : null;
}
function exportTab(id) {
  const t = tabs.find(t => t.id === id); if (!t) return;
  const payload = { format:'stemvault-calc', version:1, name: t.name, data: tabData(id) };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safe = (t.name || 'calculator').replace(/[^\w.-]+/g,'_') || 'calculator';
  a.href = url; a.download = safe + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
const fileInput = document.getElementById('fileInput');
document.getElementById('importFile').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const payload = JSON.parse(reader.result);
      if (payload && payload.format && payload.format !== 'stemvault-calc' && !payload.data && !payload.folders) {
        alert('That file does not look like a saved calculator tab.');
        fileInput.value = ''; return;
      }
      const data = payload.data || payload;     // accept raw snapshot too
      let name = payload.name || file.name.replace(/\.json$/,'') || 'Opened';
      // name-collision handling: if a tab with this name already exists, ask, then
      // open under a disambiguated name ("name (2)") to avoid confusion.
      if (tabs.some(t => t.name === name)) {
        const ok = confirm('A tab named "' + name + '" is already open.\n\nOpen this file as a new tab anyway?');
        if (!ok) { fileInput.value = ''; return; }
        let n = 2, base = name;
        while (tabs.some(t => t.name === base + ' (' + n + ')')) n++;
        name = base + ' (' + n + ')';
      }
      const t = newTab(data, name);
      if (t) t.userNamed = true;   // opened files keep their given name (not auto-renumbered)
      persist();
      closePanel();
    } catch (e) { alert('Could not read that file.'); }
    fileInput.value = '';
  };
  reader.readAsText(file);
});

/* ---- shareable URL ---- */
function encodeState(data) {
  const json = JSON.stringify(data);
  return encodeURIComponent(btoa(unescape(encodeURIComponent(json))));
}
function decodeState(s) {
  try { return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(s))))); }
  catch (e) { return null; }
}
function shareTabLink(id) {
  const data = tabData(id); if (!data) return Promise.resolve(false);
  const link = location.origin + location.pathname + '#s=' + encodeState(data);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(link).then(() => true).catch(() => { location.hash = 's=' + encodeState(data); return false; });
  }
  location.hash = 's=' + encodeState(data);
  return Promise.resolve(false);
}

  let top = Math.min(y, window.innerHeight - mh - 8);
  shareMenu.style.left = Math.max(8, left) + 'px';
  shareMenu.style.top = Math.max(8, top) + 'px';
}
function closeShareMenu() { shareMenu.hidden = true; }
document.addEventListener('mousedown', (e) => { if (!shareMenu.hidden && !shareMenu.contains(e.target)) closeShareMenu(); });

/* =====================================================================
   Bootstrap: URL share > localStorage > fresh
   ===================================================================== */
(function init() {
  // 1) shared link takes priority
  const hash = location.hash;
  const mShare = hash.match(/[#&]s=([^&]+)/);
  if (mShare) {
    const data = decodeState(mShare[1]);
    if (data) {
      // load saved tabs (if any) then add the shared one as a new tab
      restoreTabsOrFresh(/*deferActiveLoad=*/true);
      window.history.replaceState(null, '', location.pathname + location.search); // clean URL
      newTab(data, 'Shared');
      return;
    }
  }
  // 2) restore from localStorage, else fresh
  restoreTabsOrFresh(false);
  if (typeof syncPageTitle === 'function') syncPageTitle();
})();

function restoreTabsOrFresh(deferActiveLoad) {
  let saved = null;
  if (storageOK) {
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { saved = null; }
  }
  if (saved && saved.tabs && saved.tabs.length) {
    tabs = saved.tabs;
    tabSeq = saved.tabSeq || tabs.reduce((m,t)=>Math.max(m,t.id),0);
    idSeq = saved.idSeq || 0;
    tabGroups = Array.isArray(saved.tabGroups) ? saved.tabGroups : [];
    groupSeq = saved.groupSeq || tabGroups.reduce((m,g)=>Math.max(m,g.id),0);
    favourites = Array.isArray(saved.favourites) ? saved.favourites.filter(id => tabs.some(t => t.id === id)) : [];
    pruneEmptyGroups();
    activeTabId = saved.activeTabId && tabs.some(t=>t.id===saved.activeTabId) ? saved.activeTabId : tabs[0].id;
    if (!deferActiveLoad) loadSnapshot(tabs.find(t=>t.id===activeTabId).data);
    renderTabList();
  } else {
    // fresh: one blank tab
    const f = createFolder(''); createLine(f).mq.focus(); renumber();
    const id = ++tabSeq;
    tabs = [{ id, name:'Tab 1', data: snapshotActive() }];
    activeTabId = id;
    renderTabList();
  }
}
</script>
