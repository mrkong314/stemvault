ype":"sa","text":"A rod has a proper length of 2.0 m. Calculate its length as measured by an observer who sees it move past at 0.90c along its length.","marks":2,"answer":{"lines":["γ = 1/√(1 – 0.90^{2}) = 2.29 (1). L = L_{0}/γ = 2.0/2.29 = 0.87 m (1)."]},"diag":true,"num":[["L (m)",0.87]],"orig":"8.2 Q4"},{"code":"8.2 Q2","crit":"8.2","type":"mc","text":"An observer watches a clock move past at high speed. Compared with an identical clock at rest beside the observer, the moving clock is measured to","marks":1,"options":["run slow.","run fast.","run at the same rate.","stop."],"answer":{"lines":["A."]},"diag":false,"orig":"8.2 Q1"},{"code":"8.2 Q3","crit":"8.2","type":"sa","text":"A spacecraft travels past Earth at 0.80c. A clock on the spacecraft measures 10.0 s between two events on board. The spacecraft is 40 m long in its own frame. Determine the time interval between the events and the length of the spacecraft as measured by an observer on Earth.","marks":3,"answer":{"lines":["γ = 1/√(1 – 0.80^{2}) = 1.67 (1). Time: t = γt_{0} = 1.67 × 10.0 = 16.7 s (1). Length: L = L_{0}/γ = 40/1.67 = 24 m (1)."]},"diag":false,"num":[["t (s)",16.7],["L (m)",24]],"orig":"8.2 Q2"},{"code":"8.2 Q4","crit":"8.2","type":"sa","text":"A muon has a proper lifetime of 2.2 μs and travels at 0.95c (γ = 3.2) towards the ground from an altitude of 3000 m as measured by an observer on Earth.","marks":3,"parts":[{"text":"a.  Calculate the lifetime of the muon as measured by the Earth observer.","marks":1},{"text":"b.  Calculate the distance to the ground as measured in the muon's frame.","marks":2}],"answer":{"lines":["a. t = γt_{0} = 3.2 × 2.2 = 7.0 μs (1).","b. L = L_{0}/γ (1) = 3000/3.2 = 940 m (1)."]},"diag":false,"num":[["a. t (μs)",7],["b. L (m)",940]],"orig":"8.2 Q3"},{"code":"8.2 Q5","crit":"8.2","type":"sa","text":"An astronaut travels to a star at 0.99c. Observers on Earth measure the trip to take 20 years. Calculate the time that passes for the astronaut.","marks":2,"answer":{"lines":["γ = 1/√(1 – 0.99^{2}) = 7.1 (1). t_{0} = t/γ = 20/7.09 = 2.8 years (1)."]},"diag":false,"num":[["t₀ (years)",2.8]],"orig":"8.2 Q5"}]},{"code":"8.3","topic":8,"title":"Calculate the speed of an object in terms of c for a given Lorentz factor: v/c = √(1 – 1/γ^{2})","intro":null,"questions":[{"code":"8.3 Q1","crit":"8.3","type":"sa","text":"A clock moving relative to an observer is measured to run at one third of its proper rate. Calculate the speed of the clock.","marks":2,"answer":{"lines":["One third of its proper rate means t = 3t_{0}, so γ = 3 (1). v/c = √(1 – 1/9) = 0.94, so v = 0.94c (1)."]},"diag":true,"num":[["v/c",0.943,0.01]],"orig":"8.3 Q3"},{"code":"8.3 Q2","crit":"8.3","type":"mc","text":"An object has a Lorentz factor of 2.0. Its speed is","marks":1,"options":["0.87c","0.50c","0.75c","0.97c"],"answer":{"lines":["A. v/c = √(1 – 1/4) = 0.87, so v = 0.87c."]},"diag":false,"orig":"8.3 Q1"},{"code":"8.3 Q3","crit":"8.3","type":"sa","text":"Calculate the speed at which a moving rod is measured to be half its proper length.","marks":2,"answer":{"lines":["L = L_{0}/2 means γ = 2 (1). v/c = √(1 – 1/4) = 0.87, so v = 0.87c (1)."]},"diag":false,"num":[["v/c",0.866,0.01]],"orig":"8.3 Q4"},{"code":"8.3 Q4","crit":"8.3","type":"sa","text":"Calculate the speed at which γ = 1.01, and comment on the size of relativistic effects below this speed.","marks":2,"answer":{"lines":["v/c = √(1 – 1/1.01^{2}) = √(1 – 0.9803) = 0.14, so v = 0.14c, about 4.2 × 10^{7} m s^{–1} (1). Below this speed relativistic effects are under 1%, which is why they are unnoticed in everyday life (1)."]},"diag":false,"num":[["v/c",0.14,0.05]],"orig":"8.3 Q5"}]},{"code":"8.4","topic":8,"title":"Recognise who determines proper length or proper time for a scenario","intro":null,"questions":[{"code":"8.4 Q1","crit":"8.4","type":"sa","text":"A muon is created in the upper atmosphere and decays before reaching the ground. State which observer, the muon or a scientist on Earth, measures the proper lifetime of the muon, and which measures the proper distance from the point of creation to the ground.","marks":2,"answer":{"lines":["The muon measures its proper lifetime: creation and decay both occur at the muon's own location (1). The Earth scientist measures the proper distance: the point of creation and the ground are both at rest in the Earth frame (1)."]},"diag":true,"orig":"8.4 Q4"},{"code":"8.4 Q2","crit":"8.4","type":"mc","text":"The proper time between two events is measured by an observer for whom the two events","marks":1,"options":["occur at the same place.","occur at the same time.","are separated by the greatest distance.","are both at rest."],"answer":{"lines":["A."]},"diag":false,"orig":"8.4 Q1"},{"code":"8.4 Q3","crit":"8.4","type":"sa","text":"A train travels at high speed through a station. A passenger on the train times how long it takes a light on the station platform to flash twice. State who measures the proper time between the flashes, and who measures the proper length of the platform. Justify each answer.","marks":3,"answer":{"lines":["Proper time: an observer standing on the platform. Both flashes happen at the same place on the platform, so one platform clock records both events at the same location; the passenger sees the flashes at different places (the platform moves past) and measures a dilated time (2). Proper length: a platform observer, who is at rest relative to the platform; the passenger measures a contracted platform (1)."]},"diag":false,"orig":"8.4 Q2"},{"code":"8.4 Q4","crit":"8.4","type":"sa","text":"A spacecraft travels from Earth to a space station 12 light-years away (Earth frame) at 0.80c. Identify who measures the proper time for the journey and who measures the proper distance between Earth and the station. Justify each answer, and calculate the distance measured by the crew.","marks":3,"answer":{"lines":["Proper time: the spacecraft crew, since departure and arrival both occur at the crew's own location (the ship) (1). Proper distance: Earth/station observers, who are at rest relative to both endpoints (1). Crew distance: γ = 1.67, L = 12/1.67 = 7.2 light-years (1)."]},"diag":false,"num":[["crew distance (light-years)",7.2]],"orig":"8.4 Q3"},{"code":"8.4 Q5","crit":"8.4","type":"sa","text":"Two observers each measure the length of the other's identical spaceship as they pass at high speed. Explain why each measures the other's ship to be shorter than their own, and why there is no contradiction.","marks":3,"answer":{"lines":["Each observer is at rest relative to their own ship and so measures its proper length; each sees the other's ship moving and so measures a contracted length L_{0}/γ (1). The situation is symmetric because neither frame is preferred (1). There is no contradiction because length is frame-dependent: the measurements of the two ends of a moving object are not simultaneous in the other frame, so the two observers are measuring different things (1)."]},"diag":false,"orig":"8.4 Q5"},{"code":"8.4 Q6","crit":"8.4","type":"sa","marks":3,"text":"A rocket passes Earth at constant velocity. Observers on Earth measure the rocket to be 30 m long; the rocket's crew measure it to be 50 m long. Identify which measurement is the proper length, explain why, and calculate the speed of the rocket.","answer":{"lines":["50 m is the proper length: the crew are at rest relative to the rocket, and proper length is measured in the object's own rest frame (1). Earth observers see the rocket moving and measure the contracted length L = L_{0}/γ, so γ = 50/30 = 1.67 (1). v = c√(1 – 1/γ^{2}) = c√(1 – 0.36) = 0.80c (1)."]},"diag":false,"num":[["γ",1.67,0.02],["v/c",0.8,0.02]],"orig":"8.4 Q6"},{"code":"8.4 Q7","crit":"8.4","type":"sa","marks":3,"text":"A pion travels at 0.90c through a detector that is 2.0 m long in the laboratory frame. Identify who measures the proper time for the pion's transit of the detector and who measures the proper length of the detector, and calculate the transit time in each frame.","answer":{"lines":["Proper length: the laboratory, since the detector is at rest in the lab frame. Proper time: the pion, since entering and leaving the detector both happen at the pion's own location (1). Lab frame: t = d/v = 2.0/(0.90 × 3.00 × 10^{8}) = 7.4 × 10^{–9} s (1). Pion frame: γ = 2.29, t_{0} = t/γ = 3.2 × 10^{–9} s (equivalently, the contracted detector length 2.0/2.29 = 0.87 m divided by 0.90c) (1)."]},"diag":false,"num":[["lab time (s)",7.4e-9],["pion time (s)",3.2e-9]],"orig":"8.4 Q7"}]},{"code":"8.5","topic":8,"title":"Briefly describe the implications of the Michelson-Morley experiment","intro":null,"questions":[{"code":"8.5 Q1","crit":"8.5","type":"sa","text":"State the two postulates of special relativity and identify which one is supported by the Michelson-Morley result.","marks":2,"answer":{"lines":["1. The laws of physics are the same in all inertial frames of reference. 2. The speed of light in a vacuum is constant in all inertial frames of reference, regardless of the motion of the source or the observer (1 for both). The Michelson-Morley null result supports the second postulate (1)."]},"diag":true,"orig":"8.5 Q4"},{"code":"8.5 Q2","crit":"8.5","type":"sa","text":"The Michelson-Morley experiment produced a null result. Explain what this result means and how it supports Einstein's special theory of relativity.","marks":3,"answer":{"lines":["No shift in the interference pattern was seen in any orientation, so the measured speed of light was the same along and across the direction of Earth's motion (1). This means the speed of light is constant in all inertial frames of reference: it does not depend on the motion of the source or the observer (1). That is exactly the second postulate of special relativity, so the experiment supports the foundation from which time dilation and length contraction follow (1)."],"img":null},"diag":false,"orig":"8.5 Q3"}]},{"code":"8.6","topic":8,"title":"Explain how muons are able to travel further or live longer than expected by classical physics, using calculations","intro":null,"questions":[{"code":"8.6 Q1","crit":"8.6","type":"sa","text":"Muons moving at 0.995c are created 6.0 km above the ground. Using the Earth frame, calculate the dilated lifetime and the distance travelled in that time, and state whether the muons reach the ground.","marks":3,"answer":{"lines":["γ = 1/√(1 – 0.995^{2}) = 10; t = γt_{0} = 10 × 2.2 = 22 μs (1). d = vt = 0.995 × 3.00 × 10^{8} × 22 × 10^{–6} = 6.6 km (1), which exceeds 6.0 km, so the muons reach the ground (1)."]},"diag":true,"num":[["t (μs)",22],["d (km)",6.6]],"orig":"8.6 Q4"},{"code":"8.6 Q2","crit":"8.6","type":"mc","text":"Far more muons reach the ground than classical physics predicts. In the Earth frame this is because","marks":1,"options":["the lifetime of the moving muons is dilated.","the distance to the ground is contracted for the Earth observer.","the muons travel faster than light.","the mass of the muons decreases."],"answer":{"lines":["A."]},"diag":false,"orig":"8.6 Q1"},{"code":"8.6 Q3","crit":"8.6","type":"sa","text":"Muons are created 3000 m above the ground and travel towards it at 0.98c. Their proper lifetime is 2.2 μs. Show by calculation that classical physics predicts most muons should not reach the ground, and explain using special relativity, from the Earth frame, why they do.","marks":4,"answer":{"lines":["Classical: distance = vt_{0} = 0.98 × 3.00 × 10^{8} × 2.2 × 10^{–6} = 650 m, far short of 3000 m (1). γ = 1/√(1 – 0.98^{2}) = 5.0 (1). Earth frame: the muon's lifetime is dilated to t = γt_{0} = 5.0 × 2.2 = 11 μs (1), so it travels 0.98 × 3.00 × 10^{8} × 11 × 10^{–6} = 3200 m, enough to reach the ground (1)."]},"diag":false,"orig":"8.6 Q2"},{"code":"8.6 Q4","crit":"8.6","type":"sa","text":"Muons travelling at 0.99c (γ = 7.1) are created 4.0 km above the ground. Their proper lifetime is 2.2 μs.","marks":3,"parts":[{"text":"a.  Calculate the distance the muons would travel in one lifetime according to classical physics.","marks":1},{"text":"b.  Using the muon's frame of reference, show by calculation that the muons can reach the ground.","marks":2}],"answer":{"lines":["a. d = vt_{0} = 0.99 × 3.00 × 10^{8} × 2.2 × 10^{–6} = 650 m (1).","b. In the muon's frame the 4.0 km is length-contracted: L = L_{0}/γ = 4000/7.1 = 560 m (1). The muon lives 2.2 μs in its own frame and can travel 650 m in that time, which exceeds 560 m, so it reaches the ground (1)."]},"diag":false,"num":[["a. d (m)",650],["b. L (m)",560]],"orig":"8.6 Q3"},{"code":"8.6 Q5","crit":"8.6","type":"sa","text":"Explain why the Earth-frame explanation (time dilation) and the muon-frame explanation (length contraction) for muons reaching the ground are both correct and consistent with each other.","marks":3,"answer":{"lines":["They are the same physical event viewed from two inertial frames, and the postulates of relativity guarantee the frames agree on whether the muon reaches the ground (1). In the Earth frame the distance is the proper distance but the muon's lifetime is dilated by γ; in the muon frame the lifetime is the proper time but the distance is contracted by γ (1). The same factor γ appears in both, so the ratio of distance to available time is identical and both frames predict the muon arrives (1)."]},"diag":false,"orig":"8.6 Q5"},{"code":"8.6 Q6","crit":"8.6","type":"sa","marks":3,"text":"Muons with a proper lifetime of 2.2 μs are created 2.0 km above the ground and travel towards it at 0.90c. Using the Earth frame, determine whether a muon that lives for exactly its average lifetime reaches the ground.","answer":{"lines":["γ = 1/√(1 – 0.90^{2}) = 2.29; dilated lifetime t = γt_{0} = 2.29 × 2.2 = 5.0 μs (1). Distance travelled = 0.90 × 3.00 × 10^{8} × 5.05 × 10^{–6} = 1.4 × 10^{3} m (1). This is less than 2.0 km, so a muon living exactly its average lifetime does not reach the ground (although muons that live longer than average do) (1)."]},"diag":false,"num":[["dilated lifetime (μs)",5.05,0.03],["distance (m)",1360,0.05]],"orig":"8.6 Q6"}]},{"code":"8.7","topic":8,"title":"Briefly explain why GPS satellites must intentionally speed up their clocks as a result of special relativity","intro":null,"questions":[{"code":"8.7 Q1","crit":"8.7","type":"sa","text":"Explain why the clocks on GPS satellites must be set to run fast to compensate for special relativity.","marks":2,"answer":{"lines":["In the ground frame the satellite clocks are moving at high speed, so special relativity predicts they run slow relative to ground clocks (time dilation) (1). GPS positions are calculated from signal travel times measured against the satellite clocks, so before launch the clocks are deliberately set to tick fast by exactly the factor γ; as observed from the ground they then keep time with ground clocks and positions stay accurate (1)."]},"diag":true,"orig":"8.7 Q2"},{"code":"8.7 Q2","crit":"8.7","type":"mc","text":"According to special relativity, a clock on a GPS satellite moving relative to the ground is observed from the ground to","marks":1,"options":["run slow.","run fast.","run at the same rate as a ground clock.","run slow only when the satellite is overhead."],"answer":{"lines":["A."]},"diag":false,"orig":"8.7 Q1"}]},{"code":"8.8","topic":8,"title":"Calculate the rest mass-energy of an object (E_{0} = mc^{2}) and apply this to the annihilation of matter and antimatter or to a photon","intro":null,"questions":[{"code":"8.8 Q1","crit":"8.8","type":"sa","text":"Calculate the rest mass-energy of a proton (m = 1.67 × 10^{–27} kg) in J and in MeV. A proton and an antiproton at rest annihilate. Calculate the total energy released in GeV.","marks":3,"answer":{"lines":["E_{0} = mc^{2} = 1.67 × 10^{–27} × (3.00 × 10^{8})^{2} = 1.5 × 10^{–10} J (1) = 1.50 × 10^{–10}/1.60 × 10^{–19} = 9.4 × 10^{8} eV = 940 MeV (1). Annihilation releases the rest mass-energy of both particles: 2 × 940 MeV = 1.9 GeV (1)."]},"diag":true,"num":[["E₀ (J)",1.5e-10],["E₀ (MeV)",940,0.02],["released (GeV)",1.88,0.03]],"orig":"8.8 Q3"},{"code":"8.8 Q2","crit":"8.8","type":"mc","text":"The rest mass-energy of an electron is closest to","marks":1,"options":["0.51 MeV","8.2 J","511 eV","0.51 keV"],"answer":{"lines":["A. E_{0} = mc^{2} = 9.11 × 10^{–31} × 9.0 × 10^{16} = 8.2 × 10^{–14} J = 0.51 MeV."]},"diag":false,"orig":"8.8 Q1"},{"code":"8.8 Q3","crit":"8.8","type":"sa","text":"Calculate the rest mass-energy of an electron in J and MeV. An electron and a positron, both essentially at rest, annihilate to produce two identical photons. Calculate the energy and wavelength of each photon.","marks":4,"answer":{"lines":["E_{0} = mc^{2} = 9.11 × 10^{–31} × (3.00 × 10^{8})^{2} = 8.2 × 10^{–14} J (1) = 0.51 MeV (1). Total energy released = 2 × 8.19 × 10^{–14} J, shared equally: each photon has 8.2 × 10^{–14} J = 0.51 MeV (1). λ = hc/E = (6.63 × 10^{–34} × 3.00 × 10^{8})/8.19 × 10^{–14} = 2.4 × 10^{–12} m (1)."]},"diag":false,"num":[["E₀ (J)",8.19e-14],["E₀ (MeV)",0.51,0.02],["λ (m)",2.43e-12]],"orig":"8.8 Q2"},{"code":"8.8 Q4","crit":"8.8","type":"sa","text":"A gamma ray photon has an energy of 1.0 MeV. Calculate the mass equivalent of this energy in kg.","marks":2,"answer":{"lines":["E = 1.0 × 10^{6} × 1.60 × 10^{–19} = 1.6 × 10^{–13} J (1). m = E/c^{2} = 1.6 × 10^{–13}/9.0 × 10^{16} = 1.8 × 10^{–30} kg (1)."]},"diag":false,"num":[["m (kg)",1.78e-30]],"orig":"8.8 Q4"}]},{"code":"8.9","topic":8,"title":"Calculate the relativistic kinetic energy of an object: E_{k} = (γ – 1)mc^{2}","intro":null,"questions":[{"code":"8.9 Q1","crit":"8.9","type":"sa","text":"Calculate the kinetic energy of a proton moving at 0.80c, in J and in MeV.","marks":3,"answer":{"lines":["γ = 1/√(1 – 0.80^{2}) = 1.67 (1). mc^{2} = 1.67 × 10^{–27} × 9.0 × 10^{16} = 1.50 × 10^{–10} J; E_{k} = (γ – 1)mc^{2} = 0.667 × 1.50 × 10^{–10} = 1.0 × 10^{–10} J (1) = 6.3 × 10^{8} eV = 630 MeV (1)."]},"diag":true,"num":[["E_k (J)",1e-10],["E_k (MeV)",626,0.03]],"orig":"8.9 Q3"},{"code":"8.9 Q2","crit":"8.9","type":"mc","text":"An object has a Lorentz factor of 2.0. Its kinetic energy is equal to","marks":1,"options":["its rest mass-energy.","twice its rest mass-energy.","half its rest mass-energy.","zero."],"answer":{"lines":["A. E_{k} = (γ – 1)mc^{2} = (2 – 1)mc^{2} = mc^{2}."]},"diag":false,"orig":"8.9 Q1"},{"code":"8.9 Q3","crit":"8.9","type":"sa","text":"Calculate the kinetic energy of an electron moving at 0.90c, in J and MeV. Compare with the classical value ½mv^{2}.","marks":3,"answer":{"lines":["γ = 1/√(1 – 0.90^{2}) = 2.29 (1). E_{k} = (γ – 1)mc^{2} = 1.29 × 8.19 × 10^{–14} = 1.1 × 10^{–13} J = 0.66 MeV (1). Classical: ½mv^{2} = ½ × 9.11 × 10^{–31} × (2.7 × 10^{8})^{2} = 3.3 × 10^{–14} J, about one third of the relativistic value; the classical formula badly underestimates E_{k} at this speed (1)."]},"diag":false,"num":[["E_k (J)",1.06e-13],["E_k (MeV)",0.66,0.05]],"orig":"8.9 Q2"},{"code":"8.9 Q4","crit":"8.9","type":"sa","text":"An electron has a kinetic energy of 1.0 MeV. Calculate its Lorentz factor and hence its speed as a fraction of c.","marks":3,"answer":{"lines":["E_{k} = 1.0 × 10^{6} × 1.60 × 10^{–19} = 1.6 × 10^{–13} J; mc^{2} = 8.19 × 10^{–14} J (1). γ = 1 + E_{k}/mc^{2} = 1 + 1.6 × 10^{–13}/8.19 × 10^{–14} = 2.95 (1). v = c√(1 – 1/2.95^{2}) = c√(1 – 0.115) = 0.94c (1)."]},"diag":false,"num":[["γ",2.95,0.02],["v/c",0.94,0.01]],"orig":"8.9 Q4"},{"code":"8.9 Q5","crit":"8.9","type":"sa","text":"Using E_{k} = (γ – 1)mc^{2}, explain why no object with mass can be accelerated to the speed of light.","marks":2,"answer":{"lines":["As v approaches c, γ increases without limit, so E_{k} = (γ – 1)mc^{2} also increases without limit (1). Reaching c would require infinite kinetic energy, and hence infinite work done on the object, which is impossible; each increment of energy produces a smaller increase in speed as v approaches c (1)."]},"diag":false,"orig":"8.9 Q5"}]},{"code":"8.10","topic":8,"title":"Calculate the total mass-energy of an object: E_{total} = γmc^{2}","intro":null,"questions":[{"code":"8.10 Q1","crit":"8.10","type":"sa","text":"Calculate the total mass-energy of an electron moving at 0.90c (γ = 2.29) and show that it equals the sum of its rest mass-energy and kinetic energy.","marks":2,"answer":{"lines":["E_{total} = γmc^{2} = 2.29 × 8.19 × 10^{–14} = 1.9 × 10^{–13} J = 1.2 MeV (1). E_{0} + E_{k} = 8.19 × 10^{–14} + 1.06 × 10^{–13} = 1.9 × 10^{–13} J, as expected since γmc^{2} = mc^{2} + (γ – 1)mc^{2} (1)."]},"diag":true,"num":[["E_total (J)",1.88e-13]],"orig":"8.10 Q2"},{"code":"8.10 Q2","crit":"8.10","type":"mc","text":"The total mass-energy of a moving object is equal to","marks":1,"options":["its rest mass-energy plus its kinetic energy.","its rest mass-energy minus its kinetic energy.","its kinetic energy only.","its rest mass-energy only."],"answer":{"lines":["A. γmc^{2} = mc^{2} + (γ – 1)mc^{2}."]},"diag":false,"orig":"8.10 Q1"},{"code":"8.10 Q3","crit":"8.10","type":"sa","text":"A proton moves at 0.60c. Calculate its total mass-energy in J and in GeV, and its kinetic energy in J.","marks":3,"answer":{"lines":["γ = 1/√(1 – 0.60^{2}) = 1.25; mc^{2} = 1.50 × 10^{–10} J (1). E_{total} = γmc^{2} = 1.25 × 1.50 × 10^{–10} = 1.9 × 10^{–10} J = 1.17 × 10^{9} eV = 1.2 GeV (1). E_{k} = (γ – 1)mc^{2} = 0.25 × 1.50 × 10^{–10} = 3.8 × 10^{–11} J (1)."]},"diag":false,"num":[["E_total (J)",1.88e-10],["E_total (GeV)",1.17,0.03],["E_k (J)",3.76e-11]],"orig":"8.10 Q3"},{"code":"8.10 Q4","crit":"8.10","type":"sa","text":"The total mass-energy of a particle is three times its rest mass-energy. Calculate its speed as a fraction of c.","marks":2,"answer":{"lines":["E_{total} = γmc^{2} = 3mc^{2}, so γ = 3 (1). v = c√(1 – 1/9) = 0.94c (1)."]},"diag":false,"num":[["v/c",0.943,0.01]],"orig":"8.10 Q4"},{"code":"8.10 Q5","crit":"8.10","type":"sa","text":"An electron has a total mass-energy of 2.0 MeV. Calculate its kinetic energy in MeV and its speed as a fraction of c.","marks":3,"answer":{"lines":["E_{0} = 0.51 MeV; E_{k} = E_{total} – E_{0} = 2.0 – 0.51 = 1.5 MeV (1). γ = E_{total}/E_{0} = 2.0/0.512 = 3.9 (1). v = c√(1 – 1/3.9^{2}) = c√(1 – 0.0655) = 0.97c (1)."]},"diag":false,"num":[["E_k (MeV)",1.49,0.03],["v/c",0.967,0.01]],"orig":"8.10 Q5"}]}],"imgs":{"diff_rings":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA0gAAAGkCAYAAAAL/gULAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAXEgAAFxIBZ5/SUgAA7rxJREFUeJzsnXlcVPX+/18zwwz7vskmgoAoLrjhhgouaZbmnkupWaZllr9blqZlZnXvrVtaN1Oza1l93TUz01ITcN9QcEEEZJd9R/YZzu8PnNM5s4EI53OG+TwfDx5yzhk4bznL+/PeJQzDMKBQKBQKhUKhUCgUCqSkBaBQKBQKhUKhUCgUsUANJAqFQqFQKBQKhUJ5CDWQKBQKhUKhUCgUCuUh1ECiUCgUCoVCoVAolIdQA4lCoVAoFAqFQqFQHkINJAqFQqFQKBQKhUJ5CDWQKBQKhUKhUCgUCuUh1ECiUCgUCoVCoVAolIdQA4nSJvzwww+QSCS8r4iICNJidUg++OADrb/1ggULSItFoVAoFEJQHUyhtC3UQKIAAIqKirReri35Ui/Mp02bhuTkZHh5eZH9jwAoKyvDBx98wH5FR0eTFqlNef3115GcnExaDAqFQiFGly5d9OolrmGg63M//PADMbnbCzHpYAqlI2BGWgCKOHByckJycjLu37/PUy5hYWH4v//7P50/M3fuXPZ7W1tb2NrawsyM/C1VVlaGdevW8fZ1JE+ak5MTnJycSItBoVAoxIiJicHly5fx7LPPgmEYdv///vc/jBs3jve5H374AevWrcOePXvQt29fuLu7kxC5XRGTDqZQOgL0SaIAAKRSKQICArRerpaWlggICND5M5aWlkKIRqFQKBQKD19fX/j6+uL06dP4+uuv2f0ffvghpk2bxm7LZDJs2LABS5YswYwZM0iISqFQjBCaYkdpNR999BFef/110mJQKBQKxUT59NNP0a1bN3Y7IyMDS5cuZbdffPFFuLi44LPPPiMhHoVCMVKogUR5JKKjoyGRSJCeno7w8HD069fvkX6eYRjs3r0b48ePh5ubGxQKBVxcXDB+/Hj8+uuven/u2rVrWLBgAfz9/WFpaQl7e3t069YNEydOxMaNG5GWlgYAWLBgAfz8/Hg/u27dOjb3/IMPPgCgPy99+/bt6N+/P6ytrbVy2aurq7Fx40aMGDECzs7OkMvlcHZ2xogRI7Bx40ZUV1fzzhsREaF1ju3bt2PDhg3o06cPrK2tYW1tjVGjRuHKlSuP9HfUpLGxER9//DG6desGc3NzODg4YOzYsTh+/LjOz1dVVeHTTz/F4MGD4eDgAHNzc/j4+OC5557DjRs3tD6fkpKCVatWYdiwYfDx8YGFhQWsrKzQtWtXzJkzB2fOnNH6GV1/44MHD+KNN96Ar68vFAoFOnXqhJdeegllZWUAgAMHDiAsLAxWVlZwcnLCzJkzkZ2d/Vh/GwqF0nGxtLTETz/9xMt++L//+z/s2bMHW7duxcmTJ7Fjxw5YW1s/0u9NT0/XWd90584drFmzBl27doVCoWD1SmNjI7788ks888wzCAwMhL29PRQKBdzc3BAZGYlNmzahoaGB/f26mu1o6pxZs2Y9du3U1q1b0bt3b1haWsLW1hbDhg3Drl27dH62oaEBW7ZswciRI+Hs7AyFQgEPDw9MnToVp0+f1vp8fn4+1q1bh8jISPj6+sLKygqWlpbo3Lk   "4.2 Q3": () => { const L = R(0.5, 0.9, 0.05), n = pick([2, 3, 4]), f = R(300, 800, 10); const l = 2 * L / n, v = f * l;

  "4.2 Q4": () => { const L = R(1.0, 2.0, 0.1), n = R(2, 5, 1), fn = R(100, 400, 20); const f1 = fn / n, v = f1 * 2 * L;

  "4.2 Q5": () => { const v = R(80, 300, 10), f1 = R(50, 250, 10); const L = v / (2 * f1);

  "4.4 Q2": () => { const f1 = R(50, 200, 10), n = R(2, 5, 1), k = R(5, 9, 1); const ok = Math.random() < 0.5; const test = ok ? k * f1 : k * f1 + f1 / 2;
    return { text: `A string resonates at ${n * f1} Hz and at ${(n + 1) * f1} Hz, and at no frequency in between. (a) Determine the fundamental frequency and identify which harmonics these are. (b) Determine whether ${test} Hz is a possible harmonic frequency for this string.`, marks: 3,

      lines: [`a. Adjacent harmonics differ by f_{1}: f_{1} = ${(n + 1) * f1} – ${n * f1} = ${f1} Hz (1). ${n * f1}/${f1} = ${n} and ${(n + 1) * f1}/${f1} = ${n + 1}, so they are the ${ord(n)} and ${ord(n + 1)} harmonics (1).`, `b. ${test}/${f1} = ${num(test / f1, 3)}, ${ok ? "a whole number, so " + test + " Hz is the " + ord(k) + " harmonic and is possible" : "not a whole number, so " + test + " Hz is not a harmonic and cannot produce a standing wave"} (1).`] }; },
  "4.4 Q5": () => { const f1 = R(60, 200, 10); const k = pick([2, 3, 4]);

  "5.1 Q2": () => { const v = R(1.0, 9.0, 0.5) * 1e6; const l = H / (ME * v);

  "5.1 Q4": () => { const m = pick([0.057, 0.16, 0.45, 0.60]), v = R(10, 60, 5); const l = H / (m * v); const obj = { 0.057: "tennis ball", 0.16: "cricket ball", 0.45: "football", 0.60: "basketball" }[m];
    return { text: `A ${obj} of mass ${num(m, 2)} kg travels at ${v} m s^{–1}. Calculate its de Broglie wavelength and explain why the ball shows no observable diffraction when passing through a doorway.`, marks: 3, num: [V("λ (m)", l, 0.05)],

  "5.1 Q5": () => { const v = pick([50, 100, 150, 200, 250, 400, 500]); const Ek = E * v, p = Math.sqrt(2 * ME * Ek), l = H / p;
    return { text: `An electron is accelerated from rest through ${v} V. Calculate its kinetic energy in joules, its momentum and its de Broglie wavelength.`, marks: 3,

      lines: [`E_{k} = qV = 1.60 × 10^{–19} × ${v} = ${sci(Ek, 2)} J (1). p = √(2mE_{k}) = √(2 × 9.11 × 10^{–31} × ${sci(Ek, 2)}) = ${sci(p, 2)} kg m s^{–1} (1). λ = h/p = 6.63 × 10^{–34}/${sci(p, 2)} = ${sci(l, 2)} m (1).`] }; },
  "5.2 Q2": () => { const l = R(1.0, 5.0, 0.5) * 1e-11; const p = H / l, Ek = p * p / (2 * ME), Ex = H * C / l;
    return { text: `X-rays of wavelength ${sci(l, 2)} m produce a diffraction pattern from a crystal. A beam of electrons produces an identical pattern from the same crystal. Calculate the kinetic energy of the electrons and the energy of the X-ray photons, both in keV.`, marks: 4,
      num: [V("electron E_k (keV)", eV(Ek) / 1e3, 0.05), V("X-ray E (keV)", eV(Ex) / 1e3, 0.05)],
      lines: [`Identical patterns mean identical wavelengths: λ_{e} = ${sci(l, 2)} m (1). Electron: p = h/λ = 6.63 × 10^{–34}/${sci(l, 2)} = ${sci(p, 2)} kg m s^{–1}; E_{k} = p^{2}/2m = (${sci(p, 2)})^{2}/(2 × 9.11 × 10^{–31}) = ${sci(Ek, 2)} J (1) = ${num(eV(Ek) / 1e3, 2)} keV (1). X-ray photon: E = hc/λ = (6.63 × 10^{–34} × 3.00 × 10^{8})/${sci(l, 2)} = ${sci(Ex, 2)} J = ${num(eV(Ex) / 1e3, 2)} keV (1).`] }; },
  "5.2 Q3": () => { const v = R(0.5, 3.0, 0.5) * 1e7; const l = H / (ME * v), Ex = H * C / l, Ek = 0.5 * ME * v * v;
    return { text: `Electrons travelling at ${sci(v, 2)} m s^{–1} produce a diffraction pattern from a thin crystal. (a) Calculate the wavelength of X-rays that would produce an identical pattern. (b) Calculate the energy of these X-ray photons and the kinetic energy of the electrons, both in eV.`, marks: 5,
      num: [V("a. λ (m)", l), V("b. X-ray E (eV)", eV(Ex), 0.05), V("b. electron E_k (eV)", eV(Ek), 0.05)],
      lines: [`a. λ = h/mv = 6.63 × 10^{–34}/(9.11 × 10^{–31} × ${sci(v, 2)}) = ${sci(l, 2)} m (1); X-rays must have this same wavelength (1).`, `b. X-ray: E = hc/λ = (6.63 × 10^{–34} × 3.00 × 10^{8})/${sci(l, 3)} = ${sci(Ex, 2)} J (1) = ${sci(eV(Ex), 2)} eV (1). Electron: E_{k} = ½mv^{2} = ½ × 9.11 × 10^{–31} × (${sci(v, 2)})^{2} = ${sci(Ek, 2)} J = ${sci(eV(Ek), 2)} eV (1).`] }; },
  "6.1 Q2": () => { const l = R(0.05, 0.50, 0.05); const p = H / (l * 1e-9);
    return { text: `Calculate the momentum of an X-ray photon of wavelength ${num(l, 2)} nm.`, marks: 2, num: [V("p (kg m/s)", p)],

  "6.1 Q3": () => { const ev = R(1.5, 4.0, 0.1); const J = ev * E, p = J / C, l = H * C / J;
    return { text: `A photon has an energy of ${num(ev, 2)} eV. Calculate its momentum using p = E/c, then calculate its wavelength and confirm the momentum using p = h/λ.`, marks: 3, num: [V("p (kg m/s)", p), V("λ (m)", l)],
      lines: [`E = ${num(ev, 2)} × 1.60 × 10^{–19} = ${sci(J, 2)} J; p = E/c = ${sci(J, 2)}/3.00 × 10^{8} = ${sci(p, 2)} kg m s^{–1} (1). λ = hc/E = (6.63 × 10^{–34} × 3.00 × 10^{8})/${sci(J, 2)} = ${sci(l, 2)} m (1). p = h/λ = 6.63 × 10^{–34}/${sci(l, 2)} = ${sci(p, 2)} kg m s^{–1}, in agreement (1).`] }; },
  "6.1 Q4": () => { const p = R(1.0, 3.5, 0.1) * 1e-27; const l = H / p, En = p * C;
    return { text: `A photon has momentum ${sci(p, 2)} kg m s^{–1}. Calculate its wavelength and its energy in eV.`, marks: 3, num: [V("λ (m)", l), V("E (eV)", eV(En), 0.05)],
      lines: [`λ = h/p = 6.63 × 10^{–34}/${sci(p, 2)} = ${sci(l, 2)} m (1). E = pc = ${sci(p, 2)} × 3.00 × 10^{8} = ${sci(En, 2)} J (1) = ${num(eV(En), 2)} eV (1).`] }; },
  "6.2 Q2": () => { const n = R(1.0, 9.0, 0.5) * 1e18, l = R(400, 700, 10); const p = H / (l * 1e-9), F = 2 * n * H / (l * 1e-9);
    return { text: `A laser directs ${sci(n, 2)} photons per second of wavelength ${l} nm at normal incidence onto a perfectly reflecting mirror. Calculate the momentum of each photon, the momentum change of each photon on reflection, and the force on the mirror.`, marks: 3,
      num: [V("p (kg m/s)", p), V("Δp per photon (kg m/s)", 2 * p), V("F (N)", F)],
      lines: [`p = h/λ = 6.63 × 10^{–34}/${l} × 10^{–9} = ${sci(p, 2)} kg m s^{–1} (1). Perfect reflection reverses the momentum, so Δp = 2p = 2h/λ = ${sci(2 * p, 2)} kg m s^{–1} per photon (1). F = 2nh/(λt) = (2 × ${sci(n, 2)} × 6.63 × 10^{–34})/(${l} × 10^{–9} × 1.0) = ${sci(F, 2)} N (1).`] }; },
  "6.2 Q3": () => { const n = R(1.0, 9.0, 0.5) * 1e23, l = R(450, 650, 10); const F = 2 * n * H / (l * 1e-9);
    return { text: `A perfectly reflecting solar sail is struck at normal incidence by ${sci(n, 2)} photons of average wavelength ${l} nm every second. (a) Calculate the force on the sail. (b) The sail is replaced with one of the same size that absorbs all the light. Explain how and why the force changes, and state its new value.`, marks: 4,
      num: [V("a. F (N)", F), V("b. F (N)", F / 2)],
      lines: [`a. F = 2nh/(λt) (1) = (2 × ${sci(n, 2)} × 6.63 × 10^{–34})/(${l} × 10^{–9} × 1.0) = ${sci(F, 2)} N (1).`, `b. An absorbed photon's momentum changes from p to 0 (Δp = h/λ) instead of from p to –p (Δp = 2h/λ) (1). The force is halved: F = nh/(λt) = ${sci(F / 2, 2)} N (1).`] }; },
  "6.2 Q4": () => { const n = R(1, 9, 1) * 1e19, l = R(300, 650, 50), t = pick([1.0, 2.0, 5.0]); const F = 2 * n * H / (l * 1e-9 * t);
    return { text: `In ${num(t, 2)} s, ${sci(n, 2)} photons of wavelength ${l} nm strike a surface at normal incidence and are all reflected back along their original path. Calculate the average force on the surface.`, marks: 2, num: [V("F (N)", F)],
      lines: [`Each photon's momentum reverses, so Δp = 2h/λ per photon and F = 2nh/(λt) (1). F = (2 × ${sci(n, 2)} × 6.63 × 10^{–34})/(${l} × 10^{–9} × ${num(t, 2)}) = ${sci(F, 2)} N (1).`] }; },
  "7.4 Q2": () => { const ion = pick([3.4, 1.5, 0.85]), ph = R(ion + 0.5, ion + 4.0, 0.1); const ek = ph - ion; const n = { 3.4: 2, 1.5: 3, 0.85: 4 }[ion];
    return { text: `A hydrogen atom has its electron in the n = ${n} level, which is ${num(ion, 2)} eV below the ionisation level. The atom absorbs a photon of energy ${num(ph, 2)} eV. Calculate the kinetic energy of the ejected electron in eV.`, marks: 2,

      lines: [`Only ${num(ion, 2)} eV is needed to free the electron from the n = ${n} level (1). E_{k} = ${num(ph, 2)} – ${num(ion, 2)} = ${num(ek, 2)} eV (1).`] }; },
  "7.4 Q4": () => { const ion = R(4.0, 8.0, 0.1), lev = R(1.0, 3.0, 0.1), ph = R(ion - lev + 0.5, ion - lev + 3.0, 0.1); const need = ion - lev, ek = ph - need;
    return { text: `An atom has an ionisation energy of ${num(ion, 2)} eV. Its electron is in an excited level ${num(lev, 2)} eV above the ground state when it absorbs a photon of energy ${num(ph, 2)} eV. Show that the atom is ionised and calculate the kinetic energy of the ejected electron in eV.`, marks: 2,

      lines: [`From the ${num(lev, 2)} eV level the electron needs ${num(ion, 2)} – ${num(lev, 2)} = ${num(need, 2)} eV to escape; the ${num(ph, 2)} eV photon supplies more than this, so the atom is ionised (1). E_{k} = ${num(ph, 2)} – ${num(need, 2)} = ${num(ek, 2)} eV (1).`] }; },
  "7.4 Q3": () => { const ph = R(15, 30, 1); const ek = ph - 13.6, v = Math.sqrt(2 * ek * E / ME);

  "7.4 Q5": () => { const ion = R(3.0, 5.5, 0.1), l = R(150, 250, 10); const Ep = eV(H * C / (l * 1e-9)); const ek = Ep - ion;

  "8.1 Q2": () => { const b1 = pick([0.50, 0.60, 0.70, 0.75]), b2 = pick([0.90, 0.95, 0.98, 0.99]);

  "8.1 Q3": () => { const b = pick([0.990, 0.995, 0.998, 0.999]);

  "8.1 Q4": () => { const v = R(1.0, 6.0, 0.5) * 1e7; const b = v / C, g = gamma(b);

  "8.2 Q2": () => { const b = pick([0.60, 0.80, 0.90, 0.95]), t0 = R(5, 30, 5), L0 = R(20, 100, 10); const g = gamma(b);

  "8.3 Q2": () => { const g1 = pick([3.0, 4.0, 5.0, 8.0]), g2 = pick([1.10, 1.25, 1.50, 2.0]); const vb = g => Math.sqrt(1 - 1 / (g * g));

  "8.4 Q3": () => { const d = R(4, 20, 2), b = pick([0.60, 0.80, 0.90]); const g = gamma(b);
    return { text: `A spacecraft travels from Earth to a space station ${d} light-years away (Earth frame) at ${num(b, 2)}c. Identify who measures the proper time for the journey and who measures the proper distance between Earth and the station. Justify each answer, and calculate the distance measured by the crew.`, marks: 3, num: [V("crew distance (light-years)", d / g)],
      lines: [`Proper time: the spacecraft crew, since departure and arrival both occur at the crew's own location (the ship) (1). Proper distance: Earth/station observers, who are at rest relative to both endpoints (1). Crew distance: γ = ${num(g, 3)}, L = ${d}/${num(g, 3)} = ${num(d / g, 2)} light-years (1).`] }; },
  "8.6 Q3": () => { const b = pick([0.98, 0.99, 0.995]), hkm = R(2.0, 5.0, 0.5); const g = gamma(b), dc = b * C * 2.2e-6, Lc = hkm * 1e3 / g;
    return { text: `Muons travelling at ${num(b, 3)}c (γ = ${num(g, 2)}) are created ${num(hkm, 2)} km above the ground. Their proper lifetime is 2.2 μs. (a) Calculate the distance the muons would travel in one lifetime according to classical physics. (b) Using the muon's frame of reference, determine by calculation whether the muons can reach the ground.`, marks: 3, num: [V("a. d (m)", dc), V("b. L (m)", Lc)],
      lines: [`a. d = vt_{0} = ${num(b, 3)} × 3.00 × 10^{8} × 2.2 × 10^{–6} = ${num(dc, 2)} m (1).`, `b. In the muon's frame the ${num(hkm, 2)} km is length-contracted: L = L_{0}/γ = ${hkm * 1000}/${num(g, 2)} = ${num(Lc, 2)} m (1). The muon lives 2.2 μs in its own frame and can travel ${num(dc, 2)} m in that time, which ${dc > Lc ? "exceeds" : "is less than"} ${num(Lc, 2)} m, so ${dc > Lc ? "it reaches the ground" : "a muon living exactly its average lifetime does not reach the ground"} (1).`] }; },
  "8.6 Q4": () => { const b = pick([0.98, 0.99, 0.995]), hkm = R(3.0, 8.0, 0.5); const g = gamma(b), t = g * 2.2, d = b * C * t * 1e-6;
    return { text: `Muons moving at ${num(b, 3)}c are created ${num(hkm, 2)} km above the ground. Using the Earth frame, calculate the dilated lifetime and the distance travelled in that time, and state whether the muons reach the ground.`, marks: 3, num: [V("t (μs)", t), V("d (km)", d / 1e3)],
      lines: [`γ = 1/√(1 – ${num(b, 3)}^{2}) = ${num(g, 2)}; t = γt_{0} = ${num(g, 2)} × 2.2 = ${num(t, 2)} μs (1). d = vt = ${num(b, 3)} × 3.00 × 10^{8} × ${num(t, 2)} × 10^{–6} = ${num(d / 1e3, 2)} km (1), which ${d > hkm * 1e3 ? "exceeds" : "is less than"} ${num(hkm, 2)} km, so ${d > hkm * 1e3 ? "the muons reach the ground" : "a muon living its average lifetime does not reach the ground"} (1).`] }; },
  "8.7 Q3": () => { const v = R(3.0, 8.0, 0.5) * 1e3; const g1 = v * v / (2 * C * C), lost = g1 * 86400;
    return { text: `A satellite moves at ${sci(v, 2)} m s^{–1} relative to the ground. For small v, γ ≈ 1 + v^{2}/2c^{2}. Calculate γ – 1 and hence the time lost by the satellite clock relative to a ground clock in one day (86 400 s).`, marks: 3, num: [V("γ – 1", g1, 0.05), V("time lost per day (s)", lost, 0.05)],
      lines: [`γ – 1 ≈ v^{2}/2c^{2} = (${sci(v, 2)})^{2}/(2 × (3.00 × 10^{8})^{2}) (1) = ${sci(g1, 2)} (1). Time lost per day = (γ – 1) × 86 400 = ${sci(lost, 2)} s (1).`] }; },
  "8.8 Q4": () => { const mev = pick([0.5, 1.0, 2.0, 5.0, 10]); const J = mev * 1e6 * E, m = J / (C * C);
    return { text: `A gamma ray photon has an energy of ${num(mev, 2)} MeV. Calculate the mass equivalent of this energy in kg.`, marks: 2, num: [V("m (kg)", m)],
      lines: [`E = ${num(mev, 2)} × 10^{6} × 1.60 × 10^{–19} = ${sci(J, 2)} J (1). m = E/c^{2} = ${sci(J, 2)}/9.00 × 10^{16} = ${sci(m, 2)} kg (1).`] }; },
  "8.8 Q5": () => { const g = pick([0.5, 1.0, 2.0, 5.0, 10]); const En = g * 1e-3 * C * C;
    return { text: `Calculate the energy released if ${num(g, 2)} g of matter were completely converted to energy.`, marks: 2, num: [V("E (J)", En)],
      lines: [`E = mc^{2} = ${sci(g * 1e-3, 2)} × 9.00 × 10^{16} (1) = ${sci(En, 2)} J (1).`] }; },
  "8.9 Q2": () => { const b = pick([0.80, 0.90, 0.95, 0.99]); const g = gamma(b), mc2 = ME * C * C, Ek = (g - 1) * mc2, cl = 0.5 * ME * (b * C) ** 2;
    return { text: `Calculate the kinetic energy of an electron moving at ${num(b, 2)}c, in J and MeV. Compare with the classical value ½mv^{2}.`, marks: 3, num: [V("E_k (J)", Ek), V("E_k (MeV)", eV(Ek) / 1e6, 0.05)],
      lines: [`γ = 1/√(1 – ${num(b, 2)}^{2}) = ${num(g, 3)} (1). E_{k} = (γ – 1)mc^{2} = ${num(g - 1, 3)} × 8.20 × 10^{–14} = ${sci(Ek, 2)} J = ${num(eV(Ek) / 1e6, 2)} MeV (1). Classical: ½mv^{2} = ½ × 9.11 × 10^{–31} × (${sci(b * C, 2)})^{2} = ${sci(cl, 2)} J, about ${num(cl / Ek, 1)} of the relativistic value; the classical formula underestimates E_{k} at this speed (1).`] }; },
  "8.9 Q3": () => { const b = pick([0.60, 0.80, 0.90, 0.95]); const g = gamma(b), mc2 = MP * C * C, Ek = (g - 1) * mc2;
    return { text: `Calculate the kinetic energy of a proton moving at ${num(b, 2)}c, in J and in MeV.`, marks: 3, num: [V("E_k (J)", Ek), V("E_k (MeV)", eV(Ek) / 1e6, 0.03)],
      lines: [`γ = 1/√(1 – ${num(b, 2)}^{2}) = ${num(g, 3)} (1). mc^{2} = 1.67 × 10^{–27} × 9.00 × 10^{16} = 1.50 × 10^{–10} J; E_{k} = (γ – 1)mc^{2} = ${num(g - 1, 3)} × 1.50 × 10^{–10} = ${sci(Ek, 2)} J (1) = ${sci(eV(Ek), 2)} eV = ${num(eV(Ek) / 1e6, 3)} MeV (1).`] }; },
  "8.9 Q4": () => { const mev = pick([0.5, 1.0, 1.5, 2.0, 5.0]); const Ek = mev * 1e6 * E, mc2 = ME * C * C, g = 1 + Ek / mc2, vb = Math.sqrt(1 - 1 / (g * g));
    return { text: `An electron has a kinetic energy of ${num(mev, 2)} MeV. Calculate its Lorentz factor and hence its speed as a fraction of c.`, marks: 3, num: [V("γ", g, 0.02), V("v/c", vb, 0.01)],
      lines: [`E_{k} = ${num(mev, 2)} × 10^{6} × 1.60 × 10^{–19} = ${sci(Ek, 2)} J; mc^{2} = 8.20 × 10^{–14} J (1). γ = 1 + E_{k}/mc^{2} = 1 + ${sci(Ek, 2)}/8.20 × 10^{–14} = ${num(g, 3)} (1). v = c√(1 – 1/${num(g, 3)}^{2}) = c√(1 – ${num(1 / (g * g), 3)}) = ${num(vb, 2)}c (1).`] }; },
  "8.10 Q2": () => { const b = pick([0.80, 0.90, 0.95, 0.99]); const g = gamma(b), mc2 = ME * C * C;
    return { text: `Calculate the total mass-energy of an electron moving at ${num(b, 2)}c (γ = ${num(g, 3)}) and show that it equals the sum of its rest mass-energy and kinetic energy.`, marks: 2, num: [V("E_total (J)", g * mc2)],
      lines: [`E_{total} = γmc^{2} = ${num(g, 3)} × 8.20 × 10^{–14} = ${sci(g * mc2, 2)} J = ${num(eV(g * mc2) / 1e6, 2)} MeV (1). E_{0} + E_{k} = 8.20 × 10^{–14} + ${sci((g - 1) * mc2, 3)} = ${sci(g * mc2, 2)} J, as expected since γmc^{2} = mc^{2} + (γ – 1)mc^{2} (1).`] }; },
  "8.10 Q3": () => { const b = pick([0.60, 0.80, 0.90]); const g = gamma(b), mc2 = MP * C * C;
    return { text: `A proton moves at ${num(b, 2)}c. Calculate its total mass-energy in J and in GeV, and its kinetic energy in J.`, marks: 3, num: [V("E_total (J)", g * mc2), V("E_total (GeV)", eV(g * mc2) / 1e9, 0.03), V("E_k (J)", (g - 1) * mc2)],
      lines: [`γ = 1/√(1 – ${num(b, 2)}^{2}) = ${num(g, 3)}; mc^{2} = 1.50 × 10^{–10} J (1). E_{total} = γmc^{2} = ${num(g, 3)} × 1.50 × 10^{–10} = ${sci(g * mc2, 2)} J = ${sci(eV(g * mc2), 3)} eV = ${num(eV(g * mc2) / 1e9, 2)} GeV (1). E_{k} = (γ – 1)mc^{2} = ${num(g - 1, 3)} × 1.50 × 10^{–10} = ${sci((g - 1) * mc2, 2)} J (1).`] }; },
  "8.10 Q4": () => { const k = pick([2, 3, 4, 5, 10]); const vb = Math.sqrt(1 - 1 / (k * k));
    return { text: `The total mass-energy of a particle is ${["", "", "twice", "three times", "four times", "five times", "", "", "", "", "ten times"][k]} its rest mass-energy. Calculate its speed as a fraction of c.`, marks: 2, num: [V("v/c", vb, 0.01)],
      lines: [`E_{total} = γmc^{2} = ${k}mc^{2}, so γ = ${k} (1). v = c√(1 – 1/${k * k}) = ${num(vb, 3)}c (1).`] }; },
  "8.10 Q5": () => { const mev = pick([1.0, 1.5, 2.0, 3.0, 5.0]); const E0 = 0.511; const Ek = mev - E0, g = mev / E0, vb = Math.sqrt(1 - 1 / (g * g));
    return { text: `An electron has a total mass-energy of ${num(mev, 2)} MeV. Calculate its kinetic energy in MeV and its speed as a fraction of c.`, marks: 3, num: [V("E_k (MeV)", Ek, 0.03), V("v/c", vb, 0.01)],
      lines: [`E_{0} = 0.51 MeV; E_{k} = E_{total} – E_{0} = ${num(mev, 2)} – 0.51 = ${num(Ek, 2)} MeV (1). γ = E_{total}/E_{0} = ${num(mev, 2)}/0.511 = ${num(g, 2)} (1). v = c√(1 – 1/${num(g, 2)}^{2}) = c√(1 – ${num(1 / (g * g), 3)}) = ${num(vb, 2)}c (1).`] }; },
};
function l1e9(nm) { return nm * 1e-9; }
function ord(n) { return ["", "first", "second", "third", "fourth", "fifth", "sixth", "seventh", "eighth", "ninth", "tenth"][n] || n + "th"; }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function parseNum(s) {
  if (!s) return NaN;
  let t = s.trim().toLowerCase().replace(/,/g, "").replace(/−|–/g, "-").replace(/\s+/g, "");
  t = t.replace(/×|x|\*/g, "*").replace(/\*10\^\(?(-?\d+)\)?/g, "e$1").replace(/\*10\*\*\(?(-?\d+)\)?/g, "e$1").replace(/^10\^\(?(-?\d+)\)?$/, "1e$1");
  t = t.replace(/\^\(?(-?\d+)\)?/g, "e$1");
  const v = Number(t);
  return isFinite(v) ? v : NaN;
}
function qstate(code) { return state[code] || {}; }
function setq(code, patch) { state[code] = { ...qstate(code), ...patch }; save(); renderNav(); }
function critStatus(c) { return c.questions.map(q => qstate(q.code).mark || ""); }

let current = null;
const TC = t => "var(--t" + t + ")";
function counts(qs) { const c = { got: 0, part: 0, miss: 0 }; qs.forEach(q => { const m = qstate(q.code).mark; if (m) c[m]++; }); return c; }
function bar(c, n) { const w = k => (100 * c[k] / n).toFixed(1) + "%"; return '<div class="bar"><i class="g" style="width:' + w("got") + '"></i><i class="p" style="width:' + w("part") + '"></i><i class="m" style="width:' + w("miss") + '"></i></div>'; }
function renderNav() {
  const nav = document.getElementById("nav");
  let h = '<div class="lead"><strong>Choose a criterion</strong> to work on. The bar fills as you mark each question.</div>';
  let lastTopic = 0;
  DATA.bank.forEach(c => {
    if (c.topic !== lastTopic) { h += '<h2 style="--tc:' + TC(c.topic) + '"><span class="sw"></span>' + c.topic + '. ' + esc(DATA.topics[c.topic - 1]) + '</h2>'; lastTopic = c.topic; }
    const segs = critStatus(c).map(m => '<i class="' + (m ? 'm-' + m : '') + '"></i>').join("");
    h += '<button class="crit' + (current === c.code ? " active" : "") + '" style="--tc:' + TC(c.topic) + '" data-c="' + c.code + '"><span class="code">' + c.code + '</span><span class="name">' + fmt(c.title) + '</span><span class="seg">' + segs + '</span></button>';
  });
  nav.innerHTML = h;
  nav.querySelectorAll(".crit").forEach(b => b.addEventListener("click", () => openCrit(b.dataset.c)));
  renderMath(nav);
}
function renderHome() {
  current = null; renderNav();
  const all = DATA.bank.flatMap(c => c.questions);
  const tot = counts(all); const marked = tot.got + tot.part + tot.miss;
  const todo = DATA.bank.filter(c => critStatus(c).some(m => m === "part" || m === "miss"));
  let h = '<div class="home"><h2>Choose a criterion to work on</h2>' +
    '<p>Question 1 of each criterion is the key test: if you can do it, move on or keep going for more practice. Answer in your exercise book, check your values where a box is provided, then reveal the answer and mark yourself.</p>' +
    '<div class="overall"><div class="row"><span><strong>' + marked + '</strong> of ' + all.length + ' questions marked</span>' + bar(tot, all.length) + '</div>' +
    '<div class="key"><span><i style="background:var(--got)"></i>Got it ' + tot.got + '</span><span><i style="background:var(--part)"></i>Partly ' + tot.part + '</span><span><i style="background:var(--miss)"></i>Missed ' + tot.miss + '</span></div></div>' +
    '<div class="topics">' + DATA.topics.map((t, i) => {
      const qs = DATA.bank.filter(c => c.topic === i + 1).flatMap(c => c.questions); const c = counts(qs); const m = c.got + c.part + c.miss;
      const first = DATA.bank.find(c => c.topic === i + 1).code;
      return '<button class="tcard" style="--tc:' + TC(i + 1) + '" data-c="' + first + '"><div class="tn">Topic ' + (i + 1) + '</div><div class="tt">' + esc(t) + '</div>' + bar(c, qs.length) + '<div class="tc2">' + m + ' of ' + qs.length + ' marked</div></button>';
    }).join("") + '</div>';
  if (todo.length) h += '<div class="todo"><h3>Still to fix</h3>' + todo.map(c => '<button style="--tc:' + TC(c.topic) + '" data-c="' + c.code + '"><span class="code">' + c.code + '</span>' + fmt(c.title) + '</button>').join("") + '</div>';
  h += '</div>';
  const main = document.getElementById("main");
  main.innerHTML = h;
  main.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", () => openCrit(b.dataset.c)));
  renderMath(main);
}
function openCrit(code) {
  current = code; renderNav();
  const c = DATA.bank.find(x => x.code === code);
  let h = '<button class="btn back" id="backBtn">All criteria</button>' +
    '<div class="crit-head" style="--tc:' + TC(c.topic) + '"><div class="code">Criterion ' + c.code + '</div><h2>' + fmt(c.title) + '</h2><div class="topic">' + c.topic + '. ' + esc(DATA.topics[c.topic - 1]) + '</div></div>';
  if (c.intro) h += '<div class="intro">' + (c.intro.img ? '<img src="' + DATA.imgs[c.intro.img] + '" alt="">' : '') + fmt(c.intro.text) + '</div>';
  c.questions.forEach(q => h += renderQ(q));
  const main = document.getElementById("main");
  main.innerHTML = h;
  window.scrollTo(0, 0);
  document.getElementById("backBtn").addEventListener("click", renderHome);
  document.getElementById("nav").classList.add("hidden");
  c.questions.forEach(q => bindQ(q));
  renderMath(main);
}
function renderQ(q) {
  const st = q.variant ? { mark: qstate(q.code).mark } : qstate(q.code);
  let h = '<div class="q ' + (st.mark ? 'm-' + st.mark : '') + '" id="q-' + q.code.replace(/\W/g, "_") + '">' +
    '<div class="qh"><span class="code">' + q.code + (q.variant ? ' <span class="vtag">similar question</span>' : '') + '</span><span class="marks">' + q.marks + (q.marks > 1 ? ' marks' : ' mark') + '</span></div>' +
    '<div class="qt">' + fmt(q.text) + '</div>';
  if (q.img) h += '<img src="' + DATA.imgs[q.img] + '" alt="">';
  if (q.parts) q.parts.forEach(p => { h += '<div class="part"><span>' + fmt(p.text) + '</span><span class="pm">' + p.marks + (p.marks > 1 ? ' marks' : ' mark') + '</span></div>'; if (p.img) h += '<img src="' + DATA.imgs[p.img] + '" alt="">'; });
  if (q.type === "mc") {
    h += '<ul class="opts">' + q.options.map((o, i) => '<li><label><input type="radio" name="mc-' + q.code + '" value="' + i + '"' + (st.choice === i ? " checked" : "") + '><span class="let">' + "ABCD"[i] + '</span><span>' + fmt(o) + '</span></label></li>').join("") + '</ul>' +
      '<div class="actions"><button class="btn primary" data-act="checkmc">Check</button><span class="verdict"></span></div>';
  } else {
    if (q.num) {
      h += '<div class="nums">' + q.num.map((n, i) => '<label>' + fmt(n[0]) + '<input class="fld" type="text" inputmode="text" data-i="' + i + '" value="' + esc((st.vals || [])[i] || "") + '" placeholder="e.g. 1.4x10^14" autocomplete="off"><span class="preview"></span></label>').join("") + '</div>' +
        '<div class="hint">Type the value as you would write it, e.g. 1.4x10^14 (the box formats it as you type). Use the arrow key to leave a power. Checked to about 3%.</div>';
    }
    h += '<div class="actions">' + (q.num ? '<button class="btn primary" data-act="checknum">Check values</button>' : '') + '<button class="btn" data-act="reveal">' + (st.open ? 'Hide answer' : 'Show answer') + '</button><span class="verdict"></span></div>';
  }
  h += '<div class="answer' + (st.open ? " open" : "") + '">' + q.answer.lines.flatMap(splitSteps).map(l => '<p>' + fmt(l) + '</p>').join("") + (q.answer.img ? '<img src="' + DATA.imgs[q.answer.img] + '" alt="">' : '') + '</div>';
  const canVary = q.type !== "mc" && VARIANTS[q.orig];
  h += '<div class="selfmark"><span>Mark yourself:</span><button class="m-got' + (st.mark === "got" ? " on" : "") + '" data-mark="got">Got it</button><button class="m-part' + (st.mark === "part" ? " on" : "") + '" data-mark="part">Partly</button><button class="m-miss' + (st.mark === "miss" ? " on" : "") + '" data-mark="miss">Missed</button>' +
    (canVary ? '<button class="similar" data-act="similar">' + (q.variant ? 'Another similar question' : 'Try a similar question') + '</button>' : '') +
    (q.variant ? '<button class="similar" data-act="original">Back to original</button>' : '') + '</div>';
  return h + '</div>';
}
function bindQ(q) {
  const el = document.getElementById("q-" + q.code.replace(/\W/g, "_"));
  const verdict = el.querySelector(".verdict");
  const ans = el.querySelector(".answer");
  const applyMark = m => { setq(q.code, { mark: m }); el.classList.remove("m-got", "m-part", "m-miss"); el.classList.add("m-" + m); el.querySelectorAll(".selfmark button").forEach(b => b.classList.toggle("on", b.dataset.mark === m)); };
  el.querySelectorAll(".selfmark button").forEach(b => b.addEventListener("click", () => applyMark(b.dataset.mark)));
  const mcBtn = el.querySelector('[data-act="checkmc"]');
  if (mcBtn) {
    const correct = "ABCD".indexOf(q.answer.lines[0].trim()[0]);
    const show = () => {
      el.querySelectorAll(".opts label").forEach((l, i) => { l.classList.toggle("correct", i === correct); l.classList.toggle("wrong", i !== correct && l.querySelector("input").checked); });
      ans.classList.add("open");
    };
    mcBtn.addEventListener("click", () => {
      const sel = el.querySelector('input[type=radio]:checked');
      if (!sel) { verdict.textContent = "Choose an option first."; verdict.className = "verdict"; return; }
      const i = Number(sel.value);
      if (!q.variant) setq(q.code, { choice: i, open: true });
      show();
      if (i === correct) { verdict.textContent = "Correct."; verdict.className = "verdict ok"; applyMark("got"); }
      else { verdict.textContent = "Not correct. The answer is " + "ABCD"[correct] + "."; verdict.className = "verdict no"; applyMark("miss"); }
    });
    if (qstate(q.code).open) show();
  }
  upgradeFields(el);
  const numBtn = el.querySelector('[data-act="checknum"]');
  if (numBtn) numBtn.addEventListener("click", () => {
    const inputs = [...el.querySelectorAll(".nums .fld")];
    const vals = inputs.map(fieldValue);
    let ok = 0;
    inputs.forEach((inp, i) => {
      const [, target, tol] = q.num[i];
      const v = parseNum(vals[i]);
      const t = tol === undefined ? 0.03 : tol;
      const good = !isNaN(v) && (t === 0 ? v === target : Math.abs(v - target) <= t * Math.abs(target) + 1e-300);
      inp.classList.toggle("ok", good); inp.classList.toggle("bad", !good && vals[i].trim() !== "");
      if (good) ok++;
    });
    if (!q.variant) setq(q.code, { vals });
    verdict.textContent = ok === inputs.length ? "All values correct. Show the answer to check your working, then mark yourself." : ok + " of " + inputs.length + " correct.";
    verdict.className = "verdict " + (ok === inputs.length ? "ok" : "no");
  });
  const rev = el.querySelector('[data-act="reveal"]');
  if (rev) rev.addEventListener("click", () => { const open = !ans.classList.contains("open"); ans.classList.toggle("open", open); rev.textContent = open ? "Hide answer" : "Show answer"; if (!q.variant) setq(q.code, { open }); });
  const sim = el.querySelector('[data-act="similar"]');
  if (sim) sim.addEventListener("click", () => {
    const base = q.variant ? q.base : q;
    const v = VARIANTS[base.orig]();
    const vq = { code: base.code, orig: base.orig, crit: base.crit, type: "sa", text: v.text, marks: v.marks, num: v.num, answer: { lines: v.lines }, variant: true, base };
    swapQ(el, vq);
  });
  const orig = el.querySelector('[data-act="original"]');
  if (orig) orig.addEventListener("click", () => swapQ(el, q.base));
}
function swapQ(el, nq) {
  const tmp = document.createElement("div"); tmp.innerHTML = renderQ(nq);
  const fresh = tmp.firstElementChild; el.replaceWith(fresh); bindQ(nq); renderMath(fresh);
  fresh.scrollIntoView({ block: "start", behavior: "smooth" });
}
document.getElementById("resetBtn").addEventListener("click", () => { if (confirm("Clear all your marks and answers on this device?")) { state = {}; save(); if (current) openCrit(current); else renderHome(); } });
document.getElementById("menuBtn").addEventListener("click", () => document.getElementById("nav").classList.toggle("hidden"));
renderHome(); save();
window.addEventListener("load", () => { renderMath(document); upgradeFields(document); });
</script>
