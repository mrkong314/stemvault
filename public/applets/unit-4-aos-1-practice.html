<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 4 Area of Study 1 Practice</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathlive@0.110.0/mathlive.min.js"></script>
<style>
:root{--navy:#1B3A6B;--navy-2:#122A50;--sky:#2F7FD8;--sky-tint:#E7F0FB;--ink:#1E2430;--muted:#5F6B7A;--rule:#D8DFE8;--paper:#FFFFFF;--bg:#EEF3F9;
--got:#1F9D55;--got-tint:#E3F5EA;--part:#E09B12;--part-tint:#FCF1D6;--miss:#D64545;--miss-tint:#FBE4E4;
--t1:#1B3A6B;--t2:#0E7C86;--t3:#C4552F;--t4:#6A4C93;--t5:#2A9D5C;--t6:#D48A00;--t7:#2F7FD8;--t8:#B23A48;
--sans:"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font:inherit;cursor:pointer}
header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 2px 0 var(--sky)}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{opacity:.85;font-size:14px}
header .tools{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header .saved{font-size:13px;opacity:.85}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--navy);padding:7px 13px;border-radius:6px;font-size:14px;font-weight:600}
.btn:hover{background:var(--sky-tint)}
header .btn{border-color:rgba(255,255,255,.35);background:transparent;color:#fff}
header .btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn:focus-visible,input:focus-visible,label:focus-within{outline:3px solid #9CC2F1;outline-offset:2px}
.layout{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 60px)}
nav{background:var(--paper);border-right:1px solid var(--rule);padding:14px 0 40px;overflow-y:auto;position:sticky;top:0;height:100vh}
nav .lead{padding:0 20px 10px;font-size:14px;color:var(--muted)}
nav .lead strong{color:var(--ink)}
nav h2{font-size:14px;margin:12px 20px 2px;padding:8px 0 4px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:8px}
nav h2:first-of-type{border-top:0;padding-top:0}
nav h2 .sw{width:12px;height:12px;border-radius:3px;background:var(--tc)}
.crit{display:grid;grid-template-columns:44px 1fr 74px;gap:8px;align-items:start;width:100%;text-align:left;border:0;background:none;padding:7px 20px;color:var(--ink);font-size:13.5px;line-height:1.35;border-left:4px solid transparent}
.crit:hover{background:var(--sky-tint)}
.crit.active{background:var(--sky-tint);border-left-color:var(--tc)}
.crit .code{font-weight:700;color:var(--tc);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:2px;margin-top:5px}
.seg i{display:block;height:8px;flex:1;background:var(--rule);border-radius:2px}
.seg i.m-got{background:var(--got)}.seg i.m-part{background:var(--part)}.seg i.m-miss{background:var(--miss)}
main{padding:24px 32px 80px;max-width:880px}
.home h2{font-size:26px;margin:0 0 6px;color:var(--navy)}
.home p{max-width:640px;color:var(--muted)}
.overall{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;margin:18px 0}
.overall .row{display:flex;align-items:center;gap:12px;font-size:14px;margin-bottom:6px}
.overall .bar{flex:1;height:14px;background:var(--rule);border-radius:7px;overflow:hidden;display:flex}
.overall .bar i{display:block;height:100%}
.overall .bar .g{background:var(--got)}.overall .bar .p{background:var(--part)}.overall .bar .m{background:var(--miss)}
.overall .key{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px}
.overall .key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:18px 0}
.tcard{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;border-top:4px solid var(--tc);text-align:left;color:var(--ink)}
.tcard:hover{border-color:var(--tc)}
.tcard .tn{font-weight:700;font-size:15px;color:var(--tc)}
.tcard .tt{font-size:14px;margin:2px 0 8px}
.tcard .bar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;display:flex}
.tcard .bar i{display:block;height:100%}
.tcard .bar .g{background:var(--got)}.tcard .bar .p{background:var(--part)}.tcard .bar .m{background:var(--miss)}
.tcard .tc2{font-size:12.5px;color:var(--muted);margin-top:6px}
.todo{margin-top:18px}
.todo h3{font-size:16px;margin:0 0 8px;color:var(--navy)}
.todo button{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:9px 14px;margin-bottom:6px;color:var(--ink);border-left:4px solid var(--tc)}
.todo button:hover{background:var(--sky-tint)}
.todo .code{color:var(--tc);font-weight:700;margin-right:8px}
.crit-head{margin-bottom:16px;padding-left:14px;border-left:5px solid var(--tc)}
.crit-head .code{color:var(--tc);font-weight:700;font-size:14px}
.crit-head h2{font-size:23px;margin:2px 0 4px;line-height:1.25;color:var(--navy)}
.crit-head .topic{color:var(--muted);font-size:14px}
.intro{background:var(--sky-tint);border:1px solid #CFE0F5;border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:15px}
.intro img{display:block;max-width:100%;width:440px;margin:6px auto;background:#fff;border-radius:4px}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px 20px 14px;margin-bottom:14px;border-left:5px solid var(--rule)}
.q.m-got{border-left-color:var(--got)}.q.m-part{border-left-color:var(--part)}.q.m-miss{border-left-color:var(--miss)}
.qh{display:flex;gap:12px;align-items:center}
.qh .code{font-weight:700;color:var(--navy);font-size:15px}
.qh .marks{margin-left:auto;background:var(--navy);color:#fff;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap}
.qt{font-size:16.5px;line-height:1.55;margin:8px 0 10px}
.part{font-size:16.5px;margin:8px 0 4px 18px;display:flex;gap:12px}
.part .pm{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;align-self:center}
.q img{display:block;max-width:100%;width:420px;margin:8px auto}
.opts{list-style:none;padding:0;margin:8px 0}
.opts label{display:flex;gap:12px;padding:8px 10px;border-radius:6px;font-size:16px;cursor:pointer;align-items:center;border:1px solid transparent}
.opts label:hover{background:var(--sky-tint)}
.opts label.correct{background:var(--got-tint);border-color:var(--got)}.opts label.wrong{background:var(--miss-tint);border-color:var(--miss)}
.opts input{accent-color:var(--navy)}
.opts .let{font-weight:700;color:var(--navy);flex:0 0 22px}
.opts label span:last-child{flex:1}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:8px 0}
.nums label{display:block;font-size:13.5px;color:var(--muted);font-weight:600}
.nums input{display:block;width:100%;margin-top:3px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font:inherit;font-size:15px;background:#fff;font-weight:400}
.nums math-field{display:block;width:100%;margin-top:3px;padding:4px 8px;border:1px solid var(--rule);border-radius:6px;font-size:17px;background:#fff;--caret-color:var(--navy);--selection-background-color:var(--sky-tint)}
.nums math-field:focus-within{outline:3px solid #9CC2F1;outline-offset:2px}
.nums math-field.ok{border-color:var(--got);background:var(--got-tint)}.nums math-field.bad{border-color:var(--miss);background:var(--miss-tint)}
.nums math-field::part(menu-toggle){display:none}
.nums .preview{display:block;min-height:22px;margin-top:4px;color:var(--navy);font-size:15px}
.nums input.ok{border-color:var(--got);background:var(--got-tint)}.nums input.bad{border-color:var(--miss);background:var(--miss-tint)}
.katex{font-size:1.02em}
.hint{font-size:13px;color:var(--muted);margin:4px 0 10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.answer{display:none;margin-top:12px;border-top:2px solid var(--sky-tint);padding:12px 14px 4px;background:#F7FAFE;border-radius:0 0 6px 6px;font-size:15.5px;color:#123}
.answer.open{display:block}
.answer p{margin:0 0 6px}
.answer p:first-child::before{content:"Answer";display:block;font-size:12px;font-weight:700;color:var(--sky);letter-spacing:.3px;margin-bottom:4px}
.answer img{width:360px;margin:6px 0;background:#fff}
.selfmark{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;font-size:14px;color:var(--muted)}
.selfmark button{border:1px solid var(--rule);background:#fff;border-radius:20px;padding:6px 15px;font-size:14px;color:var(--ink);font-weight:600}
.selfmark button.m-got:hover{background:var(--got-tint);border-color:var(--got)}.selfmark button.m-part:hover{background:var(--part-tint);border-color:var(--part)}.selfmark button.m-miss:hover{background:var(--miss-tint);border-color:var(--miss)}
.selfmark button.m-got.on{background:var(--got);border-color:var(--got);color:#fff}
.selfmark button.m-part.on{background:var(--part);border-color:var(--part);color:#fff}
.selfmark button.m-miss.on{background:var(--miss);border-color:var(--miss);color:#fff}
.selfmark .similar{margin-left:auto;border-color:var(--sky);color:var(--sky);background:#fff}
.selfmark .similar:hover{background:var(--sky-tint)}
.selfmark .similar + .similar{margin-left:0}
.vtag{font-weight:600;color:var(--sky);font-size:12.5px;margin-left:6px}
.verdict{font-size:14px;font-weight:600}
.verdict.ok{color:var(--got)}.verdict.no{color:var(--miss)}
.constants{display:none;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;font-size:14.5px;margin-bottom:18px}
.constants.open{display:block}
.constants .ct{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.constants .cc{display:inline-block;margin:2px 18px 2px 0}
.menu-toggle{display:none}
.back{display:none}
@media (max-width:860px){
  .layout{display:block}
  nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule)}
  nav.hidden{display:none}
  main{padding:18px 14px 60px}
  .menu-toggle{display:inline-block}
  .back{display:inline-block;margin-bottom:12px}
  .crit{grid-template-columns:40px 1fr 60px}
}
</style>
</head>
<body>
<header>
  <h1>Unit 4 Area of Study 1 Practice</h1>
  <span class="sub">VCE Physics</span>
  <div class="tools">
    <button class="btn menu-toggle" id="menuBtn">Criteria</button>
    <button class="btn" id="resetBtn">Reset progress</button>
    <span class="saved" id="savedNote"></span>
  </div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
const DATA = {"topics":["Single Slit Diffraction","Young's Double Slit Experiment","Photoelectric Effect","Standing Waves: String Fixed at Both Ends","Matter as a Wave","Photon Momentum","Atomic Absorption and Emission Spectra","Special Relativity"],"bank":[{"code":"1.1","topic":1,"title":"Determine if diffraction is noticeable or significant using the ratio λ/w","intro":null,"questions":[{"code":"1.1 Q1","crit":"1.1","type":"sa","text":"A loudspeaker produces a 256 Hz note on one side of an open doorway 0.90 m wide. Determine, with a calculation, whether the sound diffracts significantly as it passes through the doorway.","marks":2,"answer":{"lines":["λ = v/f = 340/256 = 1.33 m (1). λ/w = 1.33/0.90 = 1.5, which is of order 1, so diffraction is significant and the sound spreads widely through the doorway (1)."]},"diag":true,"num":[["λ (m)",1.33],["λ/w",1.48,0.05]],"orig":"1.1 Q2"},{"code":"1.1 Q2","crit":"1.1","type":"mc","text":"Which of the following situations produces the most significant diffraction?","marks":1,"options":["Light of wavelength 600 nm passing through a slit 0.50 mm wide","Microwaves of wavelength 3.0 cm passing through a gap 10 cm wide","Sound of wavelength 1.0 m passing through a doorway 1.2 m wide","Ultrasound of frequency 20 kHz passing through a doorway 2.0 m wide"],"answer":{"lines":["C. Ratios: A 600 × 10^{–9}/0.50 × 10^{–3} = 1.2 × 10^{–3}; B 3.0/10 = 0.30; C 1.0/1.2 = 0.83; D λ = 340/20 000 = 0.017 m, 0.017/2.0 = 8.5 × 10^{–3}. Closest to 1 is C."]},"diag":false,"orig":"1.1 Q1"},{"code":"1.1 Q3","crit":"1.1","type":"sa","text":"A speaker emits sound of frequency 2.0 kHz through a gap 0.17 m wide. The frequency is then increased to 20 kHz. Using calculations, describe and explain how the loudness of the sound heard by a listener standing well to one side of the gap changes.","marks":3,"answer":{"lines":["2.0 kHz: λ = 340/2000 = 0.17 m, λ/w = 1.0, diffraction very significant, sound spreads widely and the listener to the side hears it clearly (1). 20 kHz: λ = 0.017 m, λ/w = 0.10, much less spreading (1). The sound now passes through in a narrower beam, so the listener at the side hears it much more faintly (1)."],"img":null},"diag":false,"num":[["λ/w at 2.0 kHz",1,0.05],["λ/w at 20 kHz",0.1,0.05]],"orig":"1.1 Q3"},{"code":"1.1 Q4","crit":"1.1","type":"sa","text":"A radio station broadcasts on AM at 1.0 MHz and on FM at 100 MHz. A listener lives directly behind a hill about 50 m high. Use calculations of λ/w to explain which of the two signals the listener is more likely to receive clearly.","marks":3,"answer":{"lines":["AM: λ = c/f = 3.00 × 10^{8}/1.0 × 10^{6} = 300 m, λ/w = 300/50 = 6 (1). FM: λ = 3.0 m, λ/w = 0.06 (1). The AM signal has λ/w ≳ 1 so it diffracts strongly around and over the hill; the FM signal has λ/w ≪ 1 so it travels nearly straight and the listener is in its shadow. AM is received more clearly (1)."]},"diag":false,"num":[["λ/w for AM",6,0.05],["λ/w for FM",0.06,0.05]],"orig":"1.1 Q4"},{"code":"1.1 Q5","crit":"1.1","type":"sa","text":"Blue light (λ = 450 nm) passes through a single slit of width 3.0 μm and forms a pattern on a screen. The blue light is then replaced by red light (λ = 650 nm). Calculate λ/w for each colour and describe how the width of the central bright band changes.","marks":3,"answer":{"lines":["Blue: 450 × 10^{–9}/3.0 × 10^{–6} = 0.15 (1). Red: 650 × 10^{–9}/3.0 × 10^{–6} = 0.22 (1). The ratio is larger for red, so the red light spreads more and the central bright band is wider (1)."]},"diag":false,"num":[["λ/w for blue",0.15,0.05],["λ/w for red",0.217,0.05]],"orig":"1.1 Q5"}]},{"code":"1.2","topic":1,"title":"Apply the ratio λ/w to the resolution of electron and X-ray microscopes","intro":null,"questions":[{"code":"1.2 Q1","crit":"1.2","type":"sa","text":"Electrons in an electron microscope are accelerated from rest through 10 kV. Calculate the de Broglie wavelength of the electrons. Show your working.","marks":3,"answer":{"lines":["E_{k} = qV = 1.60 × 10^{–19} × 1.0 × 10^{4} = 1.6 × 10^{–15} J (1). p = √(2mE_{k}) = √(2 × 9.11 × 10^{–31} × 1.6 × 10^{–15}) = 5.4 × 10^{–23} kg m s^{–1} (1). λ = h/p = 6.63 × 10^{–34}/5.4 × 10^{–23} = 1.2 × 10^{–11} m (1)."]},"diag":true,"num":[["λ (m)",1.23e-11]],"orig":"1.2 Q2"},{"code":"1.2 Q2","crit":"1.2","type":"mc","text":"An electron microscope can resolve much finer detail than an optical microscope. This is mainly because","marks":1,"options":["electrons have more kinetic energy than photons.","the de Broglie wavelength of the electrons is much shorter than the wavelength of visible light.","electrons are electrically charged, so they interact more strongly with the specimen.","electrons travel faster than light inside the microscope."],"answer":{"lines":["B."]},"diag":false,"orig":"1.2 Q1"},{"code":"1.2 Q3","crit":"1.2","type":"sa","text":"X-rays of wavelength 0.15 nm are used to study a crystal in which the atomic spacing is 0.25 nm. Calculate λ/w and explain why X-rays, rather than visible light, are used to investigate the structure of crystals.","marks":3,"answer":{"lines":["λ/w = 0.15/0.25 = 0.60 (1). This is of order 1, so the X-rays diffract strongly from the regular array of atoms and produce a diffraction pattern whose geometry depends on the atomic spacing, which can therefore be measured (1). For visible light λ/w ≈ 2000, far too large: the light cannot produce a pattern related to the atomic spacing, so no structural information is obtained (1)."]},"diag":false,"num":[["λ/w",0.6]],"orig":"1.2 Q3"},{"code":"1.2 Q4","crit":"1.2","type":"sa","text":"The diagrams show the diffraction patterns produced when a beam of electrons and a beam of X-rays are each passed through the same thin crystal. The X-rays have a wavelength of 5.0 × 10^{–11} m. Calculate the speed of the electrons.","marks":3,"img":"diff_rings","answer":{"lines":["Identical patterns from the same crystal mean identical wavelengths, so λ_{e} = 5.0 × 10^{–11} m (1). λ = h/mv so v = h/(mλ) (1) = 6.63 × 10^{–34}/(9.11 × 10^{–31} × 5.0 × 10^{–11}) = 1.5 × 10^{7} m s^{–1} (1)."]},"diag":false,"num":[["v (m/s)",14600000]],"orig":"1.2 Q4"},{"code":"1.2 Q5","crit":"1.2","type":"sa","text":"The accelerating voltage of an electron microscope is increased from 5.0 kV to 20 kV. Determine the factor by which the de Broglie wavelength of the electrons changes, and describe the effect on the resolution of the microscope.","marks":3,"answer":{"lines":["E_{k} ∝ V and p = √(2mE_{k}), so p ∝ √V and λ = h/p ∝ 1/√V (1). V increases by a factor of 4, so λ decreases by a factor of √4 = 2: the wavelength halves (1). λ/w halves for every feature, so diffraction is reduced and finer detail can be resolved: the resolution improves (1)."]},"diag":false,"num":[["new λ ÷ old λ",0.5]],"orig":"1.2 Q5"}]},{"code":"2.1","topic":2,"title":"Determine the path difference (whole or half number of wavelengths): pd = nλ (constructive), pd = (n – ½)λ (destructive)","intro":{"img":"ds_geometry","text":"Double slit arrangement used in this section: slits S_{1} and S_{2} separated by d, screen at distance L, point P a distance x from the central band O."},"questions":[{"code":"2.1 Q1","crit":"2.1","type":"sa","text":"In the arrangement shown above, S_{1}P is 2.25 μm longer than S_{2}P. The light has a wavelength of 450 nm. Determine whether a bright or dark band is observed at P, and identify which band it is.","marks":2,"answer":{"lines":["pd/λ = 2.25 × 10^{–6}/450 × 10^{–9} = 5.0 (1), a whole number of wavelengths: constructive interference, so P is at the centre of the fifth bright band from the central band (1)."]},"diag":true,"orig":"2.1 Q2"},{"code":"2.1 Q2","crit":"2.1","type":"mc","text":"Light of wavelength 600 nm illuminates a double slit. At point P on the screen the path difference is 1.5 μm. Point P is at the centre of","marks":1,"options":["the second bright band.","the third bright band.","the second dark band.","the third dark band."],"answer":{"lines":["D. pd/λ = 1.5 × 10^{–6}/600 × 10^{–9} = 2.5, so (n – ½)λ with n = 3: third dark band."]},"diag":false,"orig":"2.1 Q1"},{"code":"2.1 Q3","crit":"2.1","type":"sa","text":"Light of wavelength 640 nm illuminates a double slit. At point Q on the screen the path difference is 1.60 μm.","marks":4,"parts":[{"text":"a.  Determine whether Q is at the centre of a bright or a dark band, and identify which band it is.","marks":2},{"text":"b.  The wavelength is changed to 533 nm. State what is now observed at Q. Justify your answer with a calculation.","marks":2}],"answer":{"lines":["a. pd/λ = 1.60 × 10^{–6}/640 × 10^{–9} = 2.5 (1). Half-integer, so destructive interference: Q is at the centre of the third dark band ((n – ½)λ with n = 3) (1).","b. pd/λ = 1.60 × 10^{–6}/533 × 10^{–9} = 3.0 (1). Whole number, so a bright band (the third bright band) is now observed at Q (1)."]},"diag":false,"orig":"2.1 Q3"},{"code":"2.1 Q4","crit":"2.1","type":"sa","text":"The diagram shows part of the pattern on the screen when light of wavelength 520 nm illuminates a double slit. Determine the path difference, in metres, at point X and at point Y.","marks":3,"img":"fringes_X","answer":{"lines":["X is the second bright band: pd = 2λ = 2 × 520 × 10^{–9} = 1.04 × 10^{–6} m (1). Y is the dark band immediately beyond X, i.e. the third dark band: pd = 2.5λ (1) = 1.30 × 10^{–6} m (1)."]},"diag":false,"num":[["pd at X (m)",0.00000104],["pd at Y (m)",0.0000013]],"orig":"2.1 Q4"},{"code":"2.1 Q5","crit":"2.1","type":"sa","text":"Point P is at the centre of the third bright band on the screen. The separation of the two slits is then reduced while everything else is unchanged. Explain, in terms of path difference, why the third bright band is now found further from the central band than P.","marks":3,"answer":{"lines":["The third bright band is wherever the path difference equals 3λ (1). Reducing the slit separation reduces the path difference obtained at any given point on the screen, because the two paths become more nearly equal (1). To restore a path difference of 3λ the point must be further from the centre, so the third bright band moves outward (consistent with Δx = λL/d increasing as d decreases) (1)."]},"diag":false,"orig":"2.1 Q5"}]},{"code":"2.2","topic":2,"title":"Calculate fringe spacing (distance between adjacent bright band centres): Δx = λL/d","intro":null,"questions":[{"code":"2.2 Q1","crit":"2.2","type":"sa","text":"Light of wavelength 650 nm illuminates a double slit. On a screen 2.5 m away, the distance from the centre of the first bright band to the centre of the tenth bright band is 58.5 mm. Calculate the slit separation.","marks":3,"answer":{"lines":["First to tenth bright band is nine spacings, so Δx = 58.5/9 = 6.5 mm (1). d = λL/Δx (1) = (650 × 10^{–9} × 2.5)/(6.5 × 10^{–3}) = 2.5 × 10^{–4} m = 0.25 mm (1)."]},"diag":true,"num":[["d (mm)",0.25]],"orig":"2.2 Q3"},{"code":"2.2 Q2","crit":"2.2","type":"mc","text":"The spacing between adjacent bright bands in a double slit pattern will increase if","marks":1,"options":["the slit separation is increased.","the distance from the slits to the screen is decreased.","the wavelength of the light is increased.","the frequency of the light is increased."],"answer":{"lines":["C. Δx = λL/d increases with λ. (D is wrong because higher frequency means shorter wavelength.)"]},"diag":false,"orig":"2.2 Q1"},{"code":"2.2 Q3","crit":"2.2","type":"sa","text":"The diagram shows the pattern produced on a screen 2.0 m from two slits that are 0.25 mm apart, with a millimetre scale beneath. Use the scale to determine the fringe spacing and hence calculate the wavelength of the light.","marks":3,"img":"fringes_scale","answer":{"lines":["From the scale, adjacent bright bands are 4.0 mm apart (e.g. five bands span 16 mm, four spacings) (1). λ = Δx d/L (1) = (4.0 × 10^{–3} × 0.25 × 10^{–3})/2.0 = 5.0 × 10^{–7} m = 500 nm (1)."]},"diag":false,"num":[["Δx (mm)",4,0.05],["λ (nm)",500,0.05]],"orig":"2.2 Q2"},{"code":"2.2 Q4","crit":"2.2","type":"sa","text":"Two double slit experiments are set up. Experiment A uses light of wavelength 400 nm, a slit separation of 0.20 mm and a screen distance of 1.0 m. Experiment B uses light of wavelength 600 nm, a slit separation of 0.40 mm and a screen distance of 1.5 m. Determine, with calculations, which experiment produces the larger fringe spacing.","marks":3,"answer":{"lines":["A: Δx = (400 × 10^{–9} × 1.0)/(0.20 × 10^{–3}) = 2.0 mm (1). B: Δx = (600 × 10^{–9} × 1.5)/(0.40 × 10^{–3}) = 2.25 mm (1). Experiment B has the larger fringe spacing (1)."]},"diag":false,"num":[["Δx for A (mm)",2],["Δx for B (mm)",2.25]],"orig":"2.2 Q4"},{"code":"2.2 Q5","crit":"2.2","type":"sa","text":"A student has a 633 nm laser and can place the screen at most 3.0 m from the slits. The student wants a fringe spacing of at least 5.0 mm. Calculate the largest slit separation that can be used.","marks":3,"answer":{"lines":["Δx = λL/d, so d = λL/Δx (1). Largest d for Δx ≥ 5.0 mm uses the largest L: d = (633 × 10^{–9} × 3.0)/(5.0 × 10^{–3}) (1) = 3.8 × 10^{–4} m = 0.38 mm (1)."]},"diag":false,"num":[["d (mm)",0.38]],"orig":"2.2 Q5"}]},{"code":"2.3","topic":2,"title":"Apply constructive or destructive interference to the appearance of bright or dark bands","intro":null,"questions":[{"code":"2.3 Q1","crit":"2.3","type":"sa","text":"The graphs show the displacement against time at point R for the waves arriving from S_{1} and S_{2}. The path difference at R is 1.5λ. Sketch the resultant displacement at R on the third set of axes and state what is observed at R.","marks":2,"img":"sup_anti","answer":{"lines":["The waves are in antiphase (crest meets trough), so the resultant is zero at all times: a flat line (1). A dark band is observed at R (1)."],"img":"sol_sup_anti"},"diag":true,"orig":"2.3 Q3"},{"code":"2.3 Q2","crit":"2.3","type":"mc","text":"One of the two slits in a double slit experiment is covered. On the screen","marks":1,"options":["the pattern is unchanged but half as bright.","the interference bands disappear and a single slit diffraction pattern is seen.","the fringe spacing doubles.","the screen becomes completely dark."],"answer":{"lines":["B."]},"diag":false,"orig":"2.3 Q1"},{"code":"2.3 Q3","crit":"2.3","type":"sa","text":"The two slits in a double slit experiment are each made narrower, while the separation between them is unchanged. Describe and explain the effect on the pattern seen on the screen.","marks":3,"answer":{"lines":["Each slit diffracts the light more (λ/w increases for each slit), so the light from each slit spreads over a wider region of the screen (1). The two beams therefore overlap over a wider region and more interference bands become visible, further from the centre (1). The fringe spacing is unchanged because Δx = λL/d depends on the slit separation d, not on the slit widths (1)."]},"diag":false,"orig":"2.3 Q2"},{"code":"2.3 Q4","crit":"2.3","type":"sa","text":"The intensity of the monochromatic light source in a double slit experiment is doubled. Describe the effect on the bright bands, the dark bands and the fringe spacing, and explain your answer.","marks":3,"answer":{"lines":["Bright bands become brighter: the amplitude of each wave is larger, so the constructive sum is larger (1). Dark bands remain dark: the two waves still have equal amplitude and are still in antiphase, so they still cancel completely (1). The fringe spacing is unchanged, since Δx = λL/d does not depend on intensity (1)."]},"diag":false,"orig":"2.3 Q4"},{"code":"2.3 Q5","crit":"2.3","type":"sa","text":"A student replaces the single laser illuminating the two slits with two separate identical lasers, one behind each slit. No steady interference pattern is seen. Explain why.","marks":3,"answer":{"lines":["A steady pattern requires the two sources to be coherent: a constant phase relationship between them (1). Two independent lasers emit with phases that vary randomly and independently over time (1), so the positions of constructive and destructive interference shift rapidly and randomly, averaging to uniform illumination with no visible bands (1)."]},"diag":false,"orig":"2.3 Q5"}]},{"code":"2.4","topic":2,"title":"Explain the relevance of Young's double slit experiment in supporting the wave model of light","intro":null,"questions":[{"code":"2.4 Q1","crit":"2.4","type":"sa","text":"Explain the relevance of Young's double slit experiment in supporting the wave model of light.","marks":2,"answer":{"lines":["The experiment produced alternating bright and dark bands on the screen: an interference pattern, and interference is a property of waves, not particles (1). The bright bands occur where light from the two slits interferes constructively and the dark bands where it interferes destructively, exactly as the wave model predicts (1)."],"img":null},"diag":true,"orig":"2.4 Q2"}]},{"code":"3.1","topic":3,"title":"Calculate the energy of a photon: E = hf = hc/λ","intro":null,"questions":[{"code":"3.1 Q1","crit":"3.1","type":"sa","text":"Ultraviolet light has a wavelength of 250 nm. Calculate the frequency of the light and the energy of one photon in joules and in electronvolts.","marks":3,"answer":{"lines":["f = c/λ = 3.00 × 10^{8}/250 × 10^{–9} = 1.2 × 10^{15} Hz (1). E = hf = 6.63 × 10^{–34} × 1.2 × 10^{15} = 8.0 × 10^{–19} J (1) = 8.0 × 10^{–19}/1.60 × 10^{–19} = 5.0 eV (1)."]},"diag":true,"num":[["f (Hz)",1200000000000000],["E (J)",7.96e-19],["E (eV)",4.97]],"orig":"3.1 Q2"},{"code":"3.1 Q2","crit":"3.1","type":"mc","text":"The energy of a photon of blue light of wavelength 450 nm is closest to","marks":1,"options":["2.8 eV","4.4 eV","1.4 eV","0.44 eV"],"answer":{"lines":["A. E = hc/λ = (6.63 × 10^{–34} × 3.00 × 10^{8})/450 × 10^{–9} = 4.4 × 10^{–19} J = 2.8 eV."]},"diag":false,"orig":"3.1 Q1"},{"code":"3.1 Q3","crit":"3.1","type":"sa","text":"A photon has an energy of 3.0 eV. Calculate its wavelength in nanometres.","marks":2,"answer":{"lines":["E = 3.0 × 1.60 × 10^{–19} = 4.8 × 10^{–19} J (1). λ = hc/E = (6.63 × 10^{–34} × 3.00 × 10^{8})/4.8 × 10^{–19} = 4.1 × 10^{–7} m = 410 nm (1)."]},"diag":false,"num":[["λ (nm)",414]],"orig":"3.1 Q3"},{"code":"3.1 Q4","crit":"3.1","type":"sa","text":"A 5.0 mW laser emits light of wavelength 633 nm. Calculate the number of photons emitted per second.","marks":3,"answer":{"lines":["E_{photon} = hc/λ = (6.63 × 10^{–34} × 3.00 × 10^{8})/633 × 10^{–9} = 3.1 × 10^{–19} J (1). N/t = P/E (1) = 5.0 × 10^{–3}/3.14 × 10^{–19} = 1.6 × 10^{16} photons per second (1)."]},"diag":false,"num":[["photons per second",15900000000000000]],"orig":"3.1 Q4"},{"code":"3.1 Q5","crit":"3.1","type":"sa","text":"An FM radio station broadcasts at 100 MHz. Calculate the energy of one radio photon in eV and explain why radio waves cannot produce the photoelectric effect in any metal.","marks":3,"answer":{"lines":["E = hf = 6.63 × 10^{–34} × 1.0 × 10^{8} = 6.6 × 10^{–26} J = 4.1 × 10^{–7} eV (1). Every metal has a work function of at least about 2 eV; a single radio photon carries far less than this (1). One photon gives its energy to one electron, so no electron can ever gain enough energy to escape, however intense the radio waves (1)."]},"diag":false,"num":[["E (eV)",4.1e-7,0.05]],"orig":"3.1 Q5"}]},{"code":"3.2","topic":3,"title":"Convert between J and eV","intro":null,"questions":[{"code":"3.2 Q1","crit":"3.2","type":"sa","text":"(a) Convert 7.2 × 10^{–19} J to eV.   (b) Convert 2.3 eV to J.","marks":2,"answer":{"lines":["(a) 7.2 × 10^{–19}/1.60 × 10^{–19} = 4.5 eV (1). (b) 2.3 × 1.60 × 10^{–19} = 3.7 × 10^{–19} J (1)."]},"diag":true,"num":[["a. (eV)",4.5],["b. (J)",3.68e-19]],"orig":"3.2 Q2"}]},{"code":"3.3","topic":3,"title":"Calculate the work function of a metal: Φ = hf_{0}, from E_{k max} = hf – Φ","intro":null,"questions":[{"code":"3.3 Q1","crit":"3.3","type":"sa","text":"Light of wavelength 400 nm ejects photoelectrons with a maximum kinetic energy of 1.2 eV from a metal surface. Calculate the work function of the metal in eV and in J.","marks":3,"answer":{"lines":["E_{photon} = hc/λ = (6.63 × 10^{–34} × 3.00 × 10^{8})/400 × 10^{–9} = 4.97 × 10^{–19} J = 3.11 eV (1). Φ = E_{photon} – E_{k max} = 3.11 – 1.2 = 1.9 eV (1) = 1.91 × 1.60 × 10^{–19} = 3.1 × 10^{–19} J (1)."]},"diag":true,"num":[["Φ (eV)",1.91],["Φ (J)",3.06e-19]],"orig":"3.3 Q2"},{"code":"3.3 Q2","crit":"3.3","type":"mc","text":"A metal has a work function of 2.0 eV. Photons of energy 3.5 eV strike the metal. The maximum kinetic energy of the emitted electrons is","marks":1,"options":["1.5 eV","5.5 eV","2.0 eV","3.5 eV"],"answer":{"lines":["A. E_{k max} = hf – Φ = 3.5 – 2.0 = 1.5 eV."]},"diag":false,"orig":"3.3 Q1"},{"code":"3.3 Q3","crit":"3.3","type":"sa","text":"The threshold frequency of a metal is 5.5 × 10^{14} Hz.","marks":4,"parts":[{"text":"a.  Calculate the work function of the metal in J and in eV.","marks":2},{"text":"b.  Calculate the maximum kinetic energy, in eV, of photoelectrons when light of frequency 8.0 × 10^{14} Hz is used.","marks":2}],"answer":{"lines":["a. Φ = hf_{0} = 6.63 × 10^{–34} × 5.5 × 10^{14} = 3.6 × 10^{–19} J (1) = 2.3 eV (1).","b. E_{photon} = hf = 6.63 × 10^{–34} × 8.0 × 10^{14} = 5.30 × 10^{–19} J = 3.3 eV (1). E_{k max} = 3.3 – 2.3 = 1.0 eV (1)."]},"diag":false,"num":[["a. Φ (J)",3.65e-19],["a. Φ (eV)",2.28],["b. E_k max (eV)",1.04,0.08]],"orig":"3.3 Q3"},{"code":"3.3 Q4","crit":"3.3","type":"sa","text":"Light of wavelength 300 nm shines on a metal and the stopping voltage is found to be 0.80 V. Calculate the work function of the metal in eV.","marks":3,"answer":{"lines":["E_{photon} = hc/λ = (6.63 × 10^{–34} × 3.00 × 10^{8})/300 × 10^{–9} = 6.63 × 10^{–19} J = 4.1 eV (1). E_{k max} = eV_{0} = 0.80 eV (1). Φ = 4.1 – 0.80 = 3.3 eV (1)."]},"diag":false,"num":[["Φ (eV)",3.34]],"orig":"3.3 Q4"},{"code":"3.3 Q5","crit":"3.3","type":"sa","text":"Sodium has a work function of 2.3 eV.","marks":4,"parts":[{"text":"a.  Light of wavelength 600 nm is shone onto a sodium surface. Show by calculation whether photoelectrons are emitted.","marks":2},{"text":"b.  Calculate the longest wavelength of light that will eject electrons from sodium.","marks":2}],"answer":{"lines":["a. E_{photon} = hc/λ = (6.63 × 10^{–34} × 3.00 × 10^{8})/600 × 10^{–9} = 3.3 × 10^{–19} J = 2.1 eV (1). This is less than Φ = 2.3 eV, so no single photon can free an electron: no photoelectrons are emitted (1).","b. λ_{0} = hc/Φ = (6.63 × 10^{–34} × 3.00 × 10^{8})/(2.3 × 1.60 × 10^{–19}) (1) = 5.4 × 10^{–7} m = 540 nm (1)."]},"diag":false,"num":[["b. λ₀ (nm)",540]],"orig":"3.3 Q5"}]},{"code":"3.4","topic":3,"title":"Explain the role of the photoelectric effect in supporting the particle model for various observations (threshold frequency, negligible time delay, no change to maximum kinetic energy or stopping voltage when intensity is increased)","intro":null,"questions":[{"code":"3.4 Q1","crit":"3.4","type":"sa","text":"Explain why the existence of a threshold frequency supports the particle model of light and cannot be explained by the wave model.","marks":3,"answer":{"lines":["Wave model: the energy of a wave depends on its intensity, not its frequency, so light of any frequency should eventually eject electrons if bright enough or applied for long enough (1). Observation: below f_{0} no electrons are ejected regardless of intensity (1). Particle model: light arrives as photons of energy hf, and one photon gives all its energy to one electron; the electron escapes only if hf ≥ Φ, giving a threshold f_{0} = Φ/h that depends on frequency alone (1)."]},"diag":true,"orig":"3.4 Q2"},{"code":"3.4 Q2","crit":"3.4","type":"mc","text":"Which of the following observations provides evidence for the particle model of light?","marks":1,"options":["The photocurrent increases when the intensity of the light is increased.","No photoelectrons are emitted below a threshold frequency, regardless of intensity.","Light travels in straight lines.","Light can be reflected from a metal surface."],"answer":{"lines":["B. A wave model predicts emission at any frequency given enough intensity; a threshold can only be explained if energy arrives in packets of size hf."]},"diag":false,"orig":"3.4 Q1"},{"code":"3.4 Q3","crit":"3.4","type":"sa","text":"Explain why the observation that photoelectrons are emitted with negligible time delay, even for very low intensity light, supports the particle model rather than the wave model.","marks":3,"answer":{"lines":["Wave model: energy is spread continuously over the surface, so with dim light each electron would need to accumulate energy for an appreciable time before escaping; a measurable delay should occur, longer for lower intensity (1). Observation: emission is essentially instantaneous at any intensity above threshold (1). Particle model: a single photon delivers all its energy hf to one electron in one event, so the electron escapes immediately; low intensity means fewer photons per second, not a delay (1)."]},"diag":false,"orig":"3.4 Q3"},{"code":"3.4 Q4","crit":"3.4","type":"sa","text":"When the intensity of light above the threshold frequency is increased, the maximum kinetic energy of the photoelectrons is unchanged. Explain why this contradicts the wave model and how the particle model accounts for it.","marks":3,"answer":{"lines":["Wave model: a more intense wave carries more energy, so electrons should be ejected with greater kinetic energy and V_{0} should increase (1). Observation: E_{k max} and V_{0} depend only on frequency (1). Particle model: intensity is the number of photons per second, but each photon still has energy hf; one photon ejects one electron, so E_{k max} = hf – Φ is fixed by frequency alone. More intensity means more electrons per second at the same maximum energy (1)."]},"diag":false,"orig":"3.4 Q4"},{"code":"3.4 Q5","crit":"3.4","type":"sa","text":"Light below the threshold frequency is shone on a metal and the intensity is increased tenfold. Describe what is observed and explain it using the particle model.","marks":2,"answer":{"lines":["No photoelectrons are emitted, however intense the light (1). Below threshold each photon has hf < Φ, so it cannot free an electron; ten times as many inadequate photons make no difference because an electron absorbs only one photon at a time (1)."]},"diag":false,"orig":"3.4 Q5"},{"code":"3.4 Q6","crit":"3.4","type":"sa","marks":2,"text":"A student says: \"The photoelectric effect shows that light is a wave, because brighter light produces a larger photocurrent.\" Explain why this observation alone does not distinguish between the wave and particle models, and identify one observation that does.","answer":{"lines":["Both models predict that brighter light delivers more energy per second and so ejects more electrons per second; the wave model has no difficulty with a larger current (1). A distinguishing observation is one the wave model cannot explain: the threshold frequency, the absence of any time delay at low intensity, or the fact that E_{k max} depends on frequency but not on intensity (1)."]},"diag":false,"orig":"3.4 Q6"},{"code":"3.4 Q7","crit":"3.4","type":"sa","marks":2,"text":"Explain, using the photon model, why the maximum kinetic energy of photoelectrons increases linearly with the frequency of the light.","answer":{"lines":["Each photon carries energy hf, and one photon transfers all of its energy to one electron (1). The electron must give up at least the work function Φ to escape, so the most energetic electrons have E_{k max} = hf – Φ; since h and Φ are constant, E_{k max} is a linear function of f with gradient h (1)."]},"diag":false,"orig":"3.4 Q7"}]},{"code":"3.5","topic":3,"title":"Sketch V_{0} or E_{k max} vs f graphs and I vs V graphs","intro":null,"questions":[{"code":"3.5 Q1","crit":"3.5","type":"sa","text":"A metal has a work function of 2.0 eV. On the axes below, sketch a graph of stopping voltage V_{0} against frequency f. Label the threshold frequency and the extrapolated V_{0}-intercept with their values.","marks":3,"img":"grid_Vf","answer":{"lines":["Straight line of gradient h/e (1). f_{0} = Φ/h = (2.0 × 1.60 × 10^{–19})/6.63 × 10^{–34} = 4.8 × 10^{14} Hz (1). Extrapolated V_{0}-intercept = –Φ/e = –2.0 V; the line only physically exists for f ≥ f_{0} (1)."],"img":"g35_worked"},"diag":true,"orig":"3.5 Q2"},{"code":"3.5 Q2","crit":"3.5","type":"mc","text":"The gradient of a graph of stopping voltage V_{0} against frequency f is equal to","marks":1,"options":["h","h/e","Φ","e/h"],"answer":{"lines":["B. eV_{0} = hf – Φ, so V_{0} = (h/e)f – Φ/e."]},"diag":false,"orig":"3.5 Q1"},{"code":"3.5 Q3","crit":"3.5","type":"sa","text":"Light of a single frequency above threshold shines on a metal in a photocell. On the axes below, sketch the graph of photocurrent I against applied voltage V, from a large reverse voltage to a large forward voltage. Label the stopping voltage and the saturation current.","marks":2,"img":"grid_IV","answer":{"lines":["Current is zero for V ≤ –V_{0} (1). As V increases past –V_{0} the current rises, then levels off at the saturation current once every emitted electron reaches the collector (1)."],"img":"sol_35_yt"},"diag":false,"orig":"3.5 Q3"},{"code":"3.5 Q4","crit":"3.5","type":"sa","text":"Light of a fixed frequency above threshold is shone on a photocell. The intensity is then doubled. On the axes below, sketch and label the I vs V curves for both intensities.","marks":2,"img":"grid_IV","answer":{"lines":["Same stopping voltage (1); saturation current doubled (1)."],"img":"sol_35_q2"},"diag":false,"orig":"3.5 Q4"},{"code":"3.5 Q5","crit":"3.5","type":"sa","text":"Metal A has a work function of 1.5 eV and metal B has a work function of 2.5 eV. On the axes below, sketch and label the V_{0} vs f lines for both metals.","marks":3,"img":"grid_Vf","answer":{"lines":["Both lines have gradient h/e (parallel) (1). Metal A: f_{0} = 3.6 × 10^{14} Hz, V_{0}-intercept –1.5 V (1). Metal B: f_{0} = 6.0 × 10^{14} Hz, V_{0}-intercept –2.5 V; the line for B is shifted to the right (1)."],"img":"sol_35_q3"},"diag":false,"orig":"3.5 Q5"}]},{"code":"3.6","topic":3,"title":"Identify V_{0}, Φ, f_{0} and h as key graph features (intercepts or gradient) where relevant","intro":null,"questions":[{"code":"3.6 Q1","crit":"3.6","type":"sa","text":"The graph shows E_{k max} against frequency for a metal. Determine the threshold frequency, the work function in eV and an experimental value for h.","marks":3,"img":"g36_yt","answer":{"lines":["f_{0} = 6.0 × 10^{14} Hz (1). Gradient = 1.24/(9.0 – 6.0) × 10^{14} = 4.1 × 10^{–15} eV s; h = 4.13 × 10^{–15} × 1.60 × 10^{–19} = 6.6 × 10^{–34} J s (1). Φ = hf_{0} = 6.6 × 10^{–34} × 6.0 × 10^{14} = 4.0 × 10^{–19} J = 2.5 eV (1)."]},"diag":true,"num":[["f₀ (Hz)",600000000000000],["Φ (eV)",2.48,0.05],["h (J s)",6.6e-34]],"orig":"3.6 Q3"},{"code":"3.6 Q2","crit":"3.6","type":"mc","text":"On a graph of E_{k max} against frequency, the extrapolated E_{k max}-intercept is equal to","marks":1,"options":["f_{0}","–Φ","h","Φ/h"],"answer":{"lines":["B. E_{k max} = hf – Φ; at f = 0 the extrapolated value is –Φ."]},"diag":false,"orig":"3.6 Q1"},{"code":"3.6 Q3","crit":"3.6","type":"sa","text":"The graph shows the stopping voltage against frequency for a metal.","marks":4,"parts":[{"text":"a.  State the threshold frequency.","marks":1,"img":"g36_worked"},{"text":"b.  Use the gradient of the graph to determine an experimental value for Planck's constant.","marks":2},{"text":"c.  Determine the work function of the metal in eV.","marks":1}],"answer":{"lines":["a. f_{0} = 5.0 × 10^{14} Hz (1).","b. Gradient = ΔV_{0}/Δf = 1.65/(9.0 – 5.0) × 10^{14} = 4.1 × 10^{–15} V s (1). Gradient = h/e, so h = 4.1 × 10^{–15} × 1.60 × 10^{–19} = 6.6 × 10^{–34} J s (1).","c. Φ = hf_{0} = 6.6 × 10^{–34} × 5.0 × 10^{14} = 3.3 × 10^{–19} J = 2.1 eV (equivalently, the extrapolated V_{0}-intercept is –2.1 V) (1)."]},"diag":false,"num":[["a. f₀ (Hz)",500000000000000],["b. h (J s)",6.6e-34],["c. Φ (eV)",2.07,0.05]],"orig":"3.6 Q2"},{"code":"3.6 Q4","crit":"3.6","type":"sa","text":"The graph shows current against voltage for a photocell illuminated with light of frequency 7.5 × 10^{14} Hz.","marks":4,"parts":[{"text":"a.  Determine the stopping voltage and hence the maximum kinetic energy of the photoelectrons in eV and in J.","marks":2,"img":"g36_q1"},{"text":"b.  Calculate the work function of the metal in eV.","marks":2}],"answer":{"lines":["a. V_{0} = 1.2 V (current reaches zero at –1.2 V) (1). E_{k max} = 1.2 eV = 1.9 × 10^{–19} J (1).","b. E_{photon} = hf = 6.63 × 10^{–34} × 7.5 × 10^{14} = 4.97 × 10^{–19} J = 3.1 eV (1). Φ = 3.1 – 1.2 = 1.9 eV (1)."]},"diag":false,"num":[["a. V₀ (V)",1.2],["a. E_k max (J)",1.92e-19],["b. Φ (eV)",1.9,0.05]],"orig":"3.6 Q4"},{"code":"3.6 Q5","crit":"3.6","type":"sa","text":"Explain why the gradient of a V_{0} vs f graph is the same for every metal, but the intercepts are different.","marks":3,"answer":{"lines":["V_{0} = (h/e)f – Φ/e (1). The gradient h/e contains only universal constants, so it is identical for all metals (1). The intercepts (f_{0} = Φ/h and –Φ/e) depend on the work function, a property of the particular metal, so they differ (1)."]},"diag":false,"orig":"3.6 Q5"}]},{"code":"3.7","topic":3,"title":"Determine the effect of variable changes on these graphs (intensity change, frequency change with or without power kept constant, different metal with a higher or lower work function)","intro":null,"questions":[{"code":"3.7 Q1","crit":"3.7","type":"sa","text":"Light above the threshold frequency shines on a photocell. The frequency of the light is then increased, but the number of photons arriving per second is kept the same. State and explain the effect on (a) the saturation current and (b) the stopping voltage.","marks":2,"answer":{"lines":["(a) Saturation current unchanged: the same number of photons per second ejects the same number of electrons per second (1). (b) Stopping voltage increases: each photon has more energy hf, so E_{k max} = hf – Φ and hence V_{0} are larger (1)."]},"diag":true,"orig":"3.7 Q4"},{"code":"3.7 Q2","crit":"3.7","type":"mc","text":"In a photoelectric experiment the intensity of the light is doubled while its frequency is kept the same. Which of the following occurs?","marks":1,"options":["The stopping voltage doubles.","The saturation current doubles.","Both the stopping voltage and the saturation current double.","Neither the stopping voltage nor the saturation current changes."],"answer":{"lines":["B. Twice as many photons per second gives twice as many electrons per second; each photon still has energy hf, so V_{0} is unchanged."]},"diag":false,"orig":"3.7 Q1"},{"code":"3.7 Q3","crit":"3.7","type":"sa","text":"The frequency of the light shining on a photocell is increased while the power (energy per second) of the beam is kept constant. On the axes below, sketch the original I vs V curve and the new curve, and explain both changes.","marks":3,"img":"grid_IV","answer":{"lines":["Higher frequency means each photon has more energy, so E_{k max} = hf – Φ increases and V_{0} moves to a larger magnitude (1). At constant power, more energy per photon means fewer photons per second, so fewer electrons per second and a lower saturation current (1). Sketch showing both features (1)."],"img":"sol_37_yt"},"diag":false,"orig":"3.7 Q2"},{"code":"3.7 Q4","crit":"3.7","type":"sa","text":"The metal in a photocell is replaced by one with a higher work function. On the axes below, sketch the original and new V_{0} vs f lines and describe the change.","marks":3,"img":"grid_Vf","answer":{"lines":["The new line is parallel to the original (same gradient h/e) (1) but shifted to the right: f_{0} increases to Φ/h (1) and the extrapolated V_{0}-intercept becomes more negative (1)."],"img":"sol_37_q1"},"diag":false,"orig":"3.7 Q3"},{"code":"3.7 Q5","crit":"3.7","type":"sa","text":"A student records an I vs V curve, then changes one variable and records a second curve. The second curve has the same stopping voltage but a smaller saturation current. Identify the change the student made and justify your answer.","marks":2,"answer":{"lines":["The student reduced the intensity (fewer photons per second) at the same frequency (1). Same V_{0} means the photon energy, and hence the frequency, was unchanged; a smaller saturation current means fewer electrons per second, so fewer photons per second (1)."]},"diag":false,"orig":"3.7 Q5"},{"code":"3.7 Q6","crit":"3.7","type":"sa","marks":2,"text":"The frequency of the light shining on a photocell is increased and, at the same time, the power of the beam is halved. Describe the effect on the stopping voltage and on the saturation current.","answer":{"lines":["Stopping voltage increases: higher f means more energy per photon, so E_{k max} = hf – Φ is larger (1). Saturation current decreases: fewer photons arrive per second both because each photon carries more energy and because the total power is halved, so fewer electrons are ejected per second (1)."]},"diag":false,"orig":"3.7 Q6"},{"code":"3.7 Q7","crit":"3.7","type":"sa","marks":3,"text":"Metal A (Φ = 2.0 eV) and metal B (Φ = 3.0 eV) are each illuminated with light of frequency 9.0 × 10^{14} Hz at the same intensity. Compare the I vs V curves for the two metals, giving the stopping voltage for each.","answer":{"lines":["E_{photon} = hf = 6.63 × 10^{–34} × 9.0 × 10^{14} = 5.97 × 10^{–19} J = 3.7 eV (1). A: E_{k max} = 3.7 – 2.0 = 1.7 eV, so V_{0} = 1.7 V; B: E_{k max} = 3.7 – 3.0 = 0.7 eV, so V_{0} = 0.7 V (1). Both curves reach the same saturation current because the same number of photons arrives per second, but curve A extends further into reverse voltage before the current reaches zero (1)."]},"diag":false,"num":[["V₀ for A (V)",1.73,0.05],["V₀ for B (V)",0.73,0.08]],"orig":"3.7 Q7"}]},{"code":"4.1","topic":4,"title":"Recognise or draw a standing wave of a given harmonic","intro":null,"questions":[{"code":"4.1 Q1","crit":"4.1","type":"sa","text":"The diagram shows a standing wave on a string of length L. Identify the harmonic, state the number of nodes and antinodes, and give the wavelength in terms of L.","marks":2,"img":"h4","answer":{"lines":["Four loops: fourth harmonic, 5 nodes, 4 antinodes (1). L = 4 × λ/2, so λ_{4} = L/2 (1)."]},"diag":true,"orig":"4.1 Q3"},{"code":"4.1 Q2","crit":"4.1","type":"mc","text":"A string of length L fixed at both ends vibrates in its third harmonic. The wavelength of the standing wave is","marks":1,"options":["2L/3","3L/2","L/3","3L"],"answer":{"lines":["A. Three loops of λ/2 each: L = 3λ/2."]},"diag":false,"orig":"4.1 Q1"},{"code":"4.1 Q3","crit":"4.1","type":"sa","text":"On the string below, draw the second harmonic. Label the nodes and antinodes and state the wavelength in terms of L.","marks":2,"img":"string_blank","answer":{"lines":["Two loops, three nodes (both ends and the centre) and two antinodes (1). L = 2 × λ/2, so λ_{2} = L (1)."],"img":"sol_h2"},"diag":false,"orig":"4.1 Q2"},{"code":"4.1 Q4","crit":"4.1","type":"sa","text":"A string of length 1.2 m vibrates in its fifth harmonic. State the number of nodes and antinodes and calculate the wavelength.","marks":2,"answer":{"lines":["Fifth harmonic: 6 nodes, 5 antinodes (1). λ_{5} = 2L/5 = 2 × 1.2/5 = 0.48 m (1)."]},"diag":false,"num":[["nodes",6,0],["antinodes",5,0],["λ (m)",0.48]],"orig":"4.1 Q4"},{"code":"4.1 Q5","crit":"4.1","type":"sa","text":"Explain why a string fixed at both ends must have a node at each end, and why this restricts the possible wavelengths to λ_{n} = 2L/n.","marks":2,"answer":{"lines":["The fixed ends cannot move, so the displacement there is always zero: a node (1). Between the ends there must be a whole number of loops, each half a wavelength long, so L = nλ/2 and only λ_{n} = 2L/n fit; any other wavelength would require a non-zero displacement at an end (1)."]},"diag":false,"orig":"4.1 Q5"}]},{"code":"4.2","topic":4,"title":"Calculate the velocity, frequency or wavelength of a given harmonic: f_{n} = nv/2L, λ_{n} = 2L/n, v = fλ","intro":null,"questions":[{"code":"4.2 Q1","crit":"4.2","type":"sa","text":"A guitar string of length 0.65 m vibrates in its third harmonic at 660 Hz. Calculate the wavelength of this harmonic and the wave speed on the string.","marks":2,"answer":{"lines":["λ_{3} = 2L/3 = 2 × 0.65/3 = 0.433 m (1). v = fλ = 660 × 0.433 = 286 m s^{–1} ≈ 2.9 × 10^{2} m s^{–1} (1)."]},"diag":true,"num":[["λ₃ (m)",0.433],["v (m/s)",286]],"orig":"4.2 Q3"},{"code":"4.2 Q2","crit":"4.2","type":"mc","text":"Waves travel at 240 m s^{–1} along a string of length 0.60 m fixed at both ends. The fundamental frequency of the string is","marks":1,"options":["200 Hz","400 Hz","100 Hz","144 Hz"],"answer":{"lines":["A. λ_{1} = 2L = 1.2 m; f_{1} = v/λ_{1} = 240/1.2 = 200 Hz."]},"diag":false,"orig":"4.2 Q1"},{"code":"4.2 Q3","crit":"4.2","type":"sa","text":"A string of length 0.80 m fixed at both ends has a fundamental frequency of 150 Hz.","marks":3,"parts":[{"text":"a.  Calculate the wavelength of the fundamental and the wave speed on the string.","marks":2},{"text":"b.  Calculate the frequency and wavelength of the second harmonic.","marks":1}],"answer":{"lines":["a. λ_{1} = 2L = 1.6 m (1). v = fλ = 150 × 1.6 = 240 m s^{–1} (1).","b. f_{2} = 2f_{1} = 300 Hz; λ_{2} = L = 0.80 m (1)."]},"diag":false,"num":[["a. λ₁ (m)",1.6],["a. v (m/s)",240],["b. f₂ (Hz)",300],["b. λ₂ (m)",0.8]],"orig":"4.2 Q2"},{"code":"4.2 Q4","crit":"4.2","type":"sa","text":"A string of length 1.5 m vibrates in its fourth harmonic at 200 Hz. Calculate the fundamental frequency and the wave speed.","marks":2,"answer":{"lines":["f_{1} = f_{4}/4 = 50 Hz (1). λ_{1} = 2L = 3.0 m; v = f_{1}λ_{1} = 50 × 3.0 = 150 m s^{–1} (1)."]},"diag":false,"num":[["f₁ (Hz)",50],["v (m/s)",150]],"orig":"4.2 Q4"}]},{"code":"4.3","topic":4,"title":"Explain how a standing wave is formed","intro":null,"questions":[{"code":"4.3 Q1","crit":"4.3","type":"sa","text":"Explain how a standing wave forms on a string fixed at both ends.","marks":3,"answer":{"lines":["A wave sent along the string reflects from the fixed end (with a phase inversion) and travels back; the reflected and incident waves have the same frequency, wavelength and amplitude but travel in opposite directions (1). The two waves superpose: at some points they are always in antiphase and cancel, producing nodes; midway between, they are always in phase and reinforce, producing antinodes (1). The resulting pattern does not travel along the string, and only forms when the string length is a whole number of half-wavelengths so that nodes coincide with the fixed ends (1)."]},"diag":true,"orig":"4.3 Q2"},{"code":"4.3 Q2","crit":"4.3","type":"mc","text":"A standing wave on a string is produced by the superposition of","marks":1,"options":["two waves of different frequency travelling in the same direction.","two identical waves travelling in opposite directions.","two waves of different wavelength travelling in opposite directions.","a single wave that has been reflected once."],"answer":{"lines":["B."]},"diag":false,"orig":"4.3 Q1"},{"code":"4.3 Q3","crit":"4.3","type":"sa","text":"A student observes that at some points on a vibrating string the string does not appear to move at all, while at other points it vibrates with large amplitude. Explain these observations in terms of the superposition of two travelling waves.","marks":2,"answer":{"lines":["The incident wave and the wave reflected from the fixed end travel in opposite directions and superpose (1). At the stationary points (nodes) the two waves always arrive in antiphase, so their displacements cancel at every instant; at the points of large vibration (antinodes) they always arrive in phase, so their displacements add to twice the amplitude of either wave (1)."]},"diag":false,"orig":"4.3 Q3"},{"code":"4.3 Q4","crit":"4.3","type":"sa","text":"Explain why a standing wave on a string only forms at certain driving frequencies and not at others.","marks":2,"answer":{"lines":["A standing wave requires the reflected waves to reinforce the incident waves consistently, which only happens when the string length is a whole number of half-wavelengths (L = nλ/2) so that nodes fall at both fixed ends (1). Since λ = v/f, only the frequencies f_{n} = nv/2L satisfy this; at other frequencies successive reflections arrive with varying phase and largely cancel, so no stable large-amplitude pattern builds up (1)."]},"diag":false,"orig":"4.3 Q4"}]},{"code":"4.4","topic":4,"title":"Apply f_{n} = nf_{1} to find other harmonic frequencies and to determine if given harmonic frequencies are possible","intro":null,"questions":[{"code":"4.4 Q1","crit":"4.4","type":"sa","text":"A string resonates at 450 Hz and at 600 Hz, and at no frequency in between.","marks":3,"parts":[{"text":"a.  Determine the fundamental frequency and identify which harmonics 450 Hz and 600 Hz are.","marks":2},{"text":"b.  Determine whether 1050 Hz is a possible harmonic frequency for this string.","marks":1}],"answer":{"lines":["a. Adjacent harmonics differ by f_{1}: f_{1} = 600 – 450 = 150 Hz (1). 450/150 = 3 and 600/150 = 4, so they are the 3rd and 4th harmonics (1).","b. 1050/150 = 7, a whole number, so 1050 Hz is the 7th harmonic and is possible (1)."]},"diag":true,"num":[["a. f₁ (Hz)",150]],"orig":"4.4 Q2"},{"code":"4.4 Q2","crit":"4.4","type":"mc","text":"A string has a fundamental frequency of 120 Hz. Which of the following frequencies cannot produce a standing wave on the string?","marks":1,"options":["240 Hz","360 Hz","500 Hz","480 Hz"],"answer":{"lines":["C. 500/120 = 4.17 is not a whole number."]},"diag":false,"orig":"4.4 Q1"},{"code":"4.4 Q3","crit":"4.4","type":"sa","text":"A string has a fundamental frequency of 80 Hz. Determine which of the following frequencies can produce standing waves on the string: 160 Hz, 200 Hz, 320 Hz, 400 Hz. Justify your answer.","marks":2,"answer":{"lines":["160 Hz (n = 2), 320 Hz (n = 4) and 400 Hz (n = 5) are harmonics and can produce standing waves (1). 200 Hz gives n = 2.5, not a whole number, so it cannot (1)."]},"diag":false,"orig":"4.4 Q3"},{"code":"4.4 Q4","crit":"4.4","type":"sa","text":"A string with a fundamental frequency of 110 Hz is shortened to half its length while the tension (and hence wave speed) is unchanged. Determine the new fundamental frequency and list the first three harmonics of the shortened string.","marks":2,"answer":{"lines":["f_{1} = v/2L, so halving L doubles f_{1}: new f_{1} = 220 Hz (1). First three harmonics: 220 Hz, 440 Hz, 660 Hz (1)."]},"diag":false,"num":[["new f₁ (Hz)",220]],"orig":"4.4 Q5"}]},{"code":"5.1","topic":5,"title":"Calculate the de Broglie wavelength of an object: λ = h/p = h/mv","intro":null,"questions":[{"code":"5.1 Q1","crit":"5.1","type":"sa","text":"Calculate the de Broglie wavelength of an electron moving at 2.0 × 10^{6} m s^{–1}.","marks":2,"answer":{"lines":["λ = h/mv = 6.63 × 10^{–34}/(9.11 × 10^{–31} × 2.0 × 10^{6}) (1) = 3.6 × 10^{–10} m (1)."]},"diag":true,"num":[["λ (m)",3.64e-10]],"orig":"5.1 Q2"},{"code":"5.1 Q2","crit":"5.1","type":"mc","text":"The speed of an electron is doubled. Its de Broglie wavelength","marks":1,"options":["halves.","doubles.","is reduced to one quarter.","is unchanged."],"answer":{"lines":["A. λ = h/mv, so doubling v halves λ."]},"diag":false,"orig":"5.1 Q1"},{"code":"5.1 Q3","crit":"5.1","type":"sa","text":"A cricket ball of mass 0.16 kg is bowled at 40 m s^{–1}. Calculate its de Broglie wavelength and explain why the ball shows no observable diffraction when passing through a doorway.","marks":3,"answer":{"lines":["λ = h/mv = 6.63 × 10^{–34}/(0.16 × 40) = 1.0 × 10^{–34} m (2). For a doorway about 1 m wide, λ/w ≈ 10^{–34}, immeasurably small: diffraction is negligible and the ball behaves as a classical particle (1)."]},"diag":false,"num":[["λ (m)",1.04e-34,0.05]],"orig":"5.1 Q4"},{"code":"5.1 Q4","crit":"5.1","type":"sa","text":"An electron is accelerated from rest through 100 V. Calculate its kinetic energy in joules, its momentum and its de Broglie wavelength.","marks":3,"answer":{"lines":["E_{k} = qV = 1.60 × 10^{–19} × 100 = 1.6 × 10^{–17} J (1). p = √(2mE_{k}) = √(2 × 9.11 × 10^{–31} × 1.6 × 10^{–17}) = 5.4 × 10^{–24} kg m s^{–1} (1). λ = h/p = 6.63 × 10^{–34}/5.4 × 10^{–24} = 1.2 × 10^{–10} m (1)."]},"diag":false,"num":[["E_k (J)",1.6e-17],["p (kg m/s)",5.4e-24],["λ (m)",1.23e-10]],"orig":"5.1 Q5"}]},{"code":"5.2","topic":5,"title":"Identify that identical diffraction patterns for electron and X-ray diffraction means the same wavelength, and find their respective energies","intro":null,"questions":[{"code":"5.2 Q1","crit":"5.2","type":"sa","text":"X-rays of wavelength 2.0 × 10^{–11} m produce a diffraction pattern from a crystal. A beam of electrons produces an identical pattern from the same crystal. Calculate the kinetic energy of the electrons and the energy of the X-ray photons, both in keV.","marks":4,"answer":{"lines":["Identical patterns mean identical wavelengths: λ_{e} = 2.0 × 10^{–11} m (1). Electron: p = h/λ = 6.63 × 10^{–34}/2.0 × 10^{–11} = 3.3 × 10^{–23} kg m s^{–1}; E_{k} = p^{2}/2m = (3.3 × 10^{–23})^{2}/(2 × 9.11 × 10^{–31}) = 6.0 × 10^{–16} J (1) = 3.8 keV (1). X-ray photon: E = hc/λ = (6.63 × 10^{–34} × 3.00 × 10^{8})/2.0 × 10^{–11} = 9.9 × 10^{–15} J = 62 keV (1)."]},"diag":true,"num":[["electron E_k (keV)",3.77,0.05],["X-ray E (keV)",62,0.05]],"orig":"5.2 Q2"},{"code":"5.2 Q2","crit":"5.2","type":"mc","text":"A beam of electrons and a beam of X-rays produce identical diffraction patterns from the same crystal. The electrons and the X-rays must have the same","marks":1,"options":["kinetic energy.","speed.","frequency.","wavelength."],"answer":{"lines":["D. The pattern depends only on λ/w."]},"diag":false,"orig":"5.2 Q1"},{"code":"5.2 Q3","crit":"5.2","type":"sa","text":"Electrons travelling at 1.0 × 10^{7} m s^{–1} produce a diffraction pattern from a thin crystal.","marks":5,"parts":[{"text":"a.  Calculate the wavelength of X-rays that would produce an identical pattern.","marks":2},{"text":"b.  Calculate the energy of these X-ray photons and the kinetic energy of the electrons, both in eV.","marks":3}],"answer":{"lines":["a. λ = h/mv = 6.63 × 10^{–34}/(9.11 × 10^{–31} × 1.0 × 10^{7}) = 7.3 × 10^{–11} m (1); X-rays must have this same wavelength (1).","b. X-ray: E = hc/λ = (6.63 × 10^{–34} × 3.00 × 10^{8})/7.29 × 10^{–11} = 2.7 × 10^{–15} J (1) = 1.7 × 10^{4} eV (17 keV) (1). Electron: E_{k} = ½mv^{2} = ½ × 9.11 × 10^{–31} × (1.0 × 10^{7})^{2} = 4.6 × 10^{–17} J = 280 eV (1)."]},"diag":false,"num":[["a. λ (m)",7.29e-11],["b. X-ray E (eV)",17000,0.05],["b. electron E_k (eV)",284,0.05]],"orig":"5.2 Q3"},{"code":"5.2 Q4","crit":"5.2","type":"sa","text":"Explain why electrons and X-rays with the same wavelength produce the same diffraction pattern from a crystal, even though one is matter and the other is electromagnetic radiation.","marks":2,"answer":{"lines":["The spacing of a diffraction pattern depends only on the ratio λ/w, where w is the atomic spacing of the crystal (1). Electrons have a de Broglie wavelength λ = h/p that behaves exactly like the wavelength of the X-rays, so if the wavelengths are equal the pattern geometry is identical regardless of what is diffracting (1)."]},"diag":false,"orig":"5.2 Q4"},{"code":"5.2 Q5","crit":"5.2","type":"sa","text":"For the same wavelength, the energy of an X-ray photon is far greater than the kinetic energy of an electron. Explain why, with reference to the relationship between energy and momentum for each.","marks":2,"answer":{"lines":["Both have the same momentum p = h/λ. For a photon E = pc, but for a (non-relativistic) electron E_{k} = p^{2}/2m = p × v/2 (1). Since v ≪ c for the electron, p × v/2 is far smaller than p × c, so the electron's energy is much lower for the same momentum and wavelength (1)."]},"diag":false,"orig":"5.2 Q5"}]},{"code":"6.1","topic":6,"title":"Determine the momentum of a photon: p = h/λ = E/c","intro":null,"questions":[{"code":"6.1 Q1","crit":"6.1","type":"sa","text":"Calculate the momentum of an X-ray photon of wavelength 0.10 nm.","marks":2,"answer":{"lines":["p = h/λ = 6.63 × 10^{–34}/0.10 × 10^{–9} (1) = 6.6 × 10^{–24} kg m s^{–1} (1)."]},"diag":true,"num":[["p (kg m/s)",6.63e-24]],"orig":"6.1 Q2"},{"code":"6.1 Q2","crit":"6.1","type":"mc","text":"The momentum of a photon of wavelength 500 nm is closest to","marks":1,"options":["1.3 × 10^{–27} kg m s^{–1}","4.0 × 10^{–19} kg m s^{–1}","1.3 × 10^{–24} kg m s^{–1}","6.6 × 10^{–34} kg m s^{–1}"],"answer":{"lines":["A. p = h/λ = 6.63 × 10^{–34}/500 × 10^{–9} = 1.3 × 10^{–27} kg m s^{–1}."]},"diag":false,"orig":"6.1 Q1"},{"code":"6.1 Q3","crit":"6.1","type":"sa","text":"A photon has an energy of 2.0 eV. Calculate its momentum using p = E/c, then calculate its wavelength and confirm the momentum using p = h/λ.","marks":3,"answer":{"lines":["E = 2.0 × 1.60 × 10^{–19} = 3.2 × 10^{–19} J; p = E/c = 3.2 × 10^{–19}/3.00 × 10^{8} = 1.1 × 10^{–27} kg m s^{–1} (1). λ = hc/E = (6.63 × 10^{–34} × 3.00 × 10^{8})/3.2 × 10^{–19} = 6.2 × 10^{–7} m (1). p = h/λ = 6.63 × 10^{–34}/6.2 × 10^{–7} = 1.1 × 10^{–27} kg m s^{–1}, in agreement (1)."]},"diag":false,"num":[["p (kg m/s)",1.07e-27],["λ (m)",6.2e-7]],"orig":"6.1 Q3"},{"code":"6.1 Q4","crit":"6.1","type":"sa","text":"A photon and an electron both have a wavelength of 500 nm. Compare their momenta and their energies.","marks":3,"answer":{"lines":["Momentum is the same for both: p = h/λ = 6.63 × 10^{–34}/500 × 10^{–9} = 1.3 × 10^{–27} kg m s^{–1} (1). Photon: E = pc = 4.0 × 10^{–19} J = 2.5 eV (1). Electron: E_{k} = p^{2}/2m = (1.33 × 10^{–27})^{2}/(2 × 9.11 × 10^{–31}) = 9.7 × 10^{–25} J = 6.1 × 10^{–6} eV; the photon carries about 4 × 10^{5} times more energy for the same momentum (1)."]},"diag":false,"num":[["p (kg m/s)",1.33e-27],["photon E (eV)",2.5,0.05],["electron E_k (eV)",0.0000061,0.05]],"orig":"6.1 Q5"}]},{"code":"6.2","topic":6,"title":"Calculate the force acting on an object as a result of photon bombardment in perfect reflection: F = 2nh/(λt) = 2P/c","intro":{"text":"Perfect reflection reverses each photon's momentum, so Δp = 2h/λ per photon and F = 2nh/(λt) for n photons in time t. If the beam power P is given instead of the photon count, n/t = P/E_{photon} = Pλ/(hc), which gives F = 2P/c."},"questions":[{"code":"6.2 Q1","crit":"6.2","type":"sa","text":"A surface is struck by 1.0 × 10^{20} photons per second of wavelength 300 nm and reflects them all back along their original path. Calculate the force on the surface.","marks":2,"answer":{"lines":["Each photon's momentum reverses, so Δp = 2h/λ per photon and F = 2nh/(λt) (1). F = (2 × 1.0 × 10^{20} × 6.63 × 10^{–34})/(300 × 10^{–9} × 1.0) = 4.4 × 10^{–7} N (1)."]},"diag":true,"num":[["F (N)",4.4e-7]],"orig":"6.2 Q4"},{"code":"6.2 Q2","crit":"6.2","type":"mc","text":"A beam of light strikes a surface at normal incidence. Compared with a surface that absorbs all the light, a surface that reflects all the light experiences a force that is","marks":1,"options":["the same.","twice as large.","half as large.","four times as large."],"answer":{"lines":["B. Reflection changes the photon momentum from p to –p (Δp = 2p); absorption changes it from p to 0 (Δp = p)."]},"diag":false,"orig":"6.2 Q1"},{"code":"6.2 Q3","crit":"6.2","type":"sa","text":"A laser directs 6.0 × 10^{18} photons per second of wavelength 600 nm at normal incidence onto a perfectly reflecting mirror. Calculate the momentum of each photon, the momentum change of each photon on reflection, and the force on the mirror.","marks":3,"answer":{"lines":["p = h/λ = 6.63 × 10^{–34}/600 × 10^{–9} = 1.1 × 10^{–27} kg m s^{–1} (1). Perfect reflection reverses the momentum, so Δp = 2p = 2h/λ = 2.2 × 10^{–27} kg m s^{–1} per photon (1). F = 2nh/(λt) = (2 × 6.0 × 10^{18} × 6.63 × 10^{–34})/(600 × 10^{–9} × 1.0) = 1.3 × 10^{–8} N (1)."]},"diag":false,"num":[["p (kg m/s)",1.1e-27],["Δp per photon (kg m/s)",2.2e-27],["F (N)",1.33e-8]],"orig":"6.2 Q2"},{"code":"6.2 Q4","crit":"6.2","type":"sa","text":"A perfectly reflecting solar sail is struck at normal incidence by 4.5 × 10^{23} photons of average wavelength 550 nm every second.","marks":4,"parts":[{"text":"a.  Calculate the force on the sail.","marks":2},{"text":"b.  The sail is replaced with one of the same size that absorbs all the light. Explain how and why the force changes, and state its new value.","marks":2}],"answer":{"lines":["a. F = 2nh/(λt) (1) = (2 × 4.5 × 10^{23} × 6.63 × 10^{–34})/(550 × 10^{–9} × 1.0) = 1.1 × 10^{–3} N (1).","b. An absorbed photon's momentum changes from p to 0 (Δp = h/λ) instead of from p to –p (Δp = 2h/λ) (1). The force is halved: F = nh/(λt) = 5.4 × 10^{–4} N (1)."]},"diag":false,"num":[["a. F (N)",0.00108],["b. F (N)",0.00054]],"orig":"6.2 Q3"},{"code":"6.2 Q5","crit":"6.2","type":"sa","text":"In 2.0 s, 2.3 × 10^{19} photons of wavelength 450 nm strike a small mirror at normal incidence and are reflected. Show that the average force on the mirror is about 3.4 × 10^{–8} N.","marks":2,"answer":{"lines":["Δp = 2h/λ per photon, so F = 2nh/(λt) (1). F = (2 × 2.3 × 10^{19} × 6.63 × 10^{–34})/(450 × 10^{–9} × 2.0) = 3.4 × 10^{–8} N (1)."]},"diag":false,"orig":"6.2 Q5"}]},{"code":"7.1","topic":7,"title":"Explain why only discrete wavelengths are absorbed or emitted in absorption or emission spectra","intro":null,"questions":[{"code":"7.1 Q1","crit":"7.1","type":"sa","text":"The diagram shows the visible absorption spectrum of hydrogen: dark lines on an otherwise continuous spectrum. Explain how the hydrogen absorption spectrum is produced.","marks":2,"answer":{"lines":["White light passes through hydrogen gas, and electrons in the atoms absorb only those photons whose energy exactly matches the difference between two energy levels, jumping to the higher level (1). Those wavelengths are removed from the transmitted beam (the absorbed energy is re-emitted in all directions), so dark lines appear at just those wavelengths on the continuous spectrum (1)."],"img":null},"img":"h_absorption","diag":true,"orig":"7.1 Q2"},{"code":"7.1 Q2","crit":"7.1","type":"sa","text":"The diagram shows the visible emission spectrum of hydrogen: bright lines on a dark background. Explain how the hydrogen emission spectrum is produced.","marks":2,"answer":{"lines":["Electrons in the gas are excited to higher energy levels (for example by heating or an electric discharge) and then fall back to lower levels (1). Each fall emits a photon whose energy equals the difference between the two levels, E = hf = hc/λ; only certain level differences exist, so light is emitted at only those wavelengths, producing bright lines (1)."],"img":null},"img":"h_emission","diag":false,"orig":"7.1 Q3"},{"code":"7.1 Q3","crit":"7.1","type":"sa","text":"Explain how the emission spectrum of a gas can be used to identify which element it is.","marks":2,"answer":{"lines":["Each element has a unique set of energy levels, so the set of level differences, and hence the pattern of emitted wavelengths, is unique to that element (1). Comparing the observed line wavelengths with known spectra identifies the element, like a fingerprint (1)."]},"diag":false,"orig":"7.1 Q4"}]},{"code":"7.2","topic":7,"title":"Identify energy changes and represent these as arrows on energy level diagrams","intro":{"img":"elevels","text":"Energy levels of hydrogen, measured from the ground state. Used for every question in this criterion."},"questions":[{"code":"7.2 Q1","crit":"7.2","type":"sa","text":"On the diagram below, draw and label arrows representing (a) the absorption of a 10.2 eV photon by an electron in the ground state, and (b) an electron dropping from n = 4 to n = 2. Calculate the wavelength of the photon emitted in (b).","marks":3,"img":"elevels","answer":{"lines":["(a) Upward arrow from n = 1 (0 eV) to n = 2 (10.2 eV), labelled absorption (1). (b) Downward arrow from n = 4 (12.8 eV) to n = 2 (10.2 eV): E = 2.6 eV = 4.16 × 10^{–19} J (1). λ = hc/E = (6.63 × 10^{–34} × 3.00 × 10^{8})/4.16 × 10^{–19} = 4.8 × 10^{–7} m (480 nm) (1)."],"img":"sol_72_yt"},"diag":true,"num":[["λ (m)",4.8e-7]],"orig":"7.2 Q2"},{"code":"7.2 Q2","crit":"7.2","type":"mc","text":"An electron in the n = 3 level drops directly to the ground state. The energy of the emitted photon is","marks":1,"options":["12.1 eV","1.9 eV","10.2 eV","13.6 eV"],"answer":{"lines":["A. E = 12.1 – 0 = 12.1 eV."]},"diag":false,"orig":"7.2 Q1"},{"code":"7.2 Q3","crit":"7.2","type":"sa","text":"An electron is in the n = 3 level. On the diagram below, draw an arrow for every possible downward transition and state the energy of the photon for each.","marks":3,"img":"elevels","answer":{"lines":["Downward arrows for 3 → 2 (12.1 – 10.2 = 1.9 eV) (1), 3 → 1 (12.1 eV) (1), and 2 → 1 (10.2 eV) following the first transition (1)."],"img":"sol_72_q1"},"diag":false,"orig":"7.2 Q3"},{"code":"7.2 Q4","crit":"7.2","type":"sa","text":"Calculate the energy and wavelength of the photon emitted when an electron drops from n = 4 to n = 3. State the region of the electromagnetic spectrum it belongs to.","marks":3,"answer":{"lines":["E = 12.8 – 12.1 = 0.7 eV = 1.12 × 10^{–19} J (1). λ = hc/E = (6.63 × 10^{–34} × 3.00 × 10^{8})/1.12 × 10^{–19} = 1.8 × 10^{–6} m (1). Infrared (1)."]},"diag":false,"num":[["E (eV)",0.7,0.05],["λ (m)",0.00000178,0.05]],"orig":"7.2 Q4"},{"code":"7.2 Q5","crit":"7.2","type":"sa","text":"An electron in the n = 2 level absorbs a photon of energy 2.6 eV. Identify the level it moves to and describe how this would be represented on the diagram.","marks":2,"answer":{"lines":["10.2 + 2.6 = 12.8 eV, so the electron moves to n = 4 (1). Drawn as an upward arrow from the n = 2 level to the n = 4 level, labelled with the absorbed energy of 2.6 eV (1)."],"img":"sol_72_q3"},"diag":false,"orig":"7.2 Q5"}]},{"code":"7.3","topic":7,"title":"Determine what photon energies can be absorbed or emitted","intro":{"img":"elevels_atom","text":"Energy levels of an atom, measured from the ground state: 0 eV, 1.8 eV, 3.0 eV and 4.5 eV. Used for every question in this criterion."},"questions":[{"code":"7.3 Q1","crit":"7.3","type":"sa","text":"An electron is in the 3.0 eV level. List the energies of all photons that could be emitted as it returns to the ground state.","marks":2,"answer":{"lines":["3.0 → 0: 3.0 eV; 3.0 → 1.8: 1.2 eV, then 1.8 → 0: 1.8 eV (1). Three photon energies: 3.0, 1.2 and 1.8 eV (1)."]},"diag":true,"orig":"7.3 Q2"},{"code":"7.3 Q2","crit":"7.3","type":"mc","text":"The atom is in its ground state. Which of the following photons can it absorb?","marks":1,"options":["1.2 eV","2.0 eV","3.0 eV","4.0 eV"],"answer":{"lines":["C. From the ground state the only allowed jumps are to 1.8, 3.0 or 4.5 eV."]},"diag":false,"orig":"7.3 Q1"},{"code":"7.3 Q3","crit":"7.3","type":"sa","text":"An electron is excited to the 4.5 eV level. List the energies of all the different photons that could be emitted as the atom returns to the ground state.","marks":3,"answer":{"lines":["From 4.5 eV: 4.5, 1.5 (to 3.0), 2.7 (to 1.8) (1). From 3.0 eV: 3.0, 1.2 (to 1.8); from 1.8 eV: 1.8 (1). Six possible photon energies: 4.5, 2.7, 1.5, 3.0, 1.2 and 1.8 eV (1)."]},"diag":false,"orig":"7.3 Q3"},{"code":"7.3 Q4","crit":"7.3","type":"sa","text":"The emission spectrum of the atom includes a line produced by the 4.5 → 1.8 eV transition. Calculate the wavelength of this line.","marks":2,"answer":{"lines":["E = 4.5 – 1.8 = 2.7 eV = 4.32 × 10^{–19} J (1). λ = hc/E = (6.63 × 10^{–34} × 3.00 × 10^{8})/4.32 × 10^{–19} = 4.6 × 10^{–7} m = 460 nm (1)."]},"diag":false,"num":[["λ (nm)",460]],"orig":"7.3 Q4"},{"code":"7.3 Q5","crit":"7.3","type":"sa","text":"A photon of energy 2.0 eV passes through a gas of these atoms, all in the ground state, without being absorbed. Explain why.","marks":2,"answer":{"lines":["An electron in the ground state can only absorb exactly 1.8, 3.0 or 4.5 eV (1). A 2.0 eV photon would leave the electron at 2.0 eV, which is not an allowed level, and a photon cannot be partly absorbed, so it passes through (1)."]},"diag":false,"orig":"7.3 Q5"}]},{"code":"7.4","topic":7,"title":"Determine the kinetic energy of an ionised electron","intro":null,"questions":[{"code":"7.4 Q1","crit":"7.4","type":"mc","text":"A photon of energy 15.0 eV is absorbed by a ground-state hydrogen atom (ionisation energy 13.6 eV). The kinetic energy of the ejected electron is","marks":1,"options":["1.4 eV","15.0 eV","13.6 eV","28.6 eV"],"answer":{"lines":["A. E_{k} = 15.0 – 13.6 = 1.4 eV."]},"img":"elevels","diag":false,"orig":"7.4 Q1"},{"code":"7.4 Q2","crit":"7.4","type":"sa","text":"A hydrogen atom has its electron in the n = 2 level, which is 3.4 eV below the ionisation level. The atom absorbs a photon of energy 5.0 eV. Calculate the kinetic energy of the ejected electron in eV.","marks":2,"answer":{"lines":["Only 3.4 eV is needed to free the electron from the n = 2 level (1). E_{k} = 5.0 – 3.4 = 1.6 eV (1)."]},"img":"elevels","diag":false,"num":[["E_k (eV)",1.6]],"orig":"7.4 Q2"},{"code":"7.4 Q3","crit":"7.4","type":"sa","text":"An atom has an ionisation energy of 5.2 eV. Its electron is in an excited level 2.0 eV above the ground state when it absorbs a photon of energy 4.0 eV. Show that the atom is ionised and calculate the kinetic energy of the ejected electron in eV.","marks":2,"answer":{"lines":["From the 2.0 eV level the electron needs 5.2 – 2.0 = 3.2 eV to escape; the 4.0 eV photon supplies more than this, so the atom is ionised (1). E_{k} = 4.0 – 3.2 = 0.8 eV (1)."]},"diag":false,"num":[["E_k (eV)",0.8,0.05]],"orig":"7.4 Q4"},{"code":"7.4 Q4","crit":"7.4","type":"sa","text":"An atom has an ionisation energy of 4.5 eV. It absorbs a photon of wavelength 200 nm. Show that the atom is ionised and calculate the kinetic energy of the ejected electron in eV.","marks":3,"answer":{"lines":["E_{photon} = hc/λ = (6.63 × 10^{–34} × 3.00 × 10^{8})/200 × 10^{–9} = 9.95 × 10^{–19} J (1) = 6.2 eV, which exceeds the ionisation energy of 4.5 eV, so the electron is freed (1). E_{k} = 6.2 – 4.5 = 1.7 eV (1)."]},"diag":false,"num":[["E_k (eV)",1.7,0.05]],"orig":"7.4 Q5"}]},{"code":"8.1","topic":8,"title":"Calculate the Lorentz factor: γ = 1/√(1 – v^{2}/c^{2})","intro":null,"questions":[{"code":"8.1 Q1","crit":"8.1","type":"sa","text":"Calculate the Lorentz factor for a particle moving at 0.995c.","marks":2,"answer":{"lines":["γ = 1/√(1 – 0.995^{2}) (1) = 1/√0.009975 = 10 (1)."]},"diag":true,"num":[["γ",10,0.02]],"orig":"8.1 Q3"},{"code":"8.1 Q2","crit":"8.1","type":"mc","text":"The Lorentz factor for an object travelling at 0.80c is","marks":1,"options":["1.67","1.25","0.60","2.0"],"answer":{"lines":["A. γ = 1/√(1 – 0.64) = 1/0.60 = 1.67."]},"diag":false,"orig":"8.1 Q1"},{"code":"8.1 Q3","crit":"8.1","type":"sa","text":"Calculate the Lorentz factor for an object travelling at (a) 0.60c and (b) 0.95c.","marks":2,"answer":{"lines":["(a) γ = 1/√(1 – 0.60^{2}) = 1/√0.64 = 1.25 (1). (b) γ = 1/√(1 – 0.95^{2}) = 1/√0.0975 = 3.2 (1)."]},"diag":false,"num":[["a. γ",1.25,0.01],["b. γ",3.2,0.02]],"orig":"8.1 Q2"},{"code":"8.1 Q4","crit":"8.1","type":"sa","text":"A spacecraft travels at 3.0 × 10^{7} m s^{–1}. Calculate γ and comment on the size of relativistic effects at this speed.","marks":2,"answer":{"lines":["v/c = 0.10; γ = 1/√(1 – 0.010) = 1.005 (1). Relativistic effects are only about 0.5% at this speed: measurable with precise instruments but negligible for most purposes (1)."]},"diag":false,"num":[["γ",1.005,0.002]],"orig":"8.1 Q4"},{"code":"8.1 Q5","crit":"8.1","type":"sa","text":"Explain why γ can never be less than 1 and describe what happens to γ as v approaches c.","marks":2,"answer":{"lines":["Since v < c, v^{2}/c^{2} is between 0 and 1, so √(1 – v^{2}/c^{2}) is between 0 and 1 and its reciprocal γ is at least 1 (γ = 1 when v = 0) (1). As v approaches c the square root approaches 0 and γ increases without limit (1)."]},"diag":false,"orig":"8.1 Q5"}]},{"code":"8.2","topic":8,"title":"Calculate time dilation (t = γt_{0}) or length contraction (L = L_{0}/γ)","intro":null,"questions":[{"code":"8.2 Q1","crit":"8.2","t
