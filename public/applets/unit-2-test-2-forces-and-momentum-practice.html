<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 2 Motion Test 2: Forces and Momentum</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathlive@0.110.0/mathlive.min.js"></script>
<style>
:root{--navy:#1B3A6B;--navy-2:#122A50;--sky:#2F7FD8;--sky-tint:#E7F0FB;--ink:#1E2430;--muted:#5F6B7A;--rule:#D8DFE8;--paper:#FFFFFF;--bg:#EEF3F9;
--got:#1F9D55;--got-tint:#E3F5EA;--part:#E09B12;--part-tint:#FCF1D6;--miss:#D64545;--miss-tint:#FBE4E4;
--t1:#1B3A6B;--t2:#0E7C86;--t3:#C4552F;--t4:#6A4C93;--t5:#2A9D5C;--t6:#D48A00;--t7:#2F7FD8;--t8:#B23A48;
--sans:"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font:inherit;cursor:pointer}
header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 2px 0 var(--sky)}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{opacity:.85;font-size:14px}
header .tools{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header .saved{font-size:13px;opacity:.85}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--navy);padding:7px 13px;border-radius:6px;font-size:14px;font-weight:600}
.btn:hover{background:var(--sky-tint)}
header .btn{border-color:rgba(255,255,255,.35);background:transparent;color:#fff}
header .btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn:focus-visible,input:focus-visible,label:focus-within{outline:3px solid #9CC2F1;outline-offset:2px}
.layout{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 60px)}
nav{background:var(--paper);border-right:1px solid var(--rule);padding:14px 0 40px;overflow-y:auto;position:sticky;top:0;height:100vh}
nav .lead{padding:0 20px 10px;font-size:14px;color:var(--muted)}
nav .lead strong{color:var(--ink)}
nav h2{font-size:14px;margin:12px 20px 2px;padding:8px 0 4px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:8px}
nav h2:first-of-type{border-top:0;padding-top:0}
nav h2 .sw{width:12px;height:12px;border-radius:3px;background:var(--tc)}
.crit{display:grid;grid-template-columns:44px 1fr 74px;gap:8px;align-items:start;width:100%;text-align:left;border:0;background:none;padding:7px 20px;color:var(--ink);font-size:13.5px;line-height:1.35;border-left:4px solid transparent}
.crit:hover{background:var(--sky-tint)}
.crit.active{background:var(--sky-tint);border-left-color:var(--tc)}
.crit .code{font-weight:700;color:var(--tc);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:2px;margin-top:5px}
.seg i{display:block;height:8px;flex:1;background:var(--rule);border-radius:2px}
.seg i.m-got{background:var(--got)}.seg i.m-part{background:var(--part)}.seg i.m-miss{background:var(--miss)}
main{padding:24px 32px 80px;max-width:880px}
.home h2{font-size:26px;margin:0 0 6px;color:var(--navy)}
.home p{max-width:640px;color:var(--muted)}
.overall{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;margin:18px 0}
.overall .row{display:flex;align-items:center;gap:12px;font-size:14px;margin-bottom:6px}
.overall .bar{flex:1;height:14px;background:var(--rule);border-radius:7px;overflow:hidden;display:flex}
.overall .bar i{display:block;height:100%}
.overall .bar .g{background:var(--got)}.overall .bar .p{background:var(--part)}.overall .bar .m{background:var(--miss)}
.overall .key{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px}
.overall .key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:18px 0}
.tcard{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;border-top:4px solid var(--tc);text-align:left;color:var(--ink)}
.tcard:hover{border-color:var(--tc)}
.tcard .tn{font-weight:700;font-size:15px;color:var(--tc)}
.tcard .tt{font-size:14px;margin:2px 0 8px}
.tcard .bar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;display:flex}
.tcard .bar i{display:block;height:100%}
.tcard .bar .g{background:var(--got)}.tcard .bar .p{background:var(--part)}.tcard .bar .m{background:var(--miss)}
.tcard .tc2{font-size:12.5px;color:var(--muted);margin-top:6px}
.todo{margin-top:18px}
.todo h3{font-size:16px;margin:0 0 8px;color:var(--navy)}
.todo button{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:9px 14px;margin-bottom:6px;color:var(--ink);border-left:4px solid var(--tc)}
.todo button:hover{background:var(--sky-tint)}
.todo .code{color:var(--tc);font-weight:700;margin-right:8px}
.crit-head{margin-bottom:16px;padding-left:14px;border-left:5px solid var(--tc)}
.crit-head .code{color:var(--tc);font-weight:700;font-size:14px}
.crit-head h2{font-size:23px;margin:2px 0 4px;line-height:1.25;color:var(--navy)}
.crit-head .topic{color:var(--muted);font-size:14px}
.intro{background:var(--sky-tint);border:1px solid #CFE0F5;border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:15px}
.intro img{display:block;max-width:100%;width:440px;margin:6px auto;background:#fff;border-radius:4px}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px 20px 14px;margin-bottom:14px;border-left:5px solid var(--rule)}
.q.m-got{border-left-color:var(--got)}.q.m-part{border-left-color:var(--part)}.q.m-miss{border-left-color:var(--miss)}
.qh{display:flex;gap:12px;align-items:center}
.qh .code{font-weight:700;color:var(--navy);font-size:15px}
.qh .marks{margin-left:auto;background:var(--navy);color:#fff;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap}
.qt{font-size:16.5px;line-height:1.55;margin:8px 0 10px}
.part{font-size:16.5px;margin:8px 0 4px 18px;display:flex;gap:12px}
.part .pm{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;align-self:center}
.q img{display:block;max-width:100%;width:420px;margin:8px auto}
.opts{list-style:none;padding:0;margin:8px 0}
.opts label{display:flex;gap:12px;padding:8px 10px;border-radius:6px;font-size:16px;cursor:pointer;align-items:center;border:1px solid transparent}
.opts label:hover{background:var(--sky-tint)}
.opts label.correct{background:var(--got-tint);border-color:var(--got)}.opts label.wrong{background:var(--miss-tint);border-color:var(--miss)}
.opts input{accent-color:var(--navy)}
.opts .let{font-weight:700;color:var(--navy);flex:0 0 22px}
.opts label span:last-child{flex:1}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:8px 0}
.nums label{display:block;font-size:13.5px;color:var(--muted);font-weight:600}
.nums input{display:block;width:100%;margin-top:3px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font:inherit;font-size:15px;background:#fff;font-weight:400}
.nums math-field{display:block;width:100%;margin-top:3px;padding:4px 8px;border:1px solid var(--rule);border-radius:6px;font-size:17px;background:#fff;--caret-color:var(--navy);--selection-background-color:var(--sky-tint)}
.nums math-field:focus-within{outline:3px solid #9CC2F1;outline-offset:2px}
.nums math-field.ok{border-color:var(--got);background:var(--got-tint)}.nums math-field.bad{border-color:var(--miss);background:var(--miss-tint)}
.nums math-field::part(menu-toggle){display:none}
.nums .preview{display:block;min-height:22px;margin-top:4px;color:var(--navy);font-size:15px}
.nums input.ok{border-color:var(--got);background:var(--got-tint)}.nums input.bad{border-color:var(--miss);background:var(--miss-tint)}
.katex{font-size:1.02em}
.hint{font-size:13px;color:var(--muted);margin:4px 0 10px}
.typed{margin:10px 0 2px}
.typed textarea{display:block;width:100%;min-height:96px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font:inherit;font-size:15px;line-height:1.45;background:#fff;resize:vertical}
.typed textarea:focus-visible{outline:3px solid #9CC2F1;outline-offset:2px}
.typed .tnote{font-size:12.5px;color:var(--muted);margin-top:4px}
.note-btn{margin-left:auto}
.note-btn.has{border-color:var(--part);color:#8a5d00;background:var(--part-tint)}
.note-btn.has::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--part);margin-right:6px;vertical-align:middle}
.note{margin:8px 0 2px}
.note textarea{display:block;width:100%;min-height:52px;padding:7px 10px;border:1px solid #EAD9A6;border-radius:6px;font:inherit;font-size:14px;line-height:1.4;background:#FFFBEC;resize:vertical}
.note textarea:focus-visible{outline:3px solid #9CC2F1;outline-offset:2px}
.actions .verdict{flex-basis:100%}
.sk{margin:8px auto;width:420px;max-width:100%}
.sk.pad{width:100%;margin:6px 0 2px}
.sk.pad canvas{border:1px solid var(--rule);border-radius:6px}
.sk img,.sk canvas{display:block;width:100%;max-width:100%;margin:0 auto}
.sk canvas.editing{cursor:crosshair;touch-action:none;outline:2px dashed var(--sky);outline-offset:2px}
.skbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.skbar button{font-size:12.5px;padding:4px 11px;border:1px solid var(--rule);border-radius:14px;background:#fff;color:var(--ink);font-weight:600}
.skbar button:hover{background:var(--sky-tint)}
.skbar button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.calc{position:fixed;right:24px;bottom:24px;width:360px;max-width:calc(100vw - 20px);background:var(--paper);border:1px solid var(--rule);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:50;font-size:14px}
.calc-h{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;background:var(--navy);color:#fff;border-radius:10px 10px 0 0;cursor:move;user-select:none;touch-action:none}
.calc-t{font-weight:700}
.calc-mode{margin-left:auto;display:flex;gap:2px}
.calc-mode button{font-size:12px;padding:3px 8px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:4px}
.calc-mode button.on{background:#fff;color:var(--navy)}
.calc-x{border:0;background:transparent;color:#fff;font-size:20px;line-height:1;padding:0 4px}
.calc-in{padding:10px 12px 4px}
.calc-in math-field{display:block;width:100%;font-size:19px;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:#fff;--caret-color:var(--navy)}
.calc-in math-field::part(menu-toggle){display:none}
.calc-in input{display:block;width:100%;font:inherit;font-size:16px;padding:8px;border:1px solid var(--rule);border-radius:6px}
.calc-res{min-height:26px;padding:0 14px 6px;font-size:17px;color:var(--navy)}
.calc-res.err{font-size:13px;color:var(--miss)}
.calc-keys{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:4px 12px 8px}
.calc-keys button{font-size:13.5px;padding:7px 2px;border:1px solid var(--rule);border-radius:6px;background:#F7FAFE;color:var(--ink)}
.calc-keys button:hover{background:var(--sky-tint)}
.calc-keys button.eq{grid-column:span 2;background:var(--navy);color:#fff;border-color:var(--navy)}
.calc-note{font-size:12px;color:var(--muted);padding:0 14px 8px}
.calc-hh{display:flex;align-items:center;justify-content:space-between;padding:4px 14px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}
.calc-hclear{font-size:12px;padding:2px 8px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink)}
.calc-hclear:hover{background:var(--miss-tint);border-color:var(--miss)}
.calc-hist{max-height:38px;overflow-y:auto}
.calc-hist .hrow{display:flex;align-items:stretch;border-top:1px solid var(--sky-tint)}
.calc-hist .huse{flex:1;display:flex;justify-content:space-between;gap:10px;min-height:36px;text-align:left;border:0;background:#fff;padding:5px 6px 5px 14px;font-size:13.5px;color:var(--ink);align-items:center}
.calc-hist .huse:hover{background:var(--sky-tint)}
.calc-hist .hdel{border:0;background:#fff;color:var(--muted);font-size:17px;line-height:1;width:32px;opacity:0;cursor:pointer}
.calc-hist .hrow:hover .hdel,.calc-hist .hdel:focus-visible{opacity:1}
.calc-hist .hdel:hover{color:var(--miss);background:var(--miss-tint)}
@media (hover:none){.calc-hist .hdel{opacity:1}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.answer{display:none;margin-top:12px;border-top:2px solid var(--sky-tint);padding:12px 14px 4px;background:#F7FAFE;border-radius:0 0 6px 6px;font-size:15.5px;color:#123}
.answer.open{display:block}
.answer p{margin:0 0 6px}
.answer p:first-child::before{content:"Answer";display:block;font-size:12px;font-weight:700;color:var(--sky);letter-spacing:.3px;margin-bottom:4px}
.answer img{width:360px;margin:6px 0;background:#fff}
.selfmark{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;font-size:14px;color:var(--muted)}
.selfmark button{border:1px solid var(--rule);background:#fff;border-radius:20px;padding:6px 15px;font-size:14px;color:var(--ink);font-weight:600}
.selfmark button.m-got:hover{background:var(--got-tint);border-color:var(--got)}.selfmark button.m-part:hover{background:var(--part-tint);border-color:var(--part)}.selfmark button.m-miss:hover{background:var(--miss-tint);border-color:var(--miss)}
.selfmark button.m-got.on{background:var(--got);border-color:var(--got);color:#fff}
.selfmark button.m-part.on{background:var(--part);border-color:var(--part);color:#fff}
.selfmark button.m-miss.on{background:var(--miss);border-color:var(--miss);color:#fff}
.selfmark .similar{margin-left:auto;border-color:var(--sky);color:var(--sky);background:#fff}
.selfmark .similar:hover{background:var(--sky-tint)}
.selfmark .similar + .similar{margin-left:0}
.vtag{font-weight:600;color:var(--sky);font-size:12.5px;margin-left:6px}
.verdict{font-size:14px;font-weight:600}
.verdict.ok{color:var(--got)}.verdict.no{color:var(--miss)}
.constants{display:none;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;font-size:14.5px;margin-bottom:18px}
.constants.open{display:block}
.constants .ct{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.constants .cc{display:inline-block;margin:2px 18px 2px 0}
.menu-toggle{display:none}
.back{display:none}
@media (max-width:860px){
  .layout{display:block}
  nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule)}
  nav.hidden{display:none}
  main{padding:18px 14px 60px}
  .menu-toggle{display:inline-block}
  .back{display:inline-block;margin-bottom:12px}
  .crit{grid-template-columns:40px 1fr 60px}
}
</style>
</head>

<header>

    <button class="btn" id="homeBtn">Back to home</button>

    <button class="btn" id="resetBtn">Reset progress</button>

</header>
<div class="layout">

<script>
const DATA = {"topics":["Newton's Laws of Motion","Newton's Second Law Scenarios","Momentum and Impulse"],"bank":[{"code":"1.1","topic":1,"title":"Recognise which of Newton's laws of motion best applies to a given scenario","intro":null,"questions":[{"code":"1.1 Q1","crit":"1.1","type":"sa","marks":4,"text":"For each of the following, state which of Newton's laws of motion best explains the observation, and give a one-line reason.","parts":[{"text":"a.  A book stays at rest on a table until it is pushed.","marks":1},{"text":"b.  A rocket rises as it pushes exhaust gas downward.","marks":1},{"text":"c.  A cricket ball speeds up while the bat is in contact with it.","marks":1},{"text":"d.  Passengers lurch forward when a bus brakes suddenly.","marks":1}],"answer":{"lines":["a. First law: with zero net force the book stays at rest; it changes its motion only when a net force (the push) acts (1).","b. Third law: the rocket pushes the gas down (F_{on gas by rocket}) and the gas pushes the rocket up with an equal and opposite force (F_{on rocket by gas}) (1).","c. Second law: the net force from the bat produces an acceleration, a = ΣF/m (1).","d. First law: the passengers keep moving at their original velocity while the bus slows beneath them (1)."]},"diag":true,"orig":"1.1 Q1"},{"code":"1.1 Q2","crit":"1.1","type":"mc","marks":1,"text":"The same net force is applied to a car and to a truck. The truck's acceleration is smaller. This is best explained by","options":["conservation of momentum","Newton's second law, because acceleration is inversely proportional to mass","Newton's third law, because the truck pushes back harder","Newton's first law, because the truck has more inertia at rest"],"answer":{"lines":["B. a = ΣF/m: for the same net force, a larger mass gives a smaller acceleration."]},"orig":"1.1 Q2"},{"code":"1.1 Q3","crit":"1.1","type":"sa","marks":2,"text":"A passenger standing in a bus lurches forward when the bus brakes suddenly. Explain this using Newton's first law.","answer":{"lines":["With no net force on the passenger, Newton's first law says the passenger continues moving at the original constant velocity (1). The bus decelerates beneath the passenger, so the passenger keeps moving forward relative to the bus until friction from the floor or a handrail provides a backward force to slow them (1)."]},"orig":"1.1 Q3"},{"code":"1.1 Q4","crit":"1.1","type":"sa","marks":2,"text":"A swimmer pushes backward on the water with their hands and feet and moves forward. State which of Newton's laws explains this and explain how.","answer":{"lines":["Newton's third law: the swimmer exerts a backward force on the water, F_{on water by swimmer}, so the water exerts an equal and opposite forward force on the swimmer, F_{on swimmer by water} (1). This forward force from the water is the net force that accelerates the swimmer forward (1)."]},"orig":"1.1 Q4"}]},{"code":"1.2","topic":1,"title":"Draw a free-body diagram with forces to scale","intro":null,"questions":[{"code":"1.2 Q1","crit":"1.2","type":"sa","marks":2,"text":"A box is pushed to the right across a rough floor by a horizontal force and is speeding up, as shown. Draw and label all the real forces acting on the box.","img":"q14_box","answer":{"lines":["F_{g} downward and F_{N} upward, drawn equal in length (the box does not accelerate vertically), plus the push to the right and friction to the left (1). The push is drawn longer than friction because the box accelerates to the right; no net-force or motion arrow is drawn (1)."],"img":"sol_14_box"},"diag":true,"orig":"1.2 Q1"},{"code":"1.2 Q2","crit":"1.2","type":"mc","marks":1,"text":"A car turns a corner on a flat road at constant speed. Which of the following should NOT appear on a diagram of the real forces acting on the car?","options":["The normal force from the road","Friction from the road on the tyres","The force due to gravity","A centripetal force"],"answer":{"lines":["D. Centripetal force is the name for the net force needed for circular motion, not a separate real force; here it is provided by the sideways friction on the tyres. Gravity, the normal force and friction are the real forces."]},"orig":"1.2 Q2"},{"code":"1.2 Q3","crit":"1.2","type":"sa","marks":3,"text":"Draw and label the real forces acting on each of the following.","img":"q12_two","parts":[{"text":"a.  A parachutist falling at constant velocity.","marks":1},{"text":"b.  A tennis ball moving upward just after it has been hit, with air resistance acting.","marks":2}],"answer":{"lines":["a. F_{g} downward and air resistance upward, equal in length because the velocity is constant (1).","b. F_{g} downward and air resistance downward, because air resistance opposes the (upward) motion (1). No force from the racquet is drawn: the racquet is no longer in contact, and a motion arrow is not a force (1)."],"img":"sol_14_ball"},"orig":"1.2 Q4"},{"code":"1.2 Q4","crit":"1.2","type":"sa","marks":2,"text":"A skier slides down a slope with friction acting. Draw and label the real forces acting on the skier.","img":"q12_skier","answer":{"lines":["F_{g} vertically downward, F_{N} perpendicular to the slope surface, and friction along the slope pointing up the slope (opposing the motion) (1). F_{N} is drawn shorter than F_{g}, since it balances only the component mg cos θ; no net-force or motion arrow is drawn (1)."],"img":"sol_14_skier"},"orig":"1.2 Q5"}]},{"code":"1.3","topic":1,"title":"Determine an unknown force (including the force due to gravity, F_{g} = mg) or the acceleration of an object that is accelerating or moving at constant velocity when several forces act on it","intro":{"text":"Throughout this bank friction and air resistance are given as total force values. g = 9.81 m s^{–2}."},"questions":[{"code":"1.3 Q1","crit":"1.3","type":"sa","marks":3,"text":"A 1200 kg car accelerates at 2.0 m s^{–2} along a straight level road. The total of the resistive forces (friction and air resistance) on the car is 1100 N. Calculate the net force on the car and the driving force.","num":[["ΣF (N)",2400],["F_{driving} (N)",3500]],"answer":{"lines":["ΣF = ma = 1200 × 2.0 = 2400 N forward (1). The net force is the driving force minus the resistive forces: F_{driving} – 1100 = 2400 (1). F_{driving} = 3.5 × 10^{3} N forward (1)."]},"diag":true,"orig":"1.3 Q1"},{"code":"1.3 Q2","crit":"1.3","type":"mc","marks":1,"text":"A car travels along a straight level road at a constant velocity of 100 km h^{–1}. Which of the following is correct?","options":["No forces act on the car","The driving force is equal in size to the total resistive force","There is a net force in the direction of motion","The driving force is larger than the resistive forces because the car is moving"],"answer":{"lines":["B. Constant velocity means zero net force, so the driving force exactly balances the total resistive force. A net forward force would make the car accelerate."]},"orig":"1.3 Q2"},{"code":"1.3 Q3","crit":"1.3","type":"sa","marks":3,"text":"A 900 kg car travelling at 20 m s^{–1} brakes uniformly to rest over a distance of 50 m. Calculate the acceleration of the car and the net force acting on it during braking.","num":[["size of a (m/s²)",4],["size of ΣF (N)",3600]],"answer":{"lines":["v^{2} = u^{2} + 2as, so a = (0 – 20^{2})/(2 × 50) = –4.0 m s^{–2}, that is 4.0 m s^{–2} opposite to the motion (1). ΣF = ma = 900 × 4.0 (1) = 3.6 × 10^{3} N, directed opposite to the motion (1)."]},"orig":"1.3 Q7"},{"code":"1.3 Q4","crit":"1.3","type":"sa","marks":3,"text":"A 20 kg sled is pulled along level snow by two horizontal ropes, one with a force of 60 N and the other with a force of 45 N, both in the direction of motion. The sled moves at a constant velocity. Calculate the friction force on the sled, and the acceleration if the friction force then drops to 80 N.","img":"q13_sled","num":[["F_{friction} (N)",105],["a (m/s²)",1.25]],"answer":{"lines":["At constant velocity ΣF = 0, so friction balances the two pulls: F_{friction} = 60 + 45 = 105 N, opposing the motion (1). With friction at 80 N: ΣF = 105 – 80 = 25 N forward (1). a = ΣF/m = 25/20 = 1.3 m s^{–2} forward (1)."]},"orig":"1.3 Q9"},{"code":"1.3 Q5","crit":"1.3","type":"sa","marks":3,"text":"A model rocket of mass 0.80 kg is launched vertically, as shown. Its engine provides a thrust of 25 N upward and air resistance on the rocket is 3.0 N. Calculate the net force on the rocket and its acceleration just after launch.","img":"q11_rocket","num":[["ΣF (N)",14.152000000000001],["a (m/s²)",17.69]],"answer":{"lines":["F_{g} = mg = 0.80 × 9.81 = 7.85 N downward (1). ΣF = 25 – 7.85 – 3.0 = 14.2 N upward (1). a = ΣF/m = 14.2/0.80 = 18 m s^{–2} upward (1)."]},"orig":"1.3 Q10"}]},{"code":"1.4","topic":1,"title":"Identify action-reaction pairs using the force format F_{on B by A} and F_{on A by B}, and explain why the normal reaction force and the force due to gravity are not an action-reaction pair","intro":null,"questions":[{"code":"1.4 Q1","crit":"1.4","type":"sa","marks":3,"text":"For each force, write down its Newton's third law pair using the F_{on A by B} notation and state the direction of the pair force.","parts":[{"text":"a.  F_{on ball by bat}, directed forward.","marks":1},{"text":"b.  F_{on Moon by Earth}, the gravitational pull toward Earth.","marks":1},{"text":"c.  F_{on floor by person}, a person standing on the floor.","marks":1}],"answer":{"lines":["a. F_{on bat by ball}, directed backward, equal in size (1).","b. F_{on Earth by Moon}, a gravitational force on Earth directed toward the Moon, equal in size (1).","c. F_{on person by floor}, the normal force, directed upward, equal in size (1)."]},"diag":true,"orig":"1.4 Q1"},{"code":"1.4 Q2","crit":"1.4","type":"mc","marks":1,"text":"As a car accelerates, its tyres push backward on the road. The Newton's third law pair to this force is","options":["the road pushing forward on the tyres","the air resistance on the car","the normal force of the road on the car","the force due to gravity on the car"],"answer":{"lines":["A. F_{on road by tyres} (backward) pairs with F_{on tyres by road} (forward); the pair has the same type (friction), the same size and opposite direction, and acts on the other object."]},"orig":"1.4 Q2"},{"code":"1.4 Q3","crit":"1.4","type":"sa","marks":3,"text":"A 60 kg student stands on the ground. The gravitational force on the student is F_{on student by Earth}.","num":[["a. F (N)",588.6],["b. a (m/s²)",9.85929648241206e-23,0.05]],"parts":[{"text":"a.  Identify the Newton's third law pair to this force and state its size and direction.","marks":2},{"text":"b.  Explain why Earth's acceleration due to this force is not noticed.","marks":1}],"answer":{"lines":["a. F_{on Earth by student}, a gravitational force on Earth directed toward the student (upward) (1), of size mg = 60 × 9.81 = 5.9 × 10^{2} N (1).","b. a = F/M_{E} = 589/5.97 × 10^{24} ≈ 1 × 10^{–22} m s^{–2}; Earth's mass is so large that its acceleration is immeasurably small (1)."]},"orig":"1.4 Q4"},{"code":"1.4 Q4","crit":"1.4","type":"sa","marks":2,"text":"A horse pulls a cart. A student argues that because the cart pulls back on the horse with an equal and opposite force, the pair can never move. Explain the error in this argument.","answer":{"lines":["F_{on cart by horse} and F_{on horse by cart} act on different objects, so they never cancel each other; each object's motion depends only on the net force on that object (1). The cart accelerates because F_{on cart by horse} exceeds friction on the cart, and the horse accelerates because the forward push of the ground on its hooves exceeds the backward pull of the cart (1)."]},"orig":"1.4 Q5"},{"code":"1.4 Q5","crit":"1.4","type":"sa","marks":3,"text":"A book rests on a table.","parts":[{"text":"a.  Identify the Newton's third law pair to the normal force on the book by the table, giving its direction.","marks":1},{"text":"b.  Explain why F_{on book by Earth} and F_{on book by table} are not a Newton's third law pair, even though they are equal and opposite.","marks":2}],"answer":{"lines":["a. F_{on table by book}: the book pushes down on the table with a force equal in size to the normal force (1).","b. Third law pairs act on different objects and are the same type of force, whereas both of these forces act on the same object, the book, and one is a gravitational force while the other is a contact force (1). They are equal and opposite only because the book is in equilibrium (Newton's first law); if the table were accelerating upward they would not be equal (1)."],"img":"sol_15_book"},"orig":"1.4 Q6"}]},{"code":"1.5","topic":1,"title":"Calculate the normal reaction force when an object is either not accelerating, accelerating upwards, or accelerating downwards (e.g. elevator)","intro":null,"questions":[{"code":"1.5 Q1","crit":"1.5","type":"sa","marks":3,"text":"A 65 kg person stands in a lift that is accelerating upward at 1.2 m s^{–2}, as shown. Calculate the normal force exerted on the person by the floor of the lift.","img":"q13_lift","num":[["F_{N} (N)",715.65]],"answer":{"lines":["Taking up as positive, ΣF = ma: F_{N} – mg = ma (1). F_{N} = m(g + a) = 65 × (9.81 + 1.2) (1) = 7.2 × 10^{2} N (1)."]},"diag":true,"orig":"1.5 Q1"},{"code":"1.5 Q2","crit":"1.5","type":"mc","marks":1,"text":"A person stands on bathroom scales in a lift. The reading on the scales is less than the person's weight when the lift is","options":["moving downward at constant velocity","moving upward at constant velocity","moving upward and slowing down","moving downward and slowing down"],"answer":{"lines":["C. The reading is F_{N} = m(g – a) when the acceleration is downward. Moving upward and slowing down means the acceleration is downward. At constant velocity the reading equals the weight, and slowing while moving down means the acceleration is upward."]},"orig":"1.5 Q2"},{"code":"1.5 Q3","crit":"1.5","type":"sa","marks":3,"text":"An 80 kg person stands in a lift that is moving downward and slowing down at 2.0 m s^{–2}. Calculate the normal force on the person.","num":[["F_{N} (N)",944.8000000000001]],"answer":{"lines":["The lift is slowing while moving down, so its acceleration is upward (1). F_{N} = m(g + a) = 80 × (9.81 + 2.0) (1) = 9.4 × 10^{2} N (1)."]},"orig":"1.5 Q4"},{"code":"1.5 Q4","crit":"1.5","type":"sa","marks":3,"text":"A 60 kg student stands on scales in a lift. The scales read 540 N. Determine the magnitude and direction of the acceleration of the lift.","num":[["a (m/s²)",0.8100000000000005]],"answer":{"lines":["The weight is mg = 60 × 9.81 = 589 N, and the reading (F_{N}) is less than this, so the acceleration is downward (1). F_{N} = m(g – a), so a = g – F_{N}/m = 9.81 – 540/60 (1) = 0.81 m s^{–2} downward (1)."]},"orig":"1.5 Q5"},{"code":"1.5 Q5","crit":"1.5","type":"sa","marks":3,"text":"A 50 kg person stands on scales in a lift.","num":[["a. F_{N} (N)",490.5],["b. F_{N} (N)",0,0]],"parts":[{"text":"a.  The lift moves upward at a constant 3.0 m s^{–1}. Calculate the reading on the scales.","marks":1},{"text":"b.  The cable breaks and the lift falls freely. Calculate the reading on the scales and explain why the person feels weightless.","marks":2}],"answer":{"lines":["a. Constant velocity, so F_{N} = mg = 50 × 9.81 = 4.9 × 10^{2} N (1).","b. In free fall a = g downward, so F_{N} = m(g – g) = 0 (1). The person feels weightless because the floor no longer pushes on them; the sensation of weight comes from the normal force, not from gravity, which still acts (1)."]},"orig":"1.5 Q6"}]},{"code":"2.1","topic":2,"title":"Determine the acceleration and force on two or three blocks pushed against one another","intro":null,"questions":[{"code":"2.1 Q1","crit":"2.1","type":"sa","marks":4,"text":"A 2.0 kg block A and a 3.0 kg block B are in contact on a frictionless horizontal surface, as shown. A horizontal force of 10 N pushes on block A.","img":"q21_blocks","num":[["a. a (m/s²)",2],["b. F_{on B by A} (N)",6],["c. F_{on A by B} (N)",6]],"parts":[{"text":"a.  Calculate the acceleration of the blocks.","marks":1},{"text":"b.  Calculate the force on block B by block A.","marks":2},{"text":"c.  State the force on block A by block B.","marks":1}],"answer":{"lines":["a. The blocks move together: a = F/(m_{A} + m_{B}) = 10/5.0 = 2.0 m s^{–2} (1).","b. The only horizontal force on B is the push from A: ΣF = m_{B}a (1), so F_{on B by A} = 3.0 × 2.0 = 6.0 N forward (1).","c. By Newton's third law F_{on A by B} = 6.0 N backward. (Check on A: 10 – 6.0 = 4.0 N = 2.0 × 2.0.) (1)"]},"diag":true,"orig":"2.1 Q1"},{"code":"2.1 Q2","crit":"2.1","type":"mc","marks":1,"text":"Two blocks of mass 4.0 kg and 6.0 kg are in contact on a frictionless horizontal surface. A horizontal force of 15 N pushes on the 4.0 kg block. The acceleration of the blocks is","options":["3.8 m s^{–2}","1.5 m s^{–2}","15 m s^{–2}","2.5 m s^{–2}"],"answer":{"lines":["B. The blocks move together, so a = F/(m_{1} + m_{2}) = 15/10 = 1.5 m s^{–2}."]},"orig":"2.1 Q2"},{"code":"2.1 Q3","crit":"2.1","type":"sa","marks":4,"text":"Three blocks of mass 1.0 kg, 2.0 kg and 3.0 kg are in contact in a line on a frictionless surface, as shown. A 12 N horizontal force pushes on the 1.0 kg block.","img":"q21_blocks3","num":[["a. a (m/s²)",2],["b. F (N)",6],["c. F (N)",10]],"parts":[{"text":"a.  Calculate the acceleration of the blocks.","marks":1},{"text":"b.  Calculate the force on the 3.0 kg block by the 2.0 kg block.","marks":1},{"text":"c.  Calculate the force on the 2.0 kg block by the 1.0 kg block.","marks":2}],"answer":{"lines":["a. a = 12/(1.0 + 2.0 + 3.0) = 2.0 m s^{–2} (1).","b. The 3.0 kg block is pushed only by the 2.0 kg block: F = 3.0 × 2.0 = 6.0 N (1).","c. The 1.0 kg block pushes on everything ahead of it, the 2.0 kg and 3.0 kg blocks together (1): F = (2.0 + 3.0) × 2.0 = 10 N (1)."]},"orig":"2.1 Q3"},{"code":"2.1 Q4","crit":"2.1","type":"sa","marks":3,"text":"A 1.5 kg block A and a 2.5 kg block B are in contact on a frictionless surface and pushed by a 10 N force applied to block A, with B ahead of A.","img":"q21_blocks_gen","num":[["a. contact force (N)",6.25],["b. F (N)",3.75]],"parts":[{"text":"a.  Explain why the contact force between the blocks is smaller than the 10 N push, and calculate it.","marks":2},{"text":"b.  State the contact force between the blocks if the 10 N force is instead applied to block B, pushing the pair the other way.","marks":1}],"answer":{"lines":["a. The 10 N push has to accelerate the total mass of 4.0 kg, but the contact force only has to accelerate the block ahead of the push (1). a = 10/4.0 = 2.5 m s^{–2}, so the contact force is m_{B}a = 2.5 × 2.5 = 6.3 N; the remaining 3.7 N accelerates block A itself (1).","b. The contact force now accelerates only the 1.5 kg block: F = 1.5 × 2.5 = 3.8 N (1)."]},"orig":"2.1 Q4"}]},{"code":"2.2","topic":2,"title":"Determine the acceleration and tension on a pulley system (mass freely hanging off a table via a pulley cable attached to another mass on a frictionless surface)","intro":null,"questions":[{"code":"2.2 Q1","crit":"2.2","type":"sa","marks":4,"text":"A 4.0 kg trolley on a frictionless horizontal bench is connected by a light string over a frictionless pulley to a 2.0 kg mass hanging freely, as shown.","img":"q2_pulley","num":[["a. a (m/s²)",3.27],["b. T (N)",13.08]],"parts":[{"text":"a.  Calculate the acceleration of the system when it is released.","marks":2},{"text":"b.  Calculate the tension in the string.","marks":2}],"answer":{"lines":["a. The driving force is the weight of the hanging mass, F_{driving} = 2.0 × 9.81 = 19.6 N, and the whole system accelerates together (1): a = F_{driving}/(m_{1} + m_{2}) = 19.6/6.0 = 3.3 m s^{–2} (1).","b. Apply ΣF = ma to the trolley, on which the tension is the only horizontal force (1): T = m_{1}a = 4.0 × 3.27 = 13 N. (Check with the hanging mass: mg – T = ma gives T = 2.0 × (9.81 – 3.27) = 13 N.) (1)"]},"diag":true,"orig":"2.2 Q1"},{"code":"2.2 Q2","crit":"2.2","type":"mc","marks":1,"text":"A mass hangs from a string that passes over a pulley to a trolley on a frictionless bench. While the system accelerates, the tension in the string is","options":["less than the weight of the hanging mass, because the hanging mass accelerates downward","greater than the weight of the hanging mass","equal to the weight of the hanging mass","zero, because the bench is frictionless"],"answer":{"lines":["A. The hanging mass accelerates downward, so mg – T = ma and T is less than mg; the tension is what accelerates the trolley."]},"orig":"2.2 Q2"},{"code":"2.2 Q3","crit":"2.2","type":"sa","marks":4,"text":"A 3.0 kg trolley on a horizontal bench is connected by a light string over a frictionless pulley to a 1.5 kg hanging mass, as shown. A friction force of 4.0 N acts on the trolley.","img":"q2_pulley_fric","num":[["a. a (m/s²)",2.381111111111111],["b. T (N)",11.143333333333333]],"parts":[{"text":"a.  Calculate the acceleration of the system.","marks":2},{"text":"b.  Calculate the tension in the string.","marks":2}],"answer":{"lines":["a. F_{driving} = 1.5 × 9.81 = 14.7 N (1). a = (F_{driving} – ΣF_{resistive})/(m_{1} + m_{2}) = (14.7 – 4.0)/4.5 = 2.4 m s^{–2} (1).","b. For the trolley: T – 4.0 = 3.0 × 2.38 (1), so T = 7.1 + 4.0 = 11 N (1)."]},"orig":"2.2 Q3"},{"code":"2.2 Q4","crit":"2.2","type":"sa","marks":3,"text":"Two masses, 3.0 kg and 5.0 kg, hang from the ends of a light string passing over a frictionless pulley, as shown. Calculate the acceleration of the masses and the tension in the string when the system is released.","img":"q2_atwood","num":[["a (m/s²)",2.4525],["T (N)",36.7875]],"answer":{"lines":["The driving force is the difference in the weights: a = (5.0 – 3.0) × 9.81/(5.0 + 3.0) = 2.45 m s^{–2} (1). Apply ΣF = ma to the 3.0 kg mass, which accelerates upward: T – mg = ma (1), so T = 3.0 × (9.81 + 2.45) = 37 N (1)."]},"orig":"2.2 Q4"}]},{"code":"2.3","topic":2,"title":"Determine the acceleration and tension on a connected horizontally moving system (e.g. train carriage)","intro":null,"questions":[{"code":"2.3 Q1","crit":"2.3","type":"sa","marks":4,"text":"A 1200 kg van tows a 400 kg trailer along a level road, as shown. The driving force on the van is 2800 N. Resistive forces are 300 N on the van and 100 N on the trailer.","img":"q2_van","num":[["a. a (m/s²)",1.5],["b. T (N)",700]],"parts":[{"text":"a.  Calculate the acceleration of the van and trailer.","marks":2},{"text":"b.  Calculate the tension in the coupling between the van and the trailer.","marks":2}],"answer":{"lines":["a. a = (F_{driving} – ΣF_{resistive})/(m_{1} + m_{2}) = (2800 – 400)/(1200 + 400) (1) = 1.5 m s^{–2} (1).","b. Apply ΣF = ma to the trailer only: T – 100 = 400 × 1.5 (1), so T = 700 N (1)."]},"diag":true,"orig":"2.3 Q1"},{"code":"2.3 Q2","crit":"2.3","type":"mc","marks":1,"text":"A 3.0 kg block and a 1.0 kg block are connected by a light string on a frictionless horizontal surface. A horizontal force of 8.0 N pulls the 3.0 kg block to the right, as shown, so that the 1.0 kg block trails behind it. The tension in the string is","img":"q2_blocks","options":["6.0 N","8.0 N","2.0 N","4.0 N"],"answer":{"lines":["C. a = 8.0/4.0 = 2.0 m s^{–2} for the system; the tension is the only horizontal force on the 1.0 kg block, so T = 1.0 × 2.0 = 2.0 N."]},"orig":"2.3 Q2"},{"code":"2.3 Q3","crit":"2.3","type":"sa","marks":3,"text":"A locomotive of mass 5.0 × 10^{4} kg pulls three carriages, each of mass 2.0 × 10^{4} kg, along a level track. The driving force on the locomotive is 1.2 × 10^{5} N and the total resistive force on the whole train is 2.0 × 10^{4} N. Calculate the acceleration of the train.","img":"q2_train3","num":[["a (m/s²)",0.9090909090909091]],"answer":{"lines":["Total mass = 5.0 × 10^{4} + 3 × 2.0 × 10^{4} = 1.1 × 10^{5} kg (1). a = (F_{driving} – ΣF_{resistive})/m_{total} = (1.2 × 10^{5} – 2.0 × 10^{4})/1.1 × 10^{5} (1) = 0.91 m s^{–2} (1)."]},"orig":"2.3 Q3"},{"code":"2.3 Q4","crit":"2.3","type":"sa","marks":3,"text":"A locomotive pulls two carriages, A and B, as shown. Each carriage has a mass of 2.0 × 10^{4} kg and experiences a resistive force of 2000 N. The train accelerates at 0.50 m s^{–2}. Calculate the tension in the coupling between carriages A and B, and the tension in the coupling between the locomotive and carriage A.","img":"q2_train","num":[["T_{AB} (N)",12000],["T_{LA} (N)",24000]],"answer":{"lines":["Carriage B (last): T_{AB} – 2000 = 2.0 × 10^{4} × 0.50, so T_{AB} = 1.2 × 10^{4} N (1). Carriage A: T_{LA} – T_{AB} – 2000 = 2.0 × 10^{4} × 0.50 (1), so T_{LA} = 1.0 × 10^{4} + 1.2 × 10^{4} + 2000 = 2.4 × 10^{4} N (1)."]},"orig":"2.3 Q4"}]},{"code":"2.4","topic":2,"title":"Determine the component of force due to gravity down the slope (F_{gx} = mg sin θ) and the normal force (F_{N} = mg cos θ) for a block on an inclined plane","intro":null,"questions":[{"code":"2.4 Q1","crit":"2.4","type":"sa","marks":2,"text":"A 12 kg box rests on a slope inclined at 30° to the horizontal, as shown. Calculate the components of the force due to gravity on the box along the slope and perpendicular to the slope.","img":"q3_incline","num":[["component along slope (N)",58.85999999999999],["component into slope (N)",101.94851053350412]],"answer":{"lines":["Along the slope: mg sin θ = 12 × 9.81 × sin 30° = 59 N, directed down the slope (1). Perpendicular to the slope: mg cos θ = 12 × 9.81 × cos 30° = 1.0 × 10^{2} N, directed into the slope (1)."],"img":"sol_31_components"},"diag":true,"orig":"2.4 Q1"},{"code":"2.4 Q2","crit":"2.4","type":"mc","marks":1,"text":"As the angle of a slope is increased, the component of the force due to gravity on an object along the slope","options":["decreases, and the component perpendicular to the slope increases","increases, and the component perpendicular to the slope decreases","stays the same, since the weight does not change","increases, and the component perpendicular to the slope also increases"],"answer":{"lines":["B. mg sin θ increases with θ while mg cos θ decreases; at 90° the whole weight acts along the (vertical) slope."]},"orig":"2.4 Q2"},{"code":"2.4 Q3","crit":"2.4","type":"sa","marks":3,"text":"A 1200 kg car is parked on a hill inclined at 10°.","img":"q3_incline_gen","num":[["a. F_{N} (N)",11593.156868459713],["b. friction (N)",2044.1863474951037]],"parts":[{"text":"a.  Calculate the normal force on the car.","marks":2},{"text":"b.  Calculate the friction force needed to keep the car stationary.","marks":1}],"answer":{"lines":["a. F_{N} = mg cos θ (1) = 1200 × 9.81 × cos 10° = 1.2 × 10^{4} N (1).","b. Friction balances the component of gravity along the slope: F = mg sin θ = 1200 × 9.81 × sin 10° = 2.0 × 10^{3} N up the slope (1)."]},"orig":"2.4 Q4"},{"code":"2.4 Q4","crit":"2.4","type":"sa","marks":2,"text":"The normal force on a 50 kg block resting on a slope is measured to be 400 N. Calculate the angle of the slope.","img":"q3_incline_gen","num":[["θ (°)",35.36372423829686]],"answer":{"lines":["F_{N} = mg cos θ, so cos θ = 400/(50 × 9.81) = 0.815 (1). θ = 35° (1)."]},"orig":"2.4 Q5"}]},{"code":"2.5","topic":2,"title":"Calculate the acceleration of an object on an inclined plane with or without additional forces (friction, driving force)","intro":null,"questions":[{"code":"2.5 Q1","crit":"2.5","type":"sa","marks":3,"text":"A 65 kg skier is on a frictionless slope inclined at 20° to the horizontal.","img":"q3_incline_gen","num":[["a. component along slope (N)",218.08914439161265],["b. a (m/s²)",3.3552176060248105]],"parts":[{"text":"a.  Calculate the component of the force due to gravity along the slope.","marks":1},{"text":"b.  Calculate the acceleration of the skier down the slope.","marks":2}],"answer":{"lines":["a. mg sin θ = 65 × 9.81 × sin 20° = 2.2 × 10^{2} N (1).","b. With no friction this is the net force along the slope: a = mg sin θ/m = g sin θ (1) = 9.81 × sin 20° = 3.4 m s^{–2} (1)."]},"diag":true,"orig":"2.5 Q1"},{"code":"2.5 Q2","crit":"2.5","type":"mc","marks":1,"text":"A car rolls down a hill at constant speed with its engine off. Which of the following is correct?","options":["There is no friction acting on the car","The resistive forces are larger than mg sin θ","The resistive forces are equal to mg sin θ","The net force on the car acts down the slope"],"answer":{"lines":["C. Constant velocity means zero net force: friction and air resistance (up the slope) exactly balance mg sin θ (down the slope)."]},"orig":"2.5 Q2"},{"code":"2.5 Q3","crit":"2.5","type":"sa","marks":3,"text":"A 2.0 kg trolley on a frictionless slope inclined at 15° is pushed up the slope by a force of 12 N directed along the slope. Calculate the acceleration of the trolley.","img":"q3_incline_push","num":[["a (m/s²)",3.4609851675442713]],"answer":{"lines":["Component of gravity down the slope: mg sin θ = 2.0 × 9.81 × sin 15° = 5.08 N (1). Net force up the slope: ΣF = 12 – 5.08 = 6.92 N (1). a = ΣF/m = 6.92/2.0 = 3.5 m s^{–2} up the slope (1)."]},"orig":"2.5 Q4"},{"code":"2.5 Q4","crit":"2.5","type":"sa","marks":3,"text":"A 25 kg sledge slides down a snow slope inclined at 12° at constant speed.","img":"q3_incline_gen","num":[["a. F_{resistive} (N)",50.99034217305548],["b. a (m/s²)",1.3156039191025906]],"parts":[{"text":"a.  Calculate the total resistive force on the sledge.","marks":2},{"text":"b.  The sledge reaches a steeper section inclined at 20°. Assuming the resistive force is unchanged, calculate the acceleration of the sledge on this section.","marks":1}],"answer":{"lines":["a. Constant speed, so F_{resistive} = mg sin θ (1) = 25 × 9.81 × sin 12° = 51 N (1).","b. a = (mg sin 20° – F_{resistive})/m = (83.9 – 51.0)/25 = 1.3 m s^{–2} down the slope (1)."]},"orig":"2.5 Q6"},{"code":"2.5 Q5","crit":"2.5","type":"sa","marks":2,"text":"A box slides down a rough slope at constant speed. Describe the forces acting on the box and explain how they combine to give zero net force.","img":"q3_incline_gen","answer":{"lines":["Three forces act: F_{g} vertically down, F_{N} perpendicular to the slope and friction up the slope (1). Along the slope, friction balances the component mg sin θ; perpendicular to the slope, F_{N} balances the component mg cos θ; so the net force is zero in both directions and the velocity stays constant (1)."],"img":"sol_32_forces"},"orig":"2.5 Q7"}]},{"code":"2.6","topic":2,"title":"Calculate the tension in each string when an object is suspended by two strings (one horizontal to a wall, one to the ceiling at an angle) using equilibrium: ΣF = 0","intro":{"text":"The angle θ is measured between the ceiling string and the horizontal. At the knot the net force is zero: vertically T_{1} sin θ = mg, horizontally T_{1} cos θ = T_{2}."},"questions":[{"code":"2.6 Q1","crit":"2.6","type":"sa","marks":4,"text":"A 5.0 kg mass hangs at rest from a knot. String 1 runs from the knot to the ceiling at 40° above the horizontal and string 2 runs horizontally from the knot to a wall, as shown. Calculate the tension in each string.","img":"q23_strings","num":[["T_{1} (N)",76.30825370750324],["T_{2} (N)",58.45551371674601]],"answer":{"lines":["The knot is in equilibrium, so the net force is zero in both directions. Vertically only string 1 has a component: T_{1} sin 40° = mg (1). T_{1} = 5.0 × 9.81/sin 40° = 76 N (1). Horizontally the two strings balance: T_{2} = T_{1} cos 40° (1) = 76.3 × cos 40° = 58 N (1)."]},"diag":true,"orig":"2.6 Q1"},{"code":"2.6 Q2","crit":"2.6","type":"mc","marks":1,"text":"An object hangs from a knot held by a horizontal string to a wall and a second string to the ceiling. If the ceiling string is re-attached so that it makes a smaller angle with the horizontal (closer to horizontal), the tension in the ceiling string","options":["stays the same, because the weight has not changed","decreases, because it is now more nearly horizontal","becomes zero","increases, because its vertical component must still balance the weight"],"answer":{"lines":["D. T_{1} sin θ = mg, so as θ decreases T_{1} must increase to keep the same vertical component; the tension in the horizontal string, T_{1} cos θ, also increases."]},"orig":"2.6 Q2"},{"code":"2.6 Q3","crit":"2.6","type":"sa","marks":3,"text":"An object hangs from a knot in the arrangement shown. The string to the ceiling makes an angle of 30° with the horizontal and the tension in the horizontal string is measured to be 30 N. Calculate the tension in the ceiling string and the mass of the object.","img":"q23_strings_gen","num":[["T_{1} (N)",34.64101615137754],["m (kg)",1.7655971534850938]],"answer":{"lines":["Horizontally: T_{1} cos 30° = T_{2}, so T_{1} = 30/cos 30° = 34.6 N (1). Vertically: T_{1} sin 30° = mg, so mg = 34.6 × sin 30° = 17.3 N (1). m = 17.3/9.81 = 1.8 kg (1)."]},"orig":"2.6 Q4"},{"code":"2.6 Q4","crit":"2.6","type":"sa","marks":2,"text":"Draw and label the forces acting on the knot in the arrangement shown, and explain why the ceiling string always has a larger tension than the horizontal string.","img":"q23_strings_gen","answer":{"lines":["Three forces act on the knot: the weight of the hanging object (via the vertical string) downward, T_{2} horizontally toward the wall, and T_{1} along the ceiling string, up and away from the wall; they sum to zero (1). T_{2} = T_{1} cos θ, and cos θ is less than 1 for any angle, so T_{2} is always smaller than T_{1}; the ceiling string carries all of the weight as well as balancing the horizontal string (1)."],"img":"sol_23_forces"},"orig":"2.6 Q5"}]},{"code":"3.1","topic":3,"title":"Calculate the momentum of an object: p = mv","intro":null,"questions":[{"code":"3.1 Q1","crit":"3.1","type":"sa","marks":2,"text":"Calculate the momentum of a 1200 kg car travelling east at 15 m s^{–1}.","num":[["p (kg m/s)",18000]],"answer":{"lines":["p = mv (1) = 1200 × 15 = 1.8 × 10^{4} kg m s^{–1} east (1)."]},"diag":true,"orig":"3.1 Q1"},{"code":"3.1 Q2","crit":"3.1","type":"mc","marks":1,"text":"Which of the following has the greatest momentum?","options":["A 70 kg person walking at 0.30 m s^{–1}","A 0.50 kg ball moving at 40 m s^{–1}","A 1000 kg car rolling at 0.010 m s^{–1}","A 2.0 kg bird flying at 8.0 m s^{–1}"],"answer":{"lines":["A. p = mv: 20, 16, 21 and 10 kg m s^{–1} respectively; the walking person has the most."]},"orig":"3.1 Q2"},{"code":"3.1 Q3","crit":"3.1","type":"sa","marks":3,"text":"Compare the momentum of an 8000 kg truck travelling at 5.0 m s^{–1} with that of a 0.010 kg bullet travelling at 400 m s^{–1}, and calculate the speed at which the truck would have the same momentum as the bullet.","num":[["p_{truck} (kg m/s)",40000],["p_{bullet} (kg m/s)",4],["v (m/s)",0.0005]],"answer":{"lines":["Truck: p = 8000 × 5.0 = 4.0 × 10^{4} kg m s^{–1} (1). Bullet: p = 0.010 × 400 = 4.0 kg m s^{–1}, ten thousand times less (1). For equal momentum v = p/m = 4.0/8000 = 5.0 × 10^{–4} m s^{–1} (1)."]},"orig":"3.1 Q3"}]},{"code":"3.2","topic":3,"title":"Use conservation of momentum to find unknown velocities: m_{1}u_{1} + m_{2}u_{2} = m_{1}v_{1} + m_{2}v_{2} (standard collisions, sticky collisions, explosive collisions)","intro":{"text":"Choose one direction as positive and give every velocity in the other direction a negative sign. Standard collision (the objects separate): m_{1}u_{1} + m_{2}u_{2} = m_{1}v_{1} + m_{2}v_{2}. Sticky collision (the objects move off together): m_{1}u_{1} + m_{2}u_{2} = (m_{1} + m_{2})v. Explosive collision (the objects start together, usually at rest, and fly apart): 0 = m_{1}v_{1} + m_{2}v_{2}."},"questions":[{"code":"3.2 Q1","crit":"3.2","type":"sa","marks":3,"text":"A 1200 kg car travelling at 15 m s^{–1} collides with a stationary 800 kg car, as shown. The two cars lock together. Calculate their common velocity immediately after the collision.","img":"q74_collision","num":[["v (m/s)",9]],"answer":{"lines":["Momentum is conserved: m_{1}u_{1} + m_{2}u_{2} = (m_{1} + m_{2})v (1). 1200 × 15 + 0 = 2000v (1). v = 18000/2000 = 9.0 m s^{–1} in the original direction of the moving car (1)."]},"diag":true,"orig":"3.2 Q1"},{"code":"3.2 Q2","crit":"3.2","type":"mc","marks":1,"text":"The total momentum of two colliding objects is conserved provided that","options":["the objects have equal masses","the objects stick together","the collision is elastic","no net external force acts on the system during the collision"],"answer":{"lines":["D. Momentum is conserved when the net external force on the system is zero; the forces between the objects are internal and cancel by Newton's third law. Kinetic energy need not be conserved."]},"orig":"3.2 Q2"},{"code":"3.2 Q3","crit":"3.2","type":"sa","marks":3,"text":"A 2.0 kg trolley moving at 3.0 m s^{–1} collides with a stationary 1.0 kg trolley. After the collision the 2.0 kg trolley continues in the same direction at 1.0 m s^{–1}. Calculate the velocity of the 1.0 kg trolley after the collision.","img":"q72_trolleys","num":[["v_{2} (m/s)",4]],"answer":{"lines":["m_{1}u_{1} + m_{2}u_{2} = m_{1}v_{1} + m_{2}v_{2} (1): 2.0 × 3.0 + 0 = 2.0 × 1.0 + 1.0 × v_{2} (1). v_{2} = 6.0 – 2.0 = 4.0 m s^{–1} in the original direction of motion (1)."]},"orig":"3.2 Q3"},{"code":"3.2 Q4","crit":"3.2","type":"sa","marks":3,"text":"A 0.20 kg ball moving at 6.0 m s^{–1} strikes a stationary 0.60 kg ball head-on, as shown. After the collision the 0.20 kg ball rebounds along its original line at 3.0 m s^{–1}. Calculate the velocity of the 0.60 kg ball after the collision.","img":"q32_rebound","num":[["v_{2} (m/s)",3]],"answer":{"lines":["Take the original direction of the 0.20 kg ball as positive, so its velocity after the collision is v_{1} = –3.0 m s^{–1} (1). m_{1}u_{1} + m_{2}u_{2} = m_{1}v_{1} + m_{2}v_{2}: 0.20 × 6.0 + 0 = 0.20 × (–3.0) + 0.60 × v_{2} (1). v_{2} = (1.2 + 0.60)/0.60 = 3.0 m s^{–1} in the original direction of the 0.20 kg ball (1)."]},"orig":"3.2 Q4"},{"code":"3.2 Q5","crit":"3.2","type":"sa","marks":3,"text":"A 3.0 kg trolley moving east at 4.0 m s^{–1} collides head-on with a 2.0 kg trolley moving west at 1.0 m s^{–1}, as shown. After the collision the 2.0 kg trolley moves east at 3.0 m s^{–1}. Calculate the velocity of the 3.0 kg trolley after the collision.","img":"q72_headon","num":[["size of v_{1} (m/s)",1.3333333333333333]],"answer":{"lines":["Take east as positive. Total momentum before = 3.0 × 4.0 + 2.0 × (–1.0) = 12 – 2.0 = 10 kg m s^{–1} (1). After: 3.0 × v_{1} + 2.0 × 3.0 = 10 (1). v_{1} = (10 – 6.0)/3.0 = 1.3 m s^{–1} east (1)."]},"orig":"3.2 Q5"},{"code":"3.2 Q6","crit":"3.2","type":"sa","marks":3,"text":"A 0.50 kg ball moving east at 4.0 m s^{–1} collides head-on with a 0.30 kg ball moving west at 2.0 m s^{–1}. The balls stick together. Calculate their velocity after the collision.","img":"q72_headon","num":[["v (m/s)",1.75]],"answer":{"lines":["Take east as positive. Total momentum before = 0.50 × 4.0 + 0.30 × (–2.0) = 2.0 – 0.60 = 1.4 kg m s^{–1} (1). After: (0.50 + 0.30)v = 1.4 (1). v = 1.4/0.80 = 1.8 m s^{–1} east (1)."]},"orig":"3.2 Q6"},{"code":"3.2 Q7","crit":"3.2","type":"sa","marks":3,"text":"A 1.2 × 10^{4} kg rail truck moving at 3.0 m s^{–1} catches up with an 8.0 × 10^{3} kg truck moving in the same direction at 1.0 m s^{–1}, as shown. On impact the trucks couple together. Calculate their common velocity after coupling.","img":"q32_couple","num":[["v (m/s)",2.2]],"answer":{"lines":["Momentum is conserved: m_{1}u_{1} + m_{2}u_{2} = (m_{1} + m_{2})v (1). 1.2 × 10^{4} × 3.0 + 8.0 × 10^{3} × 1.0 = 2.0 × 10^{4} × v, so 3.6 × 10^{4} + 8.0 × 10^{3} = 4.4 × 10^{4} = 2.0 × 10^{4}v (1). v = 4.4 × 10^{4}/2.0 × 10^{4} = 2.2 m s^{–1} in the original direction of motion (1)."]},"orig":"3.2 Q7"},{"code":"3.2 Q8","crit":"3.2","type":"sa","marks":3,"text":"A 60 kg skater and a 40 kg skater stand at rest on ice, facing each other. They push apart and the 40 kg skater moves off at 3.0 m s^{–1}. Calculate the velocity of the 60 kg skater.","img":"q72_skaters","num":[["speed (m/s)",2]],"answer":{"lines":["Total momentum before is zero, so it is zero after: 0 = 60v + 40 × 3.0 (1). v = –120/60 (1) = –2.0 m s^{–1}, that is 2.0 m s^{–1} in the opposite direction to the 40 kg skater (1)."]},"orig":"3.2 Q8"},{"code":"3.2 Q9","crit":"3.2","type":"sa","marks":3,"text":"A 1200 kg cannon is free to roll on a horizontal surface, as shown. It fires a 5.0 kg cannonball horizontally at 240 m s^{–1}. Calculate the recoil velocity of the cannon.","img":"q32_recoil","num":[["recoil speed (m/s)",1]],"answer":{"lines":["Before firing the total momentum is zero, so it is zero afterwards: 0 = m_{ball}v_{ball} + m_{cannon}v_{cannon} (1). 0 = 5.0 × 240 + 1200 × v (1). v = –1200/1200 = –1.0 m s^{–1}, that is 1.0 m s^{–1} in the opposite direction to the cannonball (1)."]},"orig":"3.2 Q9"},{"code":"3.2 Q10","crit":"3.2","type":"sa","marks":3,"text":"A 0.40 kg object at rest on a frictionless surface is split into two pieces by a small explosive charge. One piece, of mass 0.15 kg, moves off at 20 m s^{–1} east. Calculate the velocity of the other piece.","num":[["speed (m/s)",12]],"answer":{"lines":["The other piece has mass 0.40 – 0.15 = 0.25 kg (1). Total momentum is zero before and after the explosion: 0 = 0.15 × 20 + 0.25 × v (1). v = –3.0/0.25 = –12 m s^{–1}, that is 12 m s^{–1} west (1)."]},"orig":"3.2 Q10"}]},{"code":"3.3","topic":3,"title":"Determine whether a collision is elastic or inelastic using calculations","intro":null,"questions":[{"code":"3.3 Q1","crit":"3.3","type":"sa","marks":3,"text":"A 2.0 kg trolley moving at 3.0 m s^{–1} collides with a stationary 1.0 kg trolley. After the collision the 2.0 kg trolley moves at 1.0 m s^{–1} and the 1.0 kg trolley at 4.0 m s^{–1}, both in the original direction. Determine whether the collision is elastic or inelastic.","img":"q72_trolleys","num":[["E_{k} before (J)",9],["E_{k} after (J)",9]],"answer":{"lines":["E_{k} before = ½ × 2.0 × 3.0^{2} = 9.0 J (1). E_{k} after = ½ × 2.0 × 1.0^{2} + ½ × 1.0 × 4.0^{2} = 1.0 + 8.0 = 9.0 J (1). The total kinetic energy is unchanged, so the collision is elastic (1)."]},"diag":true,"orig":"3.3 Q1"},{"code":"3.3 Q2","crit":"3.3","type":"mc","marks":1,"text":"In a collision in which two objects stick together,","options":["kinetic energy is conserved but momentum is not","neither momentum nor kinetic energy is conserved","momentum is conserved but kinetic energy is not","both momentum and kinetic energy are conserved"],"answer":{"lines":["C. Momentum is conserved in every collision with no external force; when objects stick together some kinetic energy is always transformed to other forms, so the collision is inelastic."]},"orig":"3.3 Q2"},{"code":"3.3 Q3","crit":"3.3","type":"sa","marks":3,"text":"A 1200 kg car travelling at 15 m s^{–1} collides with a stationary 800 kg car and the two lock together, moving off at 9.0 m s^{–1}. Show by calculation that the collision is inelastic and determine the kinetic energy transformed.","num":[["E_{k} before (J)",135000],["E_{k} after (J)",81000],["E_{k} transformed (J)",54000]],"answer":{"lines":["E_{k} before = ½ × 1200 × 15^{2} = 1.35 × 10^{5} J (1). E_{k} after = ½ × 2000 × 9.0^{2} = 8.1 × 10^{4} J (1). Kinetic energy is not conserved, so the collision is inelastic; 1.35 × 10^{5} – 8.1 × 10^{4} = 5.4 × 10^{4} J is transformed to other forms (1)."]},"orig":"3.3 Q3"},{"code":"3.3 Q4","crit":"3.3","type":"sa","marks":3,"text":"Explain why momentum is conserved in an inelastic collision even though kinetic energy is not.","answer":{"lines":["During the collision the only forces on the objects are the forces they exert on each other, which are equal and opposite (Newton's third law), so the total momentum of the pair cannot change (1). Kinetic energy is not a conserved quantity on its own: the forces deform the objects and heat them, transforming kinetic energy into heat, sound and deformation (1). Total energy is still conserved; it is only the kinetic part that decreases (1)."]},"orig":"3.3 Q5"}]},{"code":"3.4","topic":3,"title":"Calculate the impulse or change in momentum of an object (Δp = mv – mu, or the area under a force-time graph) and the average force F_{net} = Δp/Δt","intro":null,"questions":[{"code":"3.4 Q1","crit":"3.4","type":"sa","marks":3,"text":"A 0.060 kg tennis ball hits a wall at 25 m s^{–1} and rebounds along the same line at 20 m s^{–1}, as shown. Calculate the change in momentum of the ball, stating its direction.","img":"q73_wall","num":[["size of Δp (kg m/s)",2.7]],"answer":{"lines":["Take the direction toward the wall as positive: u = +25 m s^{–1}, v = –20 m s^{–1} (1). Δp = m(v – u) = 0.060 × (–20 – 25) = –2.7 kg m s^{–1} (1). The change in momentum is 2.7 kg m s^{–1} directed away from the wall (1)."]},"diag":true,"orig":"3.4 Q1"},{"code":"3.4 Q2","crit":"3.4","type":"mc","marks":1,"text":"The area under a force versus time graph for a collision represents","options":["the impulse on the object, equal to its change in momentum","the average force on the object","the work done on the object","the kinetic energy gained by the object"],"answer":{"lines":["A. The area is FΔt, the impulse, which equals the change in momentum mΔv of the object."]},"orig":"3.4 Q2"},{"code":"3.4 Q3","crit":"3.4","type":"sa","marks":3,"text":"The graph shows the force exerted by a bat on a 0.40 kg ball that is initially at rest. Use the graph to determine the impulse on the ball and the speed of the ball as it leaves the bat.","img":"graph_Ft_tri","num":[["I (N s)",16],["v (m/s)",40]],"answer":{"lines":["Impulse is the area under the force-time graph (1): I = ½ × 0.040 × 800 = 16 N s (1). I = mΔv, so v = 16/0.40 = 40 m s^{–1} (1)."]},"orig":"3.4 Q4"},{"code":"3.4 Q4","crit":"3.4","type":"sa","marks":3,"text":"The graph shows the net force on a 60 kg athlete during a jump. Use the graph to determine the impulse on the athlete and the athlete's change in velocity.","img":"graph_Ft_trap","num":[["I (N s)",450],["Δv (m/s)",7.5]],"answer":{"lines":["Area under the graph = area of the trapezium = ½ × (0.40 + 0.20) × 1500 (1) = 4.5 × 10^{2} N s (1). Δv = I/m = 450/60 = 7.5 m s^{–1} (1)."]},"orig":"3.4 Q6"},{"code":"3.4 Q5","crit":"3.4","type":"sa","marks":3,"text":"A 0.15 kg ball travelling east at 30 m s^{–1} is hit directly back toward the west at 40 m s^{–1}. The bat is in contact with the ball for 3.0 ms.","img":"q73_bat","num":[["a. size of Δp (kg m/s)",10.5],["b. size of F (N)",3500]],"parts":[{"text":"a.  Calculate the change in momentum of the ball.","marks":2},{"text":"b.  Calculate the average force on the ball.","marks":1}],"answer":{"lines":["a. Take east as positive: Δp = m(v – u) = 0.15 × (–40 – 30) (1) = –10.5 kg m s^{–1}, that is 10.5 kg m s^{–1} west (1).","b. F = Δp/Δt = 10.5/(3.0 × 10^{–3}) = 3.5 × 10^{3} N west (1)."]},"orig":"3.4 Q7"}]},{"code":"3.5","topic":3,"title":"Explain scenarios where changing impact time affects the force experienced (e.g. airbags) using F_{net} = Δp/Δt","intro":null,"questions":[{"code":"3.5 Q1","crit":"3.5","type":"sa","marks":3,"text":"Explain how an airbag reduces the injury to a driver in a head-on collision.","answer":{"lines":["In the collision the driver's momentum must be reduced to zero, so the change in momentum is fixed by the driver's mass and initial speed, with or without the airbag (1). The airbag increases the time Δt over which the driver comes to rest, compared with striking the steering wheel or dashboard (1). Since FΔt = mΔv, a longer time for the same change in momentum means a smaller average force on the driver, so the injury is less (1)."]},"diag":true,"orig":"3.5 Q1"},{"code":"3.5 Q2","crit":"3.5","type":"mc","marks":1,"text":"A crumple zone reduces the force on the occupants of a car in a collision because it","options":["absorbs the car's momentum","reduces the mass of the car","reduces the change in momentum of the car","increases the time taken for the car to stop"],"answer":{"lines":["D. The change in momentum is fixed; crumpling lengthens the stopping time, and F = mΔv/Δt is then smaller."]},"orig":"3.5 Q2"},{"code":"3.5 Q3","crit":"3.5","type":"sa","marks":3,"text":"A 70 kg passenger travelling at 20 m s^{–1} is brought to rest in a collision. Calculate the average force on the passenger if the stopping time is 0.050 s (no airbag) and if it is 0.20 s (with an airbag).","num":[["F without airbag (N)",28000],["F with airbag (N)",7000]],"answer":{"lines":["Δp = mΔv = 70 × 20 = 1.4 × 10^{3} kg m s^{–1} in both cases (1). Without airbag: F = Δp/Δt = 1400/0.050 = 2.8 × 10^{4} N (1). With airbag: F = 1400/0.20 = 7.0 × 10^{3} N, one quarter of the force (1)."]},"orig":"3.5 Q3"},{"code":"3.5 Q4","crit":"3.5","type":"sa","marks":3,"text":"The graph shows the force on a driver who strikes the steering wheel in a collision, coming to rest in 0.050 s. Sketch on the same axes the force-time graph for the same driver in the same collision if an airbag brings them to rest in 0.20 s.","img":"q76_Ft","answer":{"lines":["The area under the new graph equals the area under the original (150 N s), since the change in momentum is the same (1). The new graph extends to 0.20 s, four times as wide (1), and its peak is much lower, about 1500 N, so that the areas are equal (1)."],"img":"sol_76_Ft"},"orig":"3.5 Q5"}]}],"imgs":{"q14_box":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgYAAAFzCAYAAABFOMFPAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjksIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvJkbTWQAAAAlwSFlzAAAXEgAAFxIBZ5/SUgAAJVxJREFUeJzt3Xt0VOW9//HP5DZJhnCTUEAghICGmwHCpYAQRFQQYSnSKLYSugBBEKQVOMfD+SlQOVwE9IClgBWocI6KCtZ6WrCtuECgFiy3VhRQwAqVAEK4hSTMfH9/uPIsh4Q7s0PI+7UWa7l3nnm+z+wxk8/s+e4Zn5mZAAAAJEWV9QIAAMD1g2AAAAAcggEAAHAIBgAAwCEYAAAAh2AAAAAcggEAAHAIBgAAwCEYAAAAh2AAAAAcggEAAHAIBgAAwCEYAAAAh2AAAAAcggEAAHAIBgAAwCEYAAAAh2AAAAAcggEAAHAIBgAAwCEYAAAAh2AAAAAcggEAAHAIBgAAwCEYAAAAh2AAAAAcggEAAHAIBgAAwCEYAAAAh2AAAAAcggEAAHAIBgAAwCEYAAAAh2AAAAAcggEAAHAIBgAAwCEYAAAAh2AAAAAcggEAAHAIBgAAwCEYAAAAh2AAAAAcggEAAHAIBgAAwCEYAAAAh2AAAAAcggEAAHAIBgAAwCEYAAAAh2AAAAAcggEAAHAIBgAAwCEYAAAAh2AAAAAcggEAAHAIBgAAwCEYAAAAh2AAAAAcggEAAHAIBgAAwCEYAAAAh2AAAAAcggEAAHAIBgAAwCEYAAAAh2AAAAAcggEAAHAIBgAAwCEYAAAAh2AAAAAcggEAAHAIBg   "3.4 Q1": () => { const m = R(0.05, 0.2, 0.01), u = R(15, 30, 1), v = R(8, u - 2, 1); const dp = m * (u + v);
    return { text: `A ${num(m, 2)} kg ball hits a wall at ${u} m s^{–1} and rebounds along the same line at ${v} m s^{–1}. Calculate the change in momentum of the ball, stating its direction.`, marks: 3,
      num: [V("size of Δp (kg m/s)", dp)],
      lines: [`Take the direction toward the wall as positive: u = +${u} m s^{–1}, v = –${v} m s^{–1} (1). Δp = m(v – u) = ${num(m, 2)} × (–${v} – ${u}) = –${num(dp, 2)} kg m s^{–1} (1). The change in momentum is ${num(dp, 2)} kg m s^{–1} directed away from the wall (1).`] }; },
  "3.4 Q7": () => { const m = R(0.1, 0.2, 0.01), u = R(20, 35, 1), v = R(25, 45, 1), t = R(2, 5, 0.5); const dp = m * (u + v), F = dp / (t * 1e-3);

      lines: [`a. Take east as positive: Δp = m(v – u) = ${num(m, 2)} × (–${v} – ${u}) (1) = –${num(dp, 3)} kg m s^{–1}, that is ${num(dp, 2)} kg m s^{–1} west (1).`, `b. F = Δp/Δt = ${num(dp, 3)}/(${num(t, 2)} × 10^{–3}) = ${sci(F, 2)} N west (1).`] }; },
  "3.2 Q1": () => { const m1 = R(900, 1600, 100), m2 = R(600, 1400, 100), u = R(10, 25, 1); const v = m1 * u / (m1 + m2);
    return { text: `A ${m1} kg car travelling at ${u} m s^{–1} collides with a stationary ${m2} kg car. The two cars lock together. Calculate their common velocity immediately after the collision.`, marks: 3,
      num: [V("v (m/s)", v)],
      lines: [`Momentum is conserved: m_{1}u_{1} + m_{2}u_{2} = (m_{1} + m_{2})v (1). ${m1} × ${u} + 0 = ${m1 + m2}v (1). v = ${m1 * u}/${m1 + m2} = ${num(v, 2)} m s^{–1} in the original direction of the moving car (1).`] }; },
  "3.2 Q3": () => { const m1 = R(1.5, 3, 0.5), m2 = R(0.5, 1.5, 0.5), u = R(2, 5, 0.5); const vmin = Math.max(0.5, Math.ceil(2 * u * (m1 - m2) / (m1 + m2)) / 2); const v1 = R(vmin, Math.max(vmin, u - 0.5), 0.5); const v2 = (m1 * u - m1 * v1) / m2;
    return { text: `A ${num(m1, 2)} kg trolley moving at ${num(u, 2)} m s^{–1} collides with a stationary ${num(m2, 2)} kg trolley. After the collision the ${num(m1, 2)} kg trolley continues in the same direction at ${num(v1, 2)} m s^{–1}. Calculate the velocity of the ${num(m2, 2)} kg trolley after the collision.`, marks: 3,
      num: [V("v_{2} (m/s)", v2)],
      lines: [`m_{1}u_{1} + m_{2}u_{2} = m_{1}v_{1} + m_{2}v_{2} (1): ${num(m1, 2)} × ${num(u, 2)} + 0 = ${num(m1, 2)} × ${num(v1, 2)} + ${num(m2, 2)} × v_{2} (1). v_{2} = (${num(m1 * u, 3)} – ${num(m1 * v1, 3)})/${num(m2, 2)} = ${num(v2, 2)} m s^{–1} in the original direction of motion (1).`] }; },
  "3.2 Q6": () => { const m1 = R(0.4, 0.8, 0.1), u1 = R(3.5, 6, 0.5), m2 = R(0.2, 0.4, 0.1), u2 = R(1, 3, 0.5); const p = m1 * u1 - m2 * u2, v = p / (m1 + m2);

      num: [V("v (m/s)", Math.abs(v))],
      lines: [`Take east as positive. Total momentum before = ${num(m1, 2)} × ${num(u1, 2)} + ${num(m2, 2)} × (–${num(u2, 2)}) = ${num(m1 * u1, 3)} – ${num(m2 * u2, 3)} = ${num(p, 3)} kg m s^{–1} (1). After: (${num(m1, 2)} + ${num(m2, 2)})v = ${num(p, 3)} (1). v = ${num(p, 3)}/${num(m1 + m2, 2)} = ${num(Math.abs(v), 2)} m s^{–1} ${v >= 0 ? "east" : "west"} (1).`] }; },
  "3.2 Q8": () => { const m1 = R(55, 85, 5), m2 = m1 - R(10, 25, 5), v2 = R(1.5, 4, 0.5); const v1 = m2 * v2 / m1;
    return { text: `A ${m1} kg skater and a ${m2} kg skater stand at rest on ice, facing each other. They push apart and the ${m2} kg skater moves off at ${num(v2, 2)} m s^{–1}. Calculate the velocity of the ${m1} kg skater.`, marks: 3,
      num: [V("speed (m/s)", v1)],
      lines: [`Total momentum before is zero, so it is zero after: 0 = ${m1}v + ${m2} × ${num(v2, 2)} (1). v = –${num(m2 * v2, 3)}/${m1} (1) = –${num(v1, 2)} m s^{–1}, that is ${num(v1, 2)} m s^{–1} in the opposite direction to the ${m2} kg skater (1).`] }; },
  "3.5 Q3": () => { const m = R(55, 90, 5), v = R(12, 25, 1), t1 = R(0.03, 0.08, 0.01), k = pick([3, 4, 5]); const t2 = t1 * k, dp = m * v, F1 = dp / t1, F2 = dp / t2;
    return { text: `A ${m} kg passenger travelling at ${v} m s^{–1} is brought to rest in a collision. Calculate the average force on the passenger if the stopping time is ${num(t1, 2)} s (no airbag) and if it is ${num(t2, 2)} s (with an airbag).`, marks: 3,
      num: [V("F without airbag (N)", F1), V("F with airbag (N)", F2)],
      lines: [`Δp = mΔv = ${m} × ${v} = ${sci(dp, 3)} kg m s^{–1} in both cases (1). Without airbag: F = Δp/Δt = ${num(dp, 3)}/${num(t1, 2)} = ${sci(F1, 2)} N (1). With airbag: F = ${num(dp, 3)}/${num(t2, 2)} = ${sci(F2, 2)} N, one ${k === 3 ? "third" : k === 4 ? "quarter" : "fifth"} of the force (1).`] }; },
  "3.3 Q3": () => { const m1 = R(900, 1600, 100), m2 = R(600, 1400, 100), u = R(10, 25, 1); const v = m1 * u / (m1 + m2), E1 = 0.5 * m1 * u * u, E2 = 0.5 * (m1 + m2) * v * v;
    return { text: `A ${m1} kg car travelling at ${u} m s^{–1} collides with a stationary ${m2} kg car and the two lock together, moving off at ${num(v, 3)} m s^{–1}. Show by calculation that the collision is inelastic and determine the kinetic energy transformed.`, marks: 3,
      num: [V("E_{k} before (J)", E1), V("E_{k} after (J)", E2), V("E_{k} transformed (J)", E1 - E2)],
      lines: [`E_{k} before = ½ × ${m1} × ${u}^{2} = ${sci(E1, 3)} J (1). E_{k} after = ½ × ${m1 + m2} × ${num(v, 3)}^{2} = ${sci(E2, 3)} J (1). Kinetic energy is not conserved, so the collision is inelastic; ${sci(E1, 3)} – ${sci(E2, 3)} = ${sci(E1 - E2, 2)} J is transformed to other forms (1).`] }; },
  "2.1 Q1": () => { const mA = R(1, 4, 0.5), mB = R(1, 5, 0.5), F = R(6, 30, 1); const a = F / (mA + mB), FB = mB * a;
    return { text: `A ${num(mA, 2)} kg block A and a ${num(mB, 2)} kg block B are in contact on a frictionless horizontal surface. A horizontal force of ${F} N pushes on block A, with B ahead of A. a. Calculate the acceleration of the blocks. b. Calculate the force on block B by block A. c. State the force on block A by block B.`, marks: 4,
      num: [V("a. a (m/s²)", a), V("b. F_{on B by A} (N)", FB), V("c. F_{on A by B} (N)", FB)],
      lines: [`a. The blocks move together: a = F/(m_{A} + m_{B}) = ${F}/${num(mA + mB, 2)} = ${num(a, 3)} m s^{–2} (1).`, `b. The only horizontal force on B is the push from A: ΣF = m_{B}a (1), so F_{on B by A} = ${num(mB, 2)} × ${num(a, 3)} = ${num(FB, 2)} N forward (1).`, `c. By Newton's third law F_{on A by B} = ${num(FB, 2)} N backward (1).`] }; },
  "2.1 Q3": () => { const m1 = R(1, 2, 0.5), m2 = R(1.5, 3, 0.5), m3 = R(2, 4, 0.5), F = R(8, 30, 1); const a = F / (m1 + m2 + m3);
    return { text: `Three blocks of mass ${num(m1, 2)} kg, ${num(m2, 2)} kg and ${num(m3, 2)} kg are in contact in a line, in that order, on a frictionless surface. A ${F} N horizontal force pushes on the ${num(m1, 2)} kg block. a. Calculate the acceleration of the blocks. b. Calculate the force on the ${num(m3, 2)} kg block by the ${num(m2, 2)} kg block. c. Calculate the force on the ${num(m2, 2)} kg block by the ${num(m1, 2)} kg block.`, marks: 4,
      num: [V("a. a (m/s²)", a), V("b. F (N)", m3 * a), V("c. F (N)", (m2 + m3) * a)],
      lines: [`a. a = ${F}/(${num(m1, 2)} + ${num(m2, 2)} + ${num(m3, 2)}) = ${num(a, 3)} m s^{–2} (1).`, `b. The last block is pushed only by the middle block: F = ${num(m3, 2)} × ${num(a, 3)} = ${num(m3 * a, 2)} N (1).`, `c. The first block pushes on both blocks ahead of it (1): F = (${num(m2, 2)} + ${num(m3, 2)}) × ${num(a, 3)} = ${num((m2 + m3) * a, 2)} N (1).`] }; },
  "3.1 Q1": () => { const m = R(800, 2000, 100), v = R(5, 30, 1), d = pick(["east", "west", "north", "south"]);
    return { text: `Calculate the momentum of a ${m} kg car travelling ${d} at ${v} m s^{–1}.`, marks: 2,

  "3.1 Q3": () => { const mt = R(3000, 12000, 1000), vt = R(3, 12, 1), mb = R(0.005, 0.02, 0.005), vb = R(200, 600, 50); const pt = mt * vt, pb = mb * vb;
    return { text: `Compare the momentum of a ${mt} kg truck travelling at ${vt} m s^{–1} with that of a ${num(mb, 2)} kg bullet travelling at ${vb} m s^{–1}, and calculate the speed at which the truck would have the same momentum as the bullet.`, marks: 3,

  "2.2 Q1": () => { const m1 = R(2, 6, 0.5), m2 = R(1, 3, 0.5); const Fd = m2 * G, a = Fd / (m1 + m2), T = m1 * a;
    return { text: `A ${num(m1, 2)} kg trolley on a frictionless horizontal bench is connected by a light string over a frictionless pulley to a ${num(m2, 2)} kg mass hanging freely. a. Calculate the acceleration of the system when it is released. b. Calculate the tension in the string.`, marks: 4,
      num: [V("a. a (m/s²)", a), V("b. T (N)", T)],
      lines: [`a. The driving force is the weight of the hanging mass, F_{driving} = ${num(m2, 2)} × 9.81 = ${num(Fd, 3)} N, and the whole system accelerates together (1): a = F_{driving}/(m_{1} + m_{2}) = ${num(Fd, 3)}/${num(m1 + m2, 2)} = ${num(a, 2)} m s^{–2} (1).`, `b. Apply ΣF = ma to the trolley, on which the tension is the only horizontal force (1): T = m_{1}a = ${num(m1, 2)} × ${num(a, 3)} = ${num(T, 2)} N (1).`] }; },
  "2.2 Q3": () => { const m1 = R(2, 6, 0.5), m2 = R(1, 3, 0.5); const Fd = m2 * G; const f = R(1, Math.floor(Fd / 2), 0.5); const a = (Fd - f) / (m1 + m2), T = f + m1 * a;
    return { text: `A ${num(m1, 2)} kg trolley on a horizontal bench is connected by a light string over a frictionless pulley to a ${num(m2, 2)} kg hanging mass. A friction force of ${num(f, 2)} N acts on the trolley. a. Calculate the acceleration of the system. b. Calculate the tension in the string.`, marks: 4,
      num: [V("a. a (m/s²)", a), V("b. T (N)", T)],
      lines: [`a. F_{driving} = ${num(m2, 2)} × 9.81 = ${num(Fd, 3)} N (1). a = (F_{driving} – ΣF_{resistive})/(m_{1} + m_{2}) = (${num(Fd, 3)} – ${num(f, 2)})/${num(m1 + m2, 2)} = ${num(a, 2)} m s^{–2} (1).`, `b. For the trolley: T – ${num(f, 2)} = ${num(m1, 2)} × ${num(a, 3)} (1), so T = ${num(m1 * a, 3)} + ${num(f, 2)} = ${num(T, 2)} N (1).`] }; },
  "1.1 Q1": () => { const chosen = shuffle([pick(LAW_SCENES.filter(x => x.law === 1)), pick(LAW_SCENES.filter(x => x.law === 2)), pick(LAW_SCENES.filter(x => x.law === 3)), ...pickN(LAW_SCENES, 4)]).filter((x, i, a) => a.indexOf(x) === i).slice(0, 4);
    return { text: "For each of the following, state which of Newton's laws of motion best explains the observation, and give a one-line reason.", marks: 4,
      parts: chosen.map((x, i) => ({ text: `${"abcd"[i]}.  ${x.s}.`, marks: 1 })),
      lines: chosen.map((x, i) => `${"abcd"[i]}. ${cap(LAWS[x.law])} law: ${x.why} (1).`) }; },
  "1.1 Q2": () => { const x = pick(LAW_SCENES); const names = { 1: "Newton's first law", 2: "Newton's second law", 3: "Newton's third law" };

  "1.4 Q1": () => { const chosen = pickN(PAIRS, 3);

  "1.4 Q2": () => { const x = pick(PAIRS); const { options, letter } = mcq(x.correct, x.wrong);

  "1.5 Q2": () => { const less = Math.random() < 0.5; const need = less ? -1 : 1; const correct = pick(LIFT.filter(x => x.a === need)); const wrong = pickN(LIFT.filter(x => x.a !== need), 3);

  "2.1 Q2": () => { let m1, m2, F, a, opts; do { m1 = R(2, 6, 1); m2 = R(2, 6, 1); F = R(8, 30, 1); a = F / (m1 + m2); opts = [a, F / m1, F / m2, F].map(x => num(x, 2)); } while (m1 === m2 || new Set(opts).size < 4);
    const { options, letter } = mcq(opts[0] + " m s^{–2}", opts.slice(1).map(o => o + " m s^{–2}"));

      lines: [`${letter}. The blocks move together, so a = F/(m_{1} + m_{2}) = ${F}/${num(m1 + m2, 2)} = ${num(a, 2)} m s^{–2}.`] }; },
  "3.1 Q2": () => { let objs, ps; do { objs = pickN(MOVERS, 4).map(o => ({ ...o, mv: R(...o.m), vv: R(...o.v) })); ps = objs.map(o => o.mv * o.vv); } while (ps.slice().sort((a, b) => b - a)[0] < 1.15 * ps.slice().sort((a, b) => b - a)[1]);
    const best = ps.indexOf(Math.max(...ps)); const texts = objs.map(o => `A ${num(o.mv, 2)} kg ${o.n} ${o.d} at ${num(o.vv, 2)} m s^{–1}`);
