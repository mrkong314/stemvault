<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketching Sine &amp; Cosine Graphs</title>
<style>
  :root {
    --ink: #1a2332;
    --muted: #5b6472;
    --paper: #f7f8fa;
    --card: #ffffff;
    --line: #d8dde4;
    --curve: #2456c8;
    --curve-soft: #7fa0e6;
    --mid: #d97706;
    --env: #8a93a0;
    --accent-bg: #eef3fc;
    --good: #15803d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 18px;
  }
  .wrap { max-width: 1060px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; margin-bottom: 12px; }
  header h1 { font-size: 20px; font-weight: 650; }
  header p { color: var(--muted); font-size: 13.5px; }

  .controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 12px;
  }
  .controls label { font-size: 13px; color: var(--muted); margin-left: 6px; }
  .controls select {
    font-size: 14px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px;
    background: #fff; color: var(--ink);
  }
  .controls .spacer { flex: 1; }
  button {
    font-size: 14px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); cursor: pointer;
  }
  button:hover { background: #f0f2f5; }
  button.primary { background: var(--curve); border-color: var(--curve); color: #fff; font-weight: 600; }
  button.primary:hover { background: #1d49ad; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:hover { background: #fff; }
  button.primary:disabled:hover { background: var(--curve); }

  .main { display: grid; grid-template-columns: 1fr 320px; gap: 12px; }
  @media (max-width: 900px) { .main { grid-template-columns: 1fr; } }

  .plot-card, .side {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  }
  .eq-bar {
    padding: 12px 16px 4px; text-align: center;
    font-family: Georgia, "Times New Roman", serif; font-style: italic;
    font-size: 24px; letter-spacing: 0.3px;
  }
  .eq-bar .fn { font-style: normal; }
  svg { display: block; width: 100%; height: auto; }

  .side { display: flex; flex-direction: column; }
  .step-head {
    padding: 12px 16px 0; display: flex; align-items: center; justify-content: space-between;
  }
  .step-head .step-num { font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--curve); }
  .dots { display: flex; gap: 5px; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dots span.on { background: var(--curve); }
  .step-title { padding: 6px 16px 0; font-size: 17px; font-weight: 650; }
  .step-body { padding: 8px 16px 14px; font-size: 14px; line-height: 1.55; color: #333c49; flex: 1; min-height: 235px; }
  .step-body .math { font-family: Georgia, "Times New Roman", serif; font-style: italic; white-space: nowrap; }
  .step-body .math .fn { font-style: normal; }
  .step-body .pattern {
    display: block; margin-top: 8px; padding: 8px 10px; background: var(--accent-bg);
    border-radius: 8px; font-weight: 600; color: var(--curve); font-size: 14px; text-align: center;
  }
  .feature-chips { padding: 0 16px 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: var(--accent-bg);
    color: var(--ink); border: 1px solid #d6e2f7; visibility: hidden;
  }
  .chip b { font-weight: 700; }
  .chip .math { font-family: Georgia, serif; font-style: italic; }
  .chip.show { visibility: visible; }
  .nav { padding: 12px 16px 6px; display: flex; gap: 8px; border-top: 1px solid var(--line); }
  .nav button { flex: 1; }
  .kbd-hint { padding: 0 16px 12px; font-size: 11.5px; color: var(--muted); text-align: center; }
  .kbd-hint kbd {
    font-family: inherit; font-size: 11px; background: #f0f2f5; border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 5px;
  }

  .curve-path {
    fill: none; stroke: var(--curve); stroke-width: 3; stroke-linecap: round;
  }
  .curve-anim { animation: drawin 1.1s ease-out forwards; }
  @keyframes drawin { to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sketching Sine &amp; Cosine Graphs</h1>
    <p>Midline &rarr; amplitude bounds &rarr; quarter periods &rarr; key points &rarr; sketch through.</p>
  </header>

  <div class="controls">
    <label>Function</label>
    <select id="selFn"><option value="sin">sin</option><option value="cos">cos</option></select>
    <label><span class="math" style="font-family:Georgia,serif;font-style:italic">a</span></label>
    <select id="selA"></select>
    <label><span style="font-family:Georgia,serif;font-style:italic">b</span></label>
    <select id="selB"></select>
    <label><span style="font-family:Georgia,serif;font-style:italic">d</span></label>
    <select id="selD"></select>
    <div class="spacer"></div>
    <button id="btnRandom">&#127922; Random graph</button>
  </div>

  <div class="main">
    <div class="plot-card">
      <div class="eq-bar" id="eqBar"></div>
      <svg id="plot" viewBox="0 0 720 430" role="img" aria-label="graph"></svg>
    </div>
    <div class="side">
      <div class="step-head">
        <span class="step-num" id="stepNum"></span>
        <span class="dots" id="dots"></span>
      </div>
      <div class="step-title" id="stepTitle"></div>
      <div class="step-body" id="stepBody"></div>
      <div class="feature-chips" id="chips">
        <span class="chip" id="chipAmp"></span>
        <span class="chip" id="chipPer"></span>
        <span class="chip" id="chipMid"></span>
      </div>
      <div class="nav">
        <button id="btnPrev">&larr; Back</button>
        <button id="btnNext" class="primary">Next &rarr;</button>
      </div>
      <div class="kbd-hint"><kbd>&rarr;</kbd> / <kbd>space</kbd> next &nbsp;&middot;&nbsp; <kbd>&larr;</kbd> back &nbsp;&middot;&nbsp; <kbd>N</kbd> new graph</div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var MINUS = '−', PI = 'π', TIMES = '';

  // ---------- state ----------
  var state = { fn: 'sin', a: 2, b: 1, d: 1, step: 0 };
  var N_STEPS = 7; // steps 0..6

  var A_VALS = [-3, -2, -1, 1, 2, 3];
  var B_VALS = [0.5, 1, 2, 3];
  var D_VALS = [-2, -1, 0, 1, 2];

  // ---------- fraction helpers (multiples of pi) ----------
  function gcd(x, y) { x = Math.abs(x); y = Math.abs(y); while (y) { var t = y; y = x % y; x = t; } return x || 1; }
  // format (num/den) * pi as a plain string, e.g. 3π/2, π, 0, −π/6
  function piFrac(num, den) {
    if (num === 0) return '0';
    var g = gcd(num, den); num /= g; den /= g;
    if (den < 0) { den = -den; num = -num; }
    var sign = num < 0 ? MINUS : '';
    num = Math.abs(num);
    var top = (num === 1 ? '' : num) + PI;
    return den === 1 ? sign + top : sign + top + '/' + den;
  }
  // quarter period as fraction of pi: T/4 = pi/(2b). With b in {0.5,1,2,3}, 2b is integer.
  function quarterFrac() { return { num: 1, den: Math.round(2 * state.b) }; }
  function periodFracStr() { var q = quarterFrac(); return piFrac(4 * q.num, q.den); }
  function quarterFracStr() { var q = quarterFrac(); return piFrac(q.num, q.den); }
  function tickLabel(k) { var q = quarterFrac(); return piFrac(k * q.num, q.den); } // k quarter-periods

  function fmtNum(v) { return (v < 0 ? MINUS : '') + Math.abs(v); }
  function fmtSigned(v) { return (v < 0 ? ' ' + MINUS + ' ' : ' + ') + Math.abs(v); }

  // ---------- equation rendering ----------
  function eqHTML() {
    var s = state, h = 'y = ';
    if (s.a === -1) h += MINUS;
    else if (s.a !== 1) h += fmtNum(s.a);
    h += '<span class="fn">' + s.fn + '</span>(';
    if (s.b === 0.5) h += 'x/2';
    else if (s.b === 1) h += 'x';
    else h += s.b + 'x';
    h += ')';
    if (s.d !== 0) h += fmtSigned(s.d);
    return h;
  }

  // ---------- geometry ----------
  var W = 720, H = 430, padL = 52, padR = 18, padT = 16, padB = 34;
  function model() {
    var s = state;
    var T = 2 * Math.PI / s.b;
    var amp = Math.abs(s.a);
    var yTop = Math.max(s.d + amp, 0) + 0.9;
    var yBot = Math.min(s.d - amp, 0) - 0.9;
    var xMax = 2 * T;
    return { T: T, amp: amp, yTop: yTop, yBot: yBot, xMax: xMax };
  }
  function fx(x, m) { return padL + (x / m.xMax) * (W - padL - padR); }
  function fy(y, m) { return padT + (m.yTop - y) / (m.yTop - m.yBot) * (H - padT - padB); }
  function fval(x) { var s = state; return s.a * Math[s.fn](s.b * x) + s.d; }

  // ---------- svg helpers ----------
  var svg = document.getElementById('plot');
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e);
    return e;
  }
  function txt(str, attrs, parent) {
    var e = el('text', attrs, parent);
    e.textContent = str;
    return e;
  }

  // ---------- key point pattern ----------
  // returns array of 5 labels for x = 0, T/4, ..., T
  function pointPattern() {
    var s = state;
    if (s.fn === 'sin') return s.a > 0 ? ['mid', 'max', 'mid', 'min', 'mid'] : ['mid', 'min', 'mid', 'max', 'mid'];
    return s.a > 0 ? ['max', 'mid', 'min', 'mid', 'max'] : ['min', 'mid', 'max', 'mid', 'min'];
  }
  function patternStr() { return pointPattern().join(' → '); }

  // ---------- drawing ----------
  function curvePath(x0, x1, m) {
    var n = 120, d = '';
    for (var i = 0; i <= n; i++) {
      var x = x0 + (x1 - x0) * i / n;
      d += (i === 0 ? 'M' : 'L') + fx(x, m).toFixed(2) + ' ' + fy(fval(x), m).toFixed(2);
    }
    return d;
  }

  function draw() {
    var s = state, m = model(), step = s.step;
    svg.innerHTML = '';
    var q = m.T / 4;

    // --- first-period band (from step 3) ---
    if (step >= 3) {
      el('rect', { x: fx(0, m), y: padT, width: fx(m.T, m) - fx(0, m), height: H - padT - padB,
                   fill: '#2456c8', opacity: 0.05 });
    }

    // --- grid: y integer lines ---
    for (var gy = Math.ceil(m.yBot); gy <= Math.floor(m.yTop); gy++) {
      el('line', { x1: padL, y1: fy(gy, m), x2: W - padR, y2: fy(gy, m),
                   stroke: '#edf0f3', 'stroke-width': 1 });
    }
    // grid: quarter-period verticals (faint always, so axes are readable)
    for (var k = 0; k <= 8; k++) {
      var gx = fx(k * q, m);
      el('line', { x1: gx, y1: padT, x2: gx, y2: H - padB, stroke: '#edf0f3', 'stroke-width': 1 });
    }

    // --- axes ---
    var y0 = fy(0, m);
    el('line', { x1: padL, y1: y0, x2: W - padR + 6, y2: y0, stroke: '#3a4250', 'stroke-width': 1.4 });
    el('line', { x1: padL, y1: padT - 4, x2: padL, y2: H - padB, stroke: '#3a4250', 'stroke-width': 1.4 });
    txt('x', { x: W - padR + 8, y: y0 + 4, 'font-size': 14, 'font-style': 'italic', 'font-family': 'Georgia,serif' });
    txt('y', { x: padL - 4, y: padT - 5, 'font-size': 14, 'font-style': 'italic', 'font-family': 'Georgia,serif', 'text-anchor': 'end' });

    // x tick labels every quarter period
    for (k = 1; k <= 8; k++) {
      var tx = fx(k * q, m);
      el('line', { x1: tx, y1: y0 - 4, x2: tx, y2: y0 + 4, stroke: '#3a4250', 'stroke-width': 1.2 });
      txt(tickLabel(k), { x: tx, y: y0 + 18, 'font-size': 12.5, 'text-anchor': 'middle', fill: '#3a4250',
                          'font-family': 'Georgia,serif' });
    }
    // y tick labels (integers)
    for (gy = Math.ceil(m.yBot); gy <= Math.floor(m.yTop); gy++) {
      if (gy === 0) continue;
      var ty = fy(gy, m);
      el('line', { x1: padL - 4, y1: ty, x2: padL + 4, y2: ty, stroke: '#3a4250', 'stroke-width': 1.2 });
      txt((gy < 0 ? MINUS : '') + Math.abs(gy), { x: padL - 8, y: ty + 4, 'font-size': 12.5, 'text-anchor': 'end',
          fill: '#3a4250', 'font-family': 'Georgia,serif' });
    }
    txt('0', { x: padL - 8, y: y0 + 15, 'font-size': 12.5, 'text-anchor': 'end', fill: '#3a4250', 'font-family': 'Georgia,serif' });

    // --- step 1+: midline ---
    if (step >= 1) {
      var my = fy(s.d, m);
      el('line', { x1: padL, y1: my, x2: W - padR, y2: my, stroke: '#d97706', 'stroke-width': 2,
                   'stroke-dasharray': '8 6' });
      txt('y = ' + fmtNum(s.d), { x: W - padR - 4, y: my - 7, 'font-size': 13, 'text-anchor': 'end',
          fill: '#b45309', 'font-family': 'Georgia,serif', 'font-style': 'italic' });
    }

    // --- step 2+: amplitude bounds ---
    if (step >= 2) {
      [s.d + m.amp, s.d - m.amp].forEach(function (yv, i) {
        var by = fy(yv, m);
        el('line', { x1: padL, y1: by, x2: W - padR, y2: by, stroke: '#8a93a0', 'stroke-width': 1.6,
                     'stroke-dasharray': '2 5' });
        txt((i === 0 ? 'max: ' : 'min: ') + 'y = ' + fmtNum(yv),
            { x: padL + 6, y: i === 0 ? by - 6 : by + 15, 'font-size': 12.5, fill: '#5b6472',
              'font-family': 'Georgia,serif', 'font-style': 'italic' });
      });
    }

    // --- step 3+: quarter-period marks in first period ---
    if (step >= 3) {
      for (k = 0; k <= 4; k++) {
        var qx = fx(k * q, m);
        el('line', { x1: qx, y1: padT, x2: qx, y2: H - padB, stroke: '#2456c8', 'stroke-width': 1.2,
                     'stroke-dasharray': '3 4', opacity: 0.55 });
      }
      // quarter-period width annotation between first two marks
      var ay = padT + 12;
      el('line', { x1: fx(0, m) + 2, y1: ay, x2: fx(q, m) - 2, y2: ay, stroke: '#2456c8', 'stroke-width': 1.2,
                   'marker-start': '', opacity: 0.8 });
      txt('T/4 = ' + quarterFracStr(), { x: (fx(0, m) + fx(q, m)) / 2, y: ay - 4,
          'font-size': 12, 'text-anchor': 'middle', fill: '#2456c8', 'font-family': 'Georgia,serif' });
    }

    // --- step 5+: curve over first period; step 6: full ---
    if (step >= 5) {
      var p1 = el('path', { d: curvePath(0, m.T, m), 'class': 'curve-path' + (step === 5 ? ' curve-anim' : '') });
      if (step === 5) {
        var len1 = p1.getTotalLength();
        p1.setAttribute('stroke-dasharray', len1);
        p1.setAttribute('stroke-dashoffset', len1);
      }
    }
    if (step >= 6) {
      var p2 = el('path', { d: curvePath(m.T, 2 * m.T, m), 'class': 'curve-path curve-anim', opacity: 0.85 });
      var len2 = p2.getTotalLength();
      p2.setAttribute('stroke-dasharray', len2);
      p2.setAttribute('stroke-dashoffset', len2);
    }

    // --- step 4+: key points (drawn above curve) ---
    if (step >= 4) {
      var pat = pointPattern();
      var reps = step >= 6 ? 8 : 4; // extend point markers over second period at final step
      for (k = 0; k <= reps; k++) {
        var px = k * q, py = fval(px);
        el('circle', { cx: fx(px, m), cy: fy(py, m), r: 5, fill: '#fff', stroke: '#2456c8', 'stroke-width': 2.5 });
        if (step === 4 && k <= 4) {
          var lab = pat[k];
          var above = fval(px) >= s.d;
          var anchor = k === 0 ? 'start' : 'middle';
          var lx = fx(px, m) + (k === 0 ? 9 : 0);
          var ly = fy(py, m) + (above ? -12 : 20);
          if (k === 0) ly = fy(py, m) - 10; // keep clear of envelope label at left edge
          txt(lab, { x: lx, y: ly, 'font-size': 12, 'text-anchor': anchor,
                     fill: '#2456c8', 'font-weight': 600 });
        }
      }
    }
  }

  // ---------- step text ----------
  function mathSpan(inner) { return '<span class="math">' + inner + '</span>'; }
  function stepContent() {
    var s = state, m = model();
    var ampS = String(m.amp), perS = periodFracStr(), midS = fmtNum(s.d);
    var maxS = fmtNum(s.d + m.amp), minS = fmtNum(s.d - m.amp), qS = quarterFracStr();
    var dir = (s.fn === 'sin') ? (s.a > 0 ? 'rising' : 'falling') : null;
    var startDesc = s.fn === 'sin'
      ? 'on the <b>midline</b>, ' + dir
      : 'at a ' + (s.a > 0 ? '<b>maximum</b>' : '<b>minimum</b>');
    switch (s.step) {
      case 0: return {
        t: 'Read off the features',
        b: 'From ' + mathSpan(eqHTML()) + ':<br>' +
           '&bull; amplitude = |' + fmtNum(s.a) + '| = <b>' + ampS + '</b><br>' +
           '&bull; period ' + mathSpan('T') + ' = 2' + PI + '/' + (s.b === 0.5 ? '(1/2)' : s.b) + ' = <b>' + perS + '</b><br>' +
           '&bull; midline: ' + mathSpan('y = ' + midS) + '<br>' +
           (s.a < 0 ? '&bull; ' + mathSpan('a') + ' is negative, so the graph is <b>reflected</b> in the midline.<br>' : '') +
           'These three numbers are all you need to sketch the graph.'
      };
      case 1: return {
        t: 'Draw the midline',
        b: 'The graph oscillates about the horizontal line ' + mathSpan('y = ' + midS) +
           ' (the vertical translation ' + mathSpan('d') + '). Draw it <b>dashed</b> &mdash; it is a guide, not part of the graph.'
      };
      case 2: return {
        t: 'Mark the maximum and minimum',
        b: 'Go <b>' + ampS + ' up</b> and <b>' + ampS + ' down</b> from the midline (the amplitude):<br>' +
           '&bull; max: ' + mathSpan('y = ' + midS + ' + ' + ampS + ' = ' + maxS) + '<br>' +
           '&bull; min: ' + mathSpan('y = ' + midS + ' ' + MINUS + ' ' + ampS + ' = ' + minS) + '<br>' +
           'The curve must stay between these two lines and touch them.'
      };
      case 3: return {
        t: 'Divide one period into quarters',
        b: 'One full cycle takes ' + mathSpan('T = ' + perS) + '. Everything important happens at <b>quarter-period</b> marks:<br>' +
           mathSpan('T/4 = ' + qS) + ', so mark ' + mathSpan('x = 0, ' + tickLabel(1) + ', ' + tickLabel(2) + ', ' + tickLabel(3) + ', ' + tickLabel(4)) + '.'
      };
      case 4: return {
        t: 'Plot the five key points',
        b: 'A ' + s.fn + ' graph' + (s.a < 0 ? ' with ' + mathSpan('a') + ' &lt; 0' : '') + ' starts ' + startDesc +
           '. At each quarter period it moves to the next feature:' +
           '<span class="pattern">' + patternStr() + '</span>' +
           'mid = midline (' + mathSpan('y = ' + midS) + '), max = ' + maxS + ', min = ' + minS + '.'
      };
      case 5: return {
        t: 'Sketch through the points',
        b: 'Join the five points with one <b>smooth wave</b> &mdash; no straight segments, no sharp corners. ' +
           'The curve is flat (a turning point) at each max and min, and steepest as it crosses the midline.'
      };
      case 6: return {
        t: 'Extend the pattern',
        b: 'The graph is <b>periodic</b>: the shape over one period repeats forever in both directions. ' +
           'Copy the cycle along the axis every ' + mathSpan('T = ' + perS) + ' to cover the required domain. Done.' +
           '<span class="pattern">' + patternStr() + ' → &hellip;</span>'
      };
    }
  }

  // ---------- UI wiring ----------
  var selFn = document.getElementById('selFn'), selA = document.getElementById('selA'),
      selB = document.getElementById('selB'), selD = document.getElementById('selD');

  function fillSelect(sel, vals, labels) {
    vals.forEach(function (v, i) {
      var o = document.createElement('option');
      o.value = v; o.textContent = labels ? labels[i] : (v < 0 ? MINUS + Math.abs(v) : v);
      sel.appendChild(o);
    });
  }
  fillSelect(selA, A_VALS);
  fillSelect(selB, B_VALS, ['1/2', '1', '2', '3']);
  fillSelect(selD, D_VALS);

  function syncSelects() {
    selFn.value = state.fn; selA.value = state.a; selB.value = state.b; selD.value = state.d;
  }
  [selFn, selA, selB, selD].forEach(function (sel) {
    sel.addEventListener('change', function () {
      state.fn = selFn.value;
      state.a = parseFloat(selA.value);
      state.b = parseFloat(selB.value);
      state.d = parseFloat(selD.value);
      state.step = 0;
      render();
    });
  });

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  document.getElementById('btnRandom').addEventListener('click', function () {
    this.blur();
    var prev = JSON.stringify([state.fn, state.a, state.b, state.d]);
    do {
      state.fn = pick(['sin', 'cos']);
      state.a = pick(A_VALS);
      state.b = pick(B_VALS);
      state.d = pick(D_VALS);
    } while (JSON.stringify([state.fn, state.a, state.b, state.d]) === prev);
    state.step = 0;
    syncSelects();
    render();
  });

  var btnPrev = document.getElementById('btnPrev'), btnNext = document.getElementById('btnNext');
  btnPrev.addEventListener('click', function () { this.blur(); if (state.step > 0) { state.step--; render(); } });
  btnNext.addEventListener('click', function () { this.blur(); if (state.step < N_STEPS - 1) { state.step++; render(); } });
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return; // don't hijack form controls
    if (tag === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;  // native activation handles it
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter' || e.key === 'PageDown') {
      e.preventDefault(); btnNext.click();
    } else if (e.key === 'ArrowLeft' || e.key === 'Backspace' || e.key === 'PageUp') {
      e.preventDefault(); btnPrev.click();
    } else if (e.key === 'n' || e.key === 'N' || e.key === 'r' || e.key === 'R') {
      document.getElementById('btnRandom').click();
    }
  });

  var dotsBox = document.getElementById('dots');
  for (var i = 0; i < N_STEPS; i++) dotsBox.appendChild(document.createElement('span'));

  function render() {
    document.getElementById('eqBar').innerHTML = eqHTML();
    var c = stepContent();
    document.getElementById('stepNum').textContent = 'Step ' + (state.step + 1) + ' of ' + N_STEPS;
    document.getElementById('stepTitle').textContent = c.t;
    document.getElementById('stepBody').innerHTML = c.b;
    var dots = dotsBox.children;
    for (var i = 0; i < dots.length; i++) dots[i].className = i <= state.step ? 'on' : '';
    // feature chips appear once identified in step 1
    var m = model(), show = state.step >= 0;
    var chipAmp = document.getElementById('chipAmp'), chipPer = document.getElementById('chipPer'),
        chipMid = document.getElementById('chipMid');
    chipAmp.innerHTML = 'amplitude <b>' + m.amp + '</b>';
    chipPer.innerHTML = 'period <b><span class="math">' + periodFracStr() + '</span></b>';
    chipMid.innerHTML = 'midline <b><span class="math">y = ' + fmtNum(state.d) + '</span></b>';
    [chipAmp, chipPer, chipMid].forEach(function (ch) { ch.className = 'chip' + (show ? ' show' : ''); });
    btnPrev.disabled = state.step === 0;
    btnNext.disabled = state.step === N_STEPS - 1;
    btnNext.textContent = state.step === N_STEPS - 1 ? 'Done' : 'Next →';
    draw();
  }

  syncSelects();
  render();
})();
</script>
</body>
</html>
