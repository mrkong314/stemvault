<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VCE Physics — Fields Quiz</title>
<style>
  :root{
    --blue:#004EA0; --red:#E01933; --ink:#1c2530; --muted:#5b6773;
    --line:#d8dee6; --bg:#f1f2f2; --card:#ffffff;
    --ok:#0DB14B; --okbg:#eefaf2; --bad:#E01933; --badbg:#fdeef0;
    --hint:#fff8e6; --hintline:#e8c96a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);font-size:15px;line-height:1.5}
  .wrap{max-width:780px;margin:0 auto;padding:18px 14px 60px}
  header.app{background:var(--blue);color:#fff;border-radius:10px;padding:18px 22px;margin-bottom:16px}
  header.app h1{margin:0;font-size:22px;font-weight:bold;letter-spacing:.2px}
  header.app h1 span{color:#ffd2d9;font-weight:bold}
  header.app p{margin:4px 0 0;font-size:13px;color:#cfe0f5}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
  .progress{flex:1;height:8px;background:#dfe4ea;border-radius:4px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--blue);width:0%;transition:width .25s}
  .bar .meta{font-size:13px;color:var(--muted);white-space:nowrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;box-shadow:0 1px 3px rgba(16,34,56,.06)}
  .chips{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .chip{font-size:11.5px;font-weight:bold;padding:3px 10px;border-radius:20px;letter-spacing:.3px}
  .chip.elec{background:#e8f0fa;color:var(--blue)}
  .chip.mag{background:#fdeef0;color:var(--red)}
  .chip.kind{background:#eef1f4;color:var(--muted)}
  .qtext{font-size:16px;margin:2px 0 6px}
  .diagram{margin:14px auto 6px;text-align:center}
  .diagram svg{max-width:100%;height:auto;background:#fbfcfe;border:1px solid var(--line);border-radius:8px}
  .choices{margin-top:12px;display:grid;gap:8px}
  .choice{border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:baseline;background:#fff}
  .choice:hover{border-color:#9db6d6}
  .choice.sel{border-color:var(--blue);background:#eef4fb}
  .choice .lab{font-weight:bold;color:var(--blue);min-width:18px}
  .choice.revealCorrect{border-color:var(--ok);background:var(--okbg)}
  .choice.revealWrong{border-color:var(--bad);background:var(--badbg)}
  .numrow{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .numrow input{font-size:16px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;width:200px;font-family:inherit}
  .numrow input:focus{outline:none;border-color:var(--blue)}
  .numrow .unit{font-size:16px;color:var(--ink)}
  .fmt-note{font-size:12px;color:var(--muted);margin-top:6px}
  .btnrow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
  button{font-family:inherit;font-size:14px;border-radius:8px;padding:9px 18px;cursor:pointer;border:1.5px solid transparent}
  button:disabled{opacity:.45;cursor:default}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:not(:disabled):hover{background:#003d7e}
  .btn-ghost{background:#fff;color:var(--blue);border-color:var(--blue)}
  .btn-ghost:not(:disabled):hover{background:#eef4fb}
  .btn-hint{background:#fff;color:#8a6d1a;border-color:var(--hintline)}
  .btn-hint:not(:disabled):hover{background:var(--hint)}
  .hintbox{display:none;background:var(--hint);border:1px solid var(--hintline);border-radius:8px;padding:12px 16px;margin-top:14px;font-size:14px}
  .hintbox.show{display:block}
  .hintbox h4{margin:0 0 6px;font-size:13px;color:#8a6d1a;letter-spacing:.4px}
  .hintbox .frm{font-size:15px;margin:2px 0}
  .feedback{border-radius:8px;padding:13px 16px;margin-top:16px;display:none;font-size:14.5px}
  .feedback.show{display:block}
  .feedback.good{background:var(--okbg);border:1px solid #9edcb5}
  .feedback.bad{background:var(--badbg);border:1px solid #f2aab4}
  .feedback .verdict{font-weight:bold;margin-bottom:6px}
  .feedback.good .verdict{color:#0a8038}
  .feedback.bad .verdict{color:var(--bad)}
  .worked{color:var(--ink)}
  .summary h2{color:var(--blue);margin:0 0 4px;font-size:24px}
  .summary .score{font-size:40px;font-weight:bold;color:var(--blue);margin:10px 0 2px}
  .sumlist{margin:16px 0 4px;padding:0;list-style:none}
  .sumlist li{display:flex;gap:10px;align-items:baseline;padding:7px 4px;border-bottom:1px solid #eef1f4;font-size:14px}
  .sumlist .mark{font-weight:bold;min-width:18px}
  .sumlist .mark.y{color:var(--ok)} .sumlist .mark.n{color:var(--bad)}
  footer{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}
  sup,sub{line-height:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <h1>VCE Physics <span>·</span> Fields Quiz</h1>
    <p>Electric and magnetic fields — Unit 3 AOS 1. Questions and values are randomised each quiz.</p>
  </header>

  <div class="bar">
    <div class="progress"><i id="pbar"></i></div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="card" id="stage"></div>

  <footer>Answers are marked to 3 significant figures with a ±3% tolerance. Constants follow the VCAA data sheet.</footer>
</div>

<script>
"use strict";
/* ---------------- constants & helpers ---------------- */
const K = {k:8.99e9, e:1.6e-19, me:9.1e-31, mp:1.67e-27};
const QUIZ_LEN = 10;

const ri   = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function fmt(x){ // 3 s.f., ×10^n notation where sensible (HTML string)
  if(!isFinite(x)) return "?";
  if(x===0) return "0";
  const exp = Math.floor(Math.log10(Math.abs(x)));
  if(exp>=-2 && exp<=3) return String(Number(x.toPrecision(3)));
  let m = Number((x/Math.pow(10,exp)).toPrecision(3));
  if(Math.abs(m)>=10){m/=10;} // safety after rounding
  return m+" × 10<sup>"+exp+"</sup>";
}
function parseAns(s){
  if(!s) return NaN;
  s = String(s).trim().replace(/\s+/g,"")
       .replace(/,/g,"")
       .replace(/[×xX*]10\^?/g,"e")
       .replace(/\^/g,"");
  return Number(s);
}

/* ---------------- SVG builders ---------------- */
const DEFS = `<defs>
 <marker id="aD" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#333d47"/></marker>
 <marker id="aB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#004EA0"/></marker>
 <marker id="aG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#8a97a8"/></marker>
</defs>
<style>
 .lbl{font:13px Arial;fill:#1c2530}
 .lblB{font:bold 13px Arial;fill:#004EA0}
 .sml{font:11.5px Arial;fill:#5b6773}
 .fs{font:15px Arial;fill:#8a97a8;text-anchor:middle}
 .plate{fill:#55606b}
 .wire{stroke:#004EA0;stroke-width:3;fill:none}
 .dash{stroke:#9aa6b2;stroke-width:1;stroke-dasharray:4 4;fill:none}
 .arrD{stroke:#333d47;stroke-width:1.6;fill:none;marker-end:url(#aD)}
 .arrB{stroke:#004EA0;stroke-width:2.2;fill:none;marker-end:url(#aB)}
 .arrG{stroke:#8a97a8;stroke-width:1.4;fill:none;marker-end:url(#aG)}
</style>`;

const svgWrap=(inner,w=380,h=215)=>`<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img">${DEFS}${inner}</svg>`;

function chargeGlyph(x,y,sign,label,small){
  const r = small?10:14;
  const pos = sign>0;
  const c = pos? '#E01933':'#004EA0';
  const f = pos? '#fdecee':'#e8f0fa';
  const t = pos? '+':'−';
  let s = `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" stroke="${c}" stroke-width="2"/>`+
          `<text x="${x}" y="${y+5}" text-anchor="middle" style="font:bold ${small?13:15}px Arial;fill:${c}">${t}</text>`;
  if(label) s += `<text x="${x}" y="${y+r+16}" text-anchor="middle" class="lbl">${label}</text>`;
  return s;
}
function regionSyms(into,x0,y0,x1,y1,step=44){
  let s=`<rect x="${x0-16}" y="${y0-16}" width="${x1-x0+32}" height="${y1-y0+32}" class="dash"/>`;
  for(let y=y0;y<=y1;y+=step)for(let x=x0;x<=x1;x+=step){
    if(into) s+=`<text x="${x}" y="${y+5}" class="fs">×</text>`;
    else     s+=`<circle cx="${x}" cy="${y}" r="6" fill="none" stroke="#8a97a8" stroke-width="1.3"/><circle cx="${x}" cy="${y}" r="1.7" fill="#8a97a8"/>`;
  }
  return s;
}
function regionLabel(into,x,y){
  return `<text x="${x}" y="${y}" class="lblB">B ${into?'(into page)':'(out of page)'}</text>`;
}

function svgTwoCharges(s1,s2,l1,l2,rl){
  let s = chargeGlyph(100,95,s1,l1)+chargeGlyph(280,95,s2,l2);
  s += `<line x1="122" y1="150" x2="258" y2="150" class="arrD"/><line x1="258" y1="150" x2="122" y2="150" class="arrD"/>`;
  s += `<text x="190" y="172" text-anchor="middle" class="lbl">${rl}</text>`;
  return svgWrap(s,380,195);
}
function svgPointField(sign,rl){
  const cx=105,cy=105;let s="";
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4, x1=cx+22*Math.cos(a), y1=cy+22*Math.sin(a), x2=cx+62*Math.cos(a), y2=cy+62*Math.sin(a);
    s += sign>0 ? `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="arrG"/>`
                : `<line x1="${x2}" y1="${y2}" x2="${x1}" y2="${y1}" class="arrG"/>`;
  }
  s += chargeGlyph(cx,cy,sign,"");
  s += `<circle cx="300" cy="${cy}" r="3.5" fill="#1c2530"/><text x="300" y="${cy-10}" text-anchor="middle" class="lbl">P</text>`;
  s += `<line x1="${cx+70}" y1="${cy+26}" x2="296" y2="${cy+26}" class="dash"/>`;
  s += `<text x="${(cx+300)/2+20}" y="${cy+44}" text-anchor="middle" class="lbl">${rl}</text>`;
  return svgWrap(s,380,205);
}
function svgPlates(topSign,vLabel,dLabel,centreCharge){
  const x0=70,x1=310,yT=52,yB=168;
  let s = `<rect x="${x0}" y="${yT-7}" width="${x1-x0}" height="7" class="plate"/>`+
          `<rect x="${x0}" y="${yB}" width="${x1-x0}" height="7" class="plate"/>`;
  for(let x=x0+15;x<x1;x+=30){
    s += `<text x="${x}" y="${yT-13}" text-anchor="middle" style="font:bold 13px Arial;fill:${topSign>0?'#E01933':'#004EA0'}">${topSign>0?'+':'−'}</text>`;
    s += `<text x="${x}" y="${yB+22}" text-anchor="middle" style="font:bold 13px Arial;fill:${topSign>0?'#004EA0':'#E01933'}">${topSign>0?'−':'+'}</text>`;
  }
  // field arrows (from + to −)
  for(let x=x0+40;x<x1-20;x+=55){
    s += topSign>0
      ? `<line x1="${x}" y1="${yT+12}" x2="${x}" y2="${yB-14}" class="arrG"/>`
      : `<line x1="${x}" y1="${yB-12}" x2="${x}" y2="${yT+14}" class="arrG"/>`;
  }
  if(dLabel){
    s += `<line x1="${x1+22}" y1="${yT+4}" x2="${x1+22}" y2="${yB-4}" class="arrD"/><line x1="${x1+22}" y1="${yB-4}" x2="${x1+22}" y2="${yT+4}" class="arrD"/>`;
    s += `<text x="${x1+32}" y="${(yT+yB)/2+4}" class="lbl">${dLabel}</text>`;
  }
  if(vLabel) s += `<text x="190" y="22" text-anchor="middle" class="lblB">${vLabel}</text>`;
  if(centreCharge) s += chargeGlyph(190,(yT+yB)/2,centreCharge.sign,centreCharge.label,true);
  return svgWrap(s,430,205);
}
function svgWireInField(into,dir,iLabel,lLabel){
  const x0=88,y0=62,x1=308,y1=172;
  let s = regionSyms(into,x0,y0,x1,y1);
  const cy=(y0+y1)/2, cx=(x0+x1)/2;
  if(dir==='right'||dir==='left'){
    s += `<line x1="${x0-40}" y1="${cy}" x2="${x1+40}" y2="${cy}" class="wire"/>`;
    s += dir==='right'
      ? `<line x1="${cx-24}" y1="${cy-14}" x2="${cx+30}" y2="${cy-14}" class="arrB"/>`
      : `<line x1="${cx+30}" y1="${cy-14}" x2="${cx-24}" y2="${cy-14}" class="arrB"/>`;
    s += `<text x="${cx+42}" y="${cy-20}" class="lblB">${iLabel}</text>`;
    if(lLabel){
      s += `<line x1="${x0-16}" y1="${y1+34}" x2="${x1+16}" y2="${y1+34}" class="arrD"/><line x1="${x1+16}" y1="${y1+34}" x2="${x0-16}" y2="${y1+34}" class="arrD"/>`;
      s += `<text x="${cx}" y="${y1+52}" text-anchor="middle" class="lbl">${lLabel}</text>`;
    }
  }else{
    s += `<line x1="${cx}" y1="${y0-38}" x2="${cx}" y2="${y1+38}" class="wire"/>`;
    s += dir==='up'
      ? `<line x1="${cx+14}" y1="${cy+26}" x2="${cx+14}" y2="${cy-28}" class="arrB"/>`
      : `<line x1="${cx+14}" y1="${cy-28}" x2="${cx+14}" y2="${cy+26}" class="arrB"/>`;
    s += `<text x="${cx+24}" y="${cy+4}" class="lblB">${iLabel}</text>`;
  }
  s += regionLabel(into,x0-16,y0-26);
  return svgWrap(s,400,lLabel?235:215);
}
function svgParticleEntering(into,sign,pl,vLabel){
  const x0=140,y0=58,x1=330,y1=168;
  let s = regionSyms(into,x0,y0,x1,y1);
  const cy=(y0+y1)/2;
  s += chargeGlyph(62,cy,sign,pl,true);
  s += `<line x1="80" y1="${cy}" x2="${x0-24}" y2="${cy}" class="arrB"/>`;
  s += `<text x="${(80+x0)/2-8}" y="${cy-12}" class="lblB">${vLabel||'v'}</text>`;
  s += regionLabel(into,x0-16,y0-26);
  return svgWrap(s,400,205);
}
function svgCircularPath(into,sign,pl){
  const x0=120,y0=56,x1=330,y1=176;
  let s = regionSyms(into,x0,y0,x1,y1,52);
  const cx=(x0+x1)/2, cy=(y0+y1)/2, r=52;
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" class="dash"/>`;
  s += chargeGlyph(cx+r,cy,sign,"",true);
  s += `<line x1="${cx+r}" y1="${cy-16}" x2="${cx+r}" y2="${cy-58}" class="arrB"/>`;
  s += `<text x="${cx+r+12}" y="${cy-38}" class="lblB">v</text>`;
  if(pl) s += `<text x="${cx+r+16}" y="${cy+22}" class="lbl">${pl}</text>`;
  s += regionLabel(into,x0-16,y0-26);
  return svgWrap(s,400,205);
}
function svgWireEndOn(out){
  const cx=190,cy=105;
  let s = `<circle cx="${cx}" cy="${cy}" r="40" class="dash"/><circle cx="${cx}" cy="${cy}" r="70" class="dash"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="14" fill="#fff" stroke="#004EA0" stroke-width="2.5"/>`;
  s += out ? `<circle cx="${cx}" cy="${cy}" r="3" fill="#004EA0"/>`
           : `<line x1="${cx-8}" y1="${cy-8}" x2="${cx+8}" y2="${cy+8}" stroke="#004EA0" stroke-width="2.5"/><line x1="${cx-8}" y1="${cy+8}" x2="${cx+8}" y2="${cy-8}" stroke="#004EA0" stroke-width="2.5"/>`;
  s += `<text x="${cx}" y="${cy+100}" text-anchor="middle" class="sml">wire seen end-on, current ${out?'out of':'into'} the page</text>`;
  return svgWrap(s,380,215);
}
function svgGun(particle,vLabel){
  const isNeg = particle.q<0;
  const xL=105,xR=255,y0=48,y1=172;
  let s="";
  // start plate (same sign as particle charge? particle accelerates away from like plate)
  const leftSign = isNeg? -1: 1, rightSign = -leftSign;
  s += `<rect x="${xL-7}" y="${y0}" width="7" height="${y1-y0}" class="plate"/>`;
  s += `<rect x="${xR}" y="${y0}" width="7" height="${(y1-y0)/2-16}" class="plate"/>`;
  s += `<rect x="${xR}" y="${(y0+y1)/2+16}" width="7" height="${(y1-y0)/2-16}" class="plate"/>`;
  for(let y=y0+14;y<y1;y+=26){
    s += `<text x="${xL-18}" y="${y+4}" text-anchor="middle" style="font:bold 13px Arial;fill:${leftSign>0?'#E01933':'#004EA0'}">${leftSign>0?'+':'−'}</text>`;
    s += `<text x="${xR+22}" y="${y+4}" text-anchor="middle" style="font:bold 13px Arial;fill:${rightSign>0?'#E01933':'#004EA0'}">${rightSign>0?'+':'−'}</text>`;
  }
  const cy=(y0+y1)/2;
  s += chargeGlyph(xL+30,cy,isNeg?-1:1,particle.name,true);
  s += `<line x1="${xL+52}" y1="${cy}" x2="${xR-24}" y2="${cy}" class="arrB"/>`;
  s += `<text x="${(xL+xR)/2}" y="${cy-12}" text-anchor="middle" class="lblB">${vLabel||''}</text>`;
  s += `<text x="${(xL+xR)/2}" y="${y0-14}" text-anchor="middle" class="lblB">accelerating p.d. shown as V</text>`;
  return svgWrap(s,380,205);
}

/* ---------------- direction utilities ---------------- */
const DIRS = {up:[0,1],down:[0,-1],left:[-1,0],right:[1,0]};
const DNAME = {"0,1":"upwards (towards the top of the page)","0,-1":"downwards (towards the bottom of the page)","-1,0":"to the left","1,0":"to the right"};
function crossZ(v,bz){ // (vx,vy,0) × (0,0,bz)
  return [v[1]*bz, -v[0]*bz];
}
function dirName(v){ return DNAME[v[0]+","+v[1]]; }

/* ---------------- particles ---------------- */
const ELECTRON = {name:"electron", q:-K.e, qm:K.e, m:K.me, qStr:"1.6 × 10<sup>−19</sup> C", mStr:"9.1 × 10<sup>−31</sup> kg"};
const PROTON   = {name:"proton",   q:+K.e, qm:K.e, m:K.mp, qStr:"1.6 × 10<sup>−19</sup> C", mStr:"1.67 × 10<sup>−27</sup> kg"};

const HINT_K  = "k = 8.99 × 10<sup>9</sup> N m<sup>2</sup> C<sup>−2</sup>";
const HINT_E  = "e = 1.6 × 10<sup>−19</sup> C";
const HINT_ME = "m<sub>e</sub> = 9.1 × 10<sup>−31</sup> kg";
const HINT_MP = "m<sub>p</sub> = 1.67 × 10<sup>−27</sup> kg";

function hintHTML(lines){
  return lines.map(l=>`<p class="frm">${l}</p>`).join("");
}
function mcChoices(correct,distractors){
  const opts = shuffle([{h:correct,ok:true}].concat(distractors.map(d=>({h:d,ok:false}))));
  return opts;
}

/* ---------------- question bank ---------------- */
const BANK = [

/* E1 — Coulomb's law */
function(){
  const q1=ri(2,9), q2=ri(2,9);
  const rcm=pick([10,20,25,40,50,80]);
  const r=rcm/100;
  const ans=K.k*q1*1e-6*q2*1e-6/(r*r);
  const s1=pick([1,-1]), s2=pick([1,-1]);
  return {topic:"elec", kind:"num", tag:"Coulomb's law",
    prompt:`Two point charges, q<sub>1</sub> = ${q1}.0 µC and q<sub>2</sub> = ${q2}.0 µC, are separated by ${rcm} cm in a vacuum. Calculate the magnitude of the electric force between them.`,
    svg: svgTwoCharges(s1,s2,`q₁ = ${q1}.0 µC`,`q₂ = ${q2}.0 µC`,`r = ${rcm} cm`),
    unit:"N", ans,
    hint: hintHTML([`F = kq<sub>1</sub>q<sub>2</sub> / r<sup>2</sup>`, HINT_K, `1 µC = 10<sup>−6</sup> C, and r must be in metres (${rcm} cm = ${r} m).`]),
    sol:`F = kq₁q₂/r² = (8.99 × 10<sup>9</sup> × ${q1}.0 × 10<sup>−6</sup> × ${q2}.0 × 10<sup>−6</sup>) / (${r})<sup>2</sup> = <b>${fmt(ans)} N</b>`};
},

/* E2 — field of a point charge */
function(){
  const Q=ri(2,9);
  const r=pick([0.5,1.0,1.5,2.0,2.5,3.0]);
  const ans=K.k*Q*1e-6/(r*r);
  const sign=pick([1,-1]);
  return {topic:"elec", kind:"num", tag:"Field of a point charge",
    prompt:`A point charge of magnitude ${Q}.0 µC creates an electric field. Calculate the magnitude of the electric field strength at point P, a distance of ${r.toFixed(1)} m from the charge.`,
    svg: svgPointField(sign,`r = ${r.toFixed(1)} m`),
    unit:"N C⁻¹", ans,
    hint: hintHTML([`E = kQ / r<sup>2</sup>`, HINT_K, `1 µC = 10<sup>−6</sup> C.`]),
    sol:`E = kQ/r² = (8.99 × 10<sup>9</sup> × ${Q}.0 × 10<sup>−6</sup>) / (${r.toFixed(1)})<sup>2</sup> = <b>${fmt(ans)} N C<sup>−1</sup></b>`};
},

/* E3 — uniform field between plates */
function(){
  const V=pick([100,150,200,250,300,400,500,800,1000,1500,2000,3000]);
  const dmm=pick([2,4,5,8,10,20,25,40,50]);
  const ans=V/(dmm/1000);
  const top=pick([1,-1]);
  return {topic:"elec", kind:"num", tag:"Uniform field between plates",
    prompt:`Two parallel plates are connected to a ${V} V supply and separated by ${dmm} mm. Calculate the magnitude of the electric field strength between the plates.`,
    svg: svgPlates(top,`V = ${V} V`,`d = ${dmm} mm`,null),
    unit:"V m⁻¹", ans,
    hint: hintHTML([`E = V / d`, `d must be in metres: ${dmm} mm = ${dmm/1000} m.`, `The field between parallel plates is uniform; V m<sup>−1</sup> is equivalent to N C<sup>−1</sup>.`]),
    sol:`E = V/d = ${V} / ${dmm/1000} = <b>${fmt(ans)} V m<sup>−1</sup></b>`};
},

/* E4 — force on a charge in a uniform field */
function(){
  const which=pick(["electron","proton","charge"]);
  const E=pick([2000,5000,8000,1e4,2e4,4e4,5e4]);
  let q,qHtml,body,extraHint;
  if(which==="charge"){
    const qq=ri(2,9); q=qq*1e-6;
    qHtml=`${qq}.0 µC`;
    body=`A small object carrying a charge of ${qHtml} is placed in a uniform electric field of strength ${fmt(E)} N C<sup>−1</sup>.`;
    extraHint=`1 µC = 10<sup>−6</sup> C.`;
  }else{
    q=K.e; qHtml=which;
    body=`A${which==="electron"?"n":""} ${which} is placed in a uniform electric field of strength ${fmt(E)} N C<sup>−1</sup>.`;
    extraHint=HINT_E;
  }
  const ans=q*E;
  const top=pick([1,-1]);
  return {topic:"elec", kind:"num", tag:"Force in a uniform field",
    prompt:`${body} Calculate the magnitude of the electric force acting on it.`,
    svg: svgPlates(top,"","",{sign:(which==="electron")?-1:1,label:which==="charge"?qHtml:which}),
    unit:"N", ans,
    hint: hintHTML([`F = qE`, extraHint]),
    sol:`F = qE = ${fmt(q)} × ${fmt(E)} = <b>${fmt(ans)} N</b>`};
},

/* E5 — work done, W = qV */
function(){
  const p=pick([ELECTRON,PROTON]);
  const V=pick([100,200,250,400,500,800,1000,1500,2000,2500,5000]);
  const ans=K.e*V;
  return {topic:"elec", kind:"num", tag:"Energy from a p.d.",
    prompt:`A${p.name==="electron"?"n":""} ${p.name}, initially at rest, is accelerated through a potential difference of ${V} V. Calculate the kinetic energy it gains, in joules.`,
    svg: svgGun(p,`V = ${V} V`),
    unit:"J", ans,
    hint: hintHTML([`W = qV`, HINT_E, `The work done by the field equals the kinetic energy gained.`]),
    sol:`W = qV = 1.6 × 10<sup>−19</sup> × ${V} = <b>${fmt(ans)} J</b>`};
},

/* E6 — direction of force between plates */
function(){
  const top=pick([1,-1]);          // sign of top plate
  const cs=pick([1,-1]);           // sign of the charge
  const Edir = top>0? [0,-1]:[0,1];   // E points from + to −
  const Fdir = cs>0? Edir : [Edir[0]*-1,Edir[1]*-1];
  const correct = Fdir[1]>0 ? "Towards the top plate" : "Towards the bottom plate";
  const wrong1  = Fdir[1]>0 ? "Towards the bottom plate" : "Towards the top plate";
  return {topic:"elec", kind:"mc", tag:"Force direction in a uniform field",
    prompt:`The diagram shows a ${cs>0?"positive":"negative"} charge held at rest between two charged parallel plates. In which direction is the electric force on the charge?`,
    svg: svgPlates(top,"","",{sign:cs,label:""}),
    choices: mcChoices(correct,[wrong1,"To the left","There is no force on a stationary charge"]),
    hint: hintHTML([`Field lines run from the positive plate to the negative plate.`,`F = qE: a positive charge is forced in the direction of E; a negative charge is forced opposite to E.`]),
    sol:`The top plate is ${top>0?"positive":"negative"}, so E points ${top>0?"downwards":"upwards"}. The charge is ${cs>0?"positive, so the force is in the direction of E":"negative, so the force is opposite to E"} — <b>${correct.toLowerCase()}</b>. (A stationary charge still experiences an electric force.)`};
},

/* E7 — inverse square */
function(){
  const n=pick([2,3,4]);
  const correct=`E₀ / ${n*n}`;
  return {topic:"elec", kind:"mc", tag:"Inverse square law",
    prompt:`The electric field strength at point X, a distance r from an isolated point charge, is E₀. What is the field strength at point P, a distance ${n}r from the charge?`,
    svg: svgPointField(1,`X at r, P at ${n}r`),
    choices: mcChoices(correct,[`E₀ / ${n}`,`${n}E₀`,`${n*n}E₀`]),
    hint: hintHTML([`E = kQ / r<sup>2</sup>, so E ∝ 1 / r<sup>2</sup>.`,`Multiplying the distance by ${n} divides the field strength by ${n}<sup>2</sup>.`]),
    sol:`E ∝ 1/r². At distance ${n}r the field is E₀/${n}² = <b>E₀/${n*n}</b>.`};
},

/* E8 — speed after acceleration */
function(){
  const p=pick([ELECTRON,PROTON]);
  const V=p.name==="electron"?pick([100,250,500,1000,2000,5000]):pick([500,1000,2000,5000,10000]);
  const ans=Math.sqrt(2*K.e*V/p.m);
  return {topic:"elec", kind:"num", tag:"Accelerated charge (electron gun)",
    prompt:`A${p.name==="electron"?"n":""} ${p.name}, initially at rest, is accelerated through a potential difference of ${V} V. Calculate its final speed.`,
    svg: svgGun(p,`V = ${V} V`),
    unit:"m s⁻¹", ans,
    hint: hintHTML([`qV = ½mv<sup>2</sup>  →  v = √(2qV / m)`, HINT_E, p.name==="electron"?HINT_ME:HINT_MP]),
    sol:`qV = ½mv² → v = √(2 × 1.6 × 10<sup>−19</sup> × ${V} / ${p.name==="electron"?"9.1 × 10<sup>−31</sup>":"1.67 × 10<sup>−27</sup>"}) = <b>${fmt(ans)} m s<sup>−1</sup></b>`};
},

/* M1 — F = BIl */
function(){
  const B=pick([0.02,0.05,0.10,0.20,0.25,0.40,0.50]);
  const I=pick([0.5,1.0,1.5,2.0,3.0,4.0,5.0,8.0]);
  const lcm=pick([5,8,10,15,20,25,40,50]);
  const ans=B*I*(lcm/100);
  const into=pick([true,false]);
  return {topic:"mag", kind:"num", tag:"Force on a current-carrying wire",
    prompt:`A straight wire carries a current of ${I.toFixed(1)} A at right angles to a uniform magnetic field of ${B.toFixed(2)} T. A ${lcm} cm length of the wire lies within the field. Calculate the magnitude of the magnetic force on the wire.`,
    svg: svgWireInField(into,"right",`I = ${I.toFixed(1)} A`,`l = ${lcm} cm`),
    unit:"N", ans,
    hint: hintHTML([`F = BIl (current perpendicular to B)`,`l must be in metres: ${lcm} cm = ${lcm/100} m.`]),
    sol:`F = BIl = ${B.toFixed(2)} × ${I.toFixed(1)} × ${lcm/100} = <b>${fmt(ans)} N</b>`};
},

/* M2 — direction of force on a wire */
function(){
  const into=pick([true,false]);
  const cd=pick(["up","down","left","right"]);
  const F=crossZ(DIRS[cd], into?-1:1);
  const correct="The force is directed "+dirName(F).split(" (")[0];
  const opp="The force is directed "+dirName([-F[0],-F[1]]).split(" (")[0];
  const par="The force is directed "+cd.replace("up","upwards").replace("down","downwards").replace("left","to the left").replace("right","to the right");
  return {topic:"mag", kind:"mc", tag:"Right-hand rule — wire",
    prompt:`The diagram shows a wire carrying a conventional current in a uniform magnetic field directed ${into?"into":"out of"} the page. In which direction is the magnetic force on the wire?`,
    svg: svgWireInField(into,cd,"I",""),
    choices: mcChoices(correct,[opp,par,"There is no force on the wire"]),
    hint: hintHTML([`Right-hand slap rule: fingers point in the direction of B, thumb points in the direction of conventional current, the palm pushes in the direction of the force.`,`F = IlB when the current is perpendicular to B.`]),
    sol:`With current ${par.replace("The force is directed ","")} and B ${into?"into":"out of"} the page, the right-hand rule gives a force ${dirName(F).split(" (")[0]}. <b>${correct}.</b>`};
},

/* M3 — F = qvB */
function(){
  const p=pick([ELECTRON,PROTON]);
  const v=pick([2e5,5e5,1e6,2e6,5e6,8e6,1e7]);
  const Bmt=pick([1,2,5,10,50,100,200]);
  const B=Bmt/1000;
  const ans=K.e*v*B;
  const into=pick([true,false]);
  return {topic:"mag", kind:"num", tag:"Force on a moving charge",
    prompt:`A${p.name==="electron"?"n":""} ${p.name} moves at ${fmt(v)} m s<sup>−1</sup> at right angles to a uniform magnetic field of ${Bmt} mT. Calculate the magnitude of the magnetic force on it.`,
    svg: svgParticleEntering(into,p.q>0?1:-1,p.name,"v"),
    unit:"N", ans,
    hint: hintHTML([`F = qvB (v perpendicular to B)`, HINT_E, `1 mT = 10<sup>−3</sup> T.`]),
    sol:`F = qvB = 1.6 × 10<sup>−19</sup> × ${fmt(v)} × ${fmt(B)} = <b>${fmt(ans)} N</b>`};
},

/* M4 — radius of circular path */
function(){
  const p=pick([ELECTRON,PROTON]);
  const v = p.name==="electron"? pick([5e6,1e7,2e7]) : pick([5e5,1e6,2e6]);
  const B = p.name==="electron"? pick([0.5e-3,1e-3,2e-3,5e-3]) : pick([0.05,0.1,0.2,0.5]);
  const ans=p.m*v/(K.e*B);
  const into=pick([true,false]);
  return {topic:"mag", kind:"num", tag:"Radius of circular motion",
    prompt:`A${p.name==="electron"?"n":""} ${p.name} moving at ${fmt(v)} m s<sup>−1</sup> enters a uniform magnetic field of ${fmt(B)} T at right angles to the field and follows a circular path. Calculate the radius of the path.`,
    svg: svgCircularPath(into,p.q>0?1:-1,p.name),
    unit:"m", ans,
    hint: hintHTML([`The magnetic force provides the centripetal force: qvB = mv<sup>2</sup>/r  →  r = mv / (qB)`, HINT_E, p.name==="electron"?HINT_ME:HINT_MP]),
    sol:`r = mv/(qB) = (${p.name==="electron"?"9.1 × 10<sup>−31</sup>":"1.67 × 10<sup>−27</sup>"} × ${fmt(v)}) / (1.6 × 10<sup>−19</sup> × ${fmt(B)}) = <b>${fmt(ans)} m</b>`};
},

/* M5 — deflection direction of a moving charge */
function(){
  const into=pick([true,false]);
  const p=pick([ELECTRON,PROTON]);
  const F=crossZ(DIRS.right, into?-1:1);       // v × B for positive charge
  const Fq = p.q>0? F : [-F[0],-F[1]];
  const correct=`It is initially deflected ${Fq[1]>0?"upwards":"downwards"}`;
  const wrong=`It is initially deflected ${Fq[1]>0?"downwards":"upwards"}`;
  return {topic:"mag", kind:"mc", tag:"Deflection of a moving charge",
    prompt:`A${p.name==="electron"?"n":""} ${p.name} enters a region of uniform magnetic field (directed ${into?"into":"out of"} the page) moving to the right, as shown. What happens to the ${p.name} as it enters the field?`,
    svg: svgParticleEntering(into,p.q>0?1:-1,p.name,"v"),
    choices: mcChoices(correct,[wrong,"It is not deflected","It speeds up in its original direction"]),
    hint: hintHTML([`F = qvB, directed by the right-hand slap rule for a positive charge (fingers → B, thumb → v, palm → F).`, p.q<0?`For an electron the force is opposite to the palm-push direction.`:`A proton carries positive charge, so the palm-push direction applies directly.`]),
    sol:`Using the right-hand rule with v to the right and B ${into?"into":"out of"} the page${p.q<0?", then reversing for the negative charge of the electron":""}, the initial force is ${Fq[1]>0?"upwards":"downwards"} — <b>${correct.toLowerCase()}</b>. The particle then follows a circular arc at constant speed.`};
},

/* M6 — field around a wire end-on */
function(){
  const out=pick([true,false]);
  const correct=`Concentric circles, ${out?"anticlockwise":"clockwise"} around the wire`;
  const wrong=`Concentric circles, ${out?"clockwise":"anticlockwise"} around the wire`;
  return {topic:"mag", kind:"mc", tag:"Field of a straight wire",
    prompt:`The diagram shows a straight current-carrying wire viewed end-on, with the conventional current flowing ${out?"out of":"into"} the page. Which best describes the magnetic field around the wire?`,
    svg: svgWireEndOn(out),
    choices: mcChoices(correct,[wrong,"Straight lines pointing radially away from the wire","Straight lines parallel to the wire"]),
    hint: hintHTML([`Right-hand grip rule: thumb points in the direction of conventional current, fingers curl in the direction of the field lines.`]),
    sol:`Gripping the wire with the thumb ${out?"out of":"into"} the page, the fingers curl <b>${out?"anticlockwise":"clockwise"}</b>. Field lines around a straight wire are concentric circles.`};
},

/* M7 — work done by the magnetic force */
function(){
  const p=pick([ELECTRON,PROTON]);
  const into=pick([true,false]);
  const correct="Its speed stays constant, because the magnetic force does no work on it";
  return {topic:"mag", kind:"mc", tag:"Work done by the magnetic force",
    prompt:`A${p.name==="electron"?"n":""} ${p.name} moves in a circular path in a uniform magnetic field, as shown. Which statement about its motion is correct?`,
    svg: svgCircularPath(into,p.q>0?1:-1,p.name),
    choices: mcChoices(correct,[
      "Its kinetic energy increases as the magnetic force does positive work",
      "Its speed gradually decreases as the field absorbs its energy",
      "Its momentum is constant throughout the motion"]),
    hint: hintHTML([`The magnetic force is always perpendicular to the velocity.`,`W = Fs cos θ, and θ = 90° at every instant.`]),
    sol:`The magnetic force is always perpendicular to v, so it does no work: speed and kinetic energy are constant. (Momentum is <i>not</i> constant — its direction changes continuously.) <b>${correct}.</b>`};
}
];

/* ---------------- quiz state & UI ---------------- */
let quiz=[], idx=0, results=[];

function newQuiz(){
  const gens = shuffle(BANK).slice(0,QUIZ_LEN);
  quiz = gens.map(g=>g());
  idx=0; results=quiz.map(()=>null);
  render();
}
function score(){ return results.filter(r=>r===true).length; }
function answeredCount(){ return results.filter(r=>r!==null).length; }

function setProgress(){
  const done=answeredCount();
  document.getElementById("pbar").style.width=(100*done/QUIZ_LEN)+"%";
  document.getElementById("meta").textContent =
    idx<QUIZ_LEN ? `Question ${idx+1} of ${QUIZ_LEN} · Score ${score()}/${done}` : `Complete · ${score()}/${QUIZ_LEN}`;
}

function render(){
  setProgress();
  const stage=document.getElementById("stage");
  if(idx>=QUIZ_LEN){ renderSummary(stage); return; }
  const q=quiz[idx];
  let inner=`
    <div class="chips">
      <span class="chip ${q.topic}">${q.topic==="elec"?"ELECTRIC FIELDS":"MAGNETIC FIELDS"}</span>
      <span class="chip kind">${q.kind==="mc"?"MULTIPLE CHOICE":"CALCULATION"}</span>
      <span class="chip kind">${q.tag.toUpperCase()}</span>
    </div>
    <p class="qtext">${q.prompt}</p>
    <div class="diagram">${q.svg||""}</div>`;
  if(q.kind==="mc"){
    inner+=`<div class="choices" id="choices">`+
      q.choices.map((c,i)=>`<div class="choice" data-i="${i}"><span class="lab">${"ABCD"[i]}.</span><span>${c.h}</span></div>`).join("")+
      `</div>`;
  }else{
    inner+=`<div class="numrow">
        <label for="ansIn">Answer:</label>
        <input id="ansIn" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 3.2e-5">
        <span class="unit">${q.unit}</span>
      </div>
      <div class="fmt-note">Scientific notation accepted: 3.2e-5, 3.2 × 10^-5 or 0.000032. Marked to within ±3%.</div>`;
  }
  inner+=`
    <div class="btnrow">
      <button class="btn-hint" id="hintBtn">Show hint</button>
      <button class="btn-primary" id="checkBtn">Check answer</button>
      <button class="btn-ghost" id="nextBtn" disabled>Next question →</button>
    </div>
    <div class="hintbox" id="hintbox"><h4>HINT — FORMULAS &amp; VALUES</h4>${q.hint}</div>
    <div class="feedback" id="fb"><div class="verdict" id="fbv"></div><div class="worked" id="fbw"></div></div>`;
  stage.innerHTML=inner;

  let sel=-1;
  if(q.kind==="mc"){
    stage.querySelectorAll(".choice").forEach(el=>{
      el.addEventListener("click",()=>{
        if(results[idx]!==null) return;
        stage.querySelectorAll(".choice").forEach(e=>e.classList.remove("sel"));
        el.classList.add("sel"); sel=+el.dataset.i;
      });
    });
  }else{
    const inp=document.getElementById("ansIn");
    inp.focus();
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("checkBtn").click(); });
  }

  document.getElementById("hintBtn").addEventListener("click",function(){
    const hb=document.getElementById("hintbox");
    hb.classList.toggle("show");
    this.textContent=hb.classList.contains("show")?"Hide hint":"Show hint";
  });

  document.getElementById("checkBtn").addEventListener("click",function(){
    if(results[idx]!==null) return;
    const fb=document.getElementById("fb"), fbv=document.getElementById("fbv"), fbw=document.getElementById("fbw");
    let good;
    if(q.kind==="mc"){
      if(sel<0){ fbv.textContent="Select an option first."; fbw.innerHTML=""; fb.className="feedback show bad"; return; }
      good=q.choices[sel].ok;
      stage.querySelectorAll(".choice").forEach((el,i)=>{
        if(q.choices[i].ok) el.classList.add("revealCorrect");
        else if(i===sel) el.classList.add("revealWrong");
      });
    }else{
      const u=parseAns(document.getElementById("ansIn").value);
      if(isNaN(u)){ fbv.textContent="Could not read that number — try a form like 3.2e-5."; fbw.innerHTML=""; fb.className="feedback show bad"; return; }
      good=Math.abs(u-q.ans)<=0.03*Math.abs(q.ans);
      document.getElementById("ansIn").disabled=true;
    }
    results[idx]=good;
    if(good) fbv.textContent = "Correct.";
    else fbv.innerHTML = q.kind==="num" ? "Not quite — the answer is "+fmt(q.ans)+" "+q.unit+"." : "Not quite.";
    fbw.innerHTML = "<b>Worked solution: </b>"+q.sol;
    fb.className="feedback show "+(good?"good":"bad");
    this.disabled=true;
    document.getElementById("hintBtn").disabled=false;
    document.getElementById("nextBtn").disabled=false;
    document.getElementById("nextBtn").focus();
    setProgress();
  });

  document.getElementById("nextBtn").addEventListener("click",()=>{ idx++; render(); });
}

function renderSummary(stage){
  const s=score();
  const pct=Math.round(100*s/QUIZ_LEN);
  const remark = pct>=90? "Excellent — exam-ready on this topic."
               : pct>=70? "Solid. Review the worked solutions for the ones you missed."
               : pct>=50? "A reasonable base — target the topics marked ✗ below."
               : "Worth revisiting the formula sheet and re-attempting a fresh quiz.";
  stage.innerHTML=`
    <div class="summary">
      <h2>Quiz complete</h2>
      <div class="score">${s} / ${QUIZ_LEN}</div>
      <p>${remark}</p>
      <ul class="sumlist">
        ${quiz.map((q,i)=>`<li><span class="mark ${results[i]?"y":"n"}">${results[i]?"✓":"✗"}</span><span>${q.tag} <span style="color:var(--muted)">· ${q.topic==="elec"?"electric":"magnetic"}</span></span></li>`).join("")}
      </ul>
      <div class="btnrow"><button class="btn-primary" id="againBtn">New quiz (new questions &amp; values)</button></div>
    </div>`;
  document.getElementById("againBtn").addEventListener("click",newQuiz);
}

window.__BANK = BANK; // for automated testing
newQuiz();
</script>
