<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 8 Energy and Heat Practice</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathlive@0.110.0/mathlive.min.js"></script>
<style>
:root{--navy:#1B3A6B;--navy-2:#122A50;--sky:#2F7FD8;--sky-tint:#E7F0FB;--ink:#1E2430;--muted:#5F6B7A;--rule:#D8DFE8;--paper:#FFFFFF;--bg:#EEF3F9;
--got:#1F9D55;--got-tint:#E3F5EA;--part:#E09B12;--part-tint:#FCF1D6;--miss:#D64545;--miss-tint:#FBE4E4;
--t1:#1B3A6B;--t2:#0E7C86;--t3:#C4552F;--t4:#6A4C93;--t5:#2A9D5C;--t6:#D48A00;--t7:#2F7FD8;--t8:#B23A48;
--sans:"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
:root{--keycap-height:34px;--keycap-font-size:17px;--keycap-max-width:76px;--keycap-gap:6px;--keyboard-padding-top:4px;--keyboard-padding-bottom:4px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font:inherit;cursor:pointer}
header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 2px 0 var(--sky)}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{opacity:.85;font-size:14px}
header .tools{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header .saved{font-size:13px;opacity:.85}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--navy);padding:7px 13px;border-radius:6px;font-size:14px;font-weight:600}
.btn:hover{background:var(--sky-tint)}
header .btn{border-color:rgba(255,255,255,.35);background:transparent;color:#fff}
header .btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn:focus-visible,input:focus-visible,label:focus-within{outline:3px solid #9CC2F1;outline-offset:2px}
.layout{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 60px)}
nav{background:var(--paper);border-right:1px solid var(--rule);padding:14px 0 40px;overflow-y:auto;position:sticky;top:0;height:100vh}
nav .lead{padding:0 20px 10px;font-size:14px;color:var(--muted)}
nav .lead strong{color:var(--ink)}
nav h2{font-size:14px;margin:12px 20px 2px;padding:8px 0 4px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:8px}
nav h2:first-of-type{border-top:0;padding-top:0}
nav h2 .sw{width:12px;height:12px;border-radius:3px;background:var(--tc)}
.crit{display:grid;grid-template-columns:44px 1fr 74px;gap:8px;align-items:start;width:100%;text-align:left;border:0;background:none;padding:7px 20px;color:var(--ink);font-size:13.5px;line-height:1.35;border-left:4px solid transparent}
.crit:hover{background:var(--sky-tint)}
.crit.active{background:var(--sky-tint);border-left-color:var(--tc)}
.crit .code{font-weight:700;color:var(--tc);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:2px;margin-top:5px}
.seg i{display:block;height:8px;flex:1;background:var(--rule);border-radius:2px}
.seg i.m-got{background:var(--got)}.seg i.m-part{background:var(--part)}.seg i.m-miss{background:var(--miss)}
main{padding:24px 32px 80px;max-width:880px}
.home h2{font-size:26px;margin:0 0 6px;color:var(--navy)}
.home p{max-width:640px;color:var(--muted)}
.overall{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;margin:18px 0}
.overall .row{display:flex;align-items:center;gap:12px;font-size:14px;margin-bottom:6px}
.overall .bar{flex:1;height:14px;background:var(--rule);border-radius:7px;overflow:hidden;display:flex}
.overall .bar i{display:block;height:100%}
.overall .bar .g{background:var(--got)}.overall .bar .p{background:var(--part)}.overall .bar .m{background:var(--miss)}
.overall .key{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px}
.overall .key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:18px 0}
.tcard{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;border-top:4px solid var(--tc);text-align:left;color:var(--ink)}
.tcard:hover{border-color:var(--tc)}
.tcard .tn{font-weight:700;font-size:15px;color:var(--tc)}
.tcard .tt{font-size:14px;margin:2px 0 8px}
.tcard .bar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;display:flex}
.tcard .bar i{display:block;height:100%}
.tcard .bar .g{background:var(--got)}.tcard .bar .p{background:var(--part)}.tcard .bar .m{background:var(--miss)}
.tcard .tc2{font-size:12.5px;color:var(--muted);margin-top:6px}
.todo{margin-top:18px}
.todo h3{font-size:16px;margin:0 0 8px;color:var(--navy)}
.todo button{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:9px 14px;margin-bottom:6px;color:var(--ink);border-left:4px solid var(--tc)}
.todo button:hover{background:var(--sky-tint)}
.todo .code{color:var(--tc);font-weight:700;margin-right:8px}
.crit-head{margin-bottom:16px;padding-left:14px;border-left:5px solid var(--tc)}
.crit-head .code{color:var(--tc);font-weight:700;font-size:14px}
.crit-head h2{font-size:23px;margin:2px 0 4px;line-height:1.25;color:var(--navy)}
.crit-head .topic{color:var(--muted);font-size:14px}
.intro{background:var(--sky-tint);border:1px solid #CFE0F5;border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:15px}
.intro img{display:block;max-width:100%;width:440px;margin:6px auto;background:#fff;border-radius:4px}
.intro img.wide{width:100%;max-width:920px}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px 20px 14px;margin-bottom:14px;border-left:5px solid var(--rule)}
.q.m-got{border-left-color:var(--got)}.q.m-part{border-left-color:var(--part)}.q.m-miss{border-left-color:var(--miss)}
.qh{display:flex;gap:12px;align-items:center}
.qh .code{font-weight:700;color:var(--navy);font-size:15px}
.qh .marks{margin-left:auto;background:var(--navy);color:#fff;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap}
.qt{font-size:16.5px;line-height:1.55;margin:8px 0 10px}
.part{font-size:16.5px;margin:8px 0 4px 18px;display:flex;gap:12px}
.part .pm{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;align-self:center}
.q img{display:block;max-width:100%;width:420px;margin:8px auto}
.opts{list-style:none;padding:0;margin:8px 0}
.opts label{display:flex;gap:12px;padding:8px 10px;border-radius:6px;font-size:16px;cursor:pointer;align-items:center;border:1px solid transparent}
.opts label:hover{background:var(--sky-tint)}
.opts label.correct{background:var(--got-tint);border-color:var(--got)}.opts label.wrong{background:var(--miss-tint);border-color:var(--miss)}
.opts input{accent-color:var(--navy)}
.opts .let{font-weight:700;color:var(--navy);flex:0 0 22px}
.opts label span:last-child{flex:1}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:8px 0}
.nums label{display:block;font-size:13.5px;color:var(--muted);font-weight:600}
.nums input{display:block;width:100%;margin-top:3px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font:inherit;font-size:15px;background:#fff;font-weight:400}
.nums math-field{display:block;width:100%;margin-top:3px;padding:4px 8px;border:1px solid var(--rule);border-radius:6px;font-size:17px;background:#fff;--caret-color:var(--navy);--selection-background-color:var(--sky-tint)}
.nums math-field:focus-within{outline:3px solid #9CC2F1;outline-offset:2px}
.nums math-field.ok{border-color:var(--got);background:var(--got-tint)}.nums math-field.bad{border-color:var(--miss);background:var(--miss-tint)}
.nums math-field::part(menu-toggle){display:none}
.nums .preview{display:block;min-height:22px;margin-top:4px;color:var(--navy);font-size:15px}
.nums input.ok{border-color:var(--got);background:var(--got-tint)}.nums input.bad{border-color:var(--miss);background:var(--miss-tint)}
.katex{font-size:1.02em}
.hint{font-size:13px;color:var(--muted);margin:4px 0 10px}
.typed{margin:10px 0 2px}
.typed textarea{display:block;width:100%;min-height:96px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font:inherit;font-size:15px;line-height:1.45;background:#fff;resize:vertical}
.typed textarea:focus-visible{outline:3px solid #9CC2F1;outline-offset:2px}
.typed .tnote{font-size:12.5px;color:var(--muted);margin-top:4px}
.note-btn{margin-left:auto}
.note-btn.has{border-color:var(--part);color:#8a5d00;background:var(--part-tint)}
.note-btn.has::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--part);margin-right:6px;vertical-align:middle}
.note{margin:8px 0 2px}
.note textarea{display:block;width:100%;min-height:52px;padding:7px 10px;border:1px solid #EAD9A6;border-radius:6px;font:inherit;font-size:14px;line-height:1.4;background:#FFFBEC;resize:vertical}
.note textarea:focus-visible{outline:3px solid #9CC2F1;outline-offset:2px}
.actions .verdict{flex-basis:100%}
.sk{margin:8px auto;width:420px;max-width:100%}
.sk.pad{width:100%;margin:6px 0 2px}
.sk.pad canvas{border:1px solid var(--rule);border-radius:6px}
.sk img,.sk canvas{display:block;width:100%;max-width:100%;margin:0 auto}
.sk canvas.editing{cursor:crosshair;touch-action:none;outline:2px dashed var(--sky);outline-offset:2px}
.skbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.skbar button{font-size:12.5px;padding:4px 11px;border:1px solid var(--rule);border-radius:14px;background:#fff;color:var(--ink);font-weight:600}
.skbar button:hover{background:var(--sky-tint)}
.skbar button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.calc{position:fixed;right:24px;bottom:24px;width:360px;max-width:calc(100vw - 20px);background:var(--paper);border:1px solid var(--rule);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:50;font-size:14px}
.calc-h{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;background:var(--navy);color:#fff;border-radius:10px 10px 0 0;cursor:move;user-select:none;touch-action:none}
.calc-t{font-weight:700}
.calc-mode{margin-left:auto;display:flex;gap:2px}
.calc-mode button{font-size:12px;padding:3px 8px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:4px}
.calc-mode button.on{background:#fff;color:var(--navy)}
.calc-x{border:0;background:transparent;color:#fff;font-size:20px;line-height:1;padding:0 4px}
.calc-in{padding:10px 12px 4px}
.calc-in math-field{display:block;width:100%;font-size:19px;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:#fff;--caret-color:var(--navy)}
.calc-in math-field::part(menu-toggle){display:none}
.calc-in math-field::part(virtual-keyboard-toggle){display:none}
.calc-in input{display:block;width:100%;font:inherit;font-size:16px;padding:8px;border:1px solid var(--rule);border-radius:6px}
.calc-res{min-height:26px;padding:0 14px 6px;font-size:17px;color:var(--navy)}
.calc-res.err{font-size:13px;color:var(--miss)}
.calc-keys{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:4px 12px 8px}
.calc-keys button{font-size:13.5px;padding:7px 2px;border:1px solid var(--rule);border-radius:6px;background:#F7FAFE;color:var(--ink)}
.calc-keys button{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.calc-keys button:hover{background:var(--sky-tint)}
.calc-keys button.num{background:#fff;font-size:15.5px;font-weight:600}
.calc-keys button.op{font-size:15px}
.calc-keys button.act{background:var(--sky-tint)}
.calc-keys button.w2{grid-column:span 2}
.calc-keys button.eq{grid-column:span 2;background:var(--navy);color:#fff;border-color:var(--navy)}
.calc-note{font-size:12px;color:var(--muted);padding:0 14px 8px}
.calc-hh{display:flex;align-items:center;justify-content:space-between;padding:4px 14px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}
.calc-hclear{font-size:12px;padding:2px 8px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink)}
.pt{position:fixed;left:50%;top:112px;transform:translateX(-50%);width:min(1180px,96vw);background:#fff;border:1px solid var(--rule);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:55}
.pt-h{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;background:var(--navy);color:#fff;border-radius:10px 10px 0 0;cursor:move;user-select:none;touch-action:none}
.pt-t{font-weight:700}
.pt-x{margin-left:auto;border:0;background:transparent;color:#fff;font-size:20px;line-height:1;padding:0 4px}
.pt-body{padding:10px 12px 14px;overflow:auto;max-height:calc(100vh - 140px)}
.ptg{font-size:9px;color:#000;text-align:center;line-height:16px}
.ptp{font-size:9px;color:#000;display:flex;align-items:center;justify-content:center}
.pt-grid{display:grid;grid-template-columns:18px repeat(18,1fr);grid-template-rows:16px repeat(7,auto) 8px repeat(2,auto);gap:2px;min-width:860px}
.ptc{border:1px solid #000;background:#fff;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 0 3px;line-height:1.05;min-height:38px}
.ptz{font-size:8.5px}
.pts{font-size:13px;font-weight:700}
.ptm{font-size:8px}
@media(max-width:820px){.pt-body{max-height:calc(100vh - 120px)}}
.calc-hclear:hover{background:var(--miss-tint);border-color:var(--miss)}
.calc-hist{max-height:38px;overflow-y:auto}
.calc-hist .hrow{display:flex;align-items:stretch;border-top:1px solid var(--sky-tint)}
.calc-hist .huse{flex:1;display:flex;justify-content:space-between;gap:10px;min-height:36px;text-align:left;border:0;background:#fff;padding:5px 6px 5px 14px;font-size:13.5px;color:var(--ink);align-items:center}
.calc-hist .huse:hover{background:var(--sky-tint)}
.calc-hist .hdel{border:0;background:#fff;color:var(--muted);font-size:17px;line-height:1;width:32px;opacity:0;cursor:pointer}
.calc-hist .hrow:hover .hdel,.calc-hist .hdel:focus-visible{opacity:1}
.calc-hist .hdel:hover{color:var(--miss);background:var(--miss-tint)}
@media (hover:none){.calc-hist .hdel{opacity:1}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.answer{display:none;margin-top:12px;border-top:2px solid var(--sky-tint);padding:12px 14px 4px;background:#F7FAFE;border-radius:0 0 6px 6px;font-size:15.5px;color:#123}
.answer.open{display:block}
.answer p{margin:0 0 6px}
.answer p:first-child::before{content:"Answer";display:block;font-size:12px;font-weight:700;color:var(--sky);letter-spacing:.3px;margin-bottom:4px}
.answer img{width:360px;margin:6px 0;background:#fff}
.selfmark{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;font-size:14px;color:var(--muted)}
.selfmark button{border:1px solid var(--rule);background:#fff;border-radius:20px;padding:6px 15px;font-size:14px;color:var(--ink);font-weight:600}
.selfmark button.m-got:hover{background:var(--got-tint);border-color:var(--got)}.selfmark button.m-part:hover{background:var(--part-tint);border-color:var(--part)}.selfmark button.m-miss:hover{background:var(--miss-tint);border-color:var(--miss)}
.selfmark button.m-got.on{background:var(--got);border-color:var(--got);color:#fff}
.selfmark button.m-part.on{background:var(--part);border-color:var(--part);color:#fff}
.selfmark button.m-miss.on{background:var(--miss);border-color:var(--miss);color:#fff}
.selfmark .similar{margin-left:auto;border-color:var(--sky);color:var(--sky);background:#fff}
.selfmark .similar:hover{background:var(--sky-tint)}
.selfmark .similar + .similar{margin-left:0}
.vtag{font-weight:600;color:var(--sky);font-size:12.5px;margin-left:6px}
.verdict{font-size:14px;font-weight:600}
.verdict.ok{color:var(--got)}.verdict.no{color:var(--miss)}
.constants{display:none;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;font-size:14.5px;margin-bottom:18px}
.constants.open{display:block}
.constants .ct{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.constants .cc{display:inline-block;margin:2px 18px 2px 0}
.menu-toggle{display:none}
.back{display:none}
@media (max-width:860px){
  .layout{display:block}
  nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule)}
  nav.hidden{display:none}
  main{padding:18px 14px 60px}
  .menu-toggle{display:inline-block}
  .back{display:inline-block;margin-bottom:12px}
  .crit{grid-template-columns:40px 1fr 60px}
}
</style>
</head>
<body>
<header>
  <h1>Year 8 Energy and Heat Practice</h1>
  <span class="sub">Forms of energy; transfer, transformation and efficiency; heat transfer; conductors and insulators</span>
  <div class="tools">
    <button class="btn menu-toggle" id="menuBtn">Criteria</button>
    <button class="btn" id="homeBtn">Back to home</button>
    <button class="btn" id="calcBtn">Calculator</button>
    <button class="btn" id="ptBtn">Periodic table</button>
    <button class="btn" id="resetBtn">Reset progress</button>
    <span class="saved" id="savedNote"></span>
  </div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
const DATA = {"topics":["Forms of Energy","Energy Transfer and Transformation","Heat Transfer","Conductors and Insulators"],"bank":[{"code":"1.1","topic":1,"title":"Define energy as the ability to cause change","intro":{"text":"Energy is the ability to cause change (the capacity to do work). Energy can change form, can be transferred from one object to another, and can be stored."},"questions":[{"code":"1.1 Q1","crit":"1.1","type":"sa","text":"Define energy, and give one example of a change that energy causes.","marks":2,"diag":true,"answer":{"lines":["Energy is the ability to cause change (1). Example: making a stationary bike move, heating water in a kettle, or lighting up a room (1)."]},"orig":"1.1 Q1"},{"code":"1.1 Q2","crit":"1.1","type":"mc","text":"Energy is best defined as","marks":1,"options":["the ability to cause change","a push or a pull on an object","the amount of matter in an object","the speed at which an object moves"],"answer":{"lines":["A. Energy is the ability to cause change. A push or pull is a force, the amount of matter is mass, and speed describes motion."]},"orig":"1.1 Q2"},{"code":"1.1 Q3","crit":"1.1","type":"sa","text":"A cyclist starts at rest and pedals until the bike is moving quickly. Describe the change that has occurred, and state what was needed to cause it.","marks":2,"answer":{"lines":["The bike has changed from being stationary to moving quickly (1). Energy, from the cyclist's muscles, was needed to cause this change (1)."]},"orig":"1.1 Q3"},{"code":"1.1 Q4","crit":"1.1","type":"sa","text":"Energy can change form, can be transferred from one object to another, and can be stored. Give one example of each.","marks":3,"answer":{"lines":["Changing form: a toaster changes electrical energy into heat energy (1). Transferred: a foot kicking a ball passes kinetic energy to the ball (1). Stored: a battery stores chemical potential energy, or a stretched rubber band stores elastic potential energy (1)."]},"orig":"1.1 Q4"}]},{"code":"1.2","topic":1,"title":"Recall that energy is measured in joules (J)","intro":{"text":"Energy is measured in joules, symbol J. Approximate energies: lifting an apple by one metre 1 J; a peanut 30 000 J; a chocolate bar 1 000 000 J; one litre of petrol 34 000 000 J."},"questions":[{"code":"1.2 Q1","crit":"1.2","type":"sa","text":"State the name of the unit used to measure energy, and give its symbol.","marks":2,"diag":true,"answer":{"lines":["The joule (1). Its symbol is J (1)."]},"orig":"1.2 Q1"},{"code":"1.2 Q2","crit":"1.2","type":"mc","text":"A chocolate bar contains about 1 000 000 units of energy. The unit is the","marks":1,"options":["kilogram (kg)","metre per second (m s^{–1})","degree Celsius (°C)","joule (J)"],"answer":{"lines":["D. Energy is measured in joules. Kilograms measure mass, metres per second measure speed and degrees Celsius measure temperature."]},"orig":"1.2 Q2"},{"code":"1.2 Q3","crit":"1.2","type":"sa","text":"The approximate energies of four things are: one litre of petrol, 34 000 000 J; a peanut, 30 000 J; lifting an apple by one metre, 1 J; one new AA battery, 10 000 J. Rank them from the most energy to the least energy.","marks":2,"answer":{"lines":["Petrol has the most energy and lifting the apple the least (1). Order: petrol, peanut, AA battery, lifting the apple (1)."]},"orig":"1.2 Q3"},{"code":"1.2 Q4","crit":"1.2","type":"sa","text":"A student writes: \"The cricket ball has 780 kg of kinetic energy.\" Identify the mistake and rewrite the statement correctly.","marks":2,"answer":{"lines":["The kilogram (kg) is the unit of mass, not energy (1). The cricket ball has 780 J of kinetic energy (1)."]},"orig":"1.2 Q4"}]},{"code":"1.3","topic":1,"title":"Recall different forms of energy (kinetic, heat, light, sound, electrical, gravitational potential, elastic potential, chemical potential, nuclear potential)","intro":{"text":"Kinetic: energy of movement. Heat: energy due to the random motion of particles. Light: energy carried by light. Sound: energy carried by a sound wave. Electrical: energy carried by moving electrical charges. Potential (stored) energy: gravitational potential (an object lifted off the ground), elastic potential (an object stretched or compressed), chemical potential (fuels, batteries, food), nuclear potential (the nucleus of an atom)."},"questions":[{"code":"1.3 Q1","crit":"1.3","type":"sa","text":"Name the five forms of energy that are not stored energy, and name the four forms of potential (stored) energy.","marks":4,"diag":true,"answer":{"lines":["Not stored: kinetic, heat, light, sound and electrical energy; all five for 2 marks, three or four for 1 mark (2). Potential (stored): gravitational potential, elastic potential, chemical potential and nuclear potential energy; all four for 2 marks, two or three for 1 mark (2)."]},"orig":"1.3 Q1"},{"code":"1.3 Q2","crit":"1.3","type":"mc","text":"The energy stored in an object because it has been stretched or compressed is","marks":1,"options":["gravitational potential energy","chemical potential energy","elastic potential energy","kinetic energy"],"answer":{"lines":["C. Stretching or compressing an object stores elastic potential energy. Gravitational potential energy comes from height, chemical potential energy is stored in substances, and kinetic energy is energy of movement."]},"orig":"1.3 Q2"},{"code":"1.3 Q3","crit":"1.3","type":"sa","text":"Define kinetic energy, heat energy and sound energy.","marks":3,"answer":{"lines":["Kinetic energy is the energy an object has because it is moving (1). Heat energy is the energy an object has due to the random motion of its particles; the higher the temperature, the more heat energy (1). Sound energy is the energy carried by a sound wave (1)."]},"orig":"1.3 Q3"},{"code":"1.3 Q4","crit":"1.3","type":"sa","text":"Define gravitational potential energy, elastic potential energy, chemical potential energy and nuclear potential energy.","marks":4,"answer":{"lines":["Gravitational potential energy is energy stored when an object is lifted off the ground (1). Elastic potential energy is energy stored when an object is stretched or compressed (1). Chemical potential energy is energy stored in chemical substances such as fuels, batteries, plants or food (1). Nuclear potential energy is energy stored in the nucleus of an atom (1)."]},"orig":"1.3 Q4"},{"code":"1.3 Q5","crit":"1.3","type":"mc","text":"The energy carried by moving electrical charges in a circuit is","marks":1,"options":["electrical energy","chemical potential energy","light energy","nuclear potential energy"],"answer":{"lines":["A. Electrical energy is carried by moving charges. Chemical potential energy is stored in substances such as the battery that may drive the circuit."]},"orig":"1.3 Q5"}]},{"code":"1.4","topic":1,"title":"Classify various real-life examples of energy as kinetic, heat, light, sound, electrical, gravitational potential, elastic potential, chemical potential, or nuclear potential","intro":{"text":"To classify an example, ask what the energy is doing: is the object moving, hot, giving off light or sound, carrying an electric current, or is the energy stored by height, stretching, chemicals or the nucleus?"},"questions":[{"code":"1.4 Q1","crit":"1.4","type":"sa","text":"Classify the main form of energy in each example.","marks":4,"parts":[{"text":"a.  A marble rolling across the floor","marks":1},{"text":"b.  The petrol in a car's fuel tank","marks":1},{"text":"c.  A slinky being held stretched out","marks":1},{"text":"d.  The noise produced by a kettle boiling","marks":1}],"diag":true,"answer":{"lines":["a. Kinetic energy: the marble is moving (1).","b. Chemical potential energy: the energy is stored in the fuel (1).","c. Elastic potential energy: the slinky is stretched (1).","d. Sound energy: the noise is a sound wave (1)."]},"orig":"1.4 Q1"},{"code":"1.4 Q2","crit":"1.4","type":"mc","text":"A diver stands still at the edge of a 10 m high diving platform. The main form of energy the diver has because of her position is","marks":1,"options":["kinetic energy","gravitational potential energy","elastic potential energy","nuclear potential energy"],"answer":{"lines":["B. The diver is high above the water, so she has gravitational potential energy. She is not moving, so she has no kinetic energy, and the platform is not stretched or compressed."]},"orig":"1.4 Q2"},{"code":"1.4 Q3","crit":"1.4","type":"sa","text":"Classify the main form of energy in each example.","marks":3,"parts":[{"text":"a.  The energy stored in uranium fuel in a nuclear reactor","marks":1},{"text":"b.  The warmth of a freshly cooked slice of toast","marks":1},{"text":"c.  The electricity flowing through a cable to charge a pair of earbuds","marks":1}],"answer":{"lines":["a. Nuclear potential energy (1).","b. Heat energy (1).","c. Electrical energy (1)."]},"orig":"1.4 Q3"},{"code":"1.4 Q4","crit":"1.4","type":"sa","text":"A skateboarder rides on the ramp shown. At P, the highest point, the skater is momentarily stationary. Q is the lowest point of the ramp, where the skater moves fastest. At R the skater is moving and is partway up the ramp. Classify the form or forms of energy the skater has at P, at Q and at R.","marks":3,"img":"ramp","answer":{"lines":["P: gravitational potential energy only, because the skater is high up but not moving (1). Q: kinetic energy, because the skater is moving at the lowest point (1). R: both gravitational potential energy and kinetic energy, because the skater is above the lowest point and moving (1)."]},"orig":"1.4 Q4"}]},{"code":"1.5","topic":1,"title":"Calculate kinetic energy using the formula E_{K} = ½mv^{2}","intro":{"text":"E_{K} = ½mv^{2}, where E_{K} is the kinetic energy in joules (J), m is the mass in kilograms (kg) and v is the velocity in metres per second (m s^{–1}). Square the velocity first. 1 kg = 1000 g."},"questions":[{"code":"1.5 Q1","crit":"1.5","type":"sa","text":"A 50 kg student runs at a velocity of 6 m s^{–1}. Calculate the kinetic energy of the student.","marks":3,"num":[["E_{K} (J)",900]],"diag":true,"answer":{"lines":["E_{K} = ½mv^{2} (1). E_{K} = 0.5 × 50 × 6^{2} = 0.5 × 50 × 36 (1). E_{K} = 900 J (1)."]},"orig":"1.5 Q1"},{"code":"1.5 Q2","crit":"1.5","type":"mc","text":"A 2 kg ball is moving at 3 m s^{–1}. Its kinetic energy is","marks":1,"options":["9 J","3 J","6 J","18 J"],"answer":{"lines":["A. E_{K} = 0.5 × 2 × 3^{2} = 0.5 × 2 × 9 = 9 J. 18 J leaves out the ½, and 3 J and 6 J do not square the velocity."]},"orig":"1.5 Q2"},{"code":"1.5 Q3","crit":"1.5","type":"sa","text":"A cyclist and her bike have a combined mass of 80 kg and travel at a velocity of 12 m s^{–1}. Calculate their kinetic energy.","marks":3,"num":[["E_{K} (J)",5760]],"answer":{"lines":["E_{K} = ½mv^{2} (1). E_{K} = 0.5 × 80 × 12^{2} = 0.5 × 80 × 144 (1). E_{K} = 5760 J (1)."]},"orig":"1.5 Q3"},{"code":"1.5 Q4","crit":"1.5","type":"sa","text":"A tennis ball of mass 58 g is served at a velocity of 50 m s^{–1}. Calculate the kinetic energy of the ball.","marks":3,"num":[["E_{K} (J)",72.5]],"answer":{"lines":["m = 58 g = 0.058 kg (1). E_{K} = 0.5 × 0.058 × 50^{2} = 0.5 × 0.058 × 2500 (1). E_{K} = 72.5 J (1)."]},"orig":"1.5 Q4"},{"code":"1.5 Q5","crit":"1.5","type":"sa","text":"Two identical cars each have a mass of 1200 kg. Car A travels at 10 m s^{–1} and car B travels at 20 m s^{–1}. Calculate the kinetic energy of each car, and state how many times greater the kinetic energy of car B is.","marks":3,"num":[["E_{K} of car A (J)",60000],["E_{K} of car B (J)",240000],["times greater",4]],"answer":{"lines":["Car A: E_{K} = 0.5 × 1200 × 10^{2} = 60 000 J (1). Car B: E_{K} = 0.5 × 1200 × 20^{2} = 240 000 J (1). 240 000 ÷ 60 000 = 4, so car B has 4 times the kinetic energy of car A (1)."]},"orig":"1.5 Q5"}]},{"code":"1.6","topic":1,"title":"Calculate gravitational potential energy using the formula E_{g} = mgh (g = 9.8 m s^{–2})","intro":{"text":"E_{g} = mgh, where E_{g} is the gravitational potential energy in joules (J), m is the mass in kilograms (kg), g = 9.8 m s^{–2} and h is the height in metres (m)."},"questions":[{"code":"1.6 Q1","crit":"1.6","type":"sa","text":"A 45 kg student climbs to the top of a climbing wall that is 6 m high. Calculate the gravitational potential energy of the student at the top.","marks":3,"num":[["E_{g} (J)",2646]],"diag":true,"answer":{"lines":["E_{g} = mgh (1). E_{g} = 45 × 9.8 × 6 (1). E_{g} = 2646 J (1)."]},"orig":"1.6 Q1"},{"code":"1.6 Q2","crit":"1.6","type":"mc","text":"A 2 kg book sits on a shelf 1.5 m above the floor. Its gravitational potential energy is","marks":1,"options":["3.0 J","14.7 J","19.6 J","29.4 J"],"answer":{"lines":["D. E_{g} = 2 × 9.8 × 1.5 = 29.4 J. 3.0 J leaves out g, 19.6 J leaves out h, and 14.7 J halves the answer as if using ½mv^{2}."]},"orig":"1.6 Q2"},{"code":"1.6 Q3","crit":"1.6","type":"sa","text":"A 600 g water bottle sits on a table 0.8 m above the floor. Calculate the gravitational potential energy of the bottle.","marks":3,"num":[["E_{g} (J)",4.704]],"answer":{"lines":["m = 600 g = 0.6 kg (1). E_{g} = 0.6 × 9.8 × 0.8 (1). E_{g} = 4.704 J ≈ 4.7 J (1)."]},"orig":"1.6 Q3"},{"code":"1.6 Q4","crit":"1.6","type":"sa","text":"A 70 kg hiker walks from a car park 200 m above sea level to a lookout 650 m above sea level. Calculate the gravitational potential energy gained by the hiker.","marks":3,"num":[["E_{g} gained (J)",308700]],"answer":{"lines":["Height gained h = 650 – 200 = 450 m (1). E_{g} = 70 × 9.8 × 450 (1). E_{g} = 308 700 J (1)."]},"orig":"1.6 Q4"},{"code":"1.6 Q5","crit":"1.6","type":"sa","text":"A 2 kg pot plant sits on a balcony 3 m above the ground, and a 0.5 kg ball is stuck on a roof 10 m above the ground. Calculate the gravitational potential energy of each, and state which has more.","marks":3,"num":[["E_{g} of pot plant (J)",58.8],["E_{g} of ball (J)",49]],"answer":{"lines":["Pot plant: E_{g} = 2 × 9.8 × 3 = 58.8 J (1). Ball: E_{g} = 0.5 × 9.8 × 10 = 49 J (1). The pot plant has more gravitational potential energy, even though it is lower, because its mass is much larger (1)."]},"orig":"1.6 Q5"}]},{"code":"2.1","topic":2,"title":"Recall the law of conservation of energy","intro":{"text":"The law of conservation of energy: energy cannot be created or destroyed. It can only be transferred from one object to another or transformed from one form into another. The total energy after a change equals the total energy before it."},"questions":[{"code":"2.1 Q1","crit":"2.1","type":"sa","text":"State the law of conservation of energy.","marks":2,"diag":true,"answer":{"lines":["Energy cannot be created or destroyed (1). It can only be transferred from one object to another or transformed from one form into another (1)."]},"orig":"2.1 Q1"},{"code":"2.1 Q2","crit":"2.1","type":"mc","text":"Which statement agrees with the law of conservation of energy?","marks":1,"options":["Energy is used up and disappears completely whenever a machine runs.","Energy cannot be created or destroyed, only transferred or transformed.","A generator creates new energy each time it spins.","Energy is destroyed when a moving object stops."],"answer":{"lines":["B. The law states that energy is never created or destroyed. A machine, a generator or a stopping object only transfers or transforms energy."]},"orig":"2.1 Q2"},{"code":"2.1 Q3","crit":"2.1","type":"sa","text":"A ball rolls across the floor and slowly comes to a stop. A student says the ball's energy has been used up. Explain why the student is wrong.","marks":2,"answer":{"lines":["Energy cannot be destroyed, so the kinetic energy of the ball has not disappeared (1). Friction has transformed it into heat energy (and a little sound energy) in the ball, the floor and the air (1)."]},"orig":"2.1 Q3"},{"code":"2.1 Q4","crit":"2.1","type":"sa","text":"A power station is often said to \"make\" electricity. Use the law of conservation of energy to explain what actually happens in a coal-fired power station.","marks":2,"answer":{"lines":["Energy cannot be created, so the power station does not make new energy (1). It transforms the chemical potential energy stored in the coal into electrical energy (with some heat and sound) (1)."]},"orig":"2.1 Q4"}]},{"code":"2.2","topic":2,"title":"Recall that energy can be transferred from one object to another (e.g., kinetic energy in a foot to kinetic energy in a ball)","intro":{"text":"Energy transfer: energy is passed from one object to another. The form of energy stays the same; the object that has it changes. Example: the kinetic energy of a foot is transferred to a football as kinetic energy."},"questions":[{"code":"2.2 Q1","crit":"2.2","type":"sa","text":"A person kicks a football and it moves off. Describe what happens to the energy, and state why this is an energy transfer.","marks":2,"diag":true,"answer":{"lines":["The kinetic energy of the person's foot is passed to the football, which moves off with kinetic energy (1). The energy stays the same form (kinetic) but moves from one object to another, so it is a transfer (1)."]},"orig":"2.2 Q1"},{"code":"2.2 Q2","crit":"2.2","type":"mc","text":"Which of the following is an example of an energy transfer?","marks":1,"options":["A toaster browns a slice of bread.","A battery lights up a torch globe.","A cricket bat hits a ball and the ball moves off.","A radio plays music."],"answer":{"lines":["C. The bat's kinetic energy is passed to the ball as kinetic energy, so the form stays the same. The toaster, torch and radio each change energy from one form into another."]},"orig":"2.2 Q2"},{"code":"2.2 Q3","crit":"2.2","type":"sa","text":"Water in a beaker is heated by a Bunsen burner flame. Describe the energy transfer, naming the form of energy and the two objects involved.","marks":2,"answer":{"lines":["Heat energy (1) is transferred from the flame of the Bunsen burner to the water in the beaker; the form stays the same and only the object changes (1)."]},"orig":"2.2 Q3"},{"code":"2.2 Q4","crit":"2.2","type":"sa","text":"In a game of pool, a moving white ball hits a stationary red ball. The white ball stops and the red ball moves off. Describe the energy transfer.","marks":2,"answer":{"lines":["The kinetic energy of the white ball (1) is transferred to the red ball, which moves off with kinetic energy; the form stays the same and the object changes (1)."]},"orig":"2.2 Q4"}]},{"code":"2.3","topic":2,"title":"Recall that energy can be transformed from one form of energy into another (e.g., electrical energy in a toaster transforms into heat, light and sound)","intro":{"text":"Energy transformation: energy changes from one form into another. Example: a toaster transforms electrical energy into heat energy, with some light and sound energy."},"questions":[{"code":"2.3 Q1","crit":"2.3","type":"sa","text":"A toaster is switched on. Describe the energy transformation, naming the input form of energy and the forms of energy produced.","marks":3,"diag":true,"answer":{"lines":["The input energy is electrical energy (1). It is transformed mainly into heat energy, which toasts the bread (1). Some is transformed into light energy (the glowing elements) and sound energy (1)."]},"orig":"2.3 Q1"},{"code":"2.3 Q2","crit":"2.3","type":"mc","text":"The main energy transformation in a radio that is plugged into the wall is","marks":1,"options":["sound energy into electrical energy","electrical energy into sound energy","chemical potential energy into kinetic energy","light energy into sound energy"],"answer":{"lines":["B. The radio takes in electrical energy from the wall socket and transforms it into sound energy (with some heat)."]},"orig":"2.3 Q2"},{"code":"2.3 Q3","crit":"2.3","type":"sa","text":"Name the input form of energy and the main useful form of energy produced in each case.","marks":4,"parts":[{"text":"a.  A solar panel on a roof","marks":2},{"text":"b.  A person climbing a flight of stairs","marks":2}],"answer":{"lines":["a. Input: light energy (1). Produced: electrical energy (1).","b. Input: chemical potential energy from food (1). Produced: kinetic energy and gravitational potential energy (1)."]},"orig":"2.3 Q3"},{"code":"2.3 Q4","crit":"2.3","type":"sa","text":"When you rub your hands together quickly, they get warm. Name the energy transformation that has occurred.","marks":2,"answer":{"lines":["Kinetic energy of the moving hands (1) is transformed into heat energy by friction (1)."]},"orig":"2.3 Q4"}]},{"code":"2.4","topic":2,"title":"Define energy efficiency","intro":{"text":"Energy efficiency is a measure of how good a machine or appliance is at converting its input energy into useful energy. It is given as a percentage. Useful energy is the output energy the appliance is designed to produce; waste energy is the output energy that is not useful."},"questions":[{"code":"2.4 Q1","crit":"2.4","type":"sa","text":"Define energy efficiency, useful energy and waste energy.","marks":3,"diag":true,"answer":{"lines":["Energy efficiency is a measure of how good a machine or appliance is at converting the input energy into useful energy, given as a percentage (1). Useful energy is the output energy that the appliance is designed to produce (1). Waste energy is the output energy that the appliance produces that is not useful (1)."]},"orig":"2.4 Q1"},{"code":"2.4 Q2","crit":"2.4","type":"mc","text":"For a battery-powered torch, the waste energy is mainly","marks":1,"options":["light energy","electrical energy","kinetic energy","heat energy"],"answer":{"lines":["D. A torch is designed to produce light, so light is the useful energy. Electrical energy is the input to the globe, and the heat produced by the globe is waste."]},"orig":"2.4 Q2"},{"code":"2.4 Q3","crit":"2.4","type":"sa","text":"For an electric kettle, identify the input energy, the useful energy and the waste energy.","marks":3,"answer":{"lines":["Input energy: electrical energy (1). Useful energy: heat energy, which heats the water (1). Waste energy: sound energy (and any light from the kettle) (1)."]},"orig":"2.4 Q3"},{"code":"2.4 Q4","crit":"2.4","type":"sa","text":"For a petrol car, identify the input energy, the useful energy and the waste energy.","marks":3,"answer":{"lines":["Input energy: chemical potential energy in the petrol (1). Useful energy: kinetic energy of the car (1). Waste energy: heat energy and sound energy from the engine (1)."]},"orig":"2.4 Q4"}]},{"code":"2.5","topic":2,"title":"Explain the advantage of energy efficient appliances","intro":{"text":"An energy efficient appliance transforms a larger share of its input energy into useful energy, so less energy is wasted."},"questions":[{"code":"2.5 Q1","crit":"2.5","type":"sa","text":"Explain the advantages of choosing an energy efficient appliance.","marks":3,"diag":true,"answer":{"lines":["An efficient appliance needs less input energy to produce the same amount of useful energy (1). Less electricity is used, so the running cost (electricity bill) is lower (1). Less fuel such as coal or gas needs to be burnt in power stations, so less pollution and fewer greenhouse gases are produced (1)."]},"orig":"2.5 Q1"},{"code":"2.5 Q2","crit":"2.5","type":"mc","text":"An LED bulb and an old-style bulb give out the same amount of light. The LED bulb is more energy efficient. This means the LED bulb","marks":1,"options":["produces more heat energy than the old bulb does for the same amount of light","creates extra light energy from nothing","uses less electrical energy to produce the same amount of light","produces light without using any energy"],"answer":{"lines":["C. More of the LED's input energy becomes light, so it needs less electrical energy for the same light and wastes less as heat. No device creates energy or works without an energy input."]},"orig":"2.5 Q2"},{"code":"2.5 Q3","crit":"2.5","type":"sa","text":"Fridge A has an energy efficiency of 60% and fridge B has an energy efficiency of 40%. They keep food equally cold. State which fridge a family should buy and explain why.","marks":2,"answer":{"lines":["Fridge A (1). More of its input energy is used usefully, so it needs less electrical energy to do the same job and costs less to run (1)."]},"orig":"2.5 Q3"},{"code":"2.5 Q4","crit":"2.5","type":"sa","text":"Explain why reducing the waste heat produced by appliances helps the environment.","marks":3,"answer":{"lines":["Waste heat is energy that had to be supplied but did nothing useful, so more electrical energy must be supplied than is needed (1). Much electricity is generated by burning fuels such as coal and gas (1). Less waste means less fuel burnt, so less carbon dioxide and pollution are released (1)."]},"orig":"2.5 Q4"}]},{"code":"2.6","topic":2,"title":"Apply the law of conservation of energy to explain experimental observations","intro":{"text":"In every experiment the total energy stays the same. When an object seems to \"lose\" energy, look for where it has been transferred or transformed, usually into heat and sound.","img":"ramp"},"questions":[{"code":"2.6 Q1","crit":"2.6","type":"sa","text":"A ball is dropped from a height and bounces. Each bounce is lower than the one before, as shown. Use the law of conservation of energy to explain this observation.","marks":3,"img":"bounce","diag":true,"answer":{"lines":["Before it is dropped the ball has gravitational potential energy, which is transformed into kinetic energy as it falls (1). At each bounce some of the energy is transformed into heat and sound energy (1). The energy is not destroyed, but less is left as kinetic and gravitational potential energy, so the ball cannot rise as high (1)."]},"orig":"2.6 Q1"},{"code":"2.6 Q2","crit":"2.6","type":"mc","text":"A skater starts from rest at P on the ramp shown. There is no friction. The skater has the most kinetic energy at","marks":1,"img":"ramp","options":["P","Q","R","every point, because energy is conserved"],"answer":{"lines":["B. At Q, the lowest point, all of the gravitational potential energy from P has been transformed into kinetic energy, so the skater moves fastest there. At P the skater is at rest."]},"orig":"2.6 Q2"},{"code":"2.6 Q3","crit":"2.6","type":"sa","text":"On a real ramp with friction, a skater who starts from rest at P never quite reaches the same height on the other side. Use the law of conservation of energy to explain this.","marks":3,"img":"ramp","answer":{"lines":["As the skater moves, friction transforms some of the energy into heat (and sound) energy (1). The total energy is still the same, as energy is not destroyed (1). Less energy is left as kinetic and gravitational potential energy, so the skater cannot climb as high as P (1)."]},"orig":"2.6 Q3"},{"code":"2.6 Q4","crit":"2.6","type":"sa","text":"After riding down a long hill using the brakes, a cyclist finds that the brake pads are hot. Use the law of conservation of energy to explain this.","marks":2,"answer":{"lines":["The kinetic energy of the bike (from its gravitational potential energy) is transformed into heat energy by friction at the brake pads (1). The energy has not been destroyed: the hot brake pads show where it has gone (1)."]},"orig":"2.6 Q4"},{"code":"2.6 Q5","crit":"2.6","type":"sa","text":"A skater on the frictionless ramp shown starts from rest at P with 1800 J of gravitational potential energy (measured from Q, the lowest point). Calculate the kinetic energy of the skater at Q, and the kinetic energy at R, where the skater has 600 J of gravitational potential energy.","marks":3,"img":"ramp","num":[["E_{K} at Q (J)",1800],["E_{K} at R (J)",1200]],"answer":{"lines":["The total energy stays at 1800 J because energy is conserved (1). At Q all of it is kinetic energy: E_{K} = 1800 J (1). At R: E_{K} = 1800 – 600 = 1200 J (1)."]},"orig":"2.6 Q5"}]},{"code":"2.7","topic":2,"title":"Classify examples as energy transfers or transformations","intro":{"text":"Transfer: the same form of energy moves to a different object. Transformation: the energy changes into a different form."},"questions":[{"code":"2.7 Q1","crit":"2.7","type":"sa","text":"Classify each example as an energy transfer or an energy transformation.","marks":4,"parts":[{"text":"a.  A hairdryer is used to dry your hair.","marks":1},{"text":"b.  A cricketer hits the ball with a bat.","marks":1},{"text":"c.  The water in a beaker is heated by a Bunsen burner flame.","marks":1},{"text":"d.  The water in an electric kettle is boiled.","marks":1}],"diag":true,"answer":{"lines":["a. Transformation: electrical energy changes into heat, kinetic and sound energy (1).","b. Transfer: the kinetic energy of the bat passes to the ball (1).","c. Transfer: heat energy passes from the flame to the water (1).","d. Transformation: electrical energy changes into heat energy (1)."]},"orig":"2.7 Q1"},{"code":"2.7 Q2","crit":"2.7","type":"mc","text":"Which of the following is an energy transformation?","marks":1,"options":["A battery powers a torch globe.","A hot pie warms your hands.","A bowling ball knocks over a pin.","Warm air from a heater warms a cold room."],"answer":{"lines":["A. In a torch, chemical potential energy in the battery is transformed into electrical energy and then into light and heat. In the other three, the same form of energy moves from one object to another."]},"orig":"2.7 Q2"},{"code":"2.7 Q3","crit":"2.7","type":"sa","text":"A hot water bottle warms your feet. Classify this as an energy transfer or an energy transformation, and explain your answer.","marks":2,"answer":{"lines":["It is an energy transfer (1). Heat energy passes from the hot water bottle to your feet; the form of energy (heat) stays the same and only the object changes (1)."]},"orig":"2.7 Q3"},{"code":"2.7 Q4","crit":"2.7","type":"sa","text":"Complete the sentence: Energy transfers and transformations are similar but…","marks":2,"answer":{"lines":["…in a transformation the form of energy changes (1), while in a transfer the form stays the same and the energy moves to a different object (1)."]},"orig":"2.7 Q4"}]},{"code":"2.8","topic":2,"title":"Construct energy flow diagrams with labels","intro":{"text":"An energy flow diagram shows the input energy in a box on the left, an arrow to each form of energy produced, and a label on each arrow saying whether the energy is transferred or transformed. The example shows a lamp.","img":"flow_lamp"},"questions":[{"code":"2.8 Q1","crit":"2.8","type":"sa","text":"Draw a labelled energy flow diagram for an electric kettle boiling water.","marks":3,"diag":true,"answer":{"lines":["Input box: electrical energy (1). Output boxes: heat energy, sound energy and light energy (heat must be included) (1). Each arrow is labelled \"Transformation\" (1)."],"img":"sol_flow_kettle"},"orig":"2.8 Q1"},{"code":"2.8 Q2","crit":"2.8","type":"mc","text":"In an energy flow diagram for a wind-up toy, the input energy box should contain","marks":1,"options":["kinetic energy","chemical potential energy","electrical energy","elastic potential energy"],"answer":{"lines":["D. Winding the toy stores energy in a compressed or twisted spring, which is elastic potential energy. Kinetic energy is one of the outputs."]},"orig":"2.8 Q2"},{"code":"2.8 Q3","crit":"2.8","type":"sa","text":"Draw a labelled energy flow diagram for a person kicking a football.","marks":3,"answer":{"lines":["Input box: kinetic energy of the foot (1). Output boxes: kinetic energy of the ball, sound energy and heat energy (1). The arrow to the ball's kinetic energy is labelled \"Transfer\"; the arrows to sound and heat are labelled \"Transformation\" (1)."],"img":"sol_flow_kick"},"orig":"2.8 Q3"},{"code":"2.8 Q4","crit":"2.8","type":"sa","text":"Draw a labelled energy flow diagram for a wood campfire.","marks":3,"answer":{"lines":["Input box: chemical potential energy in the wood (1). Output boxes: heat energy, light energy and sound energy (1). Each arrow is labelled \"Transformation\" (1)."],"img":"sol_flow_campfire"},"orig":"2.8 Q4"}]},{"code":"2.9","topic":2,"title":"Apply the law of conservation of energy to individual flow diagrams","intro":{"text":"Energy is conserved, so in every energy flow diagram: total input energy = total of all output energies. The lamp shown takes in 100 J and gives out 10 J + 90 J = 100 J.","img":"q_flow_lamp_n"},"questions":[{"code":"2.9 Q1","crit":"2.9","type":"sa","text":"The energy flow diagram for an electric drill is shown. Calculate the kinetic energy produced.","marks":2,"img":"q_flow_drill","num":[["kinetic energy (J)",400]],"diag":true,"answer":{"lines":["Total output = input, so kinetic energy = 800 – 300 – 100 (1) = 400 J (1)."]},"orig":"2.9 Q1"},{"code":"2.9 Q2","crit":"2.9","type":"mc","text":"A lamp takes in 100 J of electrical energy and transforms 10 J into light energy. The only other energy produced is heat. The heat energy produced is","marks":1,"options":["10 J","90 J","100 J","110 J"],"answer":{"lines":["B. The outputs must add up to the 100 J input, so heat = 100 – 10 = 90 J."]},"orig":"2.9 Q2"},{"code":"2.9 Q3","crit":"2.9","type":"sa","text":"A student drew the energy flow diagram shown for a light globe. Explain why the diagram must be wrong.","marks":2,"img":"q_flow_wrong","answer":{"lines":["The outputs add up to 150 + 950 = 1100 J, which is more than the 1000 J input (1). Energy cannot be created, so the outputs must add up to exactly 1000 J (1)."]},"orig":"2.9 Q3"},{"code":"2.9 Q4","crit":"2.9","type":"sa","text":"A helicopter uses a full tank of petrol containing 280 000 J of chemical potential energy. The engine produces 50 000 J of heat energy and 100 000 J of sound energy, and the rest becomes kinetic energy of the rotor. These are the only energy changes. Calculate the kinetic energy produced, then draw a labelled energy flow diagram showing every value.","marks":3,"num":[["kinetic energy (J)",130000]],"answer":{"lines":["Kinetic energy = 280 000 – 50 000 – 100 000 = 130 000 J (1). Input box: chemical potential energy 280 000 J (1). Output boxes for kinetic 130 000 J, heat 50 000 J and sound 100 000 J, each arrow labelled \"Transformation\" (1)."],"img":"sol_flow_heli"},"orig":"2.9 Q4"}]},{"code":"2.10","topic":2,"title":"Calculate energy efficiency using the formula: efficiency = useful output energy ÷ input energy × 100","intro":{"text":"efficiency = (useful output energy ÷ input energy) × 100%. Add all the useful outputs together first if there is more than one."},"questions":[{"code":"2.10 Q1","crit":"2.10","type":"sa","text":"A toaster uses 800 J of electrical energy and produces 600 J of useful heat energy. Calculate the energy efficiency of the toaster.","marks":3,"num":[["efficiency (%)",75]],"diag":true,"answer":{"lines":["efficiency = (useful output energy ÷ input energy) × 100% (1). efficiency = (600 ÷ 800) × 100% (1). efficiency = 75% (1)."]},"orig":"2.10 Q1"},{"code":"2.10 Q2","crit":"2.10","type":"mc","text":"A desk lamp uses 4000 J of electrical energy and gives out 1000 J of light energy. The efficiency of the lamp is","marks":1,"options":["25%","0.25%","75%","400%"],"answer":{"lines":["A. efficiency = (1000 ÷ 4000) × 100% = 25%. 0.25% forgets to multiply by 100, 400% divides the wrong way, and 75% is the share that is wasted."]},"orig":"2.10 Q2"},{"code":"2.10 Q3","crit":"2.10","type":"sa","text":"The motor of an electric scooter uses 5000 J of electrical energy and produces 4200 J of kinetic energy. Calculate the energy efficiency of the motor.","marks":3,"num":[["efficiency (%)",84]],"answer":{"lines":["efficiency = (useful output energy ÷ input energy) × 100% (1). efficiency = (4200 ÷ 5000) × 100% (1). efficiency = 84% (1)."]},"orig":"2.10 Q3"},{"code":"2.10 Q4","crit":"2.10","type":"sa","text":"A phone uses 2000 J of electrical energy. It converts 1000 J into light energy, 700 J into sound energy and 300 J into heat energy. The light and sound energy are useful. Calculate the energy efficiency of the phone.","marks":3,"num":[["efficiency (%)",85]],"answer":{"lines":["Useful output energy = 1000 + 700 = 1700 J (1). efficiency = (1700 ÷ 2000) × 100% (1). efficiency = 85% (1)."]},"orig":"2.10 Q4"},{"code":"2.10 Q5","crit":"2.10","type":"sa","text":"A small petrol engine takes in 5000 J of chemical potential energy and produces 1250 J of kinetic energy, 3500 J of heat energy and 250 J of sound energy. Draw a labelled energy flow diagram, then calculate the energy efficiency of the engine.","marks":3,"num":[["efficiency (%)",25]],"answer":{"lines":["Flow diagram: chemical potential energy 5000 J in; kinetic 1250 J, heat 3500 J and sound 250 J out, each arrow labelled \"Transformation\" (1). efficiency = (1250 ÷ 5000) × 100% (1) = 25% (1)."],"img":"sol_flow_car_n"},"orig":"2.10 Q5"}]},{"code":"3.1","topic":3,"title":"Define conduction, convection and radiation","intro":{"text":"Conduction: heat passes through a material, or between materials in contact, from hot to cold by particles colliding and passing on their vibrations. Convection: heat is carried through a liquid or gas by the movement of the liquid or gas itself; heated fluid becomes less dense and rises, and cooler fluid sinks. Radiation: heat is transferred by electromagnetic waves (light), mainly infrared; it needs no particles and can travel through a vacuum."},"questions":[{"code":"3.1 Q1","crit":"3.1","type":"sa","text":"Define conduction, convection and radiation.","marks":3,"diag":true,"answer":{"lines":["Conduction is the transfer of heat through a material, or between materials in contact, from hot to cold by particles colliding and passing on their vibrations (1). Convection is the transfer of heat through a liquid or gas by the movement of the liquid or gas itself: heated fluid rises and cooler fluid sinks (1). Radiation is the transfer of heat by electromagnetic waves, mainly infrared, which need no particles and can travel through a vacuum (1)."]},"orig":"3.1 Q1"},{"code":"3.1 Q2","crit":"3.1","type":"mc","text":"The transfer of heat by electromagnetic waves, mainly infrared, which can travel through a vacuum, is called","marks":1,"options":["conduction","convection","radiation","insulation"],"answer":{"lines":["C. Only radiation needs no particles. Conduction and convection both need particles, and insulation is the slowing of heat transfer, not a method of transfer."]},"orig":"3.1 Q2"},{"code":"3.1 Q3","crit":"3.1","type":"sa","text":"State which methods of heat transfer need particles, and which method can occur in a vacuum.","marks":2,"answer":{"lines":["Conduction and convection need particles (1). Radiation can occur in a vacuum (1)."]},"orig":"3.1 Q3"},{"code":"3.1 Q4","crit":"3.1","type":"sa","text":"State one similarity and two differences between conduction and convection.","marks":3,"answer":{"lines":["Similarity: both need particles, and both move heat from hotter to cooler places (1). Difference: in conduction the particles vibrate and pass on energy but stay in place, while in convection the heated liquid or gas itself moves (1). Difference: conduction is fastest in solids, while convection happens only in liquids and gases (1)."]},"orig":"3.1 Q4"}]},{"code":"3.2","topic":3,"title":"Describe the role of conduction, convection and radiation in real-life situations","intro":{"text":"In real situations heat is usually transferred by more than one method at once."},"questions":[{"code":"3.2 Q1","crit":"3.2","type":"sa","text":"Water is boiled in a metal pot on a stove. Name the two main methods of heat transfer involved and describe the role of each.","marks":4,"diag":true,"answer":{"lines":["Conduction (1): heat passes through the metal base of the pot as each particle passes its vibration to the next (1). Convection (1): water at the bottom is heated, becomes less dense and rises, while cooler, denser water sinks, setting up a current that heats all the water (1)."]},"orig":"3.2 Q1"},{"code":"3.2 Q2","crit":"3.2","type":"mc","text":"Heat from the Sun reaches Earth by","marks":1,"options":["conduction","convection","conduction and convection","radiation"],"answer":{"lines":["D. Space between the Sun and Earth is almost empty, with no particles to carry heat by conduction or convection. Only radiation can cross a vacuum."]},"orig":"3.2 Q2"},{"code":"3.2 Q3","crit":"3.2","type":"sa","text":"A gas heater with a small built-in fan warms a room. Name the two methods of heat transfer involved and describe the role of each.","marks":3,"answer":{"lines":["Radiation and convection (1). Radiation: heat travels as infrared from the flame to the people in the room without needing particles (1). Convection: air heated by the heater becomes less dense and rises, cooler air sinks to replace it, and the fan helps move the warm air around the room (1)."]},"orig":"3.2 Q3"},{"code":"3.2 Q4","crit":"3.2","type":"sa","text":"Room heaters are usually placed near the floor, while air conditioners for cooling are usually mounted high on the wall. Explain why, using convection.","marks":2,"answer":{"lines":["Warm air rises, so air heated near the floor rises and circulates through the whole room (1). Cool air sinks, so cold air released high on the wall sinks through the room (1)."]},"orig":"3.2 Q4"}]},{"code":"3.3","topic":3,"title":"Apply particle theory to conduction and convection","intro":{"text":"Particle theory: particles are always moving, and the hotter a substance, the faster its particles move. In a solid the particles are close together and vibrate on the spot; in a liquid they are close together but can slide past each other; in a gas they are far apart and move freely.","img":"states"},"questions":[{"code":"3.3 Q1","crit":"3.3","type":"sa","text":"Use particle theory to explain:","marks":4,"parts":[{"text":"a.  how heat travels along a metal rod by conduction","marks":2},{"text":"b.  how a convection current forms in water heated from below","marks":2}],"diag":true,"answer":{"lines":["a. The particles at the heated end gain energy and vibrate faster (1). They collide with neighbouring particles and pass the vibration along, so heat travels down the rod (1).","b. The water particles at the bottom gain energy, move faster and spread out, so the heated water becomes less dense and rises (1). Cooler, denser water sinks to take its place, setting up a convection current (1)."]},"orig":"3.3 Q1"},{"code":"3.3 Q2","crit":"3.3","type":"mc","text":"Conduction is fastest in solids because","marks":1,"options":["the particles move freely from place to place, carrying heat with them as they go","the particles are close together, so vibrations pass easily from one particle to the next","the particles are far apart, so each one travels a long way before it collides","solids contain no particles"],"answer":{"lines":["B. In a solid the particles are packed closely, so a vibrating particle quickly bumps its neighbours. Solids are made of particles that stay in place."]},"orig":"3.3 Q2"},{"code":"3.3 Q3","crit":"3.3","type":"sa","text":"A metal spoon is left in a bowl of hot soup and its handle soon becomes hot. Name the method of heat transfer and explain it using particle theory.","marks":2,"answer":{"lines":["Conduction (1). Particles in the spoon near the soup gain energy and vibrate faster, then bump into neighbouring particles, passing the vibration along to the handle (1)."]},"orig":"3.3 Q3"},{"code":"3.3 Q4","crit":"3.3","type":"sa","text":"Use particle theory to explain why convection can happen in liquids and gases but not in solids.","marks":3,"answer":{"lines":["In liquids and gases the particles can move from place to place (1). Heated liquid or gas spreads out, becomes less dense and can flow upwards, carrying heat with it (1). In a solid the particles are held in fixed positions and only vibrate, so the heated material cannot flow (1)."]},"orig":"3.3 Q4"}]},{"code":"3.4","topic":3,"title":"Label individual diagrams of conduction, convection and radiation showing the flow of heat energy from one object to another","intro":{"text":"Heat always flows from a hotter object to a cooler one. On a diagram, draw arrows in the direction of heat flow and label each with the method: conduction, convection or radiation."},"questions":[{"code":"3.4 Q1","crit":"3.4","type":"sa","text":"The diagram shows a metal pot of water over a campfire. Identify the method of heat transfer at each labelled point.","marks":4,"img":"campfire","parts":[{"text":"a.  W, the metal handle","marks":1},{"text":"b.  X, the base of the pot","marks":1},{"text":"c.  Y, the water in the pot","marks":1},{"text":"d.  Z, between the fire and the hand","marks":1}],"diag":true,"answer":{"lines":["a. Conduction: heat passes along the metal handle (1).","b. Conduction: heat passes through the metal base and wall of the pot (1).","c. Convection: heated water rises and cooler water sinks (1).","d. Radiation: heat travels from the fire to the hand without particles (1)."]},"orig":"3.4 Q1"},{"code":"3.4 Q2","crit":"3.4","type":"mc","text":"On a diagram of a metal rod heated at one end, the arrow showing the flow of heat should point","marks":1,"options":["from the cooler end towards the heated end","straight up out of the rod","from the heated end towards the cooler end","both ways along the rod equally"],"answer":{"lines":["C. Heat always flows from hot to cold, so the arrow points from the heated end along the rod to the cooler end."]},"orig":"3.4 Q2"},{"code":"3.4 Q3","crit":"3.4","type":"sa","text":"The diagram shows a metal rod held in a flame at one end. Draw an arrow on the diagram to show the direction in which heat flows, and label the method of heat transfer.","marks":2,"img":"cond_blank","answer":{"lines":["An arrow along the rod pointing from the end in the flame towards the far end (1). Labelled conduction (1)."],"img":"cond_lab"},"orig":"3.4 Q3"},{"code":"3.4 Q4","crit":"3.4","type":"sa","text":"The diagram shows a pot of water being heated from below. Draw arrows on the diagram to show the convection current in the water, and label where the water rises and where it sinks.","marks":3,"img":"conv_blank","answer":{"lines":["Arrows point upwards above the flame in the middle of the pot (1), outwards across the top and down the cooler sides (1). Labels: warm water rises in the middle, cool water sinks at the sides (1)."],"img":"conv_lab"},"orig":"3.4 Q4"},{"code":"3.4 Q5","crit":"3.4","type":"sa","text":"The diagram shows the Sun and Earth. Draw on the diagram to show how heat travels from the Sun to Earth, and label the method of heat transfer.","marks":2,"img":"rad_blank","answer":{"lines":["Wavy arrows from the Sun to Earth across empty space (1). Labelled radiation (infrared) (1)."],"img":"rad_lab"},"orig":"3.4 Q5"}]},{"code":"4.1","topic":4,"title":"Define thermal conductor and thermal insulator","intro":{"text":"Thermal conductor: a material that allows heat to transfer through it easily. Thermal insulator: a material that does not allow heat to transfer through it easily. Metals are usually good conductors; non-metals are usually insulators."},"questions":[{"code":"4.1 Q1","crit":"4.1","type":"sa","text":"Define a thermal conductor and a thermal insulator.","marks":2,"diag":true,"answer":{"lines":["A thermal conductor is a material that allows heat to transfer through it easily (1). A thermal insulator is a material that does not allow heat to transfer through it easily (1)."]},"orig":"4.1 Q1"},{"code":"4.1 Q2","crit":"4.1","type":"mc","text":"A thermal insulator is a material that","marks":1,"options":["does not allow heat to transfer through it easily","allows heat to transfer through it easily","produces its own heat","stops all energy, including light, passing through it"],"answer":{"lines":["A. An insulator slows the transfer of heat. It does not produce heat, and many insulators, such as glass, still let light through."]},"orig":"4.1 Q2"},{"code":"4.1 Q3","crit":"4.1","type":"sa","text":"A saucepan is made of steel with a plastic handle. Identify the conductor and the insulator, and explain why each material is used.","marks":2,"answer":{"lines":["The steel pan is a conductor, so heat passes easily from the stove to the food (1). The plastic handle is an insulator, so heat does not pass easily into it and it stays cool enough to hold (1)."]},"orig":"4.1 Q3"},{"code":"4.1 Q4","crit":"4.1","type":"sa","text":"State which type of element usually makes a good thermal conductor and which type usually makes a good thermal insulator.","marks":2,"answer":{"lines":["Metals are usually good thermal conductors (1). Non-metals are usually good thermal insulators (1)."]},"orig":"4.1 Q4"}]},{"code":"4.2","topic":4,"title":"Classify various materials as thermal conductors or thermal insulators","intro":{"text":"Good thermal conductors: metals such as copper, aluminium, iron and silver. Good thermal insulators: wood, plastic, polystyrene foam, air, wool, rubber, fur and feathers."},"questions":[{"code":"4.2 Q1","crit":"4.2","type":"sa","text":"Classify each material as a thermal conductor or a thermal insulator.","marks":4,"parts":[{"text":"a.  Copper wire","marks":1},{"text":"b.  Wood","marks":1},{"text":"c.  Air","marks":1},{"text":"d.  Aluminium foil","marks":1}],"diag":true,"answer":{"lines":["a. Conductor (1).","b. Insulator (1).","c. Insulator (1).","d. Conductor (1)."]},"orig":"4.2 Q1"},{"code":"4.2 Q2","crit":"4.2","type":"mc","text":"Which material is the best thermal insulator?","marks":1,"options":["copper","steel","aluminium","polystyrene foam"],"answer":{"lines":["D. Polystyrene foam is a non-metal full of trapped air, so it is a very good insulator. Copper, steel and aluminium are metals, which are conductors."]},"orig":"4.2 Q2"},{"code":"4.2 Q3","crit":"4.2","type":"sa","text":"Rods of copper, steel and glass are heated at one end, as shown. Drawing pins are stuck to each rod with wax, and a pin falls when the wax holding it melts. State which rod's pins fall first and which fall last, and classify each material as a thermal conductor or a thermal insulator.","marks":3,"img":"rods","answer":{"lines":["The copper pins fall first and the glass pins last (or not at all) (1). Copper and steel are thermal conductors (1). Glass is a thermal insulator (1)."]},"orig":"4.2 Q3"},{"code":"4.2 Q4","crit":"4.2","type":"sa","text":"A foam can holder keeps a cold drink cold on a hot day. Classify the foam as a conductor or an insulator, and explain how it keeps the drink cold.","marks":2,"answer":{"lines":["The foam is a thermal insulator (1). It contains many trapped air spaces, so heat from the warm air outside is transferred into the can only very slowly (1)."]},"orig":"4.2 Q4"}]},{"code":"4.3","topic":4,"title":"Explain the properties of materials that make them better conductors or insulators (density, state of matter)","intro":{"text":"Solids conduct heat better than liquids, and liquids better than gases, because their particles are closer together. Dense materials with tightly packed particles, especially metals, are good conductors. Materials that trap air are good insulators, because the particles in a gas are far apart and rarely collide."},"questions":[{"code":"4.3 Q1","crit":"4.3","type":"sa","text":"Explain why a metal is a good thermal conductor and air is a good thermal insulator.","marks":3,"diag":true,"answer":{"lines":["A metal is a solid with its particles packed tightly together (it is dense) (1), so vibrations pass quickly from one particle to the next and heat is conducted easily (1). Air is a gas, so its particles are far apart and rarely collide, and heat is passed on very slowly (1)."]},"orig":"4.3 Q1"},{"code":"4.3 Q2","crit":"4.3","type":"mc","text":"A puffy down jacket is a good insulator mainly because it","marks":1,"options":["is made of tightly packed metal fibres that spread the body's heat evenly","produces its own heat from the feathers inside it","traps air, a gas whose particles are far apart and rarely collide","stops the body from producing heat"],"answer":{"lines":["C. The feathers trap a thick layer of air. Air is a gas, so it conducts heat very poorly and the body's heat stays in."]},"orig":"4.3 Q2"},{"code":"4.3 Q3","crit":"4.3","type":"sa","text":"Explain why a wooden handle on a frying pan stays cooler than a metal handle would.","marks":2,"answer":{"lines":["Wood is a non-metal whose particles are less tightly packed than the particles in a metal (1). Vibrations are passed on poorly, so heat is conducted along the wooden handle much more slowly (1)."]},"orig":"4.3 Q3"},{"code":"4.3 Q4","crit":"4.3","type":"sa","text":"Double-glazed windows have a thin layer of trapped air between two panes of glass. Explain, in terms of states of matter, why a double-glazed window loses less heat than a single pane of glass.","marks":3,"answer":{"lines":["The trapped air is a gas (1). In a gas the particles are far apart and rarely collide, so air is a very poor conductor (1). The air layer slows the conduction of heat from the warm inside to the cold outside, so less heat is lost (1)."]},"orig":"4.3 Q4"}]}],"imgs":{"ramp":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgMAAAF7CAYAAABPQohmAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAXEgAAFxIBZ5/SUgAAPxJJREFUeF7t3QeUVFW2xvFDjiqCkiRLULIIIipJQBgJZlRUEJQkhlHAOKYxMIyKoGQGR0QcB0QQHAdwQAFRJKrAIEEkShZBgsR66zvvVb261S10qHDD/7dWL7S76p57bnXX3XXC3jlCoVDIAACAwMoZ2J4DAACLYAAAgIAjGAAAIOAIBgAACDiCAQAAAo5gAACAgCMYAAAg4AgGAAAIOIIBAAACjmAAAICAIxgAACDgCAYAAAg4ggEAAAKOYAAAgIAjGAAAIOAIBgAACDiCAQAAAo5gAACAgCMYAAAg4HIHvP/ZMnjwYLNq1ap0j5E/f35z0UUXmerVq5uGDRuaggULZqstAAAShWAgG2bOnGlmzJhxxiOUK1fODB061LRv3/6MjwUAINmYJkiCzZs3mw4dOtiAAAAAt2FkII5eeuklkytXLnPy5EmzZcsWM2vWLLNhw4ZIC48//rhp27atqVixYhxbBQAgewgG4uixxx6zwUDY0aNHzW233WamTp1qv3Xo0CEzevRoM2DAgDi2CgBA9jBNkED58uUzr7zyiqOFFStWJLBFAAAyj2AgwSpVquQYLVi/fn2CWwQAIHMIBhJMawe0hiBMwQEAAG5CMJBAp06dMs8884yjhVq1aiWwRQAAMo8FhHE0btw4OyWgIEAjAtOnTzdLliyJtKBERN26dYtjiwAAZB/BQBzdc889pz3aiy++aKpVqxbHFgEAyD6CgSS44IILzKBBg0zHjh2T0BoAAJlDMBBHnTp1Mjlz/u8yjAIFCtjaBBdffLFp3LixKVy4cBxbAgAgfggG4uidd95xbCMEAMAL2E0AAEDAEQwAABBwBAMAAAQc function ptCell(z) { // returns [row, col] in the 18-column grid; rows 1-7 main block, 9-10 the f block
  if (z === 1) return [1, 1]; if (z === 2) return [1, 18];
  if (z <= 4) return [2, z - 2]; if (z <= 10) return [2, z + 8];
  if (z <= 12) return [3, z - 10]; if (z <= 18) return [3, z];
  if (z <= 36) return [4, z - 18];
  if (z <= 54) return [5, z - 36];
  if (z <= 57) return [6, z - 54];
  if (z <= 71) return [9, z - 54];        // Ce to Lu
  if (z <= 86) return [6, z - 68];        // Hf to Rn
  if (z <= 89) return [7, z - 86];
  if (z <= 103) return [10, z - 86];      // Th to Lr
  return [7, z - 100];                    // Rf to Og
}

const G = 9.8;
const R = (a, b, step) => { const n = Math.round((b - a) / step); return +(a + step * Math.floor(Math.random() * (n + 1))).toFixed(6); };
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pickN = (arr, n) => shuffle(arr).slice(0, n);
function mcq(correct, ds) { const options = shuffle([correct, ...ds]); return { options, letter: "ABCD"[options.indexOf(correct)] }; }
// plain number, up to 4 decimal places, thousands separated by spaces from 10 000
function f(x) {
  const v = Number(Number(x).toFixed(4));
  let [i, d] = String(Math.abs(v)).split(".");
  if (i.length > 4) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (v < 0 ? "–" : "") + i + (d ? "." + d : "");
}
