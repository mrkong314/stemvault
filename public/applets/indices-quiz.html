<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indices Quiz</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --ink: #1f2933;
    --muted: #6b7784;
    --line: #dbe1e8;
    --brand: #14477d;
    --correct: #1e7e46;
    --correct-bg: #e6f4ec;
    --wrong: #b3261e;
    --wrong-bg: #fbe9e7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .app { width: 100%; max-width: 560px; }
  header { margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; color: var(--brand); }
  .sub { color: var(--muted); font-size: 14px; }
  .bar {
    height: 8px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin: 14px 0 6px;
  }
  .bar > span {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--brand);
    transition: width .25s ease;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .question {
    font-size: 24px;
    margin: 4px 0 20px;
    min-height: 34px;
  }
  .options { display: grid; gap: 10px; }
  .opt {
    text-align: left;
    font-size: 18px;
    padding: 13px 16px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--brand); }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); font-weight: 600; }
  .opt.wrong { border-color: var(--wrong); background: var(--wrong-bg); color: var(--wrong); }
  .feedback { margin-top: 16px; font-size: 15px; min-height: 22px; }
  .feedback.right { color: var(--correct); }
  .feedback.no { color: var(--wrong); }
  .footer { margin-top: 20px; display: flex; justify-content: flex-end; }
  button.next {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--brand);
    border: none;
    border-radius: 8px;
    padding: 11px 22px;
    cursor: pointer;
  }
  button.next:disabled { opacity: .4; cursor: default; }
  sup { font-size: .68em; vertical-align: super; }
  .frac {
    display: inline-flex;
    flex-direction: column;
    vertical-align: middle;
    text-align: center;
    line-height: 1.05;
    margin: 0 1px;
  }
  .frac .num { border-bottom: 1.5px solid currentColor; padding: 0 3px; }
  .frac .den { padding: 0 3px; }
  .result { text-align: center; padding: 8px 0; }
  .score-num { font-size: 44px; font-weight: 700; color: var(--brand); }
  .score-line { color: var(--muted); margin: 6px 0 20px; }
  .review { text-align: left; margin-top: 8px; }
  .review div { font-size: 15px; padding: 7px 0; border-top: 1px solid var(--line); }
  .review .mark { font-weight: 700; margin-right: 8px; }
  .review .ok { color: var(--correct); }
  .review .bad { color: var(--wrong); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Indices Quiz</h1>
    <div class="sub">Simplify or evaluate each expression.</div>
    <div class="bar"><span id="progress"></span></div>
    <div class="meta">
      <span id="counter">Question 1</span>
      <span id="scoreboard">Score: 0</span>
    </div>
  </header>
  <div class="card" id="card"></div>
</div>

<script>
// answer values written in a mini-notation:
//   a^7        -> superscript
//   1/2        -> rendered as a stacked fraction
// No operation names shown to the student, and the correct answer is never revealed.
const QUESTIONS = [
  // multiplying
  { q: "3^2 × 3^3", options: ["3^5", "3^6", "9^5", "3^1"], answer: "3^5" },
  { q: "b^4 × b^3", options: ["b^12", "b^7", "b^1", "2b^7"], answer: "b^7" },
  { q: "x × x^4", options: ["x^4", "x^5", "x^3", "2x^4"], answer: "x^5" },
  { q: "n^5 × n^5", options: ["n^25", "2n^5", "n^10", "n^0"], answer: "n^10" },

  // dividing
  { q: "7^5 ÷ 7^2", options: ["7^7", "7^3", "7^10", "7^2"], answer: "7^3" },
  { q: "c^9 ÷ c^4", options: ["c^5", "c^13", "c^36", "c^4"], answer: "c^5" },
  { q: "k^6 ÷ k", options: ["k^6", "k^5", "k^7", "1"], answer: "k^5" },
  { q: "10^7 ÷ 10^3", options: ["10^10", "10^21", "10^4", "10^3"], answer: "10^4" },

  // power of a power
  { q: "(2^2)^3", options: ["2^5", "2^6", "2^8", "4^3"], answer: "2^6" },
  { q: "(b^4)^2", options: ["b^6", "b^16", "b^8", "2b^4"], answer: "b^8" },
  { q: "(y^3)^3", options: ["y^6", "y^9", "y^27", "y^1"], answer: "y^9" },
  { q: "(5^2)^2", options: ["5^2", "5^4", "5^6", "25^2"], answer: "5^4" },

  // zero and special cases
  { q: "9^0", options: ["0", "9", "1", "90"], answer: "1" },
  { q: "5a^0", options: ["0", "5", "1", "5a"], answer: "5" },
  { q: "2x^0", options: ["2x", "2", "1", "0"], answer: "2" },
  { q: "50^0", options: ["50", "0", "5", "1"], answer: "1" },

  // negative indices as fractions
  { q: "4^-1", options: ["1/4", "-4", "4", "1/8"], answer: "1/4" },
  { q: "7^-1", options: ["-7", "1/7", "7", "1/14"], answer: "1/7" },
  { q: "6^-1", options: ["-6", "1/6", "1/36", "6"], answer: "1/6" },
  { q: "2^-4", options: ["1/8", "1/16", "-16", "1/4"], answer: "1/16" },
  { q: "3^-2", options: ["1/6", "1/9", "1/3", "-9"], answer: "1/9" },
  { q: "5^-2", options: ["1/10", "1/25", "-25", "1/5"], answer: "1/25" },
  { q: "10^-2", options: ["1/10", "1/100", "-100", "1/20"], answer: "1/100" },
  { q: "2^-5", options: ["1/10", "1/32", "1/16", "-32"], answer: "1/32" }
];

// render mini-notation: superscripts and stacked fractions
function render(str) {
  if (/^\s*-?\d+\s*\/\s*\d+\s*$/.test(str)) {
    const [n, d] = str.split("/").map(s => s.trim());
    return '<span class="frac"><span class="num">' + n + '</span><span class="den">' + d + '</span></span>';
  }
  return str.replace(/\^(-?\w+)/g, "<sup>$1</sup>");
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let order = shuffle(QUESTIONS.map((_, i) => i));
let idx = 0;
let score = 0;
let answered = false;
let history = [];

const card = document.getElementById("card");
const progressEl = document.getElementById("progress");
const counterEl = document.getElementById("counter");
const scoreEl = document.getElementById("scoreboard");

function updateMeta() {
  progressEl.style.width = (idx / QUESTIONS.length * 100) + "%";
  counterEl.textContent = "Question " + (idx + 1) + " of " + QUESTIONS.length;
  scoreEl.textContent = "Score: " + score;
}

function renderQuestion() {
  answered = false;
  const q = QUESTIONS[order[idx]];
  const opts = shuffle(q.options);
  updateMeta();

  card.innerHTML =
    '<p class="question">' + render(q.q) + '</p>' +
    '<div class="options" id="options"></div>' +
    '<div class="feedback" id="feedback"></div>' +
    '<div class="footer"><button class="next" id="next" disabled>Next</button></div>';

  const box = document.getElementById("options");
  opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt";
    b.dataset.val = o;
    b.innerHTML = render(o);
    b.onclick = () => pick(b, o, q);
    box.appendChild(b);
  });

  document.getElementById("next").onclick = nextQuestion;
}

function pick(btn, chosen, q) {
  if (answered) return;
  answered = true;
  const correct = chosen === q.answer;
  const fb = document.getElementById("feedback");

  if (correct) {
    // only mark the chosen option; do not reveal the answer on wrong ones
    btn.classList.add("correct");
    score++;
    fb.className = "feedback right";
    fb.textContent = "Correct.";
  } else {
    btn.classList.add("wrong");
    fb.className = "feedback no";
    fb.textContent = "Not quite. Have another look at this one.";
  }
  document.querySelectorAll(".opt").forEach(b => { b.disabled = true; });

  history.push({ q: q.q, correct: correct });
  updateMeta();
  const nx = document.getElementById("next");
  nx.disabled = false;
  nx.textContent = (idx === QUESTIONS.length - 1) ? "See results" : "Next";
}

function nextQuestion() {
  idx++;
  if (idx >= QUESTIONS.length) return showResults();
  renderQuestion();
}

function showResults() {
  progressEl.style.width = "100%";
  counterEl.textContent = "Finished";
  scoreEl.textContent = "Score: " + score;
  const pct = Math.round(score / QUESTIONS.length * 100);
  const msg = pct === 100 ? "Perfect." : pct >= 75 ? "Strong work." : pct >= 50 ? "Getting there." : "Worth another go.";
  // review lists which questions were right or wrong, without giving the answers
  const rows = history.map(h => {
    const mark = h.correct
      ? '<span class="mark ok">&#10003;</span>'
      : '<span class="mark bad">&#10007;</span>';
    return '<div>' + mark + render(h.q) + '</div>';
  }).join("");
  card.innerHTML =
    '<div class="result">' +
      '<div class="score-num">' + score + ' / ' + QUESTIONS.length + '</div>' +
      '<div class="score-line">' + pct + '% &middot; ' + msg + '</div>' +
      '<div class="footer" style="justify-content:center"><button class="next" onclick="restart()">Try again</button></div>' +
      '<div class="review">' + rows + '</div>' +
    '</div>';
}

function restart() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0;
  score = 0;
  history = [];
  renderQuestion();
}

renderQuestion();
</script>
</body>
</html>
