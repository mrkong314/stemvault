<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 10 Chemical Reactions Practice</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathlive@0.110.0/mathlive.min.js"></script>
<style>
:root{--navy:#1B3A6B;--navy-2:#122A50;--sky:#2F7FD8;--sky-tint:#E7F0FB;--ink:#1E2430;--muted:#5F6B7A;--rule:#D8DFE8;--paper:#FFFFFF;--bg:#EEF3F9;
--got:#1F9D55;--got-tint:#E3F5EA;--part:#E09B12;--part-tint:#FCF1D6;--miss:#D64545;--miss-tint:#FBE4E4;
--t1:#1B3A6B;--t2:#0E7C86;--t3:#C4552F;--t4:#6A4C93;--t5:#2A9D5C;--t6:#D48A00;--t7:#2F7FD8;--t8:#B23A48;
--sans:"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
:root{--keycap-height:34px;--keycap-font-size:17px;--keycap-max-width:76px;--keycap-gap:6px;--keyboard-padding-top:4px;--keyboard-padding-bottom:4px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font:inherit;cursor:pointer}
header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 2px 0 var(--sky)}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{opacity:.85;font-size:14px}
header .tools{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header .saved{font-size:13px;opacity:.85}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--navy);padding:7px 13px;border-radius:6px;font-size:14px;font-weight:600}
.btn:hover{background:var(--sky-tint)}
header .btn{border-color:rgba(255,255,255,.35);background:transparent;color:#fff}
header .btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn:focus-visible,input:focus-visible,label:focus-within{outline:3px solid #9CC2F1;outline-offset:2px}
.layout{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 60px)}
nav{background:var(--paper);border-right:1px solid var(--rule);padding:14px 0 40px;overflow-y:auto;position:sticky;top:0;height:100vh}
nav .lead{padding:0 20px 10px;font-size:14px;color:var(--muted)}
nav .lead strong{color:var(--ink)}
nav h2{font-size:14px;margin:12px 20px 2px;padding:8px 0 4px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:8px}
nav h2:first-of-type{border-top:0;padding-top:0}
nav h2 .sw{width:12px;height:12px;border-radius:3px;background:var(--tc)}
.crit{display:grid;grid-template-columns:44px 1fr 74px;gap:8px;align-items:start;width:100%;text-align:left;border:0;background:none;padding:7px 20px;color:var(--ink);font-size:13.5px;line-height:1.35;border-left:4px solid transparent}
.crit:hover{background:var(--sky-tint)}
.crit.active{background:var(--sky-tint);border-left-color:var(--tc)}
.crit .code{font-weight:700;color:var(--tc);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:2px;margin-top:5px}
.seg i{display:block;height:8px;flex:1;background:var(--rule);border-radius:2px}
.seg i.m-got{background:var(--got)}.seg i.m-part{background:var(--part)}.seg i.m-miss{background:var(--miss)}
main{padding:24px 32px 80px;max-width:880px}
.home h2{font-size:26px;margin:0 0 6px;color:var(--navy)}
.home p{max-width:640px;color:var(--muted)}
.overall{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;margin:18px 0}
.overall .row{display:flex;align-items:center;gap:12px;font-size:14px;margin-bottom:6px}
.overall .bar{flex:1;height:14px;background:var(--rule);border-radius:7px;overflow:hidden;display:flex}
.overall .bar i{display:block;height:100%}
.overall .bar .g{background:var(--got)}.overall .bar .p{background:var(--part)}.overall .bar .m{background:var(--miss)}
.overall .key{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px}
.overall .key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:18px 0}
.tcard{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;border-top:4px solid var(--tc);text-align:left;color:var(--ink)}
.tcard:hover{border-color:var(--tc)}
.tcard .tn{font-weight:700;font-size:15px;color:var(--tc)}
.tcard .tt{font-size:14px;margin:2px 0 8px}
.tcard .bar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;display:flex}
.tcard .bar i{display:block;height:100%}
.tcard .bar .g{background:var(--got)}.tcard .bar .p{background:var(--part)}.tcard .bar .m{background:var(--miss)}
.tcard .tc2{font-size:12.5px;color:var(--muted);margin-top:6px}
.todo{margin-top:18px}
.todo h3{font-size:16px;margin:0 0 8px;color:var(--navy)}
.todo button{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:9px 14px;margin-bottom:6px;color:var(--ink);border-left:4px solid var(--tc)}
.todo button:hover{background:var(--sky-tint)}
.todo .code{color:var(--tc);font-weight:700;margin-right:8px}
.crit-head{margin-bottom:16px;padding-left:14px;border-left:5px solid var(--tc)}
.crit-head .code{color:var(--tc);font-weight:700;font-size:14px}
.crit-head h2{font-size:23px;margin:2px 0 4px;line-height:1.25;color:var(--navy)}
.crit-head .topic{color:var(--muted);font-size:14px}
.intro{background:var(--sky-tint);border:1px solid #CFE0F5;border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:15px}
.intro img{display:block;max-width:100%;width:440px;margin:6px auto;background:#fff;border-radius:4px}
.intro img.wide{width:100%;max-width:920px}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px 20px 14px;margin-bottom:14px;border-left:5px solid var(--rule)}
.q.m-got{border-left-color:var(--got)}.q.m-part{border-left-color:var(--part)}.q.m-miss{border-left-color:var(--miss)}
.qh{display:flex;gap:12px;align-items:center}
.qh .code{font-weight:700;color:var(--navy);font-size:15px}
.qh .marks{margin-left:auto;background:var(--navy);color:#fff;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap}
.qt{font-size:16.5px;line-height:1.55;margin:8px 0 10px}
.part{font-size:16.5px;margin:8px 0 4px 18px;display:flex;gap:12px}
.part .pm{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;align-self:center}
.q img{display:block;max-width:100%;width:420px;margin:8px auto}
.opts{list-style:none;padding:0;margin:8px 0}
.opts label{display:flex;gap:12px;padding:8px 10px;border-radius:6px;font-size:16px;cursor:pointer;align-items:center;border:1px solid transparent}
.opts label:hover{background:var(--sky-tint)}
.opts label.correct{background:var(--got-tint);border-color:var(--got)}.opts label.wrong{background:var(--miss-tint);border-color:var(--miss)}
.opts input{accent-color:var(--navy)}
.opts .let{font-weight:700;color:var(--navy);flex:0 0 22px}
.opts label span:last-child{flex:1}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:8px 0}
.nums label{display:block;font-size:13.5px;color:var(--muted);font-weight:600}
.nums input{display:block;width:100%;margin-top:3px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font:inherit;font-size:15px;background:#fff;font-weight:400}
.nums math-field{display:block;width:100%;margin-top:3px;padding:4px 8px;border:1px solid var(--rule);border-radius:6px;font-size:17px;background:#fff;--caret-color:var(--navy);--selection-background-color:var(--sky-tint)}
.nums math-field:focus-within{outline:3px solid #9CC2F1;outline-offset:2px}
.nums math-field.ok{border-color:var(--got);background:var(--got-tint)}.nums math-field.bad{border-color:var(--miss);background:var(--miss-tint)}
.nums math-field::part(menu-toggle){display:none}
.nums .preview{display:block;min-height:22px;margin-top:4px;color:var(--navy);font-size:15px}
.nums input.ok{border-color:var(--got);background:var(--got-tint)}.nums input.bad{border-color:var(--miss);background:var(--miss-tint)}
.katex{font-size:1.02em}
.hint{font-size:13px;color:var(--muted);margin:4px 0 10px}
.typed{margin:10px 0 2px}
.typed textarea{display:block;width:100%;min-height:96px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font:inherit;font-size:15px;line-height:1.45;background:#fff;resize:vertical}
.typed textarea:focus-visible{outline:3px solid #9CC2F1;outline-offset:2px}
.typed .tnote{font-size:12.5px;color:var(--muted);margin-top:4px}
.note-btn{margin-left:auto}
.note-btn.has{border-color:var(--part);color:#8a5d00;background:var(--part-tint)}
.note-btn.has::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--part);margin-right:6px;vertical-align:middle}
.note{margin:8px 0 2px}
.note textarea{display:block;width:100%;min-height:52px;padding:7px 10px;border:1px solid #EAD9A6;border-radius:6px;font:inherit;font-size:14px;line-height:1.4;background:#FFFBEC;resize:vertical}
.note textarea:focus-visible{outline:3px solid #9CC2F1;outline-offset:2px}
.actions .verdict{flex-basis:100%}
.sk{margin:8px auto;width:420px;max-width:100%}
.sk.pad{width:100%;margin:6px 0 2px}
.sk.pad canvas{border:1px solid var(--rule);border-radius:6px}
.sk img,.sk canvas{display:block;width:100%;max-width:100%;margin:0 auto}
.sk canvas.editing{cursor:crosshair;touch-action:none;outline:2px dashed var(--sky);outline-offset:2px}
.skbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.skbar button{font-size:12.5px;padding:4px 11px;border:1px solid var(--rule);border-radius:14px;background:#fff;color:var(--ink);font-weight:600}
.skbar button:hover{background:var(--sky-tint)}
.skbar button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.calc{position:fixed;right:24px;bottom:24px;width:360px;max-width:calc(100vw - 20px);background:var(--paper);border:1px solid var(--rule);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:50;font-size:14px}
.calc-h{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;background:var(--navy);color:#fff;border-radius:10px 10px 0 0;cursor:move;user-select:none;touch-action:none}
.calc-t{font-weight:700}
.calc-mode{margin-left:auto;display:flex;gap:2px}
.calc-mode button{font-size:12px;padding:3px 8px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:4px}
.calc-mode button.on{background:#fff;color:var(--navy)}
.calc-x{border:0;background:transparent;color:#fff;font-size:20px;line-height:1;padding:0 4px}
.calc-in{padding:10px 12px 4px}
.calc-in math-field{display:block;width:100%;font-size:19px;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:#fff;--caret-color:var(--navy)}
.calc-in math-field::part(menu-toggle){display:none}
.calc-in math-field::part(virtual-keyboard-toggle){display:none}
.calc-in input{display:block;width:100%;font:inherit;font-size:16px;padding:8px;border:1px solid var(--rule);border-radius:6px}
.calc-res{min-height:26px;padding:0 14px 6px;font-size:17px;color:var(--navy)}
.calc-res.err{font-size:13px;color:var(--miss)}
.calc-keys{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:4px 12px 8px}
.calc-keys button{font-size:13.5px;padding:7px 2px;border:1px solid var(--rule);border-radius:6px;background:#F7FAFE;color:var(--ink)}
.calc-keys button{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.calc-keys button:hover{background:var(--sky-tint)}
.calc-keys button.num{background:#fff;font-size:15.5px;font-weight:600}
.calc-keys button.op{font-size:15px}
.calc-keys button.act{background:var(--sky-tint)}
.calc-keys button.w2{grid-column:span 2}
.calc-keys button.eq{grid-column:span 2;background:var(--navy);color:#fff;border-color:var(--navy)}
.calc-note{font-size:12px;color:var(--muted);padding:0 14px 8px}
.calc-hh{display:flex;align-items:center;justify-content:space-between;padding:4px 14px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}
.calc-hclear{font-size:12px;padding:2px 8px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink)}
.pt{position:fixed;left:50%;top:112px;transform:translateX(-50%);width:min(1180px,96vw);background:#fff;border:1px solid var(--rule);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:55}
.pt-h{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;background:var(--navy);color:#fff;border-radius:10px 10px 0 0;cursor:move;user-select:none;touch-action:none}
.pt-t{font-weight:700}
.pt-x{margin-left:auto;border:0;background:transparent;color:#fff;font-size:20px;line-height:1;padding:0 4px}
.pt-body{padding:10px 12px 14px;overflow:auto;max-height:calc(100vh - 140px)}
.ptg{font-size:9px;color:#000;text-align:center;line-height:16px}
.ptp{font-size:9px;color:#000;display:flex;align-items:center;justify-content:center}
.pt-grid{display:grid;grid-template-columns:18px repeat(18,1fr);grid-template-rows:16px repeat(7,auto) 8px repeat(2,auto);gap:2px;min-width:860px}
.ptc{border:1px solid #000;background:#fff;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 0 3px;line-height:1.05;min-height:38px}
.ptz{font-size:8.5px}
.pts{font-size:13px;font-weight:700}
.ptm{font-size:8px}
@media(max-width:820px){.pt-body{max-height:calc(100vh - 120px)}}
.calc-hclear:hover{background:var(--miss-tint);border-color:var(--miss)}
.calc-hist{max-height:38px;overflow-y:auto}
.calc-hist .hrow{display:flex;align-items:stretch;border-top:1px solid var(--sky-tint)}
.calc-hist .huse{flex:1;display:flex;justify-content:space-between;gap:10px;min-height:36px;text-align:left;border:0;background:#fff;padding:5px 6px 5px 14px;font-size:13.5px;color:var(--ink);align-items:center}
.calc-hist .huse:hover{background:var(--sky-tint)}
.calc-hist .hdel{border:0;background:#fff;color:var(--muted);font-size:17px;line-height:1;width:32px;opacity:0;cursor:pointer}
.calc-hist .hrow:hover .hdel,.calc-hist .hdel:focus-visible{opacity:1}
.calc-hist .hdel:hover{color:var(--miss);background:var(--miss-tint)}
@media (hover:none){.calc-hist .hdel{opacity:1}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.answer{display:none;margin-top:12px;border-top:2px solid var(--sky-tint);padding:12px 14px 4px;background:#F7FAFE;border-radius:0 0 6px 6px;font-size:15.5px;color:#123}
.answer.open{display:block}
.answer p{margin:0 0 6px}
.answer p:first-child::before{content:"Answer";display:block;font-size:12px;font-weight:700;color:var(--sky);letter-spacing:.3px;margin-bottom:4px}
.answer img{width:360px;margin:6px 0;background:#fff}
.selfmark{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;font-size:14px;color:var(--muted)}
.selfmark button{border:1px solid var(--rule);background:#fff;border-radius:20px;padding:6px 15px;font-size:14px;color:var(--ink);font-weight:600}
.selfmark button.m-got:hover{background:var(--got-tint);border-color:var(--got)}.selfmark button.m-part:hover{background:var(--part-tint);border-color:var(--part)}.selfmark button.m-miss:hover{background:var(--miss-tint);border-color:var(--miss)}
.selfmark button.m-got.on{background:var(--got);border-color:var(--got);color:#fff}
.selfmark button.m-part.on{background:var(--part);border-color:var(--part);color:#fff}
.selfmark button.m-miss.on{background:var(--miss);border-color:var(--miss);color:#fff}
.selfmark .similar{margin-left:auto;border-color:var(--sky);color:var(--sky);background:#fff}
.selfmark .similar:hover{background:var(--sky-tint)}
.selfmark .similar + .similar{margin-left:0}
.vtag{font-weight:600;color:var(--sky);font-size:12.5px;margin-left:6px}
.verdict{font-size:14px;font-weight:600}
.verdict.ok{color:var(--got)}.verdict.no{color:var(--miss)}
.constants{display:none;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;font-size:14.5px;margin-bottom:18px}
.constants.open{display:block}
.constants .ct{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.constants .cc{display:inline-block;margin:2px 18px 2px 0}
.menu-toggle{display:none}
.back{display:none}
@media (max-width:860px){
  .layout{display:block}
  nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule)}
  nav.hidden{display:none}
  main{padding:18px 14px 60px}
  .menu-toggle{display:inline-block}
  .back{display:inline-block;margin-bottom:12px}
  .crit{grid-template-columns:40px 1fr 60px}
}
</style>
</head>
<body>
<header>
  <h1>Year 10 Chemical Reactions Practice</h1>
  <span class="sub">Conservation of mass and equations; reaction types; energy in reactions; collision theory and reaction rate</span>
  <div class="tools">
    <button class="btn menu-toggle" id="menuBtn">Criteria</button>
    <button class="btn" id="homeBtn">Back to home</button>
    <button class="btn" id="calcBtn">Calculator</button>
    <button class="btn" id="ptBtn">Periodic table</button>
    <button class="btn" id="resetBtn">Reset progress</button>
    <span class="saved" id="savedNote"></span>
  </div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
const DATA = {"topics":["Conservation of Mass and Chemical Equations","Types of Chemical Reactions","Energy in Chemical Reactions","Collision Theory and Reaction Rate"],"bank":[{"code":"1.1","topic":1,"title":"Write formulae for ionic compounds (overall neutral charge) using a periodic table and a table of ions.","intro":{"text":"The data sheet table of ions is shown. To write an ionic formula, write the cation first and the anion second, then combine the ions in the smallest whole-number ratio that makes the overall charge zero (swap and drop: each ion's charge number becomes the other ion's subscript, then divide by any common factor). Brackets go around a polyatomic ion when more than one is needed, as in Cu(OH)₂. For main-group elements the periodic table gives the charge: groups 1, 2 and 13 form 1+, 2+ and 3+ ions; groups 15, 16 and 17 form 3–, 2– and 1– ions.","img":"ion_table","wide":true},"questions":[{"code":"1.1 Q1","crit":"1.1","type":"sa","text":"Write the formula for each ionic compound.","marks":3,"parts":[{"text":"a.  calcium chloride","marks":1},{"text":"b.  iron(III) oxide","marks":1},{"text":"c.  magnesium nitrate","marks":1}],"diag":true,"answer":{"lines":["a. Ca²⁺ and Cl⁻: two chloride ions balance one calcium ion, CaCl₂ (1).","b. Fe³⁺ and O²⁻: 2 × (3+) = 6+ balances 3 × (2–) = 6–, so Fe₂O₃ (1).","c. Mg²⁺ and NO₃⁻: two nitrate ions, in brackets, Mg(NO₃)₂ (1)."]},"orig":"1.1 Q1"},{"code":"1.1 Q2","crit":"1.1","type":"mc","text":"The formula of aluminium sulfate is","marks":1,"options":["Al₂(SO₄)₃","AlSO₄","Al₃(SO₄)₂","Al₂SO₄₃"],"answer":{"lines":["A. Al³⁺ and SO₄²⁻: two aluminium ions (6+) balance three sulfate ions (6–), and the sulfate ion is bracketed because more than one is needed. AlSO₄ is not neutral, Al₃(SO₄)₂ swaps the numbers the wrong way, and Al₂SO₄₃ leaves out the brackets."]},"orig":"1.1 Q2"},{"code":"1.1 Q3","crit":"1.1","type":"sa","text":"Write the formula for each ionic compound.","marks":3,"parts":[{"text":"a.  potassium sulfide","marks":1},{"text":"b.  zinc phosphate","marks":1},{"text":"c.  lead(II) hydroxide","marks":1}],"answer":{"lines":["a. K⁺ and S²⁻: K₂S (1).","b. Zn²⁺ and PO₄³⁻: 3 × (2+) = 6+ balances 2 × (3–) = 6–, so Zn₃(PO₄)₂ (1).","c. Pb²⁺ and OH⁻: Pb(OH)₂ (1)."]},"orig":"1.1 Q3"},{"code":"1.1 Q4","crit":"1.1","type":"sa","text":"A student writes the formula of calcium hydroxide as CaOH₂. Explain the mistake and write the correct formula.","marks":2,"answer":{"lines":["Two hydroxide ions (OH⁻) are needed to balance one Ca²⁺ ion, but without brackets the 2 applies only to the hydrogen, not to the whole OH group (1). The correct formula is Ca(OH)₂ (1)."]},"orig":"1.1 Q4"},{"code":"1.1 Q5","crit":"1.1","type":"sa","text":"Use the periodic table to predict the charges on the ions formed by aluminium and by sulfur, then write the formula for aluminium sulfide.","marks":3,"answer":{"lines":["Aluminium is in group 13, so it loses 3 electrons to form Al³⁺ (1). Sulfur is in group 16, so it gains 2 electrons to form S²⁻ (1). Two Al³⁺ (6+) balance three S²⁻ (6–), so the formula is Al₂S₃ (1)."]},"orig":"1.1 Q5"}]},{"code":"1.2","topic":1,"title":"Name ionic compounds from ionic formulae.","intro":{"text":"Name the cation first, using the name of the element. Metals that can form ions with different charges (copper and iron), and the other metals shown with a Roman numeral on the data sheet (lead, nickel, tin), include the charge as a Roman numeral in brackets, e.g. iron(III). Name the anion second: a single non-metal ion ends in -ide (chloride, oxide); a polyatomic ion keeps its data-sheet name (nitrate, sulfate, hydroxide).","img":"ion_table","wide":true},"questions":[{"code":"1.2 Q1","crit":"1.2","type":"sa","text":"Name each ionic compound.","marks":3,"parts":[{"text":"a.  NaBr","marks":1},{"text":"b.  Fe₂(SO₄)₃","marks":1},{"text":"c.  Cu₂O","marks":1}],"diag":true,"answer":{"lines":["a. Sodium bromide (1).","b. Iron(III) sulfate: three SO₄²⁻ (6–) are balanced by two iron ions, so each iron ion is Fe³⁺ (1).","c. Copper(I) oxide: one O²⁻ is balanced by two copper ions, so each is Cu⁺ (1)."]},"orig":"1.2 Q1"},{"code":"1.2 Q2","crit":"1.2","type":"mc","text":"The name of Pb(NO₃)₂ is","marks":1,"options":["lead(II) nitride","lead(II) nitrate","lead(I) nitrate","lead nitrogen oxide"],"answer":{"lines":["B. Two NO₃⁻ ions (2–) balance one lead ion, so it is Pb²⁺, lead(II). NO₃⁻ is the nitrate ion; nitride is N³⁻."]},"orig":"1.2 Q2"},{"code":"1.2 Q3","crit":"1.2","type":"sa","text":"Name each ionic compound.","marks":4,"parts":[{"text":"a.  MgCO₃","marks":1},{"text":"b.  Al₂O₃","marks":1},{"text":"c.  Ni(NO₃)₂","marks":1},{"text":"d.  LiHCO₃","marks":1}],"answer":{"lines":["a. Magnesium carbonate (1).","b. Aluminium oxide (1).","c. Nickel(II) nitrate (1).","d. Lithium hydrogen carbonate (1)."]},"orig":"1.2 Q3"},{"code":"1.2 Q4","crit":"1.2","type":"sa","text":"A student names both FeCl₂ and FeCl₃ as \"iron chloride\". Explain why this is not acceptable, and name each compound correctly.","marks":3,"answer":{"lines":["Iron can form ions with different charges (Fe²⁺ and Fe³⁺), so the name must give the charge as a Roman numeral or the two compounds cannot be told apart (1). FeCl₂: two Cl⁻ balance one iron ion, so it is iron(II) chloride (1). FeCl₃: three Cl⁻ balance one iron ion, so it is iron(III) chloride (1)."]},"orig":"1.2 Q4"}]},{"code":"1.3","topic":1,"title":"Define the theory of conservation of mass (matter is transformed in a chemical reaction, not created, or destroyed).","intro":{"text":"Theory of conservation of mass: matter is transformed in a chemical reaction, not created or destroyed. The atoms in the reactants are rearranged to form the products, so the total mass of the products equals the total mass of the reactants."},"questions":[{"code":"1.3 Q1","crit":"1.3","type":"sa","text":"Define the theory of conservation of mass.","marks":2,"diag":true,"answer":{"lines":["In a chemical reaction matter is transformed: the atoms in the reactants are rearranged to form the products (1). Matter is not created or destroyed, so the total mass of the products equals the total mass of the reactants (1)."]},"orig":"1.3 Q1"},{"code":"1.3 Q2","crit":"1.3","type":"mc","text":"Which statement agrees with the theory of conservation of mass?","marks":1,"options":["Some of the atoms are used up, so the products have less mass than the reactants.","New atoms form during the reaction, so the products have more mass than the reactants.","The atoms in the reactants are rearranged, so the total mass does not change.","Mass is conserved only in reactions that do not give off heat or light."],"answer":{"lines":["C. Matter is not created or destroyed in a reaction: the same atoms are present before and after, only rearranged, so the total mass stays the same."]},"orig":"1.3 Q2"},{"code":"1.3 Q3","crit":"1.3","type":"sa","text":"Explain, in terms of atoms, why the total mass of the products of a reaction equals the total mass of the reactants.","marks":2,"answer":{"lines":["During a reaction the bonds between atoms are broken and new bonds form, so the atoms are rearranged into new substances (1). No atoms are created or destroyed, so the same number of each kind of atom, and therefore the same mass, is present before and after (1)."]},"orig":"1.3 Q3"},{"code":"1.3 Q4","crit":"1.3","type":"sa","text":"Complete the sentences: In a chemical reaction ________ is not lost or gained. This idea is known as the ________. A chemical reaction involves ________ the atoms that make up the reactants to form the products.","marks":3,"answer":{"lines":["Mass (1). The conservation of mass (1). Rearranging (1)."]},"orig":"1.3 Q4"}]},{"code":"1.4","topic":1,"title":"Evaluate experimental evidence using the theory of conservation of mass.","intro":{"text":"Total mass of reactants = total mass of products. In an open container a gas produced by the reaction can escape, so the measured mass falls; a gas from the air can also react, so the measured mass rises. Mass has not been created or destroyed in either case."},"questions":[{"code":"1.4 Q1","crit":"1.4","type":"sa","text":"30 g of zinc powder is added to 150 g of copper(II) sulfate solution in a beaker. Calculate the total mass of the products after the reaction.","marks":2,"num":[["mass of products (g)",180]],"diag":true,"answer":{"lines":["Total mass of reactants = 30 + 150 = 180 g (1). Mass is conserved, so the products have a total mass of 180 g (1)."]},"orig":"1.4 Q1"},{"code":"1.4 Q2","crit":"1.4","type":"mc","text":"Magnesium ribbon is burned in an open crucible, and the mass of solid in the crucible increases. The best explanation is that","marks":1,"options":["new atoms have been created in the flame","the heat from the flame has mass that is added to the solid","mass is not conserved when a substance burns","oxygen atoms from the air have combined with the magnesium"],"answer":{"lines":["D. Magnesium reacts with oxygen from the air to form magnesium oxide. The oxygen atoms were already present in the air, so the total mass of everything involved is conserved."]},"orig":"1.4 Q2"},{"code":"1.4 Q3","crit":"1.4","type":"sa","text":"Marble chips react with hydrochloric acid in an open flask that sits on a balance. The total mass falls from 250.0 g to 248.2 g during the reaction. Explain whether this result disproves the theory of conservation of mass, and calculate the mass of carbon dioxide gas that escaped.","marks":3,"num":[["mass of carbon dioxide (g)",1.8]],"answer":{"lines":["No: the reaction produces carbon dioxide gas, which escapes from the open flask, so it is not weighed (1). Mass of carbon dioxide = 250.0 – 248.2 = 1.8 g (1). If the flask were sealed the mass would stay at 250.0 g, so mass is conserved (1)."]},"orig":"1.4 Q3"},{"code":"1.4 Q4","crit":"1.4","type":"sa","text":"A student heats 2.00 g of copper(II) carbonate until it has completely decomposed, leaving 1.29 g of copper(II) oxide. Carbon dioxide gas is also produced. Calculate the mass of carbon dioxide produced, and explain why the mass of solid decreased.","marks":3,"num":[["mass of carbon dioxide (g)",0.71]],"answer":{"lines":["Mass of carbon dioxide = 2.00 – 1.29 = 0.71 g (1). The carbon dioxide is a gas that escapes into the air (1). Mass is still conserved: 1.29 + 0.71 = 2.00 g, the mass of the reactant (1)."]},"orig":"1.4 Q4"}]},{"code":"1.5","topic":1,"title":"Recall the four states of matter in chemistry (solid, liquid, gas, and aqueous ‐ dissolved in water).","intro":{"text":"There are four states of matter in chemistry. Solid (s): e.g. a powder, piece, chunk or crystals. Liquid (l): a pure substance that can be poured, e.g. water or molten (melted) salt. Gas (g). Aqueous (aq): a solution in which a solute is dissolved in water, e.g. salty water."},"questions":[{"code":"1.5 Q1","crit":"1.5","type":"sa","text":"Name the four states of matter used in chemistry and give the symbol for each.","marks":4,"diag":true,"answer":{"lines":["Solid, (s) (1). Liquid, (l) (1). Gas, (g) (1). Aqueous (dissolved in water), (aq) (1)."]},"orig":"1.5 Q1"},{"code":"1.5 Q2","crit":"1.5","type":"mc","text":"A solution of sodium chloride in water is written as","marks":1,"options":["NaCl(aq)","NaCl(l)","NaCl(s)","NaCl(g)"],"answer":{"lines":["A. Sodium chloride dissolved in water is aqueous, (aq). NaCl(l) is molten sodium chloride with no water."]},"orig":"1.5 Q2"},{"code":"1.5 Q3","crit":"1.5","type":"sa","text":"Write the chemical formula followed by the state (in brackets) for each substance.","marks":4,"parts":[{"text":"a.  Copper(II) sulfate crystals","marks":1},{"text":"b.  Carbon dioxide gas","marks":1},{"text":"c.  A solution of potassium nitrate","marks":1},{"text":"d.  Molten (melted) sodium chloride","marks":1}],"answer":{"lines":["a. CuSO₄(s) (1).","b. CO₂(g) (1).","c. KNO₃(aq) (1).","d. NaCl(l) (1)."]},"orig":"1.5 Q3"},{"code":"1.5 Q4","crit":"1.5","type":"sa","text":"Explain the difference between NaCl(l) and NaCl(aq).","marks":2,"answer":{"lines":["NaCl(l) is pure sodium chloride that has been melted (molten), with no water present (1). NaCl(aq) is sodium chloride dissolved in water, a solution (1)."]},"orig":"1.5 Q4"}]},{"code":"1.6","topic":1,"title":"Write worded and balanced chemical equations with states from worded descriptions.","intro":{"text":"Write the word equation with states first: reactants on the left of the arrow, products on the right. Then replace each name with its formula. Balance the equation by placing numbers (coefficients) in front of formulae, never by changing a formula, until every element has the same number of atoms on each side. Hydrogen, oxygen, nitrogen and chlorine gases are diatomic: H₂, O₂, N₂, Cl₂."},"questions":[{"code":"1.6 Q1","crit":"1.6","type":"sa","text":"Solid magnesium is burned in oxygen gas, producing solid magnesium oxide. Write the word equation with states and the balanced chemical equation with states.","marks":3,"diag":true,"answer":{"lines":["magnesium(s) + oxygen(g) → magnesium oxide(s) (1). Formulae: Mg, O₂ and MgO with correct states (1). Balanced: 2Mg(s) + O₂(g) → 2MgO(s) (1)."]},"orig":"1.6 Q1"},{"code":"1.6 Q2","crit":"1.6","type":"mc","text":"Which is the balanced equation for hydrogen gas reacting with oxygen gas to form liquid water?","marks":1,"options":["H₂(g) + O₂(g) → H₂O₂(l)","2H₂(g) + O₂(g) → 2H₂O(l)","H₂(g) + O₂(g) → H₂O(l)","2H₂(g) + O₂(g) → H₂O(l)"],"answer":{"lines":["B. Two water molecules are needed to use both oxygen atoms, and then two hydrogen molecules. H₂O₂ changes the formula of water, which is not allowed."]},"orig":"1.6 Q2"},{"code":"1.6 Q3","crit":"1.6","type":"sa","text":"Balance the equation by giving the coefficient of each substance: ___Al(s) + ___O₂(g) → ___Al₂O₃(s)","marks":3,"num":[["coefficient of Al",4,0],["coefficient of O₂",3,0],["coefficient of Al₂O₃",2,0]],"answer":{"lines":["Oxygen: three O₂ molecules give 6 oxygen atoms, enough for two Al₂O₃ (1). Aluminium: two Al₂O₃ contain 4 aluminium atoms, so 4Al (1). 4Al(s) + 3O₂(g) → 2Al₂O₃(s) (1)."]},"orig":"1.6 Q3"},{"code":"1.6 Q4","crit":"1.6","type":"sa","text":"Methane gas burns in oxygen gas, producing carbon dioxide gas and liquid water. Write the word equation with states and the balanced chemical equation with states.","marks":3,"answer":{"lines":["methane(g) + oxygen(g) → carbon dioxide(g) + water(l) (1). Formulae with states: CH₄(g), O₂(g), CO₂(g), H₂O(l) (1). Balanced: CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(l) (1)."]},"orig":"1.6 Q4"},{"code":"1.6 Q5","crit":"1.6","type":"sa","text":"A piece of zinc is placed in hydrochloric acid, HCl(aq), producing a solution of zinc chloride and hydrogen gas. Write the word equation with states and the balanced chemical equation with states.","marks":3,"answer":{"lines":["zinc(s) + hydrochloric acid(aq) → zinc chloride(aq) + hydrogen(g) (1). Formulae with states: Zn(s), HCl(aq), ZnCl₂(aq), H₂(g) (1). Balanced: Zn(s) + 2HCl(aq) → ZnCl₂(aq) + H₂(g) (1)."]},"orig":"1.6 Q5"}]},{"code":"1.7","topic":1,"title":"Identify the formula of a missing chemical when provided with an incomplete balanced chemical equation.","intro":{"text":"In a balanced equation each element has the same number of atoms on both sides. Tally the atoms of each element on each side; the atoms that are missing make up the unknown formula (divide by its coefficient if it has one)."},"questions":[{"code":"1.7 Q1","crit":"1.7","type":"sa","text":"Identify the formula of the missing chemical: 2Na(s) + 2H₂O(l) → 2____(aq) + H₂(g)","marks":2,"diag":true,"answer":{"lines":["Reactants: 2 sodium, 4 hydrogen and 2 oxygen atoms. Products without the missing chemical: 2 hydrogen atoms. Missing: 2 sodium, 2 hydrogen and 2 oxygen atoms (1). Dividing by the coefficient 2 gives NaOH (1)."]},"orig":"1.7 Q1"},{"code":"1.7 Q2","crit":"1.7","type":"mc","text":"The missing chemical in N₂(g) + 3____(g) → 2NH₃(g) is","marks":1,"options":["H","H₃","NH","H₂"],"answer":{"lines":["D. The products contain 6 hydrogen atoms and 2 nitrogen atoms. N₂ supplies the nitrogen, so the 3 missing molecules must supply 6 hydrogen atoms: each is H₂."]},"orig":"1.7 Q2"},{"code":"1.7 Q3","crit":"1.7","type":"sa","text":"Identify the formula of the missing chemical: Pb(NO₃)₂(aq) + 2KI(aq) → ____(s) + 2KNO₃(aq)","marks":2,"answer":{"lines":["Reactants: 1 lead, 2 nitrogen, 6 oxygen, 2 potassium and 2 iodine atoms. Products shown: 2 potassium, 2 nitrogen and 6 oxygen atoms. Missing: 1 lead and 2 iodine atoms (1). The missing chemical is PbI₂ (1)."]},"orig":"1.7 Q3"},{"code":"1.7 Q4","crit":"1.7","type":"sa","text":"Identify the formula of the missing chemical: ____(s) + 2HCl(aq) → MgCl₂(aq) + H₂O(l) + CO₂(g)","marks":3,"answer":{"lines":["Products: 1 magnesium, 2 chlorine, 2 hydrogen, 3 oxygen and 1 carbon atom (1). The 2HCl supplies 2 hydrogen and 2 chlorine atoms, so the missing chemical supplies 1 magnesium, 1 carbon and 3 oxygen atoms (1). The missing chemical is MgCO₃ (1)."]},"orig":"1.7 Q4"}]},{"code":"2.1","topic":2,"title":"Recall that chemical reactions may be categorised according to type (synthesis, decomposition, displacement, and double displacement).","intro":{"text":"Synthesis: two or more reactants combine to form a single product. Decomposition: a single reactant breaks apart to form two or more products. Displacement: a more reactive element displaces a less reactive element from a compound. Double displacement (precipitation): two solutions are mixed, the ions switch partners, and an insoluble product (a precipitate) forms."},"questions":[{"code":"2.1 Q1","crit":"2.1","type":"sa","text":"Name the four types of chemical reaction studied in this unit, and describe each in one sentence.","marks":4,"diag":true,"answer":{"lines":["Synthesis: two or more reactants combine to form a single product (1). Decomposition: a single reactant breaks apart into two or more products (1). Displacement: a more reactive element displaces a less reactive element from a compound (1). Double displacement (precipitation): two solutions are mixed and an insoluble product, the precipitate, forms (1)."]},"orig":"2.1 Q1"},{"code":"2.1 Q2","crit":"2.1","type":"mc","text":"Which of the following is not one of the four types of chemical reaction studied in this unit?","marks":1,"options":["synthesis","neutralisation","decomposition","double displacement"],"answer":{"lines":["B. The four types studied are synthesis, decomposition, displacement and double displacement (precipitation)."]},"orig":"2.1 Q2"},{"code":"2.1 Q3","crit":"2.1","type":"sa","text":"Name the type of reaction described in each case.","marks":3,"parts":[{"text":"a.  Two solutions are mixed and a solid forms.","marks":1},{"text":"b.  One reactant breaks apart into two or more products.","marks":1},{"text":"c.  Two or more reactants combine to form one product.","marks":1}],"answer":{"lines":["a. Double displacement (precipitation) (1).","b. Decomposition (1).","c. Synthesis (1)."]},"orig":"2.1 Q3"}]},{"code":"2.2","topic":2,"title":"Identify synthesis reactions, in which multiple reactants form a single product.","intro":{"text":"A synthesis reaction has two or more reactants and only one product: A + B → AB."},"questions":[{"code":"2.2 Q1","crit":"2.2","type":"sa","text":"Four reactions are listed. Identify the synthesis reaction and explain your choice. Reaction A: Zn(s) + CuSO₄(aq) → ZnSO₄(aq) + Cu(s);  reaction B: 2Na(s) + Cl₂(g) → 2NaCl(s);  reaction C: CaCO₃(s) → CaO(s) + CO₂(g);  reaction D: BaCl₂(aq) + Na₂SO₄(aq) → BaSO₄(s) + 2NaCl(aq).","marks":2,"diag":true,"answer":{"lines":["B, 2Na(s) + Cl₂(g) → 2NaCl(s) (1). Two reactants, sodium and chlorine, combine to form a single product, sodium chloride (1)."]},"orig":"2.2 Q1"},{"code":"2.2 Q2","crit":"2.2","type":"mc","text":"Which of the following is a synthesis reaction?","marks":1,"options":["2H₂O₂(aq) → 2H₂O(l) + O₂(g)","Mg(s) + ZnSO₄(aq) → MgSO₄(aq) + Zn(s)","N₂(g) + 3H₂(g) → 2NH₃(g)","AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq)"],"answer":{"lines":["C. Nitrogen and hydrogen combine to form a single product, ammonia. The others have two products."]},"orig":"2.2 Q2"},{"code":"2.2 Q3","crit":"2.2","type":"sa","text":"Iron reacts with chlorine gas to form solid iron(III) chloride. Write the balanced chemical equation with states, and explain why this is a synthesis reaction.","marks":3,"answer":{"lines":["Formulae: Fe(s), Cl₂(g), FeCl₃(s) (1). 2Fe(s) + 3Cl₂(g) → 2FeCl₃(s) (1). Two reactants combine to form one product, so it is synthesis (1)."]},"orig":"2.2 Q3"},{"code":"2.2 Q4","crit":"2.2","type":"sa","text":"A student says that 2H₂O₂(aq) → 2H₂O(l) + O₂(g) is a synthesis reaction because two substances are formed. Explain why the student is wrong and name the correct type.","marks":2,"answer":{"lines":["A synthesis reaction forms a single product from two or more reactants, but here there is one reactant and two products (1). It is a decomposition reaction (1)."]},"orig":"2.2 Q4"}]},{"code":"2.3","topic":2,"title":"Identify decomposition reactions, in which a single reactant forms multiple products.","intro":{"text":"A decomposition reaction has only one reactant, which breaks apart to form two or more products: AB → A + B. Many need heat or electricity to proceed."},"questions":[{"code":"2.3 Q1","crit":"2.3","type":"sa","text":"Four reactions are listed. Identify the decomposition reaction and explain your choice. Reaction A: Zn(s) + CuSO₄(aq) → ZnSO₄(aq) + Cu(s);  reaction B: 2Na(s) + Cl₂(g) → 2NaCl(s);  reaction C: CaCO₃(s) → CaO(s) + CO₂(g);  reaction D: BaCl₂(aq) + Na₂SO₄(aq) → BaSO₄(s) + 2NaCl(aq).","marks":2,"diag":true,"answer":{"lines":["C, CaCO₃(s) → CaO(s) + CO₂(g) (1). A single reactant, calcium carbonate, breaks apart into two products (1)."]},"orig":"2.3 Q1"},{"code":"2.3 Q2","crit":"2.3","type":"mc","text":"Which of the following is a decomposition reaction?","marks":1,"options":["2H₂(g) + O₂(g) → 2H₂O(l)","Fe(s) + CuSO₄(aq) → FeSO₄(aq) + Cu(s)","Pb(NO₃)₂(aq) + 2KI(aq) → PbI₂(s) + 2KNO₃(aq)","PCl₅(g) → PCl₃(g) + Cl₂(g)"],"answer":{"lines":["D. One reactant, PCl₅, breaks apart into two products."]},"orig":"2.3 Q2"},{"code":"2.3 Q3","crit":"2.3","type":"sa","text":"When copper(II) carbonate is heated strongly it forms solid copper(II) oxide and carbon dioxide gas. Write the word equation and the balanced chemical equation, both with states, and identify the type of reaction.","marks":3,"answer":{"lines":["copper(II) carbonate(s) → copper(II) oxide(s) + carbon dioxide(g) (1). CuCO₃(s) → CuO(s) + CO₂(g) (1). Decomposition: one reactant forms two products (1)."]},"orig":"2.3 Q3"},{"code":"2.3 Q4","crit":"2.3","type":"sa","text":"Passing electricity through liquid water breaks it down into hydrogen gas and oxygen gas. Write the balanced chemical equation with states and identify the type of reaction.","marks":2,"answer":{"lines":["2H₂O(l) → 2H₂(g) + O₂(g) (1). Decomposition, as a single reactant forms two products (1)."]},"orig":"2.3 Q4"}]},{"code":"2.4","topic":2,"title":"Identify displacement reactions, in which a more reactive element displaces a less reactive element from a compound.","intro":{"text":"In a displacement reaction a solid metal is placed in a solution of an ionic compound. If the solid metal is more reactive, it forms ions and goes into solution, and the less reactive metal comes out of solution as solid atoms: the metals switch places. The data sheet reactivity series is shown.","img":"reactivity_series","wide":true},"questions":[{"code":"2.4 Q1","crit":"2.4","type":"sa","text":"Four reactions are listed. Identify the displacement reaction, and name the element that is displaced. Reaction A: Zn(s) + CuSO₄(aq) → ZnSO₄(aq) + Cu(s);  reaction B: 2Na(s) + Cl₂(g) → 2NaCl(s);  reaction C: CaCO₃(s) → CaO(s) + CO₂(g);  reaction D: BaCl₂(aq) + Na₂SO₄(aq) → BaSO₄(s) + 2NaCl(aq).","marks":2,"diag":true,"answer":{"lines":["A, Zn(s) + CuSO₄(aq) → ZnSO₄(aq) + Cu(s) (1). Zinc is more reactive, so it displaces copper from copper(II) sulfate (1)."]},"orig":"2.4 Q1"},{"code":"2.4 Q2","crit":"2.4","type":"mc","text":"Which of the following is a displacement reaction?","marks":1,"options":["Cu(s) + 2AgNO₃(aq) → Cu(NO₃)₂(aq) + 2Ag(s)","CaO(s) + CO₂(g) → CaCO₃(s)","2Ag₂O(s) → 4Ag(s) + O₂(g)","CuSO₄(aq) + 2NaOH(aq) → Cu(OH)₂(s) + Na₂SO₄(aq)"],"answer":{"lines":["A. Copper is more reactive than silver, so solid copper displaces silver from silver nitrate solution."]},"orig":"2.4 Q2"},{"code":"2.4 Q3","crit":"2.4","type":"sa","text":"An iron nail is placed in blue copper(II) sulfate solution. The nail becomes coated with a red-brown solid and the blue colour of the solution slowly fades. Identify the type of reaction, name the red-brown solid, and explain why the blue colour fades.","marks":3,"answer":{"lines":["Displacement: iron is more reactive than copper (1). The red-brown solid is copper metal (1). The blue colour is caused by Cu²⁺ ions; as the copper ions come out of solution as copper atoms they are replaced by iron(II) ions, Fe²⁺, which do not give the blue colour (1)."]},"orig":"2.4 Q3"},{"code":"2.4 Q4","crit":"2.4","type":"sa","text":"For the reaction Mg(s) + ZnSO₄(aq) → MgSO₄(aq) + Zn(s), identify the element that is displaced and state which metal is more reactive.","marks":2,"answer":{"lines":["Zinc is displaced from zinc sulfate (1). Magnesium is more reactive than zinc (1)."]},"orig":"2.4 Q4"}]},{"code":"2.5","topic":2,"title":"Use a metal reactivity series to predict if a displacement reaction will take place.","intro":{"text":"A metal displaces a second metal from a solution of its compound only if the solid metal is more reactive (further left in the series) than the metal in the solution. If the metal in the solution is more reactive, no reaction occurs.","img":"reactivity_series","wide":true},"questions":[{"code":"2.5 Q1","crit":"2.5","type":"sa","text":"Pieces of metal are added to ionic solutions. For each mixture, state whether a displacement reaction will occur, and give a reason.","marks":4,"parts":[{"text":"a.  Ag and Cu(NO₃)₂(aq)","marks":1},{"text":"b.  Zn and CuSO₄(aq)","marks":1},{"text":"c.  Sn and ZnCl₂(aq)","marks":1},{"text":"d.  Mg and FeSO₄(aq)","marks":1}],"diag":true,"answer":{"lines":["a. No: silver is less reactive than copper (1).","b. Yes: zinc is more reactive than copper (1).","c. No: tin is less reactive than zinc (1).","d. Yes: magnesium is more reactive than iron (1)."]},"orig":"2.5 Q1"},{"code":"2.5 Q2","crit":"2.5","type":"mc","text":"Which mixture will produce a displacement reaction?","marks":1,"options":["Cu(s) and ZnSO₄(aq)","Fe(s) and AgNO₃(aq)","Ag(s) and CuCl₂(aq)","Sn(s) and MgCl₂(aq)"],"answer":{"lines":["B. Iron is more reactive than silver, so it displaces silver. In each other mixture the solid metal is less reactive than the metal in solution."]},"orig":"2.5 Q2"},{"code":"2.5 Q3","crit":"2.5","type":"sa","text":"Strips of aluminium, copper, zinc and silver are placed in separate samples of tin(II) chloride solution. State which metals become coated with tin, and explain.","marks":2,"answer":{"lines":["Aluminium and zinc (1). They are more reactive than tin, so they displace tin from the solution; copper and silver are less reactive than tin (1)."]},"orig":"2.5 Q3"},{"code":"2.5 Q4","crit":"2.5","type":"sa","text":"Metal X displaces copper from copper(II) nitrate solution, but does not displace zinc from zinc nitrate solution. Use the reactivity series to identify the two metals that X could be.","marks":2,"answer":{"lines":["X is more reactive than copper but less reactive than zinc (1). X could be iron or tin (1)."]},"orig":"2.5 Q4"}]},{"code":"2.6","topic":2,"title":"Identify double displacement (precipitation) reactions, in which two solutions are mixed, and an insoluble product (precipitate) is formed.","intro":{"text":"In a double displacement (precipitation) reaction two solutions of ionic compounds are mixed and the cations switch partners. One product is soluble and stays in solution (aq); the other is insoluble and forms a solid, the precipitate (s).","img":"solubility_table","wide":true},"questions":[{"code":"2.6 Q1","crit":"2.6","type":"sa","text":"Four reactions are listed. Identify the double displacement (precipitation) reaction, and identify the precipitate. Reaction A: Zn(s) + CuSO₄(aq) → ZnSO₄(aq) + Cu(s);  reaction B: 2Na(s) + Cl₂(g) → 2NaCl(s);  reaction C: CaCO₃(s) → CaO(s) + CO₂(g);  reaction D: BaCl₂(aq) + Na₂SO₄(aq) → BaSO₄(s) + 2NaCl(aq).","marks":2,"diag":true,"answer":{"lines":["D, BaCl₂(aq) + Na₂SO₄(aq) → BaSO₄(s) + 2NaCl(aq) (1). The precipitate is barium sulfate, BaSO₄(s) (1)."]},"orig":"2.6 Q1"},{"code":"2.6 Q2","crit":"2.6","type":"mc","text":"Which of the following is a double displacement (precipitation) reaction?","marks":1,"options":["Ni(s) + CuCl₂(aq) → NiCl₂(aq) + Cu(s)","H₂(g) + Cl₂(g) → 2HCl(g)","2NaCl(l) → 2Na(l) + Cl₂(g)","AgNO₃(aq) + KCl(aq) → AgCl(s) + KNO₃(aq)"],"answer":{"lines":["D. Two solutions are mixed and their ions switch partners, forming the insoluble solid silver chloride."]},"orig":"2.6 Q2"},{"code":"2.6 Q3","crit":"2.6","type":"sa","text":"Colourless solutions of silver nitrate and sodium chloride are mixed and a white solid forms. Identify the type of reaction, name the white solid, and write the balanced chemical equation with states.","marks":3,"answer":{"lines":["Double displacement (precipitation) (1). The white solid is silver chloride (1). AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq) (1)."]},"orig":"2.6 Q3"},{"code":"2.6 Q4","crit":"2.6","type":"sa","text":"Explain why a precipitation reaction is also called a double displacement reaction.","marks":2,"answer":{"lines":["Each metal ion displaces the other from its partner anion, so the ions in two compounds switch partners (1). This is two displacements at once, and one of the new combinations is insoluble and forms the precipitate (1)."]},"orig":"2.6 Q4"}]},{"code":"2.7","topic":2,"title":"Determine the solubility of ionic substances in water using a solubility table.","intro":{"text":"The solubility table (from the data sheet) shows whether each ionic compound is soluble (S) or insoluble (I) in water. Find the row of the cation and the column of the anion.","img":"solubility_table","wide":true},"questions":[{"code":"2.7 Q1","crit":"2.7","type":"sa","text":"Use the solubility table to state whether each compound is soluble or insoluble in water.","marks":4,"parts":[{"text":"a.  calcium carbonate","marks":1},{"text":"b.  zinc chloride","marks":1},{"text":"c.  lead(II) iodide","marks":1},{"text":"d.  sodium phosphate","marks":1}],"diag":true,"answer":{"lines":["a. Insoluble (1).","b. Soluble (1).","c. Insoluble (1).","d. Soluble (1)."]},"orig":"2.7 Q1"},{"code":"2.7 Q2","crit":"2.7","type":"mc","text":"Which ionic compound is insoluble in water?","marks":1,"options":["barium chloride","copper(II) nitrate","silver bromide","magnesium sulfate"],"answer":{"lines":["C. Silver bromide is marked I in the table. The other three are soluble."]},"orig":"2.7 Q2"},{"code":"2.7 Q3","crit":"2.7","type":"sa","text":"Use the solubility table to name the insoluble compounds that contain chloride ions.","marks":2,"answer":{"lines":["Silver chloride (1). Lead(II) chloride (1)."]},"orig":"2.7 Q3"},{"code":"2.7 Q4","crit":"2.7","type":"sa","text":"Which of the following compounds are soluble in water? PbSO₄, CuCl₂, Na₂CO₃, Mg(OH)₂","marks":2,"answer":{"lines":["CuCl₂ (copper(II) chloride) is soluble (1). Na₂CO₃ (sodium carbonate) is soluble; PbSO₄ and Mg(OH)₂ are insoluble (1)."]},"orig":"2.7 Q4"}]},{"code":"2.8","topic":2,"title":"Identify the type of reaction when provided with a worded or chemical equation.","intro":{"text":"Count the reactants and products and look at what they are. One product from several reactants: synthesis. Several products from one reactant: decomposition. An element and a compound forming a new element and a new compound: displacement. Two solutions (ionic compounds) forming a precipitate and a solution: double displacement."},"questions":[{"code":"2.8 Q1","crit":"2.8","type":"sa","text":"Identify the type of each reaction.","marks":4,"parts":[{"text":"a.  Iron metal reacts with chlorine gas to produce iron(III) chloride.","marks":1},{"text":"b.  Barium nitrate solution is mixed with sodium sulfate solution and a white solid forms.","marks":1},{"text":"c.  MgCO₃(s) → MgO(s) + CO₂(g)","marks":1},{"text":"d.  2Al(s) + 3CuCl₂(aq) → 2AlCl₃(aq) + 3Cu(s)","marks":1}],"diag":true,"answer":{"lines":["a. Synthesis: two reactants form one product (1).","b. Double displacement (precipitation): two solutions form a precipitate (1).","c. Decomposition: one reactant forms two products (1).","d. Displacement: aluminium displaces copper from its compound (1)."]},"orig":"2.8 Q1"},{"code":"2.8 Q2","crit":"2.8","type":"mc","text":"The reaction FeCl₃(aq) + 3NaOH(aq) → Fe(OH)₃(s) + 3NaCl(aq) is an example of","marks":1,"options":["double displacement (precipitation)","displacement","synthesis","decomposition"],"answer":{"lines":["A. Two solutions react and the ions switch partners, forming the insoluble solid Fe(OH)₃."]},"orig":"2.8 Q2"},{"code":"2.8 Q3","crit":"2.8","type":"sa","text":"Identify the type of each reaction.","marks":2,"parts":[{"text":"a.  Calcium carbonate is heated strongly, forming calcium oxide and carbon dioxide gas.","marks":1},{"text":"b.  A piece of magnesium is placed in silver nitrate solution and silver crystals form on the magnesium.","marks":1}],"answer":{"lines":["a. Decomposition (1).","b. Displacement (1)."]},"orig":"2.8 Q3"},{"code":"2.8 Q4","crit":"2.8","type":"sa","text":"Explain how the reactants of a displacement reaction differ from the reactants of a double displacement (precipitation) reaction.","marks":2,"answer":{"lines":["In a displacement reaction the reactants are an element (a solid metal) and an ionic compound in solution (1). In a double displacement reaction both reactants are ionic compounds in solution (1)."]},"orig":"2.8 Q4"}]},{"code":"2.9","topic":2,"title":"Predict the products of displacement and double displacement (precipitation) reactions from the reactants.","intro":{"text":"Displacement: if the solid metal is more reactive (reactivity series), the two metals switch places; otherwise no reaction. Precipitation: switch the cations of the two compounds, then use the solubility table to find any insoluble product, the precipitate (s). The solubility table is shown; the reactivity series is attached to the questions that need it.","img":"solubility_table","wide":true},"questions":[{"code":"2.9 Q1","crit":"2.9","type":"sa","text":"Predict the products, with states, of each mixture.","marks":4,"parts":[{"text":"a.  Zn(s) and CuSO₄(aq)","marks":2,"img":"reactivity_small"},{"text":"b.  Silver nitrate solution and potassium iodide solution","marks":2}],"diag":true,"answer":{"lines":["a. Zinc is more reactive than copper, so a reaction occurs (1): the products are ZnSO₄(aq) and Cu(s) (1).","b. Switching partners gives silver iodide and potassium nitrate (1). Silver iodide is insoluble, so the products are AgI(s) and KNO₃(aq) (1)."]},"orig":"2.9 Q1"},{"code":"2.9 Q2","crit":"2.9","type":"mc","text":"Lead(II) nitrate solution is mixed with sodium chloride solution. The precipitate that forms is","marks":1,"options":["sodium nitrate","lead(II) nitrate","lead(II) chloride","sodium chloride"],"answer":{"lines":["C. Switching partners gives lead(II) chloride and sodium nitrate. Lead(II) chloride is insoluble, so it is the precipitate; sodium nitrate stays in solution."]},"orig":"2.9 Q2"},{"code":"2.9 Q3","crit":"2.9","type":"sa","text":"Sodium bromide solution is mixed with copper(II) nitrate solution. Predict the products and state whether a precipitate forms.","marks":2,"answer":{"lines":["Switching partners gives sodium nitrate and copper(II) bromide (1). Both are soluble, so no precipitate forms (1)."]},"orig":"2.9 Q3"},{"code":"2.9 Q4","crit":"2.9","type":"sa","text":"Predict the products of each mixture, or state that no reaction occurs.","marks":4,"parts":[{"text":"a.  Cu(s) and AgNO₃(aq)","marks":2,"img":"reactivity_small"},{"text":"b.  Ag(s) and Cu(NO₃)₂(aq)","marks":2}],"answer":{"lines":["a. Copper is more reactive than silver, so it displaces silver (1): Cu(NO₃)₂(aq) and Ag(s) (1).","b. Silver is less reactive than copper (1), so no reaction occurs (1)."]},"orig":"2.9 Q4"}]},{"code":"2.10","topic":2,"title":"Write a worded and balanced chemical reaction for each of the reaction types.","intro":{"text":"Write the word equation with states, predict the products using the reactivity series or the solubility table where needed, replace each name with its formula, then balance. Ionic compounds dissolved in water are (aq); a precipitate is (s). The reactivity series is shown.","img":"reactivity_series","wide":true},"questions":[{"code":"2.10 Q1","crit":"2.10","type":"sa","text":"Barium nitrate solution is added to sodium carbonate solution, producing a white precipitate of barium carbonate. Write the word equation and the balanced chemical equation, both with states.","marks":3,"diag":true,"answer":{"lines":["barium nitrate(aq) + sodium carbonate(aq) → barium carbonate(s) + sodium nitrate(aq) (1). Formulae: Ba(NO₃)₂, Na₂CO₃, BaCO₃, NaNO₃ (1). Ba(NO₃)₂(aq) + Na₂CO₃(aq) → BaCO₃(s) + 2NaNO₃(aq) (1)."]},"orig":"2.10 Q1"},{"code":"2.10 Q2","crit":"2.10","type":"mc","text":"Which is the balanced equation for aluminium displacing copper from copper(II) sulfate solution?","marks":1,"options":["2Al(s) + 3CuSO₄(aq) → Al₂(SO₄)₃(aq) + 3Cu(s)","Al(s) + CuSO₄(aq) → AlSO₄(aq) + Cu(s)","2Al(s) + 3CuSO₄(aq) → Al₂(SO₄)₃(aq) + 3Cu(aq)","3Al(s) + 2CuSO₄(aq) → Al₃(SO₄)₂(aq) + 2Cu(s)"],"answer":{"lines":["A. Aluminium sulfate is Al₂(SO₄)₃ (Al³⁺ and SO₄²⁻) and copper metal is a solid; three CuSO₄ balance the three sulfate ions."]},"orig":"2.10 Q2"},{"code":"2.10 Q3","crit":"2.10","type":"sa","text":"Synthesis: solid sodium burns in chlorine gas to form solid sodium chloride. Write the word equation and the balanced chemical equation, both with states.","marks":3,"answer":{"lines":["sodium(s) + chlorine(g) → sodium chloride(s) (1). Formulae: Na, Cl₂, NaCl (1). 2Na(s) + Cl₂(g) → 2NaCl(s) (1)."]},"orig":"2.10 Q3"},{"code":"2.10 Q4","crit":"2.10","type":"sa","text":"Decomposition: hydrogen peroxide solution decomposes into liquid water and oxygen gas. Write the word equation and the balanced chemical equation, both with states.","marks":3,"answer":{"lines":["hydrogen peroxide(aq) → water(l) + oxygen(g) (1). Formulae: H₂O₂, H₂O, O₂ (1). 2H₂O₂(aq) → 2H₂O(l) + O₂(g) (1)."]},"orig":"2.10 Q4"},{"code":"2.10 Q5","crit":"2.10","type":"sa","text":"Displacement: a strip of magnesium is placed in silver nitrate solution. Write the word equation and the balanced chemical equation, both with states.","marks":3,"answer":{"lines":["magnesium(s) + silver nitrate(aq) → magnesium nitrate(aq) + silver(s) (1). Formulae: Mg, AgNO₃, Mg(NO₃)₂, Ag (1). Mg(s) + 2AgNO₃(aq) → Mg(NO₃)₂(aq) + 2Ag(s) (1)."]},"orig":"2.10 Q5"}]},{"code":"3.1","topic":3,"title":"Define activation energy (energy required to break bonds in reactants to start a reaction), exothermic reaction (heat releasing), and endothermic reaction (heat absorbing).","intro":{"text":"Activation energy: the energy required to break the bonds in the reactants to start a reaction. Every reaction needs it. Exothermic reaction: a reaction that releases heat. Endothermic reaction: a reaction that absorbs heat."},"questions":[{"code":"3.1 Q1","crit":"3.1","type":"sa","text":"Define activation energy, exothermic reaction and endothermic reaction.","marks":3,"diag":true,"answer":{"lines":["Activation energy is the energy required to break the bonds in the reactants to start a reaction (1). An exothermic reaction releases heat (thermal energy) to the surroundings (1). An endothermic reaction absorbs heat (thermal energy) from the surroundings (1)."]},"orig":"3.1 Q1"},{"code":"3.1 Q2","crit":"3.1","type":"mc","text":"Activation energy is the","marks":1,"options":["total heat released to the surroundings by a reaction once it is complete","energy required to break the bonds in the reactants to start a reaction","chemical energy stored in the bonds of the products of a reaction","heat absorbed from the surroundings during an endothermic reaction"],"answer":{"lines":["B. Bonds in the reactants must be broken before a reaction can start, and the energy needed to do this is the activation energy."]},"orig":"3.1 Q2"},{"code":"3.1 Q3","crit":"3.1","type":"sa","text":"A piece of wood does not burn on its own in air, but it starts burning when a lit match is held to it. Explain this using the idea of activation energy.","marks":2,"answer":{"lines":["The bonds in the reactants (wood and oxygen) must be broken before the reaction can start, which requires activation energy (1). The match supplies this activation energy as heat; once started, the burning releases enough heat to keep going (1)."]},"orig":"3.1 Q3"},{"code":"3.1 Q4","crit":"3.1","type":"sa","text":"A student says that only endothermic reactions need activation energy. Explain whether the student is correct.","marks":2,"answer":{"lines":["The student is incorrect: all reactions, exothermic and endothermic, need activation energy (1). In every reaction bonds in the reactants must be broken to start the reaction, and breaking bonds requires energy (1)."]},"orig":"3.1 Q4"}]},{"code":"3.2","topic":3,"title":"Recall the energy transformation in exothermic (chemical to thermal) and endothermic (thermal to chemical) reactions.","intro":{"text":"Reactions convert energy between chemical energy (stored in the bonds of the chemicals) and thermal (heat) energy (in the surroundings). Exothermic: chemical energy → thermal energy. Endothermic: thermal energy → chemical energy."},"questions":[{"code":"3.2 Q1","crit":"3.2","type":"sa","text":"State the energy transformation that takes place in an exothermic reaction and in an endothermic reaction.","marks":2,"diag":true,"answer":{"lines":["Exothermic: chemical energy is transformed into thermal (heat) energy (1). Endothermic: thermal (heat) energy is transformed into chemical energy (1)."]},"orig":"3.2 Q1"},{"code":"3.2 Q2","crit":"3.2","type":"mc","text":"In an endothermic reaction, energy is transformed from","marks":1,"options":["chemical energy into thermal energy","chemical energy into kinetic energy","thermal energy into chemical energy","chemical energy into light energy"],"answer":{"lines":["C. An endothermic reaction absorbs thermal energy from the surroundings and stores it as chemical energy in the bonds of the products."]},"orig":"3.2 Q2"},{"code":"3.2 Q3","crit":"3.2","type":"sa","text":"Natural gas burns on a stove and heats a pot of water. Identify whether the reaction is exothermic or endothermic, and state the energy transformation.","marks":2,"answer":{"lines":["Exothermic (1). Chemical energy stored in the gas and oxygen is transformed into thermal energy, which heats the water (1)."]},"orig":"3.2 Q3"},{"code":"3.2 Q4","crit":"3.2","type":"sa","text":"An instant cold pack feels cold when the chemicals inside it react. Identify the type of reaction, state the energy transformation, and explain where the energy comes from.","marks":3,"answer":{"lines":["Endothermic (1). Thermal energy is transformed into chemical energy (1). The thermal energy is absorbed from the surroundings, including your hand, which is why the pack feels cold (1)."]},"orig":"3.2 Q4"}]},{"code":"3.3","topic":3,"title":"Recall that exothermic reactions increase, and endothermic reactions decrease the temperature of the surrounding environment.","intro":{"text":"An exothermic reaction releases thermal energy, so the temperature of the surroundings (the container, the solution and the air around it) increases. An endothermic reaction absorbs thermal energy, so the temperature of the surroundings decreases."},"questions":[{"code":"3.3 Q1","crit":"3.3","type":"sa","text":"An endothermic reaction occurs in a beaker on a lab bench. The beaker, its contents and the surrounding air start at 25 °C. State what happens to their temperature, and explain why.","marks":2,"diag":true,"answer":{"lines":["The temperature decreases, falling below 25 °C (1). The reaction absorbs thermal energy from the beaker, its contents and the air, converting it into chemical energy (1)."]},"orig":"3.3 Q1"},{"code":"3.3 Q2","crit":"3.3","type":"mc","text":"An exothermic reaction occurs in a beaker sitting on a lab bench. Which temperature change of the beaker, its contents and the surrounding air is correct?","marks":1,"options":["30 °C to 25 °C","25 °C to 25 °C","30 °C to 20 °C","25 °C to 30 °C"],"answer":{"lines":["D. An exothermic reaction releases thermal energy, so the temperature of the surroundings increases."]},"orig":"3.3 Q2"},{"code":"3.3 Q3","crit":"3.3","type":"sa","text":"A hand warmer contains chemicals that react when the packet is activated. Explain why the hand warmer feels warm, naming the type of reaction.","marks":2,"answer":{"lines":["The reaction is exothermic (1). Chemical energy is transformed into thermal energy, which is released and raises the temperature of the packet and your hands (1)."]},"orig":"3.3 Q3"},{"code":"3.3 Q4","crit":"3.3","type":"sa","text":"For each statement, write exothermic, endothermic, or all reactions.","marks":4,"parts":[{"text":"a.  A reaction that converts thermal energy into chemical energy.","marks":1},{"text":"b.  A reaction that releases energy to the surroundings.","marks":1},{"text":"c.  A reaction that cools the surroundings.","marks":1},{"text":"d.  A reaction that requires energy to begin.","marks":1}],"answer":{"lines":["a. Endothermic (1).","b. Exothermic (1).","c. Endothermic (1).","d. All reactions (1)."]},"orig":"3.3 Q4"}]},{"code":"3.4","topic":3,"title":"Draw and label energy profile diagrams using the specific reactants and products, activation energy, and heat released or absorbed.","intro":{"text":"An energy profile diagram plots chemical energy (vertical axis) against reaction progress. It shows the energy of the reactants and the products, the activation energy (from the reactants up to the peak) and the energy released or absorbed (the difference between the reactants and the products). The example is an exothermic reaction.","img":"profile_exo_words"},"questions":[{"code":"3.4 Q1","crit":"3.4","type":"sa","text":"Draw and label an energy profile diagram for the exothermic reaction Zn(s) + CuSO₄(aq) → ZnSO₄(aq) + Cu(s), using the specific reactants and products, the activation energy and the heat released.","marks":4,"diag":true,"answer":{"lines":["Axes labelled chemical energy and reaction progress (1). Reactants, Zn(s) + CuSO₄(aq), at a higher level than the products, ZnSO₄(aq) + Cu(s) (1). Activation energy shown as an arrow from the reactants up to the peak (1). Energy released shown as an arrow down from the reactant level to the product level (1)."],"img":"sol_profile_zn"},"orig":"3.4 Q1"},{"code":"3.4 Q2","crit":"3.4","type":"mc","text":"On the energy profile diagram of an endothermic reaction,","marks":1,"options":["the products are higher in chemical energy than the reactants","the reactants are higher in chemical energy than the products","there is no activation energy, as heat is absorbed","the products and the reactants are at the same energy level"],"answer":{"lines":["A. An endothermic reaction absorbs thermal energy and stores it as chemical energy, so the products end up higher than the reactants. Every reaction has an activation energy."]},"orig":"3.4 Q2"},{"code":"3.4 Q3","crit":"3.4","type":"sa","text":"The energy profile diagram shows a reaction. Identify what each of the letters A, B, C and D represents, and state whether the reaction is exothermic or endothermic.","marks":5,"img":"profile_exo_letters","answer":{"lines":["A: reactants (1). B: products (1). C: activation energy (1). D: energy (heat) released (1). Exothermic, because the products are lower in chemical energy than the reactants (1)."],"img":"profile_exo_words"},"orig":"3.4 Q3"},{"code":"3.4 Q4","crit":"3.4","type":"sa","text":"When copper(II) carbonate is heated it decomposes in an endothermic reaction: CuCO₃(s) → CuO(s) + CO₂(g). Draw and label the energy profile diagram, using the specific reactants and products, the activation energy and the heat absorbed.","marks":4,"answer":{"lines":["Axes labelled chemical energy and reaction progress (1). Reactant, CuCO₃(s), at a lower level than the products, CuO(s) + CO₂(g) (1). Activation energy shown as an arrow from the reactant level up to the peak (1). Energy absorbed shown as an arrow up from the reactant level to the product level (1)."],"img":"sol_profile_cuco3"},"orig":"3.4 Q4"},{"code":"3.4 Q5","crit":"3.4","type":"sa","text":"The energy profile diagram shown is missing one key label. Identify the missing label, state whether the reaction is exothermic or endothermic, and state whether the surroundings become hotter or colder, referring to thermal energy.","marks":3,"img":"profile_exo_noea","answer":{"lines":["The activation energy is missing (1). The reaction is exothermic, as the products are lower in chemical energy than the reactants (1). The surroundings become hotter because thermal energy is released by the reaction (1)."],"img":"profile_exo_words"},"orig":"3.4 Q5"}]},{"code":"3.5","topic":3,"title":"Identify a reaction as exothermic or endothermic from an energy profile diagram or experimental evidence.","intro":{"text":"From an energy profile diagram: products lower than reactants means exothermic; products higher than reactants means endothermic. From an experiment: a rise in the temperature of the surroundings means exothermic; a fall means endothermic."},"questions":[{"code":"3.5 Q1","crit":"3.5","type":"sa","text":"Identify each reaction as exothermic or endothermic.","marks":3,"parts":[{"text":"a.  Magnesium ribbon burns with a bright white flame and the crucible becomes hot.","marks":1},{"text":"b.  A reaction occurs according to the energy profile shown.","marks":1,"img":"profile_endo_plain"},{"text":"c.  Ammonium chloride is dissolved in water and the temperature of the solution falls from 20.1 °C to 14.7 °C.","marks":1}],"diag":true,"answer":{"lines":["a. Exothermic: heat is released (1).","b. Endothermic: the products are higher in chemical energy than the reactants (1).","c. Endothermic: the temperature of the solution falls (1)."]},"orig":"3.5 Q1"},{"code":"3.5 Q2","crit":"3.5","type":"mc","text":"A thermometer in a reaction mixture rises from 21 °C to 34 °C during a reaction. The reaction is","marks":1,"options":["endothermic, because thermal energy is absorbed from the surroundings","exothermic, because thermal energy is released to the surroundings","exothermic, because thermal energy is absorbed from the surroundings","endothermic, because thermal energy is released to the surroundings"],"answer":{"lines":["B. The temperature of the mixture (the surroundings) rose, so thermal energy was released: the reaction is exothermic."]},"orig":"3.5 Q2"},{"code":"3.5 Q3","crit":"3.5","type":"sa","text":"A student dissolves ammonium chloride in water and records the temperature of the solution, as shown in the table. Explain whether the process is exothermic or endothermic, state the energy transformation, and state the time at which the salt has fully dissolved.","marks":3,"img":"nh4cl_table","answer":{"lines":["Endothermic, as the temperature of the solution goes down from 20.1 °C to 14.7 °C (1). Thermal energy is transformed into chemical energy (1). The temperature stops falling at 80 s, so the salt has fully dissolved at about 80 s (between 60 s and 80 s) (1)."]},"orig":"3.5 Q3"},{"code":"3.5 Q4","crit":"3.5","type":"sa","text":"Powdered zinc is added to 20 mL of copper(II) sulfate solution in a polystyrene cup. The temperature rises from 21.0 °C to 38.5 °C. Calculate the temperature change, and identify the reaction as exothermic or endothermic, explaining using the energy transformation.","marks":3,"num":[["temperature change (°C)",17.5]],"answer":{"lines":["Temperature change = 38.5 – 21.0 = 17.5 °C (1). The reaction is exothermic (1). Chemical energy is transformed into thermal energy, which is released and raises the temperature of the solution (1)."]},"orig":"3.5 Q4"}]},{"code":"4.1","topic":4,"title":"Recall that collisions between reactant particles must have the correct orientation and sufficient energy for a reaction to occur.","intro":{"text":"For a chemical reaction to happen, reactant particles have to collide. A collision only produces products if it has the correct orientation and sufficient energy (at least the activation energy) to break the bonds in the reactants. Otherwise the particles bounce off each other."},"questions":[{"code":"4.1 Q1","crit":"4.1","type":"sa","text":"State the two conditions a collision between reactant particles must meet for a reaction to occur.","marks":2,"diag":true,"answer":{"lines":["The particles must collide with the correct orientation (1). The collision must have sufficient energy, at least the activation energy, to break the bonds in the reactants (1)."]},"orig":"4.1 Q1"},{"code":"4.1 Q2","crit":"4.1","type":"mc","text":"Which of the following are required for a successful collision? I: correct orientation. II: sufficient energy.","marks":1,"options":["I only","II only","I and II","Neither I nor II"],"answer":{"lines":["C. A collision must have both the correct orientation and enough energy to break the bonds in the reactants."]},"orig":"4.1 Q2"},{"code":"4.1 Q3","crit":"4.1","type":"sa","text":"The diagram shows two collisions between particle A and molecule BC. Both collisions have more than the activation energy. Identify which collision is successful, and explain why the other is not.","marks":2,"img":"collisions","answer":{"lines":["Collision X is successful: A hits the B end and forms the new product AB (1). In collision Y, A hits the C end, the wrong orientation, so the particles bounce apart and no product forms (1)."]},"orig":"4.1 Q3"},{"code":"4.1 Q4","crit":"4.1","type":"sa","text":"In a reaction mixture the reactant particles collide billions of times every second, yet only some collisions produce products. Explain why.","marks":2,"answer":{"lines":["Many collisions have the wrong orientation, so the particles simply bounce off each other (1). Many collisions do not have enough energy (at least the activation energy) to break the bonds in the reactants (1)."]},"orig":"4.1 Q4"}]},{"code":"4.2","topic":4,"title":"Recall that the reaction rate is the frequency of successful collisions (those that generate a product) between reactant particles.","intro":{"text":"Reaction rate is the frequency of successful collisions (those that generate a product) between reactant particles. It depends on the frequency of collisions and the percentage of collisions that are successful."},"questions":[{"code":"4.2 Q1","crit":"4.2","type":"sa","text":"Define reaction rate in terms of collisions between reactant particles.","marks":2,"diag":true,"answer":{"lines":["Reaction rate is the frequency of successful collisions between reactant particles (1), where a successful collision is one that generates a product (1)."]},"orig":"4.2 Q1"},{"code":"4.2 Q2","crit":"4.2","type":"mc","text":"Which reaction has the highest rate?","marks":1,"options":["1000 collisions per second, with 15% of collisions successful","100 successful collisions per second","4000 collisions per second, with 2% of collisions successful","600 collisions per second, with 20% of collisions successful"],"answer":{"lines":["A. Successful collisions per second: 0.15 × 1000 = 150; 100; 0.02 × 4000 = 80; 0.20 × 600 = 120. The highest is 150."]},"orig":"4.2 Q2"},{"code":"4.2 Q3","crit":"4.2","type":"sa","text":"In reaction P there are 4000 collisions per second and 2.5% are successful. In reaction Q there are 1500 collisions per second and 8% are successful. Calculate the number of successful collisions per second in each reaction, and state which reaction is faster.","marks":3,"num":[["P: successful collisions per second",100],["Q: successful collisions per second",120]],"answer":{"lines":["P: 0.025 × 4000 = 100 successful collisions per second (1). Q: 0.08 × 1500 = 120 successful collisions per second (1). Q has more successful collisions per second, so reaction Q is faster (1)."]},"orig":"4.2 Q3"},{"code":"4.2 Q4","crit":"4.2","type":"sa","text":"The rate of successful collisions depends on two things. Name them.","marks":2,"answer":{"lines":["The frequency of collisions between reactant particles (how often they hit each other) (1). The percentage of collisions that are successful (1)."]},"orig":"4.2 Q4"}]},{"code":"4.3","topic":4,"title":"Recall the different factors that affect reaction rate (concentration, temperature, catalyst, surface area of a solid).","intro":{"text":"Four factors studied affect reaction rate: concentration of a solution, temperature, adding a catalyst, and the surface area of a solid. A catalyst is a substance that increases the rate of a reaction without being consumed in the reaction."},"questions":[{"code":"4.3 Q1","crit":"4.3","type":"sa","text":"Name the four factors studied that affect the rate of a reaction, and state the change to each that increases the rate.","marks":4,"diag":true,"answer":{"lines":["Concentration: increase the concentration of a reactant solution (1). Temperature: increase the temperature (1). Catalyst: add a catalyst (1). Surface area: increase the surface area of a solid, e.g. grind it into a powder (1)."]},"orig":"4.3 Q1"},{"code":"4.3 Q2","crit":"4.3","type":"mc","text":"Which of the following changes would decrease the rate of a reaction?","marks":1,"options":["Adding a catalyst to the reaction mixture","Replacing a powdered reactant with chunks","Increasing the temperature of the reaction mixture","Increasing the concentration of a reactant"],"answer":{"lines":["B. Chunks have a smaller surface area than a powder, which lowers the rate. The other three changes increase the rate."]},"orig":"4.3 Q2"},{"code":"4.3 Q3","crit":"4.3","type":"sa","text":"Marble chips (calcium carbonate) react with hydrochloric acid to produce carbon dioxide gas. Suggest three different changes that would increase the rate of this reaction.","marks":3,"answer":{"lines":["Use a higher concentration of hydrochloric acid (1). Heat the acid to a higher temperature (1). Crush the marble chips into smaller pieces or a powder to increase the surface area (1)."]},"orig":"4.3 Q3"},{"code":"4.3 Q4","crit":"4.3","type":"sa","text":"Define a catalyst.","marks":2,"answer":{"lines":["A catalyst is a substance that increases the rate of a reaction (1) without being consumed (used up) in the reaction (1)."]},"orig":"4.3 Q4"}]},{"code":"4.4","topic":4,"title":"Explain how each factor affects reaction rate using collision theory (the ‘frequency of collisions’ and∕or ‘percentage of collisions that are successful’).","intro":{"text":"A collision theory explanation has three parts: identify the change in conditions; explain how it affects the frequency of collisions and∕or the percentage of collisions that are successful; link this to the effect on the reaction rate."},"questions":[{"code":"4.4 Q1","crit":"4.4","type":"sa","text":"For each factor, state whether increasing it affects the frequency of collisions, the percentage of collisions that are successful, or both.","marks":4,"parts":[{"text":"a.  Concentration","marks":1},{"text":"b.  Surface area","marks":1},{"text":"c.  Catalyst","marks":1},{"text":"d.  Temperature","marks":1}],"diag":true,"answer":{"lines":["a. Frequency of collisions (1).","b. Frequency of collisions (1).","c. Percentage of collisions that are successful (1).","d. Both (1)."],"img":"factor_table"},"orig":"4.4 Q1"},{"code":"4.4 Q2","crit":"4.4","type":"mc","text":"Increasing the temperature has a large effect on reaction rate because it","marks":1,"options":["increases only the frequency of collisions between the reactant particles","lowers the activation energy needed, in the same way as a catalyst","increases both the frequency of collisions and the % that are successful","increases the number of reactant particles in a given volume of solution"],"answer":{"lines":["C. At a higher temperature the particles move faster, so they collide more often, and more of the collisions have at least the activation energy."]},"orig":"4.4 Q2"},{"code":"4.4 Q3","crit":"4.4","type":"sa","text":"Hydrochloric acid reacts with marble chips to form carbon dioxide along with other products. Explain how diluting the acid would affect the reaction rate.","marks":3,"answer":{"lines":["Diluting the acid decreases the concentration of the acid (1). This leads to a decrease in the frequency of collisions between reactant particles (1). Therefore the reaction rate decreases (1)."]},"orig":"4.4 Q3"},{"code":"4.4 Q4","crit":"4.4","type":"sa","text":"Hydrogen peroxide decomposes to form oxygen gas and water. Explain the effect of adding a potassium iodide catalyst on the reaction rate.","marks":3,"answer":{"lines":["Adding a catalyst lowers the activation energy (1). This leads to an increase in the percentage of collisions that are successful (1). Therefore the reaction rate increases (1)."]},"orig":"4.4 Q4"},{"code":"4.4 Q5","crit":"4.4","type":"sa","text":"A student cools a reaction mixture in an ice bath. Explain the effect on the rate of reaction.","marks":4,"answer":{"lines":["Cooling decreases the kinetic energy of the particles, so they move more slowly (1). Fewer collisions have at least the activation energy, so the percentage of collisions that are successful decreases (1). The particles also collide less often, so the frequency of collisions decreases (1). Therefore the reaction rate decreases (1)."]},"orig":"4.4 Q5"}]},{"code":"4.5","topic":4,"title":"Design and carry out an investigation into how a particular factor effects reaction rate.","intro":{"
