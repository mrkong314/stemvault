text":"Reaction rate is measured by tracking a quantity that changes during the reaction: volume of gas produced, mass lost from an open vessel as a gas escapes, colour, pressure, temperature or pH. The faster the change, the faster the reaction. A fair test changes one factor (independent variable), measures the response (dependent variable) and keeps everything else the same (controlled variables)."},"questions":[{"code":"4.5 Q1","crit":"4.5","type":"sa","text":"Describe a simple method to measure the rate of a reaction that produces a gas.","marks":3,"diag":true,"answer":{"lines":["Run the reaction in an open vessel on a balance (1). Measure the loss of mass of the vessel at regular time intervals as the gas escapes; the mass lost equals the mass of gas produced (1). The rate is the mass of gas lost in a certain period of time (or collect the gas in a gas syringe and measure the volume produced each time interval) (1)."]},"orig":"4.5 Q1"},{"code":"4.5 Q2","crit":"4.5","type":"mc","text":"A student investigates the effect of the temperature of hydrochloric acid on the rate of its reaction with magnesium ribbon, timing how long the ribbon takes to disappear. The independent variable is","marks":1,"options":["the time taken for the magnesium ribbon to disappear","the concentration of the hydrochloric acid","the length of the magnesium ribbon","the temperature of the hydrochloric acid"],"answer":{"lines":["D. The independent variable is the factor the student changes on purpose: the temperature. The time is measured (dependent variable), and the concentration and ribbon length are controlled."]},"orig":"4.5 Q2"},{"code":"4.5 Q3","crit":"4.5","type":"sa","text":"Equal masses of calcium carbonate powder (P) and chips (Q) react with the same volume and concentration of hydrochloric acid in open flasks on balances. The graph shows the mass of carbon dioxide lost. Use the graph to find the mass of carbon dioxide lost by each in the first 60 s, and explain the difference using collision theory.","marks":4,"img":"mass_loss","num":[["P: mass lost in 60 s (g)",1.5],["Q: mass lost in 60 s (g)",0.7]],"answer":{"lines":["P: 1.5 g in the first 60 s (1). Q: 0.7 g in the first 60 s (1). The powder has a larger surface area, so the frequency of collisions between the acid and calcium carbonate particles is higher (1). Therefore the powder reacts faster and loses more carbon dioxide in the same time (1)."]},"orig":"4.5 Q3"},{"code":"4.5 Q4","crit":"4.5","type":"sa","text":"A student plans to investigate how the concentration of hydrochloric acid affects the rate of its reaction with calcium carbonate chips. Write an aim and a hypothesis, and identify the independent variable, the dependent variable and two controlled variables.","marks":4,"answer":{"lines":["Aim: to investigate the effect of the concentration of hydrochloric acid on the rate of its reaction with calcium carbonate (1). Hypothesis: if the concentration of the acid is increased, then the rate of reaction will increase, because the frequency of collisions increases (1). Independent variable: concentration of the acid; dependent variable: mass of carbon dioxide lost (or volume of gas produced) in a set time (1). Controlled variables: any two of volume of acid, temperature of acid, mass and size of the calcium carbonate chips (1)."]},"orig":"4.5 Q4"}]}],"imgs":{"ion_table":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABOIAAARECAYAAADYw761AAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAXEgAAFxIBZ5/SUgABAABJREFUeF7s3QW4FOX///+b7u4QKQlBSlEEwaIEbEEMTBQxQUGwi48BWKBYKGCCBYgICiKSIgaghCgSgohKSInU/K/X/f3d+5+ds3vOnlr2nH0+rutc4uzs7Ozs1P2e9/2+83ie5xkAAAAAAAAA2Spvti4dAAAAAAAAgEUgDgAAAAAAAIgDAnEAAAAAAABAHBCIAwAAAAAAAOKAQBwAAAAAAAAQBwTiAAAAAAAAgDggEAcAAAAAAADEAYE4AAAAAAAAIA4IxAEAAAAAAABxQCAOAAAAAAAAiAMCcQAAAAAAAEAcEIgDAAAAAAAA4oBAHAAAAAAAABAHBOIAAAAAAACAOCAQBwAAAAAAAMQBgTgAAAAAAAAgDgjEAQAAAAAAAHFAIA4AAAAAAACIAwJxAAAAAHKkAwcO5Mj1BgAkLwJxAJA function parseNum(s) {
  if (!s) return NaN;
  let t = s.trim().toLowerCase().replace(/,/g, "").replace(/−|–/g, "-").replace(/\s+/g, "");
  t = t.replace(/×|x|\*/g, "*").replace(/\*10\^\(?(-?\d+)\)?/g, "e$1").replace(/\*10\*\*\(?(-?\d+)\)?/g, "e$1").replace(/^10\^\(?(-?\d+)\)?$/, "1e$1");
  t = t.replace(/\^\(?(-?\d+)\)?/g, "e$1");
  const v = Number(t);
  return isFinite(v) ? v : NaN;
}

  const c = DATA.bank.find(x => x.code === code);
  let h = '<button class="btn back" id="backBtn">All criteria</button>' +
    '<div class="crit-head" style="--tc:' + TC(c.topic) + '"><div class="code">Criterion ' + c.code + '</div><h2>' + fmt(c.title) + '</h2><div class="topic">' + c.topic + '. ' + esc(DATA.topics[c.topic - 1]) + '</div></div>';
  if (c.intro) h += '<div class="intro">' + (c.intro.img ? '<img class="' + (c.intro.wide ? "wide" : "") + '" src="' + DATA.imgs[c.intro.img] + '" alt="">' : '') + fmt(c.intro.text) + '</div>';
  c.questions.forEach(q => h += renderQ(q));
  const main = document.getElementById("main");
  main.innerHTML = h;
  window.scrollTo(0, 0);
  document.getElementById("backBtn").addEventListener("click", renderHome);
  document.getElementById("nav").classList.add("hidden");
  c.questions.forEach(q => bindQ(q));
  renderMath(main);
}
// which optional tools a question gets: typed answer on worded items (no value boxes), scratchpad on draw/plot/sketch items; bank.json "tools" overrides
function qTools(q) {
  if (q.type === "mc") return [];
  if (q.tools) return q.tools;
  const txt = q.text + " " + (q.parts || []).map(p => p.text).join(" ");
  const pad = /(^|[.;:]\s*|[a-d]\.\s+)(draw|plot|sketch)\b/i.test(txt);   // an instruction to draw, not "a student's plot"
  const wordy = /\b(explain|describe|state|identify|write|suggest|compare|classify|justify|discuss|outline|give|why|what|which|whether)\b/i.test(txt);
  const type = pad || q.num ? wordy : true;
  return [type ? "type" : null, pad ? "pad" : null].filter(Boolean);
}
const noteBtn = st => '<button class="btn note-btn' + (st.note ? ' has' : '') + '" data-act="note">' + (st.noteOpen ? 'Hide note' : 'Note') + '</button>';
const noteBox = st => '<div class="note"' + (st.noteOpen ? '' : ' hidden') + '><textarea rows="2" placeholder="Optional: add a note for this question, e.g. what to revise or ask about. Saved in this browser.">' + esc(st.note || "") + '</textarea></div>';
function renderQ(q) {
  const full = qstate(q.code);
  const st = q.variant ? { mark: full.mark, note: full.note, noteOpen: full.noteOpen } : full;
  const tools = qTools(q);
  let h = '<div class="q ' + (st.mark ? 'm-' + st.mark : '') + '" id="q-' + q.code.replace(/\W/g, "_") + '">' +
    '<div class="qh"><span class="code">' + q.code + (q.variant ? ' <span class="vtag">similar question</span>' : '') + '</span><span class="marks">' + q.marks + (q.marks > 1 ? ' marks' : ' mark') + '</span></div>' +
    '<div class="qt">' + fmt(q.text) + '</div>';
  const qimg = n => (q.type === "mc" || q.variant) ? '<img src="' + DATA.imgs[n] + '" alt="">' : skWrap(n, DATA.imgs[n]);
  if (q.img) h += qimg(q.img);
  if (q.parts) q.parts.forEach(p => { h += '<div class="part"><span>' + fmt(p.text) + '</span><span class="pm">' + p.marks + (p.marks > 1 ? ' marks' : ' mark') + '</span></div>'; if (p.img) h += qimg(p.img); });
  if (q.type === "mc") {
    h += '<ul class="opts">' + q.options.map((o, i) => '<li><label><input type="radio" name="mc-' + q.code + '" value="' + i + '"' + (st.choice === i ? " checked" : "") + '><span class="let">' + "ABCD"[i] + '</span><span>' + fmt(o) + '</span></label></li>').join("") + '</ul>' +
      '<div class="actions"><button class="btn primary" data-act="checkmc">Check</button>' + noteBtn(st) + '<span class="verdict"></span></div>' + noteBox(st);
  } else {
    if (q.num) {
      h += '<div class="nums">' + q.num.map((n, i) => '<label>' + fmt(n[0]) + '<input class="fld" type="text" inputmode="text" data-i="' + i + '" value="' + esc((st.vals || [])[i] || "") + '" placeholder="e.g. 1.4x10^14" autocomplete="off"><span class="preview"></span></label>').join("") + '</div>' +
        '<div class="hint">Type the value as you would write it, e.g. 1.4x10^14 (the box formats it as you type). Press * twice, or hold × on the keypad, for ×10ⁿ. Use the arrow key to leave a power. Checked to about 3%.</div>';
    }
    h += '<div class="actions">' + (q.num ? '<button class="btn primary" data-act="checknum">Check values</button>' : '') + (tools.includes("type") ? '<button class="btn" data-act="type">' + (st.typing ? 'Hide typing' : 'Type answer') + '</button>' : '') + (tools.includes("pad") ? '<button class="btn" data-act="pad">' + (st.pad ? 'Hide scratchpad' : 'Scratchpad') + '</button>' : '') + '<button class="btn" data-act="reveal">' + (st.open ? 'Hide answer' : 'Show answer') + '</button>' + noteBtn(st) + '<span class="verdict"></span></div>' + noteBox(st);
    if (tools.includes("type")) h += '<div class="typed"' + (st.typing ? '' : ' hidden') + '><textarea rows="4" placeholder="Type your answer here (optional)" spellcheck="true">' + esc(st.resp || "") + '</textarea><div class="tnote">Optional. Your typed answer is saved in this browser. Show the answer to compare, then mark yourself.</div></div>';
    if (tools.includes("pad")) h += '<div class="padwrap"' + (st.pad ? '' : ' hidden') + '>' + padWrap() + '</div>';
  }
  h += '<div class="answer' + (st.open ? " open" : "") + '">' + q.answer.lines.flatMap(splitSteps).map(l => '<p>' + fmt(l) + '</p>').join("") + (q.answer.img ? '<img src="' + DATA.imgs[q.answer.img] + '" alt="">' : '') + '</div>';
  const canVary = !!VARIANTS[q.orig];
  h += '<div class="selfmark"><span>Mark yourself:</span><button class="m-got' + (st.mark === "got" ? " on" : "") + '" data-mark="got">Got it</button><button class="m-part' + (st.mark === "part" ? " on" : "") + '" data-mark="part">Partly</button><button class="m-miss' + (st.mark === "miss" ? " on" : "") + '" data-mark="miss">Missed</button>' +
    (canVary ? '<button class="similar" data-act="similar">' + (q.variant ? 'Another similar question' : 'Try a similar question') + '</button>' : '') +
    (q.variant ? '<button class="similar" data-act="original">Back to original</button>' : '') + '</div>';
  return h + '</div>';
}
function bindQ(q) {
  const el = document.getElementById("q-" + q.code.replace(/\W/g, "_"));
  const verdict = el.querySelector(".verdict");
  const ans = el.querySelector(".answer");
  const applyMark = m => { // m may be null to clear the mark
    setq(q.code, { mark: m || undefined }); el.classList.remove("m-got", "m-part", "m-miss"); if (m) el.classList.add("m-" + m);
    el.querySelectorAll(".selfmark button[data-mark]").forEach(b => b.classList.toggle("on", !!m && b.dataset.mark === m)); };
  el.querySelectorAll(".selfmark button[data-mark]").forEach(b => b.addEventListener("click", () => applyMark(qstate(q.code).mark === b.dataset.mark ? null : b.dataset.mark)));
  const mcBtn = el.querySelector('[data-act="checkmc"]');
  if (mcBtn) {
    const correct = "ABCD".indexOf(q.answer.lines[0].trim()[0]);
    const show = () => {
      el.querySelectorAll(".opts label").forEach((l, i) => { l.classList.toggle("correct", i === correct); l.classList.toggle("wrong", i !== correct && l.querySelector("input").checked); });
      ans.classList.add("open");
    };
    mcBtn.addEventListener("click", () => {
      const sel = el.querySelector('input[type=radio]:checked');
      if (!sel) { verdict.textContent = "Choose an option first."; verdict.className = "verdict"; return; }
      const i = Number(sel.value);
      if (!q.variant) setq(q.code, { choice: i, open: true });
      show();
      if (i === correct) { verdict.textContent = "Correct."; verdict.className = "verdict ok"; applyMark("got"); }
      else { verdict.textContent = "Not correct. The answer is " + "ABCD"[correct] + "."; verdict.className = "verdict no"; applyMark("miss"); }
    });
    if (qstate(q.code).open) show();
  }
  upgradeFields(el); bindSketch(el, q);
  const numBtn = el.querySelector('[data-act="checknum"]');
  if (numBtn) numBtn.addEventListener("click", () => {
    const inputs = [...el.querySelectorAll(".nums .fld")];
    const vals = inputs.map(fieldValue);
    let ok = 0;
    inputs.forEach((inp, i) => {
      const [, target, tol] = q.num[i];
      const v = parseNum(vals[i]);
      const t = tol === undefined ? 0.03 : tol;
      const good = !isNaN(v) && (t === 0 ? v === target : Math.abs(v - target) <= t * Math.abs(target) + 1e-300);
      inp.classList.toggle("ok", good); inp.classList.toggle("bad", !good && vals[i].trim() !== "");
      if (good) ok++;
    });
    if (!q.variant) setq(q.code, { vals });
    verdict.textContent = ok === inputs.length ? "All values correct. Show the answer to check your working, then mark yourself." : ok + " of " + inputs.length + " correct.";
    verdict.className = "verdict " + (ok === inputs.length ? "ok" : "no");
  });
  const tBtn = el.querySelector('[data-act="type"]');
  if (tBtn) {
    const box = el.querySelector(".typed"), ta = box.querySelector("textarea");
    tBtn.addEventListener("click", () => { const on = box.hidden; box.hidden = !on; tBtn.textContent = on ? "Hide typing" : "Type answer"; if (on) ta.focus(); if (!q.variant) setq(q.code, { typing: on }); });
    ta.addEventListener("input", () => { if (!q.variant) { state[q.code] = { ...qstate(q.code), resp: ta.value }; save(); } });
  }
  const nBtn = el.querySelector('[data-act="note"]');
  if (nBtn) {
    const box = el.querySelector(".note"), ta = box.querySelector("textarea");
    nBtn.addEventListener("click", () => { const on = box.hidden; box.hidden = !on; nBtn.textContent = on ? "Hide note" : "Note"; if (on) ta.focus(); setq(q.code, { noteOpen: on }); });
    ta.addEventListener("input", () => { state[q.code] = { ...qstate(q.code), note: ta.value }; save(); nBtn.classList.toggle("has", !!ta.value.trim()); });
  }
  const pBtn = el.querySelector('[data-act="pad"]');
  if (pBtn) {
    const box = el.querySelector(".padwrap"), sk = box.querySelector(".sk");
    pBtn.addEventListener("click", () => { const on = box.hidden; box.hidden = !on; pBtn.textContent = on ? "Hide scratchpad" : "Scratchpad"; if (on && !sk.querySelector("canvas")) sk.skEdit(); if (!q.variant) setq(q.code, { pad: on }); });
  }
  const rev = el.querySelector('[data-act="reveal"]');
  if (rev) rev.addEventListener("click", () => { const open = !ans.classList.contains("open"); ans.classList.toggle("open", open); rev.textContent = open ? "Hide answer" : "Show answer"; if (!q.variant) setq(q.code, { open }); });
  const sim = el.querySelector('[data-act="similar"]');
  if (sim) sim.addEventListener("click", () => {
    const base = q.variant ? q.base : q;
    const v = VARIANTS[base.orig]();
    const vq = { code: base.code, orig: base.orig, crit: base.crit, type: v.type === "mc" ? "mc" : "sa", text: v.text, marks: v.marks, num: v.num, options: v.options, parts: v.parts, answer: { lines: v.lines }, variant: true, base };
    swapQ(el, vq);
  });
  const orig = el.querySelector('[data-act="original"]');
  if (orig) orig.addEventListener("click", () => swapQ(el, q.base));
}
function swapQ(el, nq) {
  const tmp = document.createElement("div"); tmp.innerHTML = renderQ(nq);
  const fresh = tmp.firstElementChild; el.replaceWith(fresh); bindQ(nq); renderMath(fresh);
  fresh.scrollIntoView({ block: "start", behavior: "smooth" });
}
document.getElementById("resetBtn").addEventListener("click", () => { if (confirm("Clear all your marks and answers on this device?")) { state = {}; save(); if (current) openCrit(current); else renderHome(); } });
document.getElementById("menuBtn").addEventListener("click", () => document.getElementById("nav").classList.toggle("hidden"));
document.getElementById("homeBtn").addEventListener("click", () => { renderHome(); document.getElementById("nav").classList.remove("hidden"); window.scrollTo(0, 0); });
renderHome(); save(); initCalc(); initPT();
window.addEventListener("load", () => { renderMath(document); upgradeFields(document); });
</script>
