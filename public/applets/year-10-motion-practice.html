<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 10 Motion Practice</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathlive@0.110.0/mathlive.min.js"></script>
<style>
:root{--navy:#1B3A6B;--navy-2:#122A50;--sky:#2F7FD8;--sky-tint:#E7F0FB;--ink:#1E2430;--muted:#5F6B7A;--rule:#D8DFE8;--paper:#FFFFFF;--bg:#EEF3F9;
--got:#1F9D55;--got-tint:#E3F5EA;--part:#E09B12;--part-tint:#FCF1D6;--miss:#D64545;--miss-tint:#FBE4E4;
--t1:#1B3A6B;--t2:#0E7C86;--t3:#C4552F;--t4:#6A4C93;--t5:#2A9D5C;--t6:#D48A00;--t7:#2F7FD8;--t8:#B23A48;
--sans:"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
:root{--keycap-height:34px;--keycap-font-size:17px;--keycap-max-width:76px;--keycap-gap:6px;--keyboard-padding-top:4px;--keyboard-padding-bottom:4px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font:inherit;cursor:pointer}
header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 2px 0 var(--sky)}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{opacity:.85;font-size:14px}
header .tools{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header .saved{font-size:13px;opacity:.85}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--navy);padding:7px 13px;border-radius:6px;font-size:14px;font-weight:600}
.btn:hover{background:var(--sky-tint)}
header .btn{border-color:rgba(255,255,255,.35);background:transparent;color:#fff}
header .btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn:focus-visible,input:focus-visible,label:focus-within{outline:3px solid #9CC2F1;outline-offset:2px}
.layout{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 60px)}
nav{background:var(--paper);border-right:1px solid var(--rule);padding:14px 0 40px;overflow-y:auto;position:sticky;top:0;height:100vh}
nav .lead{padding:0 20px 10px;font-size:14px;color:var(--muted)}
nav .lead strong{color:var(--ink)}
nav h2{font-size:14px;margin:12px 20px 2px;padding:8px 0 4px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:8px}
nav h2:first-of-type{border-top:0;padding-top:0}
nav h2 .sw{width:12px;height:12px;border-radius:3px;background:var(--tc)}
.crit{display:grid;grid-template-columns:44px 1fr 74px;gap:8px;align-items:start;width:100%;text-align:left;border:0;background:none;padding:7px 20px;color:var(--ink);font-size:13.5px;line-height:1.35;border-left:4px solid transparent}
.crit:hover{background:var(--sky-tint)}
.crit.active{background:var(--sky-tint);border-left-color:var(--tc)}
.crit .code{font-weight:700;color:var(--tc);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:2px;margin-top:5px}
.seg i{display:block;height:8px;flex:1;background:var(--rule);border-radius:2px}
.seg i.m-got{background:var(--got)}.seg i.m-part{background:var(--part)}.seg i.m-miss{background:var(--miss)}
main{padding:24px 32px 80px;max-width:880px}
.home h2{font-size:26px;margin:0 0 6px;color:var(--navy)}
.home p{max-width:640px;color:var(--muted)}
.overall{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;margin:18px 0}
.overall .row{display:flex;align-items:center;gap:12px;font-size:14px;margin-bottom:6px}
.overall .bar{flex:1;height:14px;background:var(--rule);border-radius:7px;overflow:hidden;display:flex}
.overall .bar i{display:block;height:100%}
.overall .bar .g{background:var(--got)}.overall .bar .p{background:var(--part)}.overall .bar .m{background:var(--miss)}
.overall .key{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px}
.overall .key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:18px 0}
.tcard{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;border-top:4px solid var(--tc);text-align:left;color:var(--ink)}
.tcard:hover{border-color:var(--tc)}
.tcard .tn{font-weight:700;font-size:15px;color:var(--tc)}
.tcard .tt{font-size:14px;margin:2px 0 8px}
.tcard .bar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;display:flex}
.tcard .bar i{display:block;height:100%}
.tcard .bar .g{background:var(--got)}.tcard .bar .p{background:var(--part)}.tcard .bar .m{background:var(--miss)}
.tcard .tc2{font-size:12.5px;color:var(--muted);margin-top:6px}
.todo{margin-top:18px}
.todo h3{font-size:16px;margin:0 0 8px;color:var(--navy)}
.todo button{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:9px 14px;margin-bottom:6px;color:var(--ink);border-left:4px solid var(--tc)}
.todo button:hover{background:var(--sky-tint)}
.todo .code{color:var(--tc);font-weight:700;margin-right:8px}
.crit-head{margin-bottom:16px;padding-left:14px;border-left:5px solid var(--tc)}
.crit-head .code{color:var(--tc);font-weight:700;font-size:14px}
.crit-head h2{font-size:23px;margin:2px 0 4px;line-height:1.25;color:var(--navy)}
.crit-head .topic{color:var(--muted);font-size:14px}
.intro{background:var(--sky-tint);border:1px solid #CFE0F5;border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:15px}
.intro img{display:block;max-width:100%;width:440px;margin:6px auto;background:#fff;border-radius:4px}
.intro img.wide{width:100%;max-width:920px}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px 20px 14px;margin-bottom:14px;border-left:5px solid var(--rule)}
.q.m-got{border-left-color:var(--got)}.q.m-part{border-left-color:var(--part)}.q.m-miss{border-left-color:var(--miss)}
.qh{display:flex;gap:12px;align-items:center}
.qh .code{font-weight:700;color:var(--navy);font-size:15px}
.qh .marks{margin-left:auto;background:var(--navy);color:#fff;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap}
.qt{font-size:16.5px;line-height:1.55;margin:8px 0 10px}
.part{font-size:16.5px;margin:8px 0 4px 18px;display:flex;gap:12px}
.part .pm{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;align-self:center}
.q img{display:block;max-width:100%;width:420px;margin:8px auto}
.opts{list-style:none;padding:0;margin:8px 0}
.opts label{display:flex;gap:12px;padding:8px 10px;border-radius:6px;font-size:16px;cursor:pointer;align-items:center;border:1px solid transparent}
.opts label:hover{background:var(--sky-tint)}
.opts label.correct{background:var(--got-tint);border-color:var(--got)}.opts label.wrong{background:var(--miss-tint);border-color:var(--miss)}
.opts input{accent-color:var(--navy)}
.opts .let{font-weight:700;color:var(--navy);flex:0 0 22px}
.opts label span:last-child{flex:1}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:8px 0}
.nums label{display:block;font-size:13.5px;color:var(--muted);font-weight:600}
.nums input{display:block;width:100%;margin-top:3px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font:inherit;font-size:15px;background:#fff;font-weight:400}
.nums math-field{display:block;width:100%;margin-top:3px;padding:4px 8px;border:1px solid var(--rule);border-radius:6px;font-size:17px;background:#fff;--caret-color:var(--navy);--selection-background-color:var(--sky-tint)}
.nums math-field:focus-within{outline:3px solid #9CC2F1;outline-offset:2px}
.nums math-field.ok{border-color:var(--got);background:var(--got-tint)}.nums math-field.bad{border-color:var(--miss);background:var(--miss-tint)}
.nums math-field::part(menu-toggle){display:none}
.nums .preview{display:block;min-height:22px;margin-top:4px;color:var(--navy);font-size:15px}
.nums input.ok{border-color:var(--got);background:var(--got-tint)}.nums input.bad{border-color:var(--miss);background:var(--miss-tint)}
.katex{font-size:1.02em}
.hint{font-size:13px;color:var(--muted);margin:4px 0 10px}
.typed{margin:10px 0 2px}
.typed textarea{display:block;width:100%;min-height:96px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font:inherit;font-size:15px;line-height:1.45;background:#fff;resize:vertical}
.typed textarea:focus-visible{outline:3px solid #9CC2F1;outline-offset:2px}
.typed .tnote{font-size:12.5px;color:var(--muted);margin-top:4px}
.note-btn{margin-left:auto}
.note-btn.has{border-color:var(--part);color:#8a5d00;background:var(--part-tint)}
.note-btn.has::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--part);margin-right:6px;vertical-align:middle}
.note{margin:8px 0 2px}
.note textarea{display:block;width:100%;min-height:52px;padding:7px 10px;border:1px solid #EAD9A6;border-radius:6px;font:inherit;font-size:14px;line-height:1.4;background:#FFFBEC;resize:vertical}
.note textarea:focus-visible{outline:3px solid #9CC2F1;outline-offset:2px}
.actions .verdict{flex-basis:100%}
.sk{margin:8px auto;width:420px;max-width:100%}
.sk.pad{width:100%;margin:6px 0 2px}
.sk.pad canvas{border:1px solid var(--rule);border-radius:6px}
.sk img,.sk canvas{display:block;width:100%;max-width:100%;margin:0 auto}
.sk canvas.editing{cursor:crosshair;touch-action:none;outline:2px dashed var(--sky);outline-offset:2px}
.skbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.skbar button{font-size:12.5px;padding:4px 11px;border:1px solid var(--rule);border-radius:14px;background:#fff;color:var(--ink);font-weight:600}
.skbar button:hover{background:var(--sky-tint)}
.skbar button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.calc{position:fixed;right:24px;bottom:24px;width:360px;max-width:calc(100vw - 20px);background:var(--paper);border:1px solid var(--rule);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:50;font-size:14px}
.calc-h{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;background:var(--navy);color:#fff;border-radius:10px 10px 0 0;cursor:move;user-select:none;touch-action:none}
.calc-t{font-weight:700}
.calc-mode{margin-left:auto;display:flex;gap:2px}
.calc-mode button{font-size:12px;padding:3px 8px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:4px}
.calc-mode button.on{background:#fff;color:var(--navy)}
.calc-x{border:0;background:transparent;color:#fff;font-size:20px;line-height:1;padding:0 4px}
.calc-in{padding:10px 12px 4px}
.calc-in math-field{display:block;width:100%;font-size:19px;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:#fff;--caret-color:var(--navy)}
.calc-in math-field::part(menu-toggle){display:none}
.calc-in math-field::part(virtual-keyboard-toggle){display:none}
.calc-in input{display:block;width:100%;font:inherit;font-size:16px;padding:8px;border:1px solid var(--rule);border-radius:6px}
.calc-res{min-height:26px;padding:0 14px 6px;font-size:17px;color:var(--navy)}
.calc-res.err{font-size:13px;color:var(--miss)}
.calc-keys{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:4px 12px 8px}
.calc-keys button{font-size:13.5px;padding:7px 2px;border:1px solid var(--rule);border-radius:6px;background:#F7FAFE;color:var(--ink)}
.calc-keys button{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.calc-keys button:hover{background:var(--sky-tint)}
.calc-keys button.num{background:#fff;font-size:15.5px;font-weight:600}
.calc-keys button.op{font-size:15px}
.calc-keys button.act{background:var(--sky-tint)}
.calc-keys button.w2{grid-column:span 2}
.calc-keys button.eq{grid-column:span 2;background:var(--navy);color:#fff;border-color:var(--navy)}
.calc-note{font-size:12px;color:var(--muted);padding:0 14px 8px}
.calc-hh{display:flex;align-items:center;justify-content:space-between;padding:4px 14px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}
.calc-hclear{font-size:12px;padding:2px 8px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink)}
.pt{position:fixed;left:50%;top:112px;transform:translateX(-50%);width:min(1180px,96vw);background:#fff;border:1px solid var(--rule);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:55}
.pt-h{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;background:var(--navy);color:#fff;border-radius:10px 10px 0 0;cursor:move;user-select:none;touch-action:none}
.pt-t{font-weight:700}
.pt-x{margin-left:auto;border:0;background:transparent;color:#fff;font-size:20px;line-height:1;padding:0 4px}
.pt-body{padding:10px 12px 14px;overflow:auto;max-height:calc(100vh - 140px)}
.ptg{font-size:9px;color:#000;text-align:center;line-height:16px}
.ptp{font-size:9px;color:#000;display:flex;align-items:center;justify-content:center}
.pt-grid{display:grid;grid-template-columns:18px repeat(18,1fr);grid-template-rows:16px repeat(7,auto) 8px repeat(2,auto);gap:2px;min-width:860px}
.ptc{border:1px solid #000;background:#fff;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 0 3px;line-height:1.05;min-height:38px}
.ptz{font-size:8.5px}
.pts{font-size:13px;font-weight:700}
.ptm{font-size:8px}
@media(max-width:820px){.pt-body{max-height:calc(100vh - 120px)}}
.calc-hclear:hover{background:var(--miss-tint);border-color:var(--miss)}
.calc-hist{max-height:38px;overflow-y:auto}
.calc-hist .hrow{display:flex;align-items:stretch;border-top:1px solid var(--sky-tint)}
.calc-hist .huse{flex:1;display:flex;justify-content:space-between;gap:10px;min-height:36px;text-align:left;border:0;background:#fff;padding:5px 6px 5px 14px;font-size:13.5px;color:var(--ink);align-items:center}
.calc-hist .huse:hover{background:var(--sky-tint)}
.calc-hist .hdel{border:0;background:#fff;color:var(--muted);font-size:17px;line-height:1;width:32px;opacity:0;cursor:pointer}
.calc-hist .hrow:hover .hdel,.calc-hist .hdel:focus-visible{opacity:1}
.calc-hist .hdel:hover{color:var(--miss);background:var(--miss-tint)}
@media (hover:none){.calc-hist .hdel{opacity:1}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.answer{display:none;margin-top:12px;border-top:2px solid var(--sky-tint);padding:12px 14px 4px;background:#F7FAFE;border-radius:0 0 6px 6px;font-size:15.5px;color:#123}
.answer.open{display:block}
.answer p{margin:0 0 6px}
.answer p:first-child::before{content:"Answer";display:block;font-size:12px;font-weight:700;color:var(--sky);letter-spacing:.3px;margin-bottom:4px}
.answer img{width:360px;margin:6px 0;background:#fff}
.selfmark{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;font-size:14px;color:var(--muted)}
.selfmark button{border:1px solid var(--rule);background:#fff;border-radius:20px;padding:6px 15px;font-size:14px;color:var(--ink);font-weight:600}
.selfmark button.m-got:hover{background:var(--got-tint);border-color:var(--got)}.selfmark button.m-part:hover{background:var(--part-tint);border-color:var(--part)}.selfmark button.m-miss:hover{background:var(--miss-tint);border-color:var(--miss)}
.selfmark button.m-got.on{background:var(--got);border-color:var(--got);color:#fff}
.selfmark button.m-part.on{background:var(--part);border-color:var(--part);color:#fff}
.selfmark button.m-miss.on{background:var(--miss);border-color:var(--miss);color:#fff}
.selfmark .similar{margin-left:auto;border-color:var(--sky);color:var(--sky);background:#fff}
.selfmark .similar:hover{background:var(--sky-tint)}
.selfmark .similar + .similar{margin-left:0}
.vtag{font-weight:600;color:var(--sky);font-size:12.5px;margin-left:6px}
.verdict{font-size:14px;font-weight:600}
.verdict.ok{color:var(--got)}.verdict.no{color:var(--miss)}
.constants{display:none;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;font-size:14.5px;margin-bottom:18px}
.constants.open{display:block}
.constants .ct{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.constants .cc{display:inline-block;margin:2px 18px 2px 0}
.menu-toggle{display:none}
.back{display:none}
@media (max-width:860px){
  .layout{display:block}
  nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule)}
  nav.hidden{display:none}
  main{padding:18px 14px 60px}
  .menu-toggle{display:inline-block}
  .back{display:inline-block;margin-bottom:12px}
  .crit{grid-template-columns:40px 1fr 60px}
}
</style>
</head>
<body>
<header>
  <h1>Year 10 Motion Practice</h1>
  <span class="sub">Motion in a straight line; Newton's three laws of motion</span>
  <div class="tools">
    <button class="btn menu-toggle" id="menuBtn">Criteria</button>
    <button class="btn" id="homeBtn">Back to home</button>
    <button class="btn" id="calcBtn">Calculator</button>
    <button class="btn" id="ptBtn">Periodic table</button>
    <button class="btn" id="resetBtn">Reset progress</button>
    <span class="saved" id="savedNote"></span>
  </div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
const DATA = {"topics":["Motion in a straight line","Newton's three laws of motion"],"bank":[{"code":"1.1","topic":1,"title":"Recall the difference between scalar and vector quantities","intro":{"text":"A quantity that depends on direction is a vector quantity. A quantity that does not depend on direction is a scalar quantity. Magnitude means size."},"questions":[{"code":"1.1 Q1","crit":"1.1","type":"sa","text":"State the difference between a scalar quantity and a vector quantity.","marks":2,"diag":true,"answer":{"lines":["A scalar quantity has magnitude (size) only (1). A vector quantity has both magnitude and direction (1)."]},"orig":"1.1 Q1"},{"code":"1.1 Q2","crit":"1.1","type":"mc","text":"A vector quantity has","marks":1,"options":["a magnitude only","a direction only","both a magnitude and a direction","a magnitude that is always measured in metres"],"answer":{"lines":["C. A vector has a magnitude (size) and a direction. A scalar has a magnitude only."]},"orig":"1.1 Q2"},{"code":"1.1 Q3","crit":"1.1","type":"sa","text":"A car travels north-east along a straight road and its speedometer reads 50 km h^{–1}. State the car's speed and its velocity, and explain why they are different.","marks":2,"answer":{"lines":["Speed: 50 km h^{–1}. Velocity: 50 km h^{–1} north-east (1). Speed is a scalar, so it has magnitude only; velocity is a vector, so it also needs a direction (1)."]},"orig":"1.1 Q3"},{"code":"1.1 Q4","crit":"1.1","type":"sa","text":"Can an object have a constant speed but a changing velocity? Justify your answer.","marks":2,"answer":{"lines":["Yes (1). An object moving in a circle at a constant speed is always changing direction; velocity is a vector, so a change in direction is a change in velocity (1)."]},"orig":"1.1 Q4"}]},{"code":"1.2","topic":1,"title":"Categorise quantities as scalar or vector","intro":{"text":"To categorise a quantity, ask whether it depends on direction. If it does, it is a vector; if it has size only, it is a scalar."},"questions":[{"code":"1.2 Q1","crit":"1.2","type":"sa","text":"Categorise each quantity as scalar or vector.","marks":4,"parts":[{"text":"a.  Speed","marks":1},{"text":"b.  Displacement","marks":1},{"text":"c.  Mass","marks":1},{"text":"d.  Weight","marks":1}],"diag":true,"answer":{"lines":["a. Scalar (1).","b. Vector (1).","c. Scalar (1).","d. Vector: weight is a force, which acts downwards (1)."]},"orig":"1.2 Q1"},{"code":"1.2 Q2","crit":"1.2","type":"mc","text":"Which of the following is a vector quantity?","marks":1,"options":["distance","temperature","time","acceleration"],"answer":{"lines":["D. Acceleration has a direction, so it is a vector. Distance, temperature and time have size only, so they are scalars."]},"orig":"1.2 Q2"},{"code":"1.2 Q3","crit":"1.2","type":"sa","text":"Categorise each quantity as scalar or vector.","marks":3,"parts":[{"text":"a.  The cost of a theatre ticket","marks":1},{"text":"b.  The current in a river","marks":1},{"text":"c.  The initial flight path of a plane from Melbourne to Sydney","marks":1}],"answer":{"lines":["a. Scalar: a cost has size only (1).","b. Vector: a current flows in a direction (1).","c. Vector: a flight path has a direction (1)."]},"orig":"1.2 Q3"},{"code":"1.2 Q4","crit":"1.2","type":"sa","text":"A student says that mass and weight are both scalars because both are measured using scales. Explain which of the two is a vector.","marks":2,"answer":{"lines":["Mass is a scalar: it is the amount of matter in an object and has no direction (1). Weight is a vector: it is the force of gravity on the object, which acts downwards (1)."]},"orig":"1.2 Q4"}]},{"code":"1.3","topic":1,"title":"Define and calculate distance and displacement","intro":{"text":"Distance is a scalar: the total length of the path travelled. Displacement is a vector: the change in position from the start point to the end point, with a direction. To find a displacement, choose one direction as positive; movement in the opposite direction is negative."},"questions":[{"code":"1.3 Q1","crit":"1.3","type":"sa","text":"A cyclist rides along a straight road from A to B, then turns around and rides back to C, as shown below. Define distance and displacement, then calculate the distance travelled and the displacement of the cyclist.","marks":4,"img":"cyc_line","num":[["distance (km)",11],["size of displacement (km)",5]],"diag":true,"answer":{"lines":["Distance is the total length of the path travelled (scalar) (1). Displacement is the change in position from start to finish, with a direction (vector) (1). Distance = 8 + 3 = 11 km (1). Let east be positive: displacement = 8 + (–3) = 5 km, so 5 km east (1)."]},"orig":"1.3 Q1"},{"code":"1.3 Q2","crit":"1.3","type":"mc","text":"A runner completes exactly one lap of a 400 m running track and finishes where she started. Her distance travelled and her displacement are","marks":1,"options":["0 m and 400 m","400 m and 0 m","400 m and 400 m","200 m and 0 m"],"answer":{"lines":["B. The distance is the full path, 400 m. She finishes where she started, so the change in position (displacement) is zero."]},"orig":"1.3 Q2"},{"code":"1.3 Q3","crit":"1.3","type":"sa","text":"A golf ball rolls from A to B, then rolls back past A to C, as shown below. Calculate the distance travelled by the ball and its displacement.","marks":3,"img":"golf_line","num":[["distance (m)",14],["size of displacement (m)",6]],"answer":{"lines":["Distance = 4 + 10 = 14 m (1). Let right be positive: displacement = 4 + (–10) = –6 m (1). The negative sign shows the direction, so the displacement is 6 m to the left (1)."]},"orig":"1.3 Q3"},{"code":"1.3 Q4","crit":"1.3","type":"sa","text":"A hiker walks 5 km north, then 8 km south, then 2 km north along a straight track. Calculate the total distance walked and the hiker's displacement.","marks":3,"num":[["distance (km)",15],["size of displacement (km)",1]],"answer":{"lines":["Distance = 5 + 8 + 2 = 15 km (1). Let north be positive: displacement = 5 + (–8) + 2 = –1 km (1). The negative sign shows the direction: 1 km south (1)."]},"orig":"1.3 Q4"}]},{"code":"1.4","topic":1,"title":"Complete straight line vector addition","intro":{"text":"Add vectors tip to tail: draw the second vector starting at the arrowhead of the first. The resultant is drawn from the tail of the first vector to the head of the last (dashed). Mathematically, choose a positive direction: 6 m forwards then 4 m back gives 6 + (–4) = 2 m forwards. Only the same kind of vector can be added (displacement to displacement, force to force).","img":"vec_intro"},"questions":[{"code":"1.4 Q1","crit":"1.4","type":"sa","text":"A student walks 5 km east, then 2 km west. Draw a vector diagram to show the student's displacement, and calculate the displacement.","marks":3,"num":[["size of displacement (km)",3]],"diag":true,"answer":{"lines":["Arrows drawn tip to tail: 5 km east, then 2 km west starting from the head of the first (1). Resultant drawn from the tail of the first to the head of the second (1). Let east be positive: 5 + (–2) = 3 km, so 3 km east (1)."],"img":"sol_vec_5e2w"},"orig":"1.4 Q1"},{"code":"1.4 Q2","crit":"1.4","type":"mc","text":"A force of 300 N east and a force of 100 N west act on a box. The overall force on the box is","marks":1,"options":["400 N east","200 N west","400 N west","200 N east"],"answer":{"lines":["D. Let east be positive: 300 + (–100) = 200 N. The positive sign shows the direction, east. 400 N adds the sizes and ignores the directions."]},"orig":"1.4 Q2"},{"code":"1.4 Q3","crit":"1.4","type":"sa","text":"During training, a player starts in the centre of an oval, runs 50 m north, then jogs 70 m south. Calculate the player's final displacement from the centre.","marks":2,"num":[["size of displacement (m)",20]],"answer":{"lines":["Let north be positive: displacement = 50 + (–70) = –20 m (1). The negative sign shows the direction: 20 m south (1)."]},"orig":"1.4 Q3"},{"code":"1.4 Q4","crit":"1.4","type":"sa","text":"Explain why a displacement of 4 m east cannot be added to a velocity of 3 m s^{–1} east.","marks":2,"answer":{"lines":["Only the same kind of vector can be added together (1). Displacement and velocity are different quantities with different units, so their sum has no meaning (1)."]},"orig":"1.4 Q4"},{"code":"1.4 Q5","crit":"1.4","type":"sa","text":"A student takes forwards as negative and adds 5 m forwards and 2 m back as –5 + 2 = –3 m. Explain what the answer means, and state whether it agrees with taking forwards as positive.","marks":2,"answer":{"lines":["The sign only shows direction; in this convention negative means forwards, so the displacement is 3 m forwards (1). Taking forwards as positive gives 5 + (–2) = +3 m, also 3 m forwards, so the two agree (1)."]},"orig":"1.4 Q5"}]},{"code":"1.5","topic":1,"title":"Define and calculate speed, velocity and acceleration","intro":{"text":"Speed is the distance travelled per unit of time (scalar): v = d/t. Velocity is the rate of change of position, using displacement, and needs a direction (vector). Acceleration is the rate of change of velocity (vector): a = (v – u)/t, where u is the initial velocity and v the final velocity. The sign of a velocity or acceleration shows its direction."},"questions":[{"code":"1.5 Q1","crit":"1.5","type":"sa","text":"A car starts from rest and travels 400 m west in 40 s, reaching a velocity of 20 m s^{–1} west. Calculate the car's average speed, its average velocity and its average acceleration.","marks":4,"num":[["average speed (m s^{–1})",10],["average velocity (m s^{–1})",10],["acceleration (m s^{–2})",0.5]],"diag":true,"answer":{"lines":["Average speed v = d/t = 400/40 = 10 m s^{–1} (1). Average velocity = 10 m s^{–1} west (1). a = (v – u)/t = (20 – 0)/40 (1) = 0.5 m s^{–2} west (1)."]},"orig":"1.5 Q1"},{"code":"1.5 Q2","crit":"1.5","type":"mc","text":"Acceleration is defined as","marks":1,"options":["the distance travelled per unit of time","the rate of change of velocity","the rate of change of position","the speed of an object in a stated direction"],"answer":{"lines":["B. Acceleration is the rate of change of velocity. Distance per unit time is speed, rate of change of position is velocity, and speed with a direction is velocity."]},"orig":"1.5 Q2"},{"code":"1.5 Q3","crit":"1.5","type":"sa","text":"Define speed, velocity and acceleration, and state whether each is a scalar or a vector.","marks":3,"answer":{"lines":["Speed is the distance travelled per unit of time; it is a scalar (1). Velocity is the rate of change of position (displacement per unit of time); it is a vector (1). Acceleration is the rate of change of velocity; it is a vector (1)."]},"orig":"1.5 Q3"},{"code":"1.5 Q4","crit":"1.5","type":"sa","text":"A student at an athletics carnival completes the 400 m race in 58.5 s. Calculate the student's average speed.","marks":2,"num":[["average speed (m s^{–1})",6.837606837606837]],"answer":{"lines":["v = d/t = 400/58.5 (1). v = 6.84 m s^{–1} (1)."]},"orig":"1.5 Q4"},{"code":"1.5 Q5","crit":"1.5","type":"sa","text":"A race car travelling forwards at 40 m s^{–1} brakes and slows to 20 m s^{–1} in 2.0 s. Taking forwards as positive, calculate the acceleration of the car, and explain what the sign of the answer means.","marks":3,"num":[["a (m s^{–2})",-10]],"answer":{"lines":["a = (v – u)/t = (20 – 40)/2.0 (1). a = –10 m s^{–2} (1). The negative sign shows the acceleration is backwards, opposite to the motion, so the car is slowing down (1)."]},"orig":"1.5 Q5"}]},{"code":"1.6","topic":1,"title":"Remember the correct units for distance, speed and acceleration","intro":{"text":"Use SI units (metres and seconds) when performing calculations."},"questions":[{"code":"1.6 Q1","crit":"1.6","type":"sa","text":"State the correct SI unit (name and symbol) for distance, speed and acceleration.","marks":3,"diag":true,"answer":{"lines":["Distance: metres, m (1). Speed: metres per second, m s^{–1} (1). Acceleration: metres per second squared, m s^{–2} (1)."]},"orig":"1.6 Q1"},{"code":"1.6 Q2","crit":"1.6","type":"mc","text":"The SI unit of acceleration is","marks":1,"options":["m s^{–1}","km h^{–1}","m s^{–2}","m"],"answer":{"lines":["C. Acceleration is the change in velocity (m s^{–1}) per second, so its unit is m s^{–2}. m s^{–1} is the unit of speed and m is the unit of distance."]},"orig":"1.6 Q2"},{"code":"1.6 Q3","crit":"1.6","type":"sa","text":"A student writes the acceleration of a car as 3 m s^{–1}. Explain the mistake.","marks":2,"answer":{"lines":["m s^{–1} is the unit of speed or velocity, not acceleration (1). Acceleration is the change in velocity each second (m s^{–1} per second), so the unit is m s^{–2}: the acceleration is 3 m s^{–2} (1)."]},"orig":"1.6 Q3"}]},{"code":"1.7","topic":1,"title":"Convert between m s^{–1} and km h^{–1}","intro":{"text":"1 km = 1000 m and 1 h = 3600 s."},"questions":[{"code":"1.7 Q1","crit":"1.7","type":"sa","text":"Convert 260 m s^{–1} to km h^{–1}, and convert 60 km h^{–1} to m s^{–1}.","marks":2,"num":[["260 m s^{–1} in km h^{–1}",936],["60 km h^{–1} in m s^{–1}",16.666666666666668]],"diag":true,"answer":{"lines":["260 × 3.6 = 936 km h^{–1} (1). 60/3.6 = 16.7 m s^{–1} (1)."]},"orig":"1.7 Q1"},{"code":"1.7 Q2","crit":"1.7","type":"mc","text":"A car travels at 72 km h^{–1}. Its speed in m s^{–1} is","marks":1,"options":["20 m s^{–1}","259.2 m s^{–1}","1.2 m s^{–1}","0.02 m s^{–1}"],"answer":{"lines":["A. 72/3.6 = 20 m s^{–1}. 259.2 multiplies by 3.6 instead of dividing, 1.2 divides by 60, and 0.02 divides by 3600 without changing km to m."]},"orig":"1.7 Q2"},{"code":"1.7 Q3","crit":"1.7","type":"sa","text":"The diagram below shows how to convert a speed between the two units. Write m s^{–1} and km h^{–1} in the correct boxes, P and Q.","marks":2,"img":"conv_blank","answer":{"lines":["P: m s^{–1} (1). Q: km h^{–1}; multiplying by 3.6 changes a speed in m s^{–1} into the larger number in km h^{–1} (1)."],"img":"conv_lab"},"orig":"1.7 Q3"},{"code":"1.7 Q4","crit":"1.7","type":"sa","text":"Explain why a speed in km h^{–1} is divided by 3.6 to convert it to m s^{–1}.","marks":2,"answer":{"lines":["1 km h^{–1} means 1000 m travelled in 3600 s (1). 1000/3600 = 1/3.6 m s^{–1}, so each km h^{–1} is 1/3.6 m s^{–1} and the speed is divided by 3.6 (1)."]},"orig":"1.7 Q4"},{"code":"1.7 Q5","crit":"1.7","type":"sa","text":"A cheetah can sprint at 31 m s^{–1}. A racehorse can gallop at 70 km h^{–1}. Showing a conversion, state which animal is faster.","marks":2,"num":[["cheetah's speed (km h^{–1})",111.6]],"answer":{"lines":["31 × 3.6 = 111.6 km h^{–1} (1). 111.6 km h^{–1} is greater than 70 km h^{–1}, so the cheetah is faster (1)."]},"orig":"1.7 Q5"}]},{"code":"1.8","topic":1,"title":"Perform calculations and rearrange formulae: v = d/t and a = (v – u)/t","intro":{"text":"v = d/t rearranges to d = vt and t = d/v. a = (v – u)/t rearranges to v = u + at and t = (v – u)/a. Convert to metres and seconds before substituting."},"questions":[{"code":"1.8 Q1","crit":"1.8","type":"sa","text":"Answer both parts.","marks":4,"parts":[{"text":"a.  A person sprints 100 m north-west along a straight track in 10.5 s. Calculate the person's average velocity.","marks":2},{"text":"b.  A car travelling at 60 km h^{–1} brakes at a traffic light and comes to a complete stop in 3.0 s. Taking the direction of motion as positive, calculate the car's acceleration in m s^{–2}.","marks":2}],"num":[["average velocity (m s^{–1})",9.523809523809524],["a (m s^{–2})",-5.555555555555556]],"diag":true,"answer":{"lines":["a. v = d/t = 100/10.5 (1) = 9.52 m s^{–1} north-west (1).","b. u = 60/3.6 = 16.67 m s^{–1} (1). a = (v – u)/t = (0 – 16.67)/3 = –5.56 m s^{–2}, so 5.56 m s^{–2} opposite to the motion (1)."]},"orig":"1.8 Q1"},{"code":"1.8 Q2","crit":"1.8","type":"mc","text":"A boat moves along a river at a constant speed of 15 m s^{–1} for 10 s. The distance it travels is","marks":1,"options":["1.5 m","0.67 m","150 m","25 m"],"answer":{"lines":["C. d = vt = 15 × 10 = 150 m. 1.5 m divides v by t, 0.67 m divides t by v, and 25 m adds them."]},"orig":"1.8 Q2"},{"code":"1.8 Q3","crit":"1.8","type":"sa","text":"A cyclist travels along a straight path at an average speed of 8 m s^{–1} and covers a distance of 15 km. Calculate the time taken, in seconds.","marks":2,"num":[["t (s)",1875]],"answer":{"lines":["d = 15 km = 15 000 m; t = d/v (1). t = 15 000/8 = 1875 s (1)."]},"orig":"1.8 Q3"},{"code":"1.8 Q4","crit":"1.8","type":"sa","text":"A race car moving at 10 m s^{–1} accelerates at 3 m s^{–2} for 12 s. Calculate its final velocity.","marks":2,"num":[["v (m s^{–1})",46]],"answer":{"lines":["v = u + at = 10 + 3 × 12 (1). v = 46 m s^{–1} (1)."]},"orig":"1.8 Q4"},{"code":"1.8 Q5","crit":"1.8","type":"sa","text":"A train travels 20 km east in 30 minutes. Calculate the average velocity of the train in m s^{–1}, including a direction.","marks":3,"num":[["average velocity (m s^{–1})",11.11111111111111]],"answer":{"lines":["d = 20 km = 20 000 m and t = 30 × 60 = 1800 s (1). v = 20 000/1800 = 11.1 m s^{–1} (1). Average velocity = 11.1 m s^{–1} east (1)."]},"orig":"1.8 Q5"},{"code":"1.8 Q6","crit":"1.8","type":"sa","text":"A car moving forwards at 48 m s^{–1} slows down uniformly to rest. Its acceleration is –6 m s^{–2}. Calculate the time it takes to stop.","marks":2,"num":[["t (s)",8]],"answer":{"lines":["t = (v – u)/a = (0 – 48)/(–6) (1). t = 8 s (1)."]},"orig":"1.8 Q6"},{"code":"1.8 Q7","crit":"1.8","type":"sa","text":"A passenger jet cruises at 900 km h^{–1} for 1 hour and 20 minutes. Calculate its speed in m s^{–1}, and the distance it travels in metres.","marks":3,"num":[["speed (m s^{–1})",250],["distance (m)",1200000]],"answer":{"lines":["v = 900/3.6 = 250 m s^{–1} (1). t = 80 × 60 = 4800 s (1). d = vt = 250 × 4800 = 1 200 000 m (1)."]},"orig":"1.8 Q7"}]},{"code":"1.9","topic":1,"title":"Analyse straight line motion under constant acceleration using SUVAT formulas: v = u + at, s = ½(u+v)t, s = ut + ½at^{2}, s = vt – ½at^{2}, v^{2} = u^{2} + 2as","intro":{"text":"For constant acceleration only. Variables: u, initial velocity; v, final velocity; a, acceleration; t, time; s, displacement; all in metres and seconds. Equations: v = u + at, s = ½(u+v)t, s = ut + ½at^{2}, s = vt – ½at^{2}, v^{2} = u^{2} + 2as. Choose a direction to be positive, list the known variables and the unknown, then choose the equation. For vertical motion with up positive, a = –9.8 m s^{–2} (with down positive, a = 9.8 m s^{–2}); at the highest point v = 0.","img":"vert_conv"},"questions":[{"code":"1.9 Q1","crit":"1.9","type":"sa","text":"A motorbike starts from rest and speeds up uniformly to 12 m s^{–1} over a distance of 25 m. Calculate its acceleration and the time taken.","marks":4,"num":[["a (m s^{–2})",2.88],["t (s)",4.166666666666667]],"diag":true,"answer":{"lines":["u = 0, v = 12 m s^{–1}, s = 25 m (1). v^{2} = u^{2} + 2as: 12^{2} = 0 + 2 × a × 25, so a = 144/50 = 2.88 m s^{–2} (1). s = ½(u+v)t: 25 = ½(0 + 12)t (1). t = 50/12 = 4.17 s (1)."]},"orig":"1.9 Q1"},{"code":"1.9 Q2","crit":"1.9","type":"mc","text":"For a car with constant acceleration, the initial velocity, the final velocity and the time are known, and the displacement is needed. The acceleration is not known. The equation to use is","marks":1,"options":["s = ½(u+v)t","v = u + at","v^{2} = u^{2} + 2as","s = ut + ½at^{2}"],"answer":{"lines":["A. s = ½(u+v)t contains u, v, t and s but not a, which is unknown. Each of the other equations needs a."]},"orig":"1.9 Q2"},{"code":"1.9 Q3","crit":"1.9","type":"sa","text":"A scooter speeds up uniformly from 6 m s^{–1} to 18 m s^{–1} in 4.0 s. Calculate the distance it covers in this time.","marks":2,"num":[["s (m)",48]],"answer":{"lines":["s = ½(u+v)t = ½ × (6 + 18) × 4.0 (1). s = 48 m (1)."]},"orig":"1.9 Q3"},{"code":"1.9 Q4","crit":"1.9","type":"sa","text":"An aeroplane starts from rest and accelerates uniformly along the runway at 3 m s^{–2} for 20 s before it takes off.","marks":4,"parts":[{"text":"a.  Calculate the take-off speed.","marks":2},{"text":"b.  Calculate the distance covered along the runway.","marks":2}],"num":[["take-off speed (m s^{–1})",60],["distance (m)",600]],"answer":{"lines":["a. u = 0, a = 3 m s^{–2}, t = 20 s. v = u + at = 0 + 3 × 20 (1) = 60 m s^{–1} (1).","b. s = ut + ½at^{2} = 0 × 20 + ½ × 3 × 20^{2} (1) = 600 m (1)."]},"orig":"1.9 Q4"},{"code":"1.9 Q5","crit":"1.9","type":"sa","text":"A cyclist slows down uniformly and comes to rest in 3.0 s. Taking forwards as positive, the acceleration is –2.0 m s^{–2}. Calculate the stopping distance.","marks":3,"num":[["s (m)",9]],"answer":{"lines":["v = 0, a = –2.0 m s^{–2}, t = 3.0 s; u is not given (1). s = vt – ½at^{2} = 0 × 3.0 – ½ × (–2.0) × 3.0^{2} (1). s = 9.0 m (1)."]},"orig":"1.9 Q5"},{"code":"1.9 Q6","crit":"1.9","type":"sa","text":"A ball is dropped from rest from a height of 40 m. Ignoring air resistance, calculate its speed just before it hits the ground.","marks":3,"num":[["speed (m s^{–1})",28]],"answer":{"lines":["Let down be positive: u = 0, a = 9.8 m s^{–2}, s = 40 m (1). v^{2} = u^{2} + 2as = 0 + 2 × 9.8 × 40 = 784 (1). v = √(784) = 28 m s^{–1} downwards (1)."]},"orig":"1.9 Q6"},{"code":"1.9 Q7","crit":"1.9","type":"sa","text":"A cannonball is fired vertically upwards from ground level at 30 m s^{–1}. Ignoring air resistance:","marks":4,"parts":[{"text":"a.  calculate the time it takes to reach its highest point","marks":2},{"text":"b.  calculate its maximum height.","marks":2}],"num":[["t (s)",3.061224489795918],["maximum height (m)",45.91836734693877]],"answer":{"lines":["a. Let up be positive: u = 30 m s^{–1}, v = 0 at the highest point, a = –9.8 m s^{–2} (1). v = u + at: 0 = 30 + (–9.8)t, so t = 30/9.8 = 3.06 s (1).","b. v^{2} = u^{2} + 2as: 0 = 30^{2} + 2 × (–9.8) × s (1). s = 900/19.6 = 45.9 m (1)."]},"orig":"1.9 Q7"},{"code":"1.9 Q8","crit":"1.9","type":"sa","text":"A cliff jumper steps off a ledge 15 m above the water, starting with zero vertical velocity. Ignoring air resistance, calculate how long the jumper falls before reaching the water.","marks":3,"num":[["t (s)",1.749635530559413]],"answer":{"lines":["Let down be positive: u = 0, a = 9.8 m s^{–2}, s = 15 m (1). s = ut + ½at^{2}: 15 = 0 + ½ × 9.8 × t^{2}, so t^{2} = 15/4.9 = 3.06 (1). t = √(3.06) = 1.75 s (1)."]},"orig":"1.9 Q8"},{"code":"1.9 Q9","crit":"1.9","type":"sa","text":"A water balloon is tossed vertically upwards at 12 m s^{–1}. It is released 1.5 m above the ground. Ignoring air resistance, calculate the maximum height above the ground that the balloon reaches.","marks":3,"num":[["maximum height (m)",8.846938775510203]],"answer":{"lines":["Let up be positive: u = 12 m s^{–1}, v = 0, a = –9.8 m s^{–2} (1). v^{2} = u^{2} + 2as: 0 = 12^{2} + 2 × (–9.8) × s, so s = 144/19.6 = 7.35 m above the release point (1). Height above the ground = 7.35 + 1.5 = 8.85 m (1)."]},"orig":"1.9 Q9"}]},{"code":"2.1","topic":2,"title":"Recall Newton's 3 laws of motion","intro":{"text":"A force is a push, pull or twist. A force can make an object start or stop moving, speed up or slow down, change direction or change shape. Isaac Newton described how forces affect motion in three laws."},"questions":[{"code":"2.1 Q1","crit":"2.1","type":"sa","text":"State Newton's first, second and third laws of motion.","marks":3,"diag":true,"answer":{"lines":["First law: an object at rest stays at rest, and a moving object keeps moving at the same speed in the same direction, unless an unbalanced force acts on it (1). Second law: an object accelerates in the direction of the unbalanced (net) force on it, with F_{net} = ma (1). Third law: for every action there is an equal but opposite reaction; when object A pushes on object B, B pushes back on A with an equal force in the opposite direction (1)."]},"orig":"2.1 Q1"},{"code":"2.1 Q2","crit":"2.1","type":"mc","text":"Which of the following is a statement of Newton's third law of motion?","marks":1,"options":["A moving object keeps moving at the same speed in the same direction unless an unbalanced force acts on it.","An object accelerates in the direction of the net force, and the acceleration depends on the force and the mass.","A force is needed to keep an object moving at a constant speed in a straight line.","When one object pushes on a second object, the second object pushes back with an equal and opposite force."],"answer":{"lines":["D. The third law is about forces in pairs. The first two options state the first and second laws; the last is a misconception, since no net force is needed for constant velocity."]},"orig":"2.1 Q2"},{"code":"2.1 Q3","crit":"2.1","type":"sa","text":"Identify which of Newton's laws is best shown by each example.","marks":3,"parts":[{"text":"a.  A full shopping trolley needs a larger push than an empty one to speed up at the same rate.","marks":1},{"text":"b.  A person pushes on a wall and the wall pushes back on the person.","marks":1},{"text":"c.  A hockey puck slides across smooth ice at an almost constant velocity.","marks":1}],"answer":{"lines":["a. Second law: a larger mass needs a larger net force for the same acceleration (1).","b. Third law: the forces act in a pair, equal and opposite (1).","c. First law: with almost no unbalanced force, the puck keeps its velocity (1)."]},"orig":"2.1 Q3"},{"code":"2.1 Q4","crit":"2.1","type":"sa","text":"Newton's second law is written F_{net} = ma. State what each symbol stands for and its unit.","marks":3,"answer":{"lines":["F_{net} is the net (total, unbalanced) force on the object, in newtons (N) (1). m is the mass of the object, in kilograms (kg) (1). a is the acceleration of the object, in m s^{–2} (1)."]},"orig":"2.1 Q4"}]},{"code":"2.2","topic":2,"title":"Define inertia as an object's tendency to resist a change in its velocity","intro":null,"questions":[{"code":"2.2 Q1","crit":"2.2","type":"sa","text":"Define inertia, and state how the inertia of an object depends on its mass.","marks":2,"diag":true,"answer":{"lines":["Inertia is an object's tendency to resist a change in its velocity (its state of motion) (1). The larger the mass, the greater the inertia (1)."]},"orig":"2.2 Q1"},{"code":"2.2 Q2","crit":"2.2","type":"mc","text":"Which of the following has the greatest inertia?","marks":1,"options":["a 60 kg cyclist riding at 10 m s^{–1}","a parked 1500 kg car","a 0.45 kg soccer ball moving at 25 m s^{–1}","a 7 kg bowling ball rolling at 3 m s^{–1}"],"answer":{"lines":["B. Inertia depends on mass, not on speed. The car has by far the largest mass, so it has the greatest inertia even though it is not moving."]},"orig":"2.2 Q2"},{"code":"2.2 Q3","crit":"2.2","type":"sa","text":"Explain, using inertia, why heavy objects should not be placed on the rear window shelf of a car.","marks":3,"answer":{"lines":["If the car stops suddenly, an object on the shelf tends to keep moving forwards at the car's original velocity because of its inertia (1). Nothing on the shelf exerts a large enough force to stop it, so it flies forwards through the car (1). A heavy object has more inertia, so it is harder to stop and could seriously injure a passenger (1)."]},"orig":"2.2 Q3"},{"code":"2.2 Q4","crit":"2.2","type":"sa","text":"In rugby, explain why it is harder to stop a massive player than a lightly built player running at the same speed.","marks":2,"answer":{"lines":["The massive player has a larger mass, so a greater inertia: a greater tendency to resist a change in velocity (1). A larger force is needed to change the massive player's velocity, so they are harder to stop (1)."]},"orig":"2.2 Q4"},{"code":"2.2 Q5","crit":"2.2","type":"sa","text":"A coin rests on a card placed over the top of a cup. When the card is flicked away quickly, the coin drops into the cup. Explain this using inertia.","marks":3,"answer":{"lines":["The coin has inertia, so it tends to stay at rest (1). The card moves away so quickly that the friction force on the coin acts too briefly to change its velocity much (1). With the card gone, the coin's weight is unbalanced, so it falls straight down into the cup (1)."]},"orig":"2.2 Q5"}]},{"code":"2.3","topic":2,"title":"Recall that the acceleration of a falling object due to gravity is g = 9.8 m s^{–2} on Earth","intro":{"text":"Near Earth's surface, a falling object (with no air resistance) accelerates downwards at the acceleration due to gravity, g."},"questions":[{"code":"2.3 Q1","crit":"2.3","type":"sa","text":"State the value, unit and direction of the acceleration of a falling object due to gravity on Earth.","marks":2,"num":[["g (m s^{–2})",9.8]],"diag":true,"answer":{"lines":["g = 9.8 m s^{–2} (1). It acts downwards, towards the centre of Earth (1)."]},"orig":"2.3 Q1"},{"code":"2.3 Q2","crit":"2.3","type":"mc","text":"A 1 kg ball and a 5 kg ball are dropped together from the same height. Ignoring air resistance, the balls","marks":1,"options":["both accelerate at 9.8 m s^{–2} and land at the same time","accelerate at 9.8 m s^{–2} and 49 m s^{–2}, so the 5 kg ball lands first","fall at a constant speed of 9.8 m s^{–1} and land together","accelerate at 9.8 m s^{–2}, but the 1 kg ball lands first because it is lighter"],"answer":{"lines":["A. The acceleration due to gravity is 9.8 m s^{–2} for all objects near Earth's surface, whatever their mass, so they land together. They speed up as they fall; they do not move at constant speed."]},"orig":"2.3 Q2"},{"code":"2.3 Q3","crit":"2.3","type":"sa","text":"Explain what an acceleration of 9.8 m s^{–2} downwards means for an object falling from rest, ignoring air resistance.","marks":2,"answer":{"lines":["Each second, the downward velocity of the object increases by 9.8 m s^{–1} (1). For example, it is moving at 9.8 m s^{–1} after 1 s and 19.6 m s^{–1} after 2 s (1)."]},"orig":"2.3 Q3"},{"code":"2.3 Q4","crit":"2.3","type":"sa","text":"A stone is dropped from rest down a well and takes 1.7 s to reach the water. Ignoring air resistance, calculate its speed as it hits the water.","marks":2,"num":[["speed (m s^{–1})",16.66]],"answer":{"lines":["Let down be positive: v = u + at = 0 + 9.8 × 1.7 (1). v = 16.7 m s^{–1} (1)."]},"orig":"2.3 Q4"}]},{"code":"2.4","topic":2,"title":"Define weight force and normal force","intro":{"text":"Weight is calculated with W = mg, where m is the mass in kilograms and g = 9.8 m s^{–2} on Earth. Weight is a force, so it is measured in newtons (N)."},"questions":[{"code":"2.4 Q1","crit":"2.4","type":"sa","text":"Define weight force and normal force.","marks":2,"diag":true,"answer":{"lines":["Weight force is the force on an object due to gravity (1). Normal force is the force that a surface exerts on an object in contact with it, pushing out from the surface (1)."]},"orig":"2.4 Q1"},{"code":"2.4 Q2","crit":"2.4","type":"mc","text":"A book rests on a level desk. The normal force on the book","marks":1,"options":["acts downwards and is equal in size to the book's weight","acts upwards and is larger than the book's weight","acts upwards and is equal in size to the book's weight","is zero because the book is not moving"],"answer":{"lines":["C. The desk pushes up on the book. The book is not accelerating, so the vertical forces are balanced and the normal force equals the weight."]},"orig":"2.4 Q2"},{"code":"2.4 Q3","crit":"2.4","type":"sa","text":"A student has a mass of 55 kg. Calculate the student's weight on Earth.","marks":2,"num":[["W (N)",539]],"answer":{"lines":["W = mg = 55 × 9.8 (1). W = 539 N (1)."]},"orig":"2.4 Q3"},{"code":"2.4 Q4","crit":"2.4","type":"sa","text":"Draw a labelled free body diagram for a book resting on a desk.","marks":2,"answer":{"lines":["The book drawn as a box with an arrow pointing down labelled weight force and an arrow pointing up labelled normal force (1). The two arrows are the same length, because the forces are equal in size (1)."],"img":"sol_fbd_book"},"orig":"2.4 Q4"},{"code":"2.4 Q5","crit":"2.4","type":"sa","text":"An astronaut has a mass of 70 kg. On the Moon the acceleration due to gravity is 1.6 m s^{–2}. Calculate the astronaut's weight on Earth and on the Moon, and state the astronaut's mass on the Moon.","marks":3,"num":[["weight on Earth (N)",686],["weight on the Moon (N)",112],["mass on the Moon (kg)",70]],"answer":{"lines":["Earth: W = mg = 70 × 9.8 = 686 N (1). Moon: W = 70 × 1.6 = 112 N (1). Mass on the Moon = 70 kg; mass is the amount of matter and does not change (1)."]},"orig":"2.4 Q5"}]},{"code":"2.5","topic":2,"title":"Apply Newton's 3 laws of motion to explain real life scenarios","intro":null,"questions":[{"code":"2.5 Q1","crit":"2.5","type":"sa","text":"An untied balloon full of air is released and accelerates away from you. Explain why, using Newton's third law of motion.","marks":3,"diag":true,"answer":{"lines":["Newton's third law: every action force has an equal and opposite reaction force (1). The balloon pushes the air out backwards, towards you (action) (1). The air pushes the balloon forwards with an equal and opposite force (reaction), so the balloon accelerates away from you (1)."]},"orig":"2.5 Q1"},{"code":"2.5 Q2","crit":"2.5","type":"mc","text":"A swimmer pushes backwards on the water with her hands. The reaction force is","marks":1,"options":["the water pushing backwards on the swimmer's hands","the swimmer's feet pushing backwards on the water","the weight of the swimmer acting downwards","the water pushing forwards on the swimmer's hands"],"answer":{"lines":["D. The reaction acts on the other object in the pair (the swimmer) in the opposite direction (forwards), with the same size."]},"orig":"2.5 Q2"},{"code":"2.5 Q3","crit":"2.5","type":"sa","text":"A released balloon of mass 10 g accelerates at 1.0 m s^{–2}. A second balloon of mass 50 g is released and pushed by the same size force. Use Newton's second law to determine the acceleration of the second balloon, and explain how it compares with the first.","marks":3,"num":[["a (m s^{–2})",0.2]],"answer":{"lines":["F = ma = 0.010 × 1.0 = 0.010 N (1). a = F/m = 0.010/0.050 = 0.2 m s^{–2} (1). The force is the same but the mass is five times larger, so the acceleration is five times smaller (1)."]},"orig":"2.5 Q3"},{"code":"2.5 Q4","crit":"2.5","type":"sa","text":"A car moving at a steady speed brakes suddenly. Use Newton's first law to explain why a passenger needs to wear a seatbelt, and identify the force that slows the passenger down.","marks":3,"answer":{"lines":["By Newton's first law, the passenger keeps moving forwards at the car's original speed unless an unbalanced force acts on them (1). Without a seatbelt the passenger keeps moving until they hit the dashboard or windscreen (1). With a seatbelt, the belt pushes backwards on the passenger, providing the unbalanced force that slows them with the car (1)."]},"orig":"2.5 Q4"},{"code":"2.5 Q5","crit":"2.5","type":"sa","text":"An 80 kg passenger sits in a car that is accelerating forwards at 5.0 m s^{–2}.","marks":3,"parts":[{"text":"a.  Identify the force that makes the passenger accelerate with the car.","marks":1},{"text":"b.  Calculate the size of the net force on the passenger.","marks":2}],"num":[["F_{net} (N)",400]],"answer":{"lines":["a. The back of the seat pushing forwards on the passenger (1).","b. F_{net} = ma = 80 × 5.0 (1) = 400 N (1)."]},"orig":"2.5 Q5"},{"code":"2.5 Q6","crit":"2.5","type":"sa","text":"A person steps from a small boat onto a jetty, and the boat moves away from the jetty. Explain this using Newton's third law.","marks":2,"answer":{"lines":["As the person steps forwards, they push backwards on the boat (action) (1). The boat pushes forwards on the person with an equal and opposite force (reaction); the force on the boat pushes it backwards, away from the jetty (1)."]},"orig":"2.5 Q6"}]},{"code":"2.6","topic":2,"title":"Evaluate free body diagrams to classify forces present as balanced or unbalanced","intro":{"text":"A free body diagram shows the object as a box or circle, with an arrow for every force acting on it, drawn from the object. Each arrow is labelled, and its length shows the size of the force. If the forces in each direction cancel, they are balanced: the net force is zero and the object is at rest or moves at constant velocity. If not, they are unbalanced and the object accelerates in the direction of the net force."},"questions":[{"code":"2.6 Q1","crit":"2.6","type":"sa","text":"The free body diagram shows the forces on a book being pushed across a table. Is the diagram showing balanced or unbalanced forces? Explain, and state the net force.","marks":3,"img":"fbd_book_push","num":[["net force (N)",5]],"diag":true,"answer":{"lines":["Unbalanced (1). The vertical forces cancel (12 N up and 12 N down), but the horizontal forces are opposite in direction and not equal in size (1). Net force = 8 – 3 = 5 N to the right (1)."]},"orig":"2.6 Q1"},{"code":"2.6 Q2","crit":"2.6","type":"mc","text":"The free body diagram shows the forces on a car travelling along a straight, level road. The forces are","marks":1,"img":"fbd_car","options":["balanced, so the car moves at a constant velocity","balanced, so the car must be at rest","unbalanced, so the car is speeding up","unbalanced, so the car is slowing down"],"answer":{"lines":["A. The driving force equals the resistance and the normal force equals the weight, so the net force is zero. A moving object with balanced forces keeps a constant velocity (Newton's first law)."]},"orig":"2.6 Q2"},{"code":"2.6 Q3","crit":"2.6","type":"sa","text":"A person pushes a box along level ground with a force of 120 N. The friction force on the box is 80 N and its weight is 300 N. The free body diagram shows the forces, with two labelled X and Y. State the values of X and Y, and classify the forces as balanced or unbalanced.","marks":3,"img":"fbd_box_xy","num":[["X (N)",300],["Y (N)",120]],"answer":{"lines":["X = 300 N: it is the normal force, equal to the weight because the box is not lifted or sinking (1). Y = 120 N: the push, opposite to the friction (1). Unbalanced: the net force is 120 – 80 = 40 N to the right (1)."]},"orig":"2.6 Q3"},{"code":"2.6 Q4","crit":"2.6","type":"sa","text":"For each situation, state whether the forces are balanced or unbalanced. If unbalanced, give the net force with its direction.","marks":3,"parts":[{"text":"a.  A phone with a weight of 5 N sits on a desk.","marks":1},{"text":"b.  A phone with a weight of 5 N falls, with an air resistance force of 1 N.","marks":1},{"text":"c.  A skydiver with a weight of 800 N falls, with an air resistance force of 800 N.","marks":1}],"answer":{"lines":["a. Balanced; no net force (1).","b. Unbalanced: 5 – 1 = 4 N downwards (1).","c. Balanced; the skydiver falls at a constant velocity (1)."]},"orig":"2.6 Q4"},{"code":"2.6 Q5","crit":"2.6","type":"sa","text":"A student draws the free body diagram shown for a book at rest on a table. Identify two mistakes in the diagram.","marks":2,"img":"fbd_wrong","answer":{"lines":["The arrows are not labelled with the names (or sizes) of the forces (1). The book is at rest, so the forces are balanced and the arrows should be the same length, but the upward arrow is drawn much longer (1)."]},"orig":"2.6 Q5"}]},{"code":"2.7","topic":2,"title":"Calculate the net force on an object and relate this to its motion","intro":{"text":"F_{net} = ma, where F_{net} is the net force in N, m is the mass in kg and a is the acceleration in m s^{–2}. To find F_{net}, choose a direction to be positive and add the forces, with forces in the opposite direction negative. The object accelerates in the direction of the net force."},"questions":[{"code":"2.7 Q1","crit":"2.7","type":"sa","text":"The free body diagram shows the forces on a 20 kg supermarket trolley as it is pushed down an aisle. Calculate the net force on the trolley, describe its motion, and calculate its acceleration.","marks":4,"img":"fbd_trolley","num":[["net force (N)",10],["a (m s^{–2})",0.5]],"diag":true,"answer":{"lines":["Vertical forces cancel. Let left be positive: F_{net} = 25 + (–15) = 10 N, so 10 N to the left (1). The forces are unbalanced, so the trolley accelerates (speeds up) to the left (1). a = F_{net}/m = 10/20 (1) = 0.5 m s^{–2} to the left (1)."]},"orig":"2.7 Q1"},{"code":"2.7 Q2","crit":"2.7","type":"mc","text":"A net force of 100 N acts on a 5.0 kg mass. The acceleration of the mass is","marks":1,"options":["500 m s^{–2}","20 m s^{–2}","0.05 m s^{–2}","95 m s^{–2}"],"answer":{"lines":["B. a = F_{net}/m = 100/5.0 = 20 m s^{–2}. 500 multiplies instead of dividing, and 0.05 divides the wrong way."]},"orig":"2.7 Q2"},{"code":"2.7 Q3","crit":"2.7","type":"sa","text":"As a student throws a 0.8 kg ball, a net force of 32 N acts on it. Calculate the acceleration of the ball.","marks":2,"num":[["a (m s^{–2})",40]],"answer":{"lines":["a = F_{net}/m = 32/0.8 (1). a = 40 m s^{–2} (1)."]},"orig":"2.7 Q3"},{"code":"2.7 Q4","crit":"2.7","type":"sa","text":"A broken-down car of mass 950 kg is towed along a level road. It speeds up from rest to 20 m s^{–1} in 25 s. Calculate the net force on the car.","marks":3,"num":[["F_{net} (N)",760]],"answer":{"lines":["a = (v – u)/t = (20 – 0)/25 = 0.8 m s^{–2} (1). F_{net} = ma = 950 × 0.8 (1). F_{net} = 760 N (1)."]},"orig":"2.7 Q4"},{"code":"2.7 Q5","crit":"2.7","type":"sa","text":"A 15 kg trolley is pushed east and accelerates at a constant 1.0 m s^{–2} east. A friction force of 10 N acts on it. Calculate the push force.","marks":3,"num":[["push force (N)",25]],"answer":{"lines":["Let east be positive: F_{net} = ma = 15 × 1.0 = 15 N (1). F_{net} = F_{push} + (–10), so 15 = F_{push} – 10 (1). F_{push} = 25 N east (1)."]},"orig":"2.7 Q5"},{"code":"2.7 Q6","crit":"2.7","type":"sa","text":"A car has a driving force of 8000 N and a friction force of 1000 N acts on it. It accelerates at a constant 3.0 m s^{–2}. Calculate the net force on the car and the mass of the car.","marks":3,"num":[["F_{net} (N)",7000],["m (kg)",2333.3333333333335]],"answer":{"lines":["F_{net} = 8000 – 1000 = 7000 N (1). m = F_{net}/a = 7000/3.0 (1). m = 2333 kg ≈ 2300 kg (1)."]},"orig":"2.7 Q6"},{"code":"2.7 Q7","crit":"2.7","type":"sa","text":"Robert pushes an 850 kg car along a level road with a horizontal force of 120 N. The resistance forces on the car total 70 N. The car starts from rest. Calculate the net force on the car, its acceleration, and its speed after Robert has pushed for 20 s.","marks":3,"num":[["F_{net} (N)",50],["a (m s^{–2})",0.058823529411764705],["v (m s^{–1})",1.1764705882352942]],"answer":{"lines":["F_{net} = 120 – 70 = 50 N (1). a = F_{net}/m = 50/850 = 0.0588 m s^{–2} (1). v = u + at = 0 + 0.0588 × 20 = 1.18 m s^{–1} (1)."]},"orig":"2.7 Q7"},{"code":"2.7 Q8","crit":"2.7","type":"sa","text":"An 800 kg car hits a large tree at 20 m s^{–1} and stops completely in 0.1 s as its front crumples.","marks":4,"parts":[{"text":"a.  Calculate the weight of the car.","marks":1},{"text":"b.  Calculate the size of the collision force on the car.","marks":2},{"text":"c.  The 75 kg driver stops in the same time. Calculate the size of the force on the driver.","marks":1}],"num":[["weight (N)",7840],["force on car (N)",160000],["force on driver (N)",15000]],"answer":{"lines":["a. W = mg = 800 × 9.8 = 7840 N (1).","b. Size of acceleration = Δv/t = 20/0.1 = 200 m s^{–2} (1). F_{net} = ma = 800 × 200 = 160 000 N (1).","c. F_{net} = ma = 75 × 200 = 15 000 N (1)."]},"orig":"2.7 Q8"}]}],"imgs":{"cyc_line":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAwgAAAEnCAYAAAANYGTdAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAXEgAAFxIBZ5/SUgAALFVJREFUeF7t3Qd0FNX+wPFfaCE06Qihl1BVmvQq3QIqARRQQbABogJPxKfYHgIiKvIEn8JRUEFQELGAdJCO2ECqNOnSe03mf373/Wdekk3ZTYHdme/nnD1JNlPuvbPl/ua2MMuyLAEAAAAAEclEKQAAAACwESAAAAAAIEAAAAAA4IsWBAAAAAAOAgQAAAAABAgAAAAAfNGCAAAAAMBBgAAAAACAAAEAAACAL1oQAAAAADgIEAAAAAAQIAAAAADwRQsCAAAAAAcBAgAAAAACBAAAAAC+aEEAAAAA4CBAAAAAAECAAAAAAMAXLQgAAAAAHAQIAAAAAAgQAAAAAPiiBQEAAACAgwABAAAAAAECAAAAAF+0IAAAAABwECAAAAAAIEAAAAAA4IsWBAAAAAAOAgQAAAAABAgAAAAAfNGCAAAAAMBBgAAAAACAAAEAAACAL1oQAAAAADgIEAAAAAAQIAAAAASrXbt2SY function speedCtx() {
  return pick([
    [d => `A student at an athletics carnival completes the ${d} m race in`, [100, 400, 100], [11, 75, 0.5], (d, t) => t > d / 10 && t < d / 5.5],
    [d => `A cyclist rides ${d} m along a straight bike path in`, [500, 3000, 100], [60, 400, 5], (d, t) => d / t > 4 && d / t < 14],
    [d => `A car travels ${d} m from the garage to the local shops in`, [400, 2000, 50], [40, 150, 5], (d, t) => d / t > 6 && d / t < 25],
  ]);
}

function parseNum(s) {
  if (!s) return NaN;
  let t = s.trim().toLowerCase().replace(/,/g, "").replace(/−|–/g, "-").replace(/\s+/g, "");
  t = t.replace(/×|x|\*/g, "*").replace(/\*10\^\(?(-?\d+)\)?/g, "e$1").replace(/\*10\*\*\(?(-?\d+)\)?/g, "e$1").replace(/^10\^\(?(-?\d+)\)?$/, "1e$1");
  t = t.replace(/\^\(?(-?\d+)\)?/g, "e$1");
  const v = Number(t);
  return isFinite(v) ? v : NaN;
}

function qTools(q) {

  const txt = q.text + " " + (q.parts || []).map(p => p.text).join(" ");
  const pad = /(^|[.;:]\s*|[a-d]\.\s+)(draw|plot|sketch)\b/i.test(txt);   // an instruction to draw, not "a student's plot"
  const wordy = /\b(explain|describe|state|identify|write|suggest|compare|classify|justify|discuss|outline|give|why|what|which|whether)\b/i.test(txt);
  const type = pad || q.num ? wordy : true;
  return [type ? "type" : null, pad ? "pad" : null].filter(Boolean);

    const v = VARIANTS[base.orig]();
    const vq = { code: base.code, orig: base.orig, crit: base.crit, type: v.type === "mc" ? "mc" : "sa", text: v.text, marks: v.marks, num: v.num, options: v.options, parts: v.parts, answer: { lines: v.lines }, variant: true, base };
    swapQ(el, vq);
  });
  const orig = el.querySelector('[data-act="original"]');
  if (orig) orig.addEventListener("click", () => swapQ(el, q.base));
}
function swapQ(el, nq) {
  const tmp = document.createElement("div"); tmp.innerHTML = renderQ(nq);
  const fresh = tmp.firstElementChild; el.replaceWith(fresh); bindQ(nq); renderMath(fresh);
  fresh.scrollIntoView({ block: "start", behavior: "smooth" });
}
document.getElementById("resetBtn").addEventListener("click", () => { if (confirm("Clear all your marks and answers on this device?")) { state = {}; save(); if (current) openCrit(current); else renderHome(); } });
document.getElementById("menuBtn").addEventListener("click", () => document.getElementById("nav").classList.toggle("hidden"));
document.getElementById("homeBtn").addEventListener("click", () => { renderHome(); document.getElementById("nav").classList.remove("hidden"); window.scrollTo(0, 0); });
renderHome(); save(); initCalc(); initPT();
window.addEventListener("load", () => { renderMath(document); upgradeFields(document); });
</script>
