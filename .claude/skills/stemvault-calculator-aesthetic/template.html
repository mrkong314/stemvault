<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>APPLET TITLE</title>
<meta name="description" content="One sentence on what the applet does.">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)">
<style>
  /* === StemVault tokens (paste tokens.css here, unchanged) === */
</style>
<style>
  /* === Applet-specific layout === */
  .app { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; display: grid; grid-template-columns: 1fr; gap: 12px; align-items: start; }
  /* Laptop layout by input device, not orientation: a mouse or trackpad at 860px+ in any window shape, or a tablet in landscape. Phones keep one column either way. */
  @media (pointer: fine) and (min-width: 860px), (pointer: none) and (min-width: 860px), (min-width: 1000px) { .app { grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.8fr); } }
  .stage { min-height: 320px; justify-content: center; align-items: center; text-align: center; }
  .side { position: sticky; top: 72px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="inner">
    <div><div class="title">APPLET TITLE</div><div class="sub" id="subLabel">What this screen is for</div></div>
    <div class="spacer"></div>
    <div class="seg" id="modeSeg" role="tablist">
      <button type="button" data-v="explore" role="tab" class="on">Explore</button>
      <button type="button" data-v="challenge" role="tab">Challenge</button>
    </div>
    <div style="position:relative" class="settings-wrap">
      <button class="gbtn icon" id="settingsBtn" type="button" aria-label="Settings" aria-expanded="false">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <div class="popover" id="settings" hidden>
        <div><span class="label">Appearance</span>
          <div class="seg full" id="themeSeg" style="margin-top:6px"><button type="button" data-v="auto">Auto</button><button type="button" data-v="light">Light</button><button type="button" data-v="dark">Dark</button></div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center"><span id="soundLabel">Sound</span><button class="switch" id="soundToggle" type="button" role="switch" aria-checked="true" aria-labelledby="soundLabel"></button></div>
      </div>
    </div>
  </div>
</header>

<main class="app">
  <section class="glass panel stage" aria-live="polite">
    <!-- canvas / SVG / question goes here -->
    <div class="hint">Stage: the thing students look at.</div>
  </section>
  <aside class="side">
    <section class="glass panel">
      <span class="label">Controls</span>
      <label class="label" for="n">Parameter</label>
      <input class="field num" id="n" type="number" value="5" min="1" max="20">
      <div style="display:flex; gap:10px"><button type="button" class="gbtn pill" style="flex:1" id="go">Run</button><button type="button" class="gbtn" id="reset">Reset</button></div>
      <div class="hint">Short guidance for the student.</div>
    </section>
  </aside>
</main>

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const STORE = 'applet-slug-v1';            // change per applet; bump the suffix if the shape changes
  let state = { theme: 'auto', sound: true, mode: 'explore' };
  try { Object.assign(state, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (e) {}
  function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

  // Settings popover + theme
  const settings = $('settings'), settingsBtn = $('settingsBtn');
  function openSettings(on) { settings.hidden = !on; settingsBtn.setAttribute('aria-expanded', String(on)); }
  settingsBtn.addEventListener('click', () => openSettings(settings.hidden));
  document.addEventListener('pointerdown', e => { if (!settings.hidden && !e.target.closest('.settings-wrap')) openSettings(false); }, { passive: true });
  function segSync(seg, v) { seg.querySelectorAll('button').forEach(b => { const on = b.dataset.v === String(v); b.classList.toggle('on', on); b.setAttribute('aria-selected', on); }); }
  function segOn(seg, fn) { seg.addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) fn(b.dataset.v); }); }
  function applyTheme() {
    if (state.theme === 'dark' || state.theme === 'light') document.documentElement.setAttribute('data-theme', state.theme); else document.documentElement.removeAttribute('data-theme');
    segSync($('themeSeg'), state.theme);
  }
  segOn($('themeSeg'), v => { state.theme = v; save(); applyTheme(); });
  segOn($('modeSeg'), v => { state.mode = v; save(); segSync($('modeSeg'), v); });
  $('soundToggle').addEventListener('click', () => { state.sound = !state.sound; save(); $('soundToggle').setAttribute('aria-checked', String(state.sound)); });

  // Applet logic goes here.

  applyTheme(); segSync($('modeSeg'), state.mode); $('soundToggle').setAttribute('aria-checked', String(state.sound));
})();
</script>
</body>
</html>
